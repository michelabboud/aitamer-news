name: Workflow-owned numbering
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: specimen-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  specimen-integrity:
    # Keep PR observations separate from the trusted allocation certificate.
    name: ${{ (startsWith(github.event.pull_request.head.ref, 'specimens/run-') || startsWith(github.event.pull_request.head.ref, 'grok/') || startsWith(github.event.pull_request.head.ref, 'desk/posts-') || contains(github.event.pull_request.labels.*.name, 'workflow-numbering')) && 'specimen-integrity-observation' || 'specimen-integrity' }}
    if: vars.SPECIMEN_ADMISSION_ENABLED == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/specimen-admission.mjs gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
          ADMISSION_OBSERVATION: ${{ startsWith(github.event.pull_request.head.ref, 'specimens/run-') || startsWith(github.event.pull_request.head.ref, 'grok/') || startsWith(github.event.pull_request.head.ref, 'desk/posts-') || contains(github.event.pull_request.labels.*.name, 'workflow-numbering') }}
