name: Deploy GitHub Pages

# Retired 2026-09-25: aitamer.news on Cloudflare is the only copy. Kept for reference, manual
# trigger only, and disabled in the repository's Actions settings; forks do not inherit that switch.
on:
  workflow_dispatch:

# Lets the deploy job publish the github-pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a Pages deploy that has already started.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check scripts and post times
        run: |
          npm test
          npm run check:posts

      - name: Restore Astro incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-incremental-github-pages-${{ github.sha }}
          restore-keys: |
            astro-incremental-github-pages-

      - name: Build
        env:
          ASTRO_SITE: https://michelabboud.github.io
          ASTRO_BASE: /aitamer-news
        run: npm run build

      # Bot posts: the shipped HTML of every bot-authored post passes the allowlist, and the
      # checker renders every post exactly as this build did (SECURITY.md, "Bot posts"; ADR 0009).
      - name: Check bot post bodies against the build
        env:
          ASTRO_SITE: https://michelabboud.github.io
          ASTRO_BASE: /aitamer-news
        run: npm run check:bodies:build

      - name: Check the build holds no secrets
        run: npm run check:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
