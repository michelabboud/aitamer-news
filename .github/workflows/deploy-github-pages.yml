name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the deploy job publish the github-pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a Pages deploy that has already started.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check scripts and post times
        run: |
          npm test
          npm run check:times

      - name: Restore Astro incremental cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-incremental-github-pages-${{ github.sha }}
          restore-keys: |
            astro-incremental-github-pages-

      - name: Build
        env:
          ASTRO_SITE: https://michelabboud.github.io
          ASTRO_BASE: /aitamer-news
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
