name: Decode hero PNGs

on:
  push:
    branches: [design/post-heroes]
    paths:
      - 'public/heroes/*.b64'
      - 'public/heroes/*.b64.part*'

concurrency:
  group: decode-heroes
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/post-heroes
          fetch-depth: 0
      - name: Assemble and decode heroes
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Whole-file .png.b64
          for f in public/heroes/*.png.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm -f "$f"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done

          # Multipart: foo.png.b64.part0, part1, ...
          declare -A seen=()
          for f in public/heroes/*.png.b64.part*; do
            base="${f%.b64.part*}"
            seen["$base"]=1
          done
          for base in "${!seen[@]}"; do
            out="$base"
            rm -f /tmp/hero.b64
            parts=("$base".b64.part*)
            # sort numerically by part index
            IFS=$'\n' sorted=($(printf '%s\n' "${parts[@]}" | sort -t'p' -k2 -n))
            unset IFS
            for p in "${sorted[@]}"; do
              cat "$p" >> /tmp/hero.b64
              rm -f "$p"
            done
            base64 -d /tmp/hero.b64 > "$out"
            echo "assembled $out ($(wc -c < "$out") bytes) from ${#sorted[@]} parts"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/heroes
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "design(heroes): materialize binary PNG heroes from base64"
          git push origin HEAD:design/post-heroes
      - name: Remove one-shot workflow
        if: success()
        run: |
          set -euo pipefail
          # Only remove after no remaining parts/b64
          shopt -s nullglob
          left=(public/heroes/*.b64 public/heroes/*.b64.part*)
          if [ ${#left[@]} -gt 0 ]; then
            echo "still have pending blobs; keeping workflow"
            exit 0
          fi
          if [ -f .github/workflows/decode-heroes.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/decode-heroes.yml
            git commit -m "chore: remove one-shot decode-heroes workflow" || exit 0
            git push origin HEAD:design/post-heroes
          fi
