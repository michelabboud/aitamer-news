name: Decode hero PNGs

on:
  push:
    branches: [design/post-heroes]
    paths:
      - 'public/heroes/*.png.b64'

concurrency:
  group: decode-heroes
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/post-heroes
          fetch-depth: 0
      - name: Decode base64 heroes to PNG
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(public/heroes/*.png.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .b64 files to decode"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm -f "$f"
            echo "decoded $out ($(wc -c < "$out") bytes)"
            file "$out" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/heroes
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "design(heroes): materialize binary PNG heroes from base64"
          git push origin HEAD:design/post-heroes
      - name: Remove one-shot workflow
        if: success()
        run: |
          set -euo pipefail
          if [ -f .github/workflows/decode-heroes.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/decode-heroes.yml
            git commit -m "chore: remove one-shot decode-heroes workflow" || exit 0
            git push origin HEAD:design/post-heroes
          fi
