name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No package-lock.json in repo — do not set cache: npm (it requires a lockfile).

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Restore Astro incremental cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-incremental-cloudflare-${{ github.sha }}
          restore-keys: |
            astro-incremental-cloudflare-

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "48a3301b0d9817c1b50c2b81c36d799f"
          command: pages deploy dist --project-name=aitamer-news --branch=main
