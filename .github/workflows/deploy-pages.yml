name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check scripts and post times
        run: |
          npm test
          npm run check:posts

      - name: Restore Astro incremental cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-incremental-cloudflare-${{ github.sha }}
          restore-keys: |
            astro-incremental-cloudflare-

      - name: Build
        run: npm run build

      - name: Check the build holds no secrets
        run: npm run check:dist

      - name: Check the deploy fits the file budget
        run: npm run check:files

      - name: Deploy to Cloudflare Pages
        # Pinned to a commit: this step receives the Cloudflare API token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.139.0"
          command: pages deploy dist --project-name=aitamer-news --branch=main
