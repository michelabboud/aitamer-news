name: Deploy Cloudflare Pages

# Reviewed publication admission is disabled. Build the repository normally: all non-draft
# posts whose pubDate has arrived become visible together in the next verified deployment.

# Every deploy is verified before and after it goes live (docs/adr/0014-verified-deploys.md):
#   1. `settle` waits after a merge, so a burst of merges becomes one deploy of the last of them;
#   2. `deploy` runs every check on the merged commit, uploads it as a preview first and smoke-tests
#      the preview, then deploys production and smoke-tests aitamer.news, and rolls production back
#      to the deployment that was live before if that last check fails.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait the settle time first, as a merge does"
        type: boolean
        default: false

jobs:
  settle:
    runs-on: ubuntu-24.04
    permissions: {}
    # A newer run cancels an older one still waiting here: that is the whole debounce. Nothing else
    # happens in this job, so cancelling it never interrupts a deploy.
    concurrency:
      group: pages-settle
      cancel-in-progress: true
    steps:
      - name: Wait for more merges
        if: github.event_name == 'push' || inputs.wait
        env:
          # Repository variable DEPLOY_SETTLE_SECONDS, 0 to 3600; 60 when unset.
          SETTLE: ${{ vars.DEPLOY_SETTLE_SECONDS || '60' }}
        run: |
          set -euo pipefail
          if ! [[ "$SETTLE" =~ ^[0-9]+$ ]] || [ "$SETTLE" -gt 3600 ]; then
            echo "::error::DEPLOY_SETTLE_SECONDS must be a whole number of seconds from 0 to 3600"
            exit 1
          fi
          echo "Waiting ${SETTLE}s; a newer merge in that time replaces this run."
          sleep "$SETTLE"

  deploy:
    needs: settle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
    # Never cancelled once started: a deploy stopped between going live and its check, or midway
    # through a rollback, would leave production unverified. A newer run waits here instead, and
    # GitHub keeps only the newest waiting one.
    concurrency:
      group: pages-production
      cancel-in-progress: false
    env:
      PAGES_PROJECT: aitamer-news
      SITE_URL: https://aitamer.news
    steps:
      - name: Checkout
        # Pinned to a commit, like the deploy action: this job goes on to hold the Cloudflare token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The publisher may only have changed comment files
        # Defence in depth behind the required check `publisher-paths` (check-publisher-pr.yml):
        # the desk's publisher should only ever land its data files through a pull request, but if
        # it ever pushes to main itself (a ruleset gap, a leaked key), this refuses to build or
        # deploy unless every path changed between github.event.before and after is in one of its
        # two lanes, src/content/comments/<slug>.json or src/content/reactions/<slug>.json (ADR
        # 0008; the step keeps its original name, which the test finds it by). It runs first,
        # before `npm ci` or anything else from the pushed tree, with the runner's own node (the
        # script needs only node's built-ins). Because the judge is the script as it was before
        # the push, a change to the lanes takes effect only once it is itself on main.
        #
        # The checked-out tree IS the push being judged, so its copy of the script cannot be the
        # judge. The script (and the slug module it imports) is taken from the commit BEFORE the
        # push instead, read with `git show`, never checked out. That is still only a second
        # line: this workflow file itself comes from the pushed commit (GitHub refuses workflow
        # edits from an App without the `workflows` permission, which the publisher lacks), and
        # the first line is the pull request check, run from main.
        #
        # Who the publisher is: the repository variable PUBLISHER_ACTOR_ID, the App's numeric bot
        # account id (`gh api users/<app-slug>[bot] --jq .id`), compared with `github.actor_id`,
        # the account that pushed. An id, not a login: a login can be renamed and then taken by
        # someone else, an id never changes hands. Unset or blank: the step says so and skips. Set
        # but not a numeric id: the deploy fails, because a typo would otherwise switch the guard
        # off without a word. A publisher push whose before is all zeros or not fetchable fails.
        # This decision is made here, in the workflow, not by a script: a script would come from
        # the tree being judged. scripts/deploy-publisher-guard.test.mjs runs this shell as is.
        env:
          PUBLISHER_ACTOR_ID: ${{ vars.PUBLISHER_ACTOR_ID }}
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_ACTOR_ID//[[:space:]]/}" ]; then
            echo "::notice::PUBLISHER_ACTOR_ID is not set, so the publisher push check is skipped."
            exit 0
          fi
          # Whitespace around the id is forgiven; anything else that is not one number is not.
          if ! [[ "$PUBLISHER_ACTOR_ID" =~ ^[[:space:]]*([1-9][0-9]*)[[:space:]]*$ ]]; then
            echo "::error::PUBLISHER_ACTOR_ID is not a numeric account id; fix the repository variable (or clear it to skip this check)"
            exit 1
          fi
          publisher="${BASH_REMATCH[1]}"
          if ! [[ "$ACTOR_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::github.actor_id is not a numeric account id, so whether the publisher pushed cannot be told"
            exit 1
          fi
          # Both are canonical decimal numbers now, so comparing the strings compares the ids.
          if [ "$ACTOR_ID" != "$publisher" ]; then
            echo "The pusher (account $ACTOR_ID) is not the publisher; nothing to check."
            exit 0
          fi
          if [ "$EVENT_NAME" != "push" ]; then
            echo "::error::the publisher started a $EVENT_NAME run; it may only push comment files"
            exit 1
          fi
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::the publisher's push has no previous commit, so what it changed cannot be told"
            exit 1
          fi
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$AFTER" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::before or after is not a commit id"; exit 1; }
          git fetch --no-tags --depth=1 origin "$BEFORE" || { echo "::error::the commit before the publisher's push, $BEFORE, cannot be fetched"; exit 1; }
          judge="$RUNNER_TEMP/publisher-judge"
          mkdir -p "$judge"
          git show "$BEFORE:scripts/check-publisher-paths.mjs" > "$judge/check-publisher-paths.mjs"
          git show "$BEFORE:scripts/slug.mjs" > "$judge/slug.mjs"
          node "$judge/check-publisher-paths.mjs" push --before "$BEFORE" --after "$AFTER"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check scripts and post times
        run: |
          npm test
          npm run check:posts

      # The cache holds parsed content, and Astro does not re-parse an unchanged file when the schema
      # changes (2026-09-28: a renamed section kept its old value). So the key carries a fingerprint of
      # everything the content schema can import (src/content.config.ts, src/content/, src/lib/) and of
      # the lockfile, and any such change starts from a cold cache. scripts/workflow-cache.test.mjs
      # walks the schema's real imports to keep this list whole. The author files are in it too: a warm
      # cache kept a deleted author (2026-09-28), and authors change rarely.
      - name: Restore Astro incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-incremental-cloudflare-${{ hashFiles('src/content.config.ts', 'src/content/*.ts', 'src/lib/**/*.ts', '!src/lib/**/*.test.ts', 'package-lock.json', 'src/content/authors/*.md') }}-${{ github.sha }}
          restore-keys: |
            astro-incremental-cloudflare-${{ hashFiles('src/content.config.ts', 'src/content/*.ts', 'src/lib/**/*.ts', '!src/lib/**/*.test.ts', 'package-lock.json', 'src/content/authors/*.md') }}-

      - name: Verify workflow-owned numbering
        if: vars.SPECIMEN_ADMISSION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
        run: node scripts/specimen-admission.mjs deployed-gate

      - name: Build
        run: npm run build

      # Bot posts: the shipped HTML of every bot-authored post passes the allowlist, and the
      # checker renders every post exactly as this build did (SECURITY.md, "Bot posts"; ADR 0009).
      - name: Check bot post bodies against the build
        run: npm run check:bodies:build

      # The Content-Security-Policy the build wrote into dist/_headers names every inline script on
      # every page, and nothing on a page needs what it refuses (SECURITY.md, "Content-Security-Policy").
      - name: Check the Content-Security-Policy against the build
        run: npm run check:csp

      - name: Check the build holds no secrets
        run: npm run check:dist

      - name: Check the deploy fits the file budget
        run: npm run check:files

      - name: Check every internal link leads somewhere
        run: npm run check:links

      - name: Check every shipped diagram is its checked rewrite
        run: npm run check:diagrams:dist

      # A live post's hero lives on R2, which the link check cannot see (ADR 0020). One HEAD per
      # post hero, each retried on a network error or a 5xx; a draft's or a scheduled post's missing
      # hero is only listed. Before anything is uploaded, so a missing image never reaches readers.
      - name: Check every live post's hero is on the media host
        run: npm run check:media

      - name: Record the live deployment (the rollback target)
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/pages-api.mjs live

      - name: Deploy a preview (not live)
        id: preview
        # Pinned to a commit: this step receives the Cloudflare API token. Any branch other than
        # main is a Pages preview: its own address under pages.dev, which nobody is sent to.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy dist --project-name=aitamer-news --branch=deploy-candidate

      - name: Smoke-test the preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: node scripts/smoke-site.mjs --base "$PREVIEW_URL" --expect preview

      - name: Deploy to Cloudflare Pages
        id: production
        # Pinned to a commit: this step receives the Cloudflare API token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy dist --project-name=aitamer-news --branch=main

      - name: Smoke-test production
        run: node scripts/smoke-site.mjs --base "$SITE_URL" --expect production

      - name: Roll production back
        # Only when this run put a deployment live and the check after it failed. The job still
        # fails, so the failure is seen; the rollback only shortens how long readers see it.
        if: failure() && steps.production.outcome == 'success' && steps.live.outputs.deployment-id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ steps.live.outputs.deployment-id }}
        run: |
          node scripts/pages-api.mjs rollback "$TARGET"
          echo "::error::production failed its check after going live and was rolled back to deployment $TARGET"

      - name: Summary
        if: always()
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          LIVE_BEFORE: ${{ steps.live.outputs.deployment-id }}
          DEPLOYED: ${{ steps.production.outputs.pages-deployment-id }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Deploy of ${GITHUB_SHA::7}: ${OUTCOME}"
            echo "- live before: ${LIVE_BEFORE:-none recorded}"
            echo "- preview: ${PREVIEW_URL:-not deployed}"
            echo "- production deployment: ${DEPLOYED:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"
