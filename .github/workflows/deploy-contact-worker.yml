name: Deploy contact Worker

# The About page form posts to https://contact.aitamer.news/, served by workers/contact.
# Deploys only when the Worker changes, so site pushes never touch it.
on:
  push:
    branches: [main]
    paths:
      - "workers/contact/**"
      - ".github/workflows/deploy-contact-worker.yml"
  workflow_dispatch:

concurrency:
  group: contact-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The API token needs Workers Scripts: Edit and Workers Routes / custom domains on aitamer.news
      # in addition to Pages. Secrets (CONTACT_TO, TURNSTILE_SECRET_KEY) are set once with
      # `wrangler secret put` and survive deploys.
      - name: Deploy the Worker
        # Pinned to a commit: this step receives the Cloudflare API token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.139.0"
          command: deploy --config workers/contact/wrangler.toml
