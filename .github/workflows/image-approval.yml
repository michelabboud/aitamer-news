name: Approve image PR
run-name: "Owner image approval pr=${{ inputs.pr_number }} head=${{ inputs.head_sha }}"
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository image PR into main (images/ branch recommended)
        required: true
        type: string
      head_sha:
        description: Full exact head SHA after updating the image branch with current main
        required: true
        type: string
permissions: {}
concurrency:
  group: owner-image-approval-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  prepare:
    name: prepare-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      tree: ${{ steps.prepare.outputs.tree }}
      digest: ${{ steps.prepare.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: prepare
        run: node scripts/image-approval.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.head_sha }}
  validate:
    name: validate-images
    needs: prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install raster decoder and stamp font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify exact tree and materialize only approved image data
        run: node scripts/image-approval.mjs materialize
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          TREE_SHA: ${{ needs.prepare.outputs.tree }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.digest }}
      - run: npm test
      - run: npm run check:posts
      - run: npm run check:media
      - run: npm run build
      - run: npm run check:bodies:build
      - run: npm run check:csp
      - run: npm run check:links
      - run: npm run check:diagrams:dist
  certify:
    name: certify-images
    needs: [prepare, validate]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/image-approval.mjs certify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          TREE_SHA: ${{ needs.prepare.outputs.tree }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.digest }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
