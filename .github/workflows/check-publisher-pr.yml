name: Publisher paths

# The desk's publisher, a GitHub App, may only ever add, change or delete
# src/content/comments/<slug>.json and src/content/reactions/<slug>.json, its two lanes (phase 2
# plan D12, ADR 0006; the second lane, ADR 0008). A rename that git detects may not cross from one
# lane to the other; that is a tripwire (a delete plus a dissimilar add is two allowed changes),
# and each lane's contract, enforced by the required check `check`, is the real guarantee. It pushes to a desk/comments-* branch and opens a pull request into main with its
# installation token; this job is the required check on pull requests in the branch ruleset.
#
# Who is held to the rule: EVERY pull request, unless its author and this event's sender are both
# the maintainer, compared by numeric account id with the repository variable MAINTAINER_ID, and
# the event is `opened` or `synchronize` (the sender of `edited` or `reopened` did not push the
# head). Keying on the author alone would let the publisher push into someone else's pull request
# (Dependabot's, say) and pass. MAINTAINER_ID unset, empty or not a number: nobody is exempt.
#
# The posts App's authors lane (ADR 0018): a pull request whose author and this event's sender are
# both the posts App, by numeric id with the repository variable POSTS_ACTOR_ID (unset, empty or
# not a number: nobody gets the lane), on an `opened` or `synchronize` event from a
# desk/authors-<desk>-<16 hex>-<id> branch, may change exactly one src/content/authors/<id>.md,
# added or modified, and only an AI writer's or a bot's (kind at the merge base when modified, at
# the head when added; a human's file changes only through the maintainer), and only honestly: a
# modified author keeps its kind and name, and an added author takes no other author's name. The posts App gains nothing else, and
# the publisher's lanes do not gain author files. The rules and why: the script's header.
#
# pull_request_target: the workflow, and the script it runs, always come from main — never from
# the pull request. Nothing from the pull request's head is checked out or executed. For every pull
# request but the posts App's, no dependency is installed (the script needs only node's built-ins).
# For the posts App's, main's lockfile is installed with `npm ci --ignore-scripts` (no install
# script runs), because the authors lane reads the author file's frontmatter with both the site's
# own reader (scripts/frontmatter.mjs, js-yaml) and Astro's (@astrojs/internal-helpers), after
# refusing every form the two could read differently, and requires them to agree. The file itself
# is read from the fetched objects, never checked out. The verdict is pinned to the
# event's head commit: the job fetches refs/pull/<n>/head, fails if it is not that commit (the
# branch moved; the `synchronize` run for the new head judges it), and reads the changes from
# `git diff --name-status -M <merge base> <head>` and the modes from `git ls-tree -r <head>` on
# objects that are fetched but never checked out. Event values reach shell lines only through
# the environment, and each one is checked to be numeric or hexadecimal before use.
#
# The fetch is anonymous (persist-credentials: false), which works because this repository is
# public. A private copy would need an authenticated fetch, e.g. `persist-credentials: true`
# (safe here only because nothing from the pull request runs in this job).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publisher-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publisher-paths:
    # Article prefixes and the admission label isolate observation names only.
    # They grant no lane or authority; trusted certificates supply required success.
    name: ${{ (startsWith(github.event.pull_request.head.ref, 'specimens/run-') || startsWith(github.event.pull_request.head.ref, 'grok/') || startsWith(github.event.pull_request.head.ref, 'desk/posts-') || contains(github.event.pull_request.labels.*.name, 'workflow-numbering')) && 'publisher-paths-observation' || 'publisher-paths' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (the base; never the pull request)
        # Pinned to a commit: this job runs with the base repository's token on untrusted input.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history, so the merge base of any pull request is in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch the pull request's head (never checked out) and pin it
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pull request number is not a number"; exit 1; }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base sha is not a commit id"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head sha is not a commit id"; exit 1; }
          git fetch --no-tags origin "$BASE_SHA" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          fetched="$(git rev-parse --verify 'refs/remotes/pull/head^{commit}')"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request's head is now $fetched, not the $HEAD_SHA this run was for; the run for the new head judges it"
            exit 1
          fi

      - name: Install main's lockfile, for the posts App's pull requests only (no install scripts)
        # The authors lane reads frontmatter with js-yaml. Whether the lane applies is decided by the
        # script, not here: this only avoids installing anything for every other pull request. A
        # posts App pull request that gets no install fails closed (the reader cannot be loaded).
        env:
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          POSTS_ACTOR_ID: ${{ vars.POSTS_ACTOR_ID }}
        run: |
          set -euo pipefail
          if [[ "$POSTS_ACTOR_ID" =~ ^[[:space:]]*([1-9][0-9]*)[[:space:]]*$ ]] && [ "$PR_AUTHOR_ID" = "${BASH_REMATCH[1]}" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "Not a posts App pull request; nothing to install."
          fi

      - name: Check the changed paths
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          POSTS_ACTOR_ID: ${{ vars.POSTS_ACTOR_ID }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GROK_ACTOR_ID: ${{ vars.GROK_ACTOR_ID }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-publisher-paths.mjs pr --base "$BASE_SHA" --head "$HEAD_SHA"
