name: Scheduled publish

on:
  schedule:
    # :07, not :00 — GitHub's own docs flag the top of the hour as the most popular cron
    # minute, so jobs scheduled there queue behind everyone else's and can start late.
    # :07 avoids that congestion and keeps this job starting close to on time.
    # Twice an hour so a post scheduled on the hour and one on the half hour each go live in their own slot
    # (2026-10-02, Michel: one post every 30 minutes, around the clock). :07 and :37, never :00 or :30.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-due:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy
        # The serialized deploy reconciles every approved pending item and acknowledges the
        # previous run. A short timestamp window cannot recover a long scheduler outage.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml -R michelabboud/aitamer-news --ref main -f publication_mode=publish
