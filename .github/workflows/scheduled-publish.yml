name: Scheduled publish

on:
  schedule:
    # :07, not :00 — GitHub's own docs flag the top of the hour as the most popular cron
    # minute, so jobs scheduled there queue behind everyone else's and can start late.
    # :07 avoids that congestion and keeps this job starting close to on time.
    # Twice an hour so a post scheduled on the hour and one on the half hour each go live in their own slot
    # (2026-10-02, Michel: one post every 30 minutes, around the clock). :07 and :37, never :00 or :30.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-due:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # due-posts.mjs reads frontmatter with js-yaml (scripts/frontmatter.mjs), so dependencies
      # must be installed. Without this step every run failed from 0.1.19 on (review N2).
      - name: Install
        run: npm ci --omit=dev --ignore-scripts

      - name: Check for due posts
        id: due
        # 65 minutes, a little over two runs: a run GitHub delays or skips is caught by the next, and a post
        # does not keep triggering a deploy for two hours (the script's default window, sized for hourly runs).
        run: node scripts/due-posts.mjs --window-minutes 65

      - name: Trigger the deploy
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml -R michelabboud/aitamer-news --ref main
