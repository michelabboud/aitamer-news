name: Specimen admission
run-name: "${{ inputs.same_pr == 'true' && format('Specimen same-pr pr={0} head={1} review={2} recovery={3}{4}', inputs.pr_number, inputs.head_sha, inputs.review_id, inputs.recovery_run || '0', inputs.wake_run != '' && format(' wake={0}', inputs.wake_run) || '') || format('Specimen request pr={0} head={1} recovery={2}', inputs.pr_number, inputs.head_sha, inputs.recovery_run || '0') }}"
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Editorially approved source PR
        required: true
        type: string
      head_sha:
        description: Exact reviewed source head
        required: true
        type: string
      recovery_run:
        description: Trusted prior run for automatic stale-base recovery
        required: false
        default: ''
        type: string
      same_pr:
        description: Keep the original reviewed PR
        required: false
        default: 'true'
        type: string
      review_id:
        description: Exact owner approval review for automatic same-PR admission
        required: false
        default: '0'
        type: string
      wake_run:
        description: Immutable submitted owner approval receipt; empty retains legacy recovery format
        required: false
        default: ''
        type: string
permissions: {}
concurrency:
  group: specimen-admission-allocation
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.SPECIMEN_ADMISSION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    outputs:
      head: ${{ steps.prepare.outputs.head }}
      base: ${{ steps.prepare.outputs.base }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      editorial_digest: ${{ steps.prepare.outputs.editorial_digest }}
      observed_head: ${{ steps.prepare.outputs.observed_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Mint repository-scoped publishing App token
        run: node scripts/workflow-app-token.mjs
        env:
          SPECIMEN_APP_ID: ${{ vars.SPECIMEN_APP_ID }}
          SPECIMEN_INSTALLATION_ID: ${{ vars.SPECIMEN_INSTALLATION_ID }}
          SPECIMEN_APP_PRIVATE_KEY: ${{ secrets.SPECIMEN_APP_PRIVATE_KEY }}
      - id: prepare
        run: node scripts/specimen-admission.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.head_sha }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
          SAME_PR: ${{ inputs.same_pr }}
          REVIEW_ID: ${{ inputs.review_id }}
          REVIEW_WAKE_RUN: ${{ inputs.wake_run }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
      - name: Revoke run-local publishing token
        if: always()
        run: node scripts/workflow-app-token.mjs revoke
  validate:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic allocation and copy only content data
        run: node scripts/specimen-admission.mjs materialize
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EDITORIAL_DIGEST: ${{ needs.prepare.outputs.editorial_digest }}
          SAME_PR: ${{ inputs.same_pr }}
          OBSERVED_HEAD: ${{ needs.prepare.outputs.observed_head }}
      - run: npm test
      - run: npm run check:posts
      - run: npm run check:media
      - run: npm run build
      - run: npm run check:bodies:build
      - run: npm run check:csp
      - run: npm run check:links
      - run: npm run check:diagrams:dist
  certify:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/specimen-admission.mjs certify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          EDITORIAL_DIGEST: ${{ needs.prepare.outputs.editorial_digest }}
      - name: Wake finalizer after successful certification
        run: node scripts/specimen-admission.mjs wake-finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
