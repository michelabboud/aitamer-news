name: Check posts

# Runs the tests, the post contract check (times, specimen numbers, ledger) and the media check on every pull
# request and on every push to a branch other than main, so a specimen-number collision between
# two branches is caught before it lands on main (POST.md section 4). main is checked by
# deploy-pages.yml before it deploys.
#
# No secrets, read-only token: safe for pull requests from forks.

on:
  pull_request:
  push:
    # The protected control-state branch has no application tree or package manifest.
    branches-ignore: [main, specimens/state]

permissions:
  contents: read

concurrency:
  group: check-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both PR and push checks remain observations on admission-generated branches.
    # A matching branch name supplies no required certificate and no merge authority.
    name: ${{ (startsWith(github.event.pull_request.head.ref || github.ref_name, 'specimens/run-') || startsWith(github.event.pull_request.head.ref || github.ref_name, 'grok/') || startsWith(github.event.pull_request.head.ref || github.ref_name, 'desk/posts-') || contains(github.event.pull_request.labels.*.name, 'workflow-numbering') || (github.event_name == 'push' && github.event.sender.id == 334982782)) && 'check-observation' || 'check' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check posts
        env:
          SPECIMEN_ADMISSION_ENABLED: ${{ vars.SPECIMEN_ADMISSION_ENABLED }}
        run: |
          if [ "$SPECIMEN_ADMISSION_ENABLED" = 'true' ]; then
            git fetch --no-tags origin main
            npm run check:candidate -- --base "$(git rev-parse origin/main)"
          else
            npm run check:posts
          fi

      # Heroes live on R2 (ADR 0020): a live post whose hero was never uploaded fails its pull
      # request here, not the deploy of main. One HEAD per post hero, retried on a network error or
      # a 5xx; a draft's or a future-scheduled post's missing hero is only listed. deploy-pages.yml
      # runs the same check again, for a post that goes live between the merge and the deploy.
      - name: Check every live post's hero is on the media host
        run: npm run check:media

      # The strict schema (retired sections, misspelled fields) is only enforced by the build,
      # so build here too: a bad post fails its pull request, not the next deploy of main.
      - name: Build
        run: npm run build

      # Bot posts: the shipped HTML of every bot-authored post passes the allowlist, and the
      # checker renders every post exactly as this build did (SECURITY.md, "Bot posts"; ADR 0009).
      - name: Check bot post bodies against the build
        run: npm run check:bodies:build

      # The Content-Security-Policy the build wrote names every inline script on every page
      # (SECURITY.md, "Content-Security-Policy"): a change that adds one fails here, not on main.
      - name: Check the Content-Security-Policy against the build
        run: npm run check:csp

      # Every internal link on every page leads to a page, a file or a redirect the site serves:
      # a link to a renamed page fails its pull request, not the deploy of main.
      - name: Check every internal link leads somewhere
        run: npm run check:links

      # Diagrams (ADR 0016): the build replaced every SVG with the checker's own rewrite; the files
      # that would ship are exactly that rewrite.
      - name: Check every shipped diagram is its checked rewrite
        run: npm run check:diagrams:dist
