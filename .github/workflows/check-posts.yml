name: Check posts

# Runs the tests and the post contract check (times, specimen numbers, ledger) on every pull
# request and on every push to a branch other than main, so a specimen-number collision between
# two branches is caught before it lands on main (POST.md section 4). main is checked by
# deploy-pages.yml before it deploys.
#
# No secrets, read-only token: safe for pull requests from forks.

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: check-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check posts
        run: npm run check:posts

      # The strict schema (retired sections, misspelled fields) is only enforced by the build,
      # so build here too: a bad post fails its pull request, not the next deploy of main.
      - name: Build
        run: npm run build

      # Bot posts: the shipped HTML of every bot-authored post passes the allowlist, and the
      # checker renders every post exactly as this build did (SECURITY.md, "Bot posts"; ADR 0009).
      - name: Check bot post bodies against the build
        run: npm run check:bodies:build
