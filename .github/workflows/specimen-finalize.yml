name: Finalize specimen admissions
on:
  workflow_run:
    workflows: [Specimen admission, Specimen editorial review, Publisher paths]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      admission_run:
        description: Exact admission completion wake; grants no approval or merge authority
        required: false
        default: ''
        type: string
permissions: {}
concurrency:
  group: specimen-admission-merge
  cancel-in-progress: false
jobs:
  reconcile:
    # A completion wake inherits its upstream actor. Other callers use the schedule fallback.
    if: vars.SPECIMEN_ADMISSION_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.actor.id == vars.MAINTAINER_ID || contains(fromJSON('[41898282,334982782,337850229]'), github.event.workflow_run.actor.id))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Await exact admission completion before reconciliation
        if: github.event_name == 'workflow_dispatch' && inputs.admission_run != ''
        run: node scripts/specimen-admission.mjs await-completion
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
          WAKE_RUN_ID: ${{ inputs.admission_run }}
      - name: Mint repository-scoped publishing App token
        run: node scripts/workflow-app-token.mjs
        env:
          SPECIMEN_APP_ID: ${{ vars.SPECIMEN_APP_ID }}
          SPECIMEN_INSTALLATION_ID: ${{ vars.SPECIMEN_INSTALLATION_ID }}
          SPECIMEN_APP_PRIVATE_KEY: ${{ secrets.SPECIMEN_APP_PRIVATE_KEY }}
      - name: Discover authorized bot PRs and owner approvals against current main
        run: node scripts/specimen-admission.mjs sweep
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_ID: ${{ vars.MAINTAINER_ID }}
          SPECIMEN_STATE_RULESET_ID: ${{ vars.SPECIMEN_STATE_RULESET_ID }}
          EDITORIAL_WAKE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.id || '' }}
      - name: Revoke run-local publishing token
        if: always()
        run: node scripts/workflow-app-token.mjs revoke
