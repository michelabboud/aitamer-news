# Pages project. pages_build_output_dir makes this file the source of truth
# on the next `wrangler pages deploy` (bindings included). The contact form
# is functions/api/contact.js and sends through the EMAIL binding.
name = "aitamer-news"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-23"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "desk@aitamer.news" ]
