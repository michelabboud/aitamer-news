<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" role="img" aria-labelledby="t d">
<title id="t">The RAG loop</title>
<desc id="d">Offline, sources are parsed, chunked, embedded and upserted into the vector database with metadata. On each request the question is embedded, searched with filters, reranked, and the top chunks go into a prompt from which an LLM writes an answer with citations.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes travel {
  0% { transform: translate(104px, 206px); opacity: 1; }
  18% { transform: translate(294px, 206px); }
  36% { transform: translate(484px, 206px); }
  54% { transform: translate(674px, 206px); }
  64% { transform: translate(674px, 262px); }
  78% { transform: translate(504px, 264px); }
  90% { transform: translate(294px, 264px); }
  100% { transform: translate(104px, 264px); opacity: 1; }
}
.pk { transform: translate(104px, 206px); opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
.pk { animation: travel 7s linear infinite; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="338" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">RAG end to end: where the vector database sits</text>
<text class="t" x="24" y="60" text-anchor="start">Ingestion (offline, on change)</text>
<rect class="box" x="24" y="72" width="160" height="48" rx="8"/>
<text class="t" x="104.0" y="101.0" text-anchor="middle">Sources</text>
<rect class="box" x="214" y="72" width="160" height="48" rx="8"/>
<text class="t" x="294.0" y="101.0" text-anchor="middle">Parse and chunk</text>
<path class="ln" d="M186 96L210 96" marker-end="url(#ah)"/>
<rect class="boxb" x="404" y="72" width="160" height="48" rx="8"/>
<text class="t" x="484.0" y="101.0" text-anchor="middle">Embed</text>
<path class="ln" d="M376 96L400 96" marker-end="url(#ah)"/>
<rect class="boxc" x="594" y="72" width="160" height="48" rx="8"/>
<text class="t" x="674.0" y="101.0" text-anchor="middle">Upsert + metadata</text>
<path class="ln" d="M566 96L590 96" marker-end="url(#ah)"/>
<text class="t" x="24" y="170" text-anchor="start">Query (every request)</text>
<rect class="box" x="24" y="182" width="160" height="48" rx="8"/>
<text class="t" x="104.0" y="211.0" text-anchor="middle">Question</text>
<rect class="boxb" x="214" y="182" width="160" height="48" rx="8"/>
<text class="t" x="294.0" y="211.0" text-anchor="middle">Embed</text>
<path class="ln" d="M186 206L210 206" marker-end="url(#ah)"/>
<rect class="boxc" x="404" y="182" width="160" height="48" rx="8"/>
<text class="t" x="484.0" y="211.0" text-anchor="middle">ANN + filter</text>
<path class="ln" d="M376 206L400 206" marker-end="url(#ah)"/>
<rect class="boxs" x="594" y="182" width="160" height="48" rx="8"/>
<text class="t" x="674.0" y="211.0" text-anchor="middle">Rerank</text>
<path class="ln" d="M566 206L590 206" marker-end="url(#ah)"/>
<path class="ln" d="M674 230 L674 264 L644 264" marker-end="url(#ah)"/>
<rect class="box" x="24" y="240" width="160" height="48" rx="8"/>
<text class="t" x="104.0" y="269.0" text-anchor="middle">Answer + citations</text>
<rect class="boxb" x="214" y="240" width="160" height="48" rx="8"/>
<text class="t" x="294.0" y="269.0" text-anchor="middle">LLM generates</text>
<rect class="box" x="404" y="240" width="236" height="48" rx="8"/>
<text class="t" x="522.0" y="269.0" text-anchor="middle">Prompt: question + top chunks</text>
<path class="ln" d="M402 264L376 264" marker-end="url(#ah)"/>
<path class="ln" d="M212 264L186 264" marker-end="url(#ah)"/>
<path class="lnf" d="M644 120 L644 182"/>
<text class="ts" x="652" y="156" text-anchor="start">same index</text>
<circle class="pk" cx="0" cy="0" r="6" fill="#d9674f"/>
<text class="ts" x="24" y="318" text-anchor="start">The coral boxes are the vector database. Most "RAG isn't working" bugs live in the other boxes.</text>
</svg>
