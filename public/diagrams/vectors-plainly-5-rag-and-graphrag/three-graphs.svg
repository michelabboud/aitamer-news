}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="330" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Three different things called "graph"</text>
<rect class="panel" x="24" y="46" width="240" height="240" rx="10"/>
<text class="t" x="144" y="72" text-anchor="middle">The index is a graph</text>
<text class="ts" x="144" y="252" text-anchor="middle">HNSW links near vectors.</text>
<text class="ts" x="144" y="270" text-anchor="middle">Edges mean "close", nothing else.</text>
