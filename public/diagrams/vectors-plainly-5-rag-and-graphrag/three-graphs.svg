<text class="t" x="400" y="72" text-anchor="middle">A knowledge graph beside it</text>
<text class="ts" x="400" y="252" text-anchor="middle">Entities and relations in</text>
<text class="ts" x="400" y="270" text-anchor="middle">a graph store; edges mean facts.</text>
<path class="lnc" d="M340 120 L460 120" marker-end="url(#ahc)"/>
<path class="lnc" d="M460 120 L400 200" marker-end="url(#ahc)"/>
<text class="ts" x="400" y="110" text-anchor="middle">uses</text>
<text class="ts" x="456" y="168" text-anchor="start">had</text>
<circle class="dc" cx="340" cy="120" r="8"/>
<text class="ts" x="340" y="144" text-anchor="middle">Acme</text>
<circle class="dc" cx="460" cy="120" r="8"/>
<text class="ts" x="460" y="106" text-anchor="middle">Vendor X</text>
<circle class="dc" cx="400" cy="200" r="8"/>
<text class="ts" x="400" y="224" text-anchor="middle">Incident</text>
<rect class="panel" x="536" y="46" width="240" height="240" rx="10"/>
<text class="t" x="656" y="72" text-anchor="middle">One engine, both</text>
<text class="ts" x="656" y="252" text-anchor="middle">Vectors and edges in one</text>
<text class="ts" x="656" y="270" text-anchor="middle">store and one query language.</text>
<path class="lnc" d="M596 120 L716 120 L656 200 Z"/>
<circle class="dc" cx="596" cy="120" r="8"/>
<rect class="boxb" x="580" y="132" width="32" height="10" rx="2"/>
<circle class="dc" cx="716" cy="120" r="8"/>
<rect class="boxb" x="700" y="132" width="32" height="10" rx="2"/>
<circle class="dc" cx="656" cy="200" r="8"/>
<rect class="boxb" x="640" y="212" width="32" height="10" rx="2"/>
<text class="ts" x="656" y="236" text-anchor="middle">each node also carries a vector</text>
<text class="ts" x="24" y="312" text-anchor="start">Most teams compose: a vector database for similarity, a graph database once multi-hop questions appear.</text>
</svg>
