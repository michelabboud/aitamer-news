<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
<title id="t">Three meanings of graph</title>
<desc id="d">Left: an HNSW index is a graph whose edges only mean two vectors are close. Middle: a knowledge graph beside the vector store, whose edges are facts between entities. Right: one engine that stores both vectors and graph edges.</desc>
<style>
