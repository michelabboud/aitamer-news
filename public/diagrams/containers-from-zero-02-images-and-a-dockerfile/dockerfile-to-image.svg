<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">From Dockerfile lines to image layers</title>
<desc id="d">On the left, the six-line Dockerfile for hello-app. On the right, the image it builds, as docker history shows it, newest at the top. FROM python:3.14-slim does not copy anything: the image starts on top of the four file layers of the Python base image, a Debian base of 87.7MB and Python of 42.1MB among them. WORKDIR /app adds a layer of 8.19kB and COPY app.py adds a layer of 12.3kB; that COPY layer is highlighted as the one your code lives in. ENV, EXPOSE and CMD are 0B: they set metadata such as the default command and change no files.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Each Dockerfile line becomes a layer or a setting</text>
<rect class="panel" x="24" y="50" width="300" height="400" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Dockerfile</text>
<rect class="box" x="40" y="92" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="116.5" text-anchor="start">FROM python:3.14-slim</text>
<rect class="box" x="40" y="144" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="168.5" text-anchor="start">WORKDIR /app</text>
<rect class="boxc" x="40" y="196" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="220.5" text-anchor="start">COPY app.py .</text>
<rect class="box" x="40" y="248" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="272.5" text-anchor="start">ENV GREETING=Hello</text>
<rect class="box" x="40" y="300" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="324.5" text-anchor="start">EXPOSE 8000</text>
<rect class="box" x="40" y="352" width="268" height="40" rx="10"/>
<text class="tm" x="52" y="376.5" text-anchor="start">CMD [&quot;python&quot;, &quot;app.py&quot;]</text>
<rect class="panel" x="344" y="50" width="432" height="400" rx="10"/>
<text class="th" x="360" y="76" text-anchor="start">hello-app:1.0  (docker history, newest first)</text>
<rect class="boxn" x="360" y="86" width="400" height="36" rx="10"/>
<text class="tm" x="374" y="109" text-anchor="start">CMD [&quot;python&quot; &quot;app.py&quot;]</text>
<text class="tb" x="640" y="109" text-anchor="end">0B</text>
<text class="ts" x="748" y="109" text-anchor="end">metadata</text>
<rect class="boxn" x="360" y="130" width="400" height="36" rx="10"/>
<text class="tm" x="374" y="153" text-anchor="start">EXPOSE 8000/tcp</text>
<text class="tb" x="640" y="153" text-anchor="end">0B</text>
<text class="ts" x="748" y="153" text-anchor="end">metadata</text>
<rect class="boxn" x="360" y="174" width="400" height="36" rx="10"/>
<text class="tm" x="374" y="197" text-anchor="start">ENV GREETING=Hello</text>
<text class="tb" x="640" y="197" text-anchor="end">0B</text>
<text class="ts" x="748" y="197" text-anchor="end">metadata</text>
<rect class="boxc" x="360" y="218" width="400" height="36" rx="10"/>
<text class="tm" x="374" y="241" text-anchor="start">COPY app.py .</text>
<text class="tb" x="640" y="241" text-anchor="end">12.3kB</text>
<text class="ts" x="748" y="241" text-anchor="end">your code</text>
<rect class="boxs" x="360" y="262" width="400" height="36" rx="10"/>
<text class="tm" x="374" y="285" text-anchor="start">WORKDIR /app</text>
<text class="tb" x="640" y="285" text-anchor="end">8.19kB</text>
<text class="ts" x="748" y="285" text-anchor="end">creates /app</text>
<rect class="boxb" x="360" y="310" width="400" height="124" rx="10"/>
<text class="tb" x="374" y="334" text-anchor="start">python:3.14-slim, the FROM image</text>
<text class="tm" x="374" y="356" text-anchor="start">Python 3.14.10 files</text>
<text class="tb" x="744" y="356" text-anchor="end">42.1MB</text>
<text class="tm" x="374" y="376" text-anchor="start">apt packages and links</text>
<text class="tb" x="744" y="376" text-anchor="end">4.93MB + 16.4kB</text>
<text class="tm" x="374" y="396" text-anchor="start">Debian trixie base</text>
<text class="tb" x="744" y="396" text-anchor="end">87.7MB</text>
<text class="ts" x="374" y="420" text-anchor="start">plus its own ENV and CMD settings, 0B each</text>
<line class="ln" x1="308" y1="112" x2="358" y2="380" marker-end="url(#ah)"/>
<line class="ln" x1="308" y1="164" x2="358" y2="280" marker-end="url(#ah)"/>
<line class="lnc" x1="308" y1="216" x2="358" y2="236" marker-end="url(#ahc)"/>
</svg>
