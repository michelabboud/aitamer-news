<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">A container adds one writable layer</title>
<desc id="d">A running container named try is drawn as the image&#x27;s read-only layers with one thin writable layer on top. Writing /app/note.txt inside the container puts the file in the writable layer, which is highlighted; docker diff try reports C /app and A /app/note.txt. The image layers do not change. A second container from the same image gets its own empty writable layer and sees only app.py in /app. Removing the container deletes its writable layer and the note with it.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Writes go to the container&#x27;s own layer, never into the image</text>
<rect class="panel" x="24" y="50" width="360" height="330" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">container try</text>
<rect class="boxc" x="40" y="92" width="328" height="56" rx="10"/>
<text class="tb" x="204" y="116.0" text-anchor="middle">writable layer</text>
<text class="tm" x="204" y="133.0" text-anchor="middle">A /app/note.txt</text>
<rect class="box" x="40" y="158" width="328" height="40" rx="10"/>
<text class="tm" x="204" y="182.5" text-anchor="middle">COPY app.py  (read-only)</text>
<rect class="box" x="40" y="204" width="328" height="40" rx="10"/>
<text class="tm" x="204" y="228.5" text-anchor="middle">WORKDIR /app  (read-only)</text>
<rect class="boxb" x="40" y="250" width="328" height="70" rx="10"/>
<text class="tm" x="204" y="281.0" text-anchor="middle">python:3.14-slim layers</text>
<text class="tm" x="204" y="298.0" text-anchor="middle">(read-only)</text>
<text class="tm" x="204" y="350" text-anchor="middle">docker diff try:  C /app,  A /app/note.txt</text>
<rect class="panel" x="404" y="50" width="372" height="330" rx="10"/>
<text class="th" x="420" y="76" text-anchor="start">a second container</text>
<rect class="boxd" x="420" y="92" width="340" height="56" rx="10"/>
<text class="t" x="590" y="116.0" text-anchor="middle">its own writable layer</text>
<text class="ts" x="590" y="133.0" text-anchor="middle">empty</text>
<rect class="box" x="420" y="158" width="340" height="162" rx="10"/>
<text class="t" x="590" y="226.5" text-anchor="middle">the same image layers,</text>
<text class="t" x="590" y="243.5" text-anchor="middle">shared, unchanged</text>
<text class="tm" x="590" y="260.5" text-anchor="middle">ls /app prints only app.py</text>
<text class="ts" x="590" y="350" text-anchor="middle">docker rm deletes a writable layer and its files</text>
</svg>
