<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Two images share every layer but one</title>
<desc id="d">hello-app:1.0 and hello-app:1.1 listed by layer digest, bottom to top. The four bottom layers, 54ae9782e24f, 8bea222313c7, 1d5b23e30cf6 and 3223e9c67581, are python:3.14-slim and are identical in both. The WORKDIR layer 4bfad4ab49d7 is identical too, because the rebuild reused it from the build cache (CACHED). Only the top COPY layer differs, 22b502fd8b26 in 1.0 and 74899f619c88 in 1.1, because app.py changed; that difference is highlighted. The tag hello-app:latest points at the same image ID as 1.1, 045cf843b4fd.</desc>
