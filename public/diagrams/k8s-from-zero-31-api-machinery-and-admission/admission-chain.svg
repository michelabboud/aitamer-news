<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Admission runs in two phases: mutating, then validating</title>
<desc id="d">Left: the mutating phase. Built-in mutating plugins such as ServiceAccount and LimitRanger, MutatingAdmissionPolicy objects written in CEL, and mutating webhooks, which are called in serial and may be reinvoked if a later step changes the object. In our lab the policy add-managed-by added the label managed-by=platform-team. Middle: schema validation of the final object. Right: the validating phase. Built-in validating plugins such as PodSecurity and ResourceQuota, ValidatingAdmissionPolicy objects in CEL, and validating webhooks, which are called in parallel. If any of them rejects, the whole request fails. In our lab require-team-label denied a Deployment without a team label. A bottom panel lists webhook settings: failurePolicy Fail or Ignore, timeoutSeconds default 10, sideEffects, and matchConditions.</desc>
