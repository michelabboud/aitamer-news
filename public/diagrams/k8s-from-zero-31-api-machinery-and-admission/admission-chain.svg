<text class="tm" x="40" y="348" text-anchor="start">managed-by=platform-team</text>
<line class="ln" x1="324" y1="210" x2="350" y2="210" marker-end="url(#ah)"/>
<rect class="box" x="352" y="150" width="96" height="120" rx="10"/>
<text class="t" x="400" y="200" text-anchor="middle">schema</text>
<text class="t" x="400" y="220" text-anchor="middle">validation</text>
<line class="ln" x1="448" y1="210" x2="474" y2="210" marker-end="url(#ah)"/>
<rect class="boxs" x="476" y="60" width="300" height="300" rx="12"/>
<text class="t" x="492" y="86" text-anchor="start">Validating phase</text>
<rect class="box" x="492" y="104" width="268" height="54" rx="8"/>
<text class="tm" x="504" y="126" text-anchor="start">built-in plugins</text>
<text class="ts" x="504" y="146" text-anchor="start">PodSecurity, ResourceQuota, ...</text>
<rect class="box" x="492" y="172" width="268" height="54" rx="8"/>
<text class="tm" x="504" y="194" text-anchor="start">ValidatingAdmissionPolicy</text>
<text class="ts" x="504" y="214" text-anchor="start">CEL, Deny, Warn or Audit</text>
<rect class="box" x="492" y="240" width="268" height="54" rx="8"/>
<text class="tm" x="504" y="262" text-anchor="start">validating webhooks</text>
<text class="ts" x="504" y="282" text-anchor="start">called in parallel</text>
<text class="tc" x="492" y="330" text-anchor="start">any rejection fails the request</text>
<text class="ts" x="492" y="348" text-anchor="start">lab: require-team-label denied noteam</text>
<rect class="panel" x="24" y="384" width="752" height="120" rx="10"/>
<text class="t" x="40" y="408" text-anchor="start">Webhook settings that decide how bad a bad day gets</text>
<text class="ts" x="40" y="434" text-anchor="start">failurePolicy: Fail (default) blocks requests when the webhook is down; Ignore lets them through</text>
<text class="ts" x="40" y="456" text-anchor="start">timeoutSeconds: default 10, keep it short; sideEffects: None if the call changes nothing else</text>
<text class="ts" x="40" y="478" text-anchor="start">matchConditions and namespaceSelector: keep kube-system and the webhook itself out of scope</text>
</svg>
