<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d">
<title id="t">Server-side apply: every field has a manager</title>
<desc id="d">The Deployment api with its managedFields shown as owners. Step 1: kubectl applied the manifest with replicas 2, so the manager kubectl owns spec.replicas, the labels and the Pod template, and kube-controller-manager owns status. Step 2: a second manager, scaler-bot, applied replicas 5 and got a conflict with kubectl on .spec.replicas. Step 3: scaler-bot applied again with --force-conflicts and took ownership of spec.replicas, shown highlighted. Step 4: kubectl re-applied its manifest with replicas 2 and now hit a conflict with scaler-bot. Step 5: replicas was removed from the kubectl manifest, the apply succeeded, and replicas stayed at 5, owned by scaler-bot.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="540" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Deployment api: who owns which field (managedFields)</text>
<rect class="box" x="24" y="56" width="360" height="200" rx="12"/>
<text class="ts" x="40" y="80" text-anchor="start">after step 1</text>
<text class="tm" x="40" y="110" text-anchor="start">metadata.labels.team</text>
<rect class="boxb" x="200" y="96" width="176" height="24" rx="6"/>
<text class="tm" x="208" y="112" text-anchor="start">kubectl</text>
<text class="tm" x="40" y="148" text-anchor="start">spec.replicas: 2</text>
<rect class="boxb" x="200" y="134" width="176" height="24" rx="6"/>
<text class="tm" x="208" y="150" text-anchor="start">kubectl</text>
<text class="tm" x="40" y="186" text-anchor="start">spec.template</text>
<rect class="boxb" x="200" y="172" width="176" height="24" rx="6"/>
<text class="tm" x="208" y="188" text-anchor="start">kubectl</text>
<text class="tm" x="40" y="224" text-anchor="start">status</text>
<rect class="boxs" x="200" y="210" width="176" height="24" rx="6"/>
<text class="tm" x="208" y="226" text-anchor="start">kube-controller-manager</text>
<rect class="box" x="416" y="56" width="360" height="200" rx="12"/>
<text class="ts" x="432" y="80" text-anchor="start">after step 3 (--force-conflicts)</text>
<text class="tm" x="432" y="110" text-anchor="start">metadata.labels.team</text>
<rect class="boxb" x="592" y="96" width="176" height="24" rx="6"/>
<text class="tm" x="600" y="112" text-anchor="start">kubectl</text>
<text class="tm" x="432" y="148" text-anchor="start">spec.replicas: 5</text>
<rect class="boxc" x="592" y="134" width="176" height="24" rx="6"/>
<text class="tm" x="600" y="150" text-anchor="start">scaler-bot</text>
<text class="tm" x="432" y="186" text-anchor="start">spec.template</text>
<rect class="boxb" x="592" y="172" width="176" height="24" rx="6"/>
<text class="tm" x="600" y="188" text-anchor="start">kubectl</text>
<text class="tm" x="432" y="224" text-anchor="start">status</text>
<rect class="boxs" x="592" y="210" width="176" height="24" rx="6"/>
<text class="tm" x="600" y="226" text-anchor="start">kube-controller-manager</text>
<line class="ln" x1="384" y1="156" x2="414" y2="156" marker-end="url(#ah)"/>
<rect class="box" x="24" y="276" width="752" height="38" rx="8"/>
<text class="t" x="40" y="300" text-anchor="start">1</text>
<text class="t" x="64" y="300" text-anchor="start">kubectl apply --server-side (replicas 2)</text>
<text class="ts" x="456" y="300" text-anchor="start">fields owned by kubectl</text>
<rect class="boxc" x="24" y="322" width="752" height="38" rx="8"/>
<text class="t" x="40" y="346" text-anchor="start">2</text>
<text class="t" x="64" y="346" text-anchor="start">scaler-bot applies replicas 5</text>
<text class="tc" x="456" y="346" text-anchor="start">conflict with "kubectl": .spec.replicas</text>
<rect class="box" x="24" y="368" width="752" height="38" rx="8"/>
<text class="t" x="40" y="392" text-anchor="start">3</text>
<text class="t" x="64" y="392" text-anchor="start">scaler-bot applies with --force-conflicts</text>
<text class="ts" x="456" y="392" text-anchor="start">ownership moves to scaler-bot</text>
<rect class="boxc" x="24" y="414" width="752" height="38" rx="8"/>
<text class="t" x="40" y="438" text-anchor="start">4</text>
<text class="t" x="64" y="438" text-anchor="start">kubectl re-applies replicas 2</text>
<text class="tc" x="456" y="438" text-anchor="start">conflict with "scaler-bot"</text>
<rect class="box" x="24" y="460" width="752" height="38" rx="8"/>
<text class="t" x="40" y="484" text-anchor="start">5</text>
<text class="t" x="64" y="484" text-anchor="start">kubectl drops replicas from its file</text>
<text class="ts" x="456" y="484" text-anchor="start">apply succeeds, replicas stays 5</text>
</svg>
