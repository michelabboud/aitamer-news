<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
<title id="t">Who owns a file written into a bind mount</title>
<desc id="d">A bind mount shares one folder between the host and the container, and file ownership is shared as numbers. hello-app runs as root, user ID 0, by default, so visits.txt it creates in the bind-mounted folder belongs to root on the host, and echo 5 &gt; data/visits.txt from your shell fails with Permission denied. Started with --user &quot;$(id -u):$(id -g)&quot;, here 1000:1000, the app writes the file as your user ID, so the host shows it as yours and you can edit it; the next visit counted 6. This second case is highlighted.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="380" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Ownership crosses a bind mount as a number</text>
<rect class="panel" x="24" y="50" width="368" height="310" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">default</text>
<rect class="boxd" x="40" y="90" width="336" height="84" rx="10"/>
<text class="t" x="54" y="112" text-anchor="start">container</text>
<rect class="box" x="56" y="118" width="304" height="44" rx="10"/>
<text class="tm" x="208" y="144.5" text-anchor="middle">app runs as uid 0 (root)</text>
<line class="ln" x1="208" y1="174" x2="208" y2="208" marker-end="url(#ah)"/>
<text class="ts" x="218" y="196" text-anchor="start">writes data/visits.txt</text>
<rect class="box" x="40" y="210" width="336" height="64" rx="10"/>
<text class="ts" x="208" y="238.0" text-anchor="middle">host: ls -l data</text>
<text class="tb" x="208" y="255.0" text-anchor="middle">-rw-r--r-- root root</text>
<text class="tm" x="208" y="312" text-anchor="middle">echo 5 &gt; ...: Permission denied</text>
<rect class="panel" x="408" y="50" width="368" height="310" rx="10"/>
<text class="th" x="424" y="76" text-anchor="start">--user &quot;$(id -u):$(id -g)&quot;</text>
<rect class="boxd" x="424" y="90" width="336" height="84" rx="10"/>
<text class="t" x="438" y="112" text-anchor="start">container</text>
<rect class="boxc" x="440" y="118" width="304" height="44" rx="10"/>
<text class="tm" x="592" y="144.5" text-anchor="middle">app runs as uid 1000</text>
<line class="lnc" x1="592" y1="174" x2="592" y2="208" marker-end="url(#ahc)"/>
<text class="ts" x="602" y="196" text-anchor="start">writes data/visits.txt</text>
<rect class="box" x="424" y="210" width="336" height="64" rx="10"/>
<text class="ts" x="592" y="238.0" text-anchor="middle">host: ls -l data</text>
<text class="tb" x="592" y="255.0" text-anchor="middle">-rw-r--r-- ubuntu ubuntu</text>
<text class="tm" x="592" y="312" text-anchor="middle">echo 5 &gt; ... works, next visit 6</text>
</svg>
