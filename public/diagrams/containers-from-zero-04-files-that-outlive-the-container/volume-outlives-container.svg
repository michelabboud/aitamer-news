<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">A named volume outlives the container</title>
<desc id="d">A timeline from the lab. The first container runs with the volume hello-data mounted at /data and answers visit 1 and visit 2, then docker rm -f removes it. The volume hello-data stays, holding visits.txt with the number 2; this volume is highlighted and runs under both containers. A new container mounts the same volume and answers visit 3. For comparison, without a volume the second container started again at visit 1.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="360" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Containers come and go; the volume stays</text>
<rect class="panel" x="24" y="50" width="752" height="290" rx="10"/>
<rect class="box" x="48" y="92" width="300" height="70" rx="10"/>
<text class="tb" x="198" y="123.0" text-anchor="middle">first container</text>
<text class="tm" x="198" y="140.0" text-anchor="middle">visit 1, visit 2</text>
<line class="ln" x1="350" y1="127" x2="470" y2="127" marker-end="url(#ah)"/>
<text class="ts" x="410" y="116" text-anchor="middle">docker rm -f</text>
<text class="ts" x="410" y="146" text-anchor="middle">then docker run</text>
<rect class="boxs" x="472" y="92" width="280" height="70" rx="10"/>
<text class="tb" x="612" y="123.0" text-anchor="middle">new container, same volume</text>
<text class="tm" x="612" y="140.0" text-anchor="middle">visit 3</text>
<line class="lnc" x1="198" y1="162" x2="198" y2="196" marker-end="url(#ahc)"/>
<line class="lnc" x1="612" y1="196" x2="612" y2="164" marker-end="url(#ahc)"/>
<rect class="boxc" x="48" y="198" width="704" height="56" rx="10"/>
<text class="tb" x="400" y="230.5" text-anchor="middle">volume hello-data   ·   visits.txt = 2, then 3</text>
<text class="ts" x="400" y="290" text-anchor="middle">Without a volume, the new container answered visit 1:</text>
<text class="ts" x="400" y="310" text-anchor="middle">the count was in the writable layer, deleted with the first container.</text>
</svg>
