<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Three places a container can write /data</title>
<desc id="d">The same file, /data/visits.txt, written by hello-app in three setups. Without a mount it lands in the container&#x27;s writable layer, on top of the read-only image layers, and is deleted with the container. With a named volume, --mount type=volume,src=hello-data,dst=/data, it lands in a directory Docker manages, /var/lib/docker/volumes/hello-data/_data, and survives docker rm; this case is highlighted. With a bind mount, --mount type=bind,src=$PWD/data,dst=/data, it lands in a folder you chose, such as /home/ubuntu/hello/data, which you and other programs on the host can read and change directly.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Where /data/visits.txt ends up</text>
<rect class="panel" x="24" y="50" width="240" height="370" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">No mount</text>
<rect class="boxd" x="40" y="92" width="208" height="120" rx="10"/>
<text class="t" x="54" y="114" text-anchor="start">container</text>
<rect class="box" x="56" y="124" width="176" height="36" rx="10"/>
<text class="tb" x="144" y="146.5" text-anchor="middle">/data/visits.txt</text>
<rect class="box" x="56" y="166" width="176" height="34" rx="10"/>
<text class="ts" x="144" y="187.5" text-anchor="middle">image layers (read-only)</text>
<line class="ln" x1="144" y1="212" x2="144" y2="248" marker-end="url(#ah)"/>
<rect class="box" x="40" y="250" width="208" height="64" rx="10"/>
<text class="tm" x="144" y="278.0" text-anchor="middle">writable layer</text>
<text class="tm" x="144" y="295.0" text-anchor="middle">of this container</text>
<text class="ts" x="144" y="340" text-anchor="middle">deleted by docker rm</text>
<rect class="panel" x="280" y="50" width="240" height="370" rx="10"/>
<text class="th" x="296" y="76" text-anchor="start">Named volume</text>
<rect class="boxd" x="296" y="92" width="208" height="120" rx="10"/>
<text class="t" x="310" y="114" text-anchor="start">container</text>
<rect class="box" x="312" y="124" width="176" height="36" rx="10"/>
<text class="tb" x="400" y="146.5" text-anchor="middle">/data/visits.txt</text>
<rect class="box" x="312" y="166" width="176" height="34" rx="10"/>
<text class="ts" x="400" y="187.5" text-anchor="middle">image layers (read-only)</text>
<line class="lnc" x1="400" y1="212" x2="400" y2="248" marker-end="url(#ahc)"/>
<rect class="boxc" x="296" y="250" width="208" height="64" rx="10"/>
<text class="tm" x="400" y="278.0" text-anchor="middle">hello-data</text>
<text class="tm" x="400" y="295.0" text-anchor="middle">managed by Docker</text>
<text class="ts" x="400" y="340" text-anchor="middle">survives docker rm</text>
<text class="ts" x="400" y="358" text-anchor="middle">/var/lib/docker/volumes/</text>
<text class="ts" x="400" y="376" text-anchor="middle">hello-data/_data</text>
<rect class="panel" x="536" y="50" width="240" height="370" rx="10"/>
<text class="th" x="552" y="76" text-anchor="start">Bind mount</text>
<rect class="boxd" x="552" y="92" width="208" height="120" rx="10"/>
<text class="t" x="566" y="114" text-anchor="start">container</text>
<rect class="box" x="568" y="124" width="176" height="36" rx="10"/>
<text class="tb" x="656" y="146.5" text-anchor="middle">/data/visits.txt</text>
<rect class="box" x="568" y="166" width="176" height="34" rx="10"/>
<text class="ts" x="656" y="187.5" text-anchor="middle">image layers (read-only)</text>
<line class="ln" x1="656" y1="212" x2="656" y2="248" marker-end="url(#ah)"/>
<rect class="boxs" x="552" y="250" width="208" height="64" rx="10"/>
<text class="tm" x="656" y="278.0" text-anchor="middle">your folder</text>
<text class="tm" x="656" y="295.0" text-anchor="middle">/home/ubuntu/hello/data</text>
<text class="ts" x="656" y="340" text-anchor="middle">survives docker rm</text>
<text class="ts" x="656" y="358" text-anchor="middle">you can edit it on the host</text>
</svg>
