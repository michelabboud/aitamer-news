<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">North-south traffic path into the cluster</title>
<desc id="d">A request from outside the cluster for shop.example.test first reaches an entry point: on kind that is kubectl port-forward, in a cloud it is usually a load balancer. The entry point forwards to the Service traefik in the namespace traefik, which sends it to the Traefik controller Pod, highlighted. The controller watches the API server for Ingress and HTTPRoute objects and turns their rules into routes. It matches the request on host name and path and proxies it to the Service web or the Service api in the namespace k8s-from-zero; the rules name a Service, and Traefik connects to the Pods behind that Service. Without a running controller, Ingress and HTTPRoute objects are stored but nothing routes traffic.</desc>
