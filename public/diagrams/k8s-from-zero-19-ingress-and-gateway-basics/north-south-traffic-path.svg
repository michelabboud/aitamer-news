<text class="tm" x="630.0" y="335.5" text-anchor="middle">api</text>
<rect class="boxs" x="690" y="170" width="70" height="44" rx="10"/>
<text class="tm" x="725.0" y="188.5" text-anchor="middle">Pod</text>
<text class="tm" x="725.0" y="205.5" text-anchor="middle">web</text>
<rect class="boxs" x="690" y="300" width="70" height="44" rx="10"/>
<text class="tm" x="725.0" y="318.5" text-anchor="middle">Pod</text>
<text class="tm" x="725.0" y="335.5" text-anchor="middle">api</text>
<line class="ln" x1="670" y1="192" x2="688" y2="192" marker-end="url(#ah)"/>
<line class="ln" x1="670" y1="322" x2="688" y2="322" marker-end="url(#ah)"/>
<line class="lnc" x1="530" y1="268" x2="588" y2="200" marker-end="url(#ahc)"/>
<line class="lnc" x1="530" y1="300" x2="588" y2="318" marker-end="url(#ahc)"/>
<text class="ts" x="590" y="362" text-anchor="start">rules name a Service;</text>
<text class="ts" x="590" y="378" text-anchor="start">Traefik connects to its Pods</text>
<text class="tm" x="556" y="222" text-anchor="start">/</text>
<text class="tm" x="540" y="326" text-anchor="start">/api</text>
<text class="t" x="24" y="420" text-anchor="start">Ingress and HTTPRoute are only rules. The controller Pod is what makes them true.</text>
</svg>
