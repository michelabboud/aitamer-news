<text class="ts" x="450.0" y="266.5" text-anchor="middle">Traefik Pod</text>
<text class="ts" x="450.0" y="283.5" text-anchor="middle">the controller</text>
<text class="ts" x="450.0" y="300.5" text-anchor="middle">routes on host,</text>
<text class="ts" x="450.0" y="317.5" text-anchor="middle">path, headers</text>
<line class="ln" x1="450" y1="214" x2="450" y2="242" marker-end="url(#ah)"/>
<rect class="boxb" x="370" y="56" width="160" height="48" rx="10"/>
<text class="tm" x="450.0" y="76.5" text-anchor="middle">kube-apiserver</text>
<text class="tm" x="450.0" y="93.5" text-anchor="middle">Ingress, HTTPRoute</text>
<path class="lnb" d="M370,290 C320,290 330,80 368,80" marker-end="url(#ah)"/>
<text class="ts" x="250" y="120" text-anchor="start">watches the rules</text>
<rect class="boxd" x="574" y="130" width="202" height="260" rx="10"/>
<text class="tm" x="675" y="152" text-anchor="middle">namespace k8s-from-zero</text>
<rect class="boxb" x="590" y="170" width="80" height="44" rx="10"/>
