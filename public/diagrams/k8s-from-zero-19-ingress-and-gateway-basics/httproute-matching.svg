<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">How HTTPRoute matching chooses a rule</title>
<desc id="d">The HTTPRoute shop has three rules: path prefix /api goes to the Service api; path prefix / with the header x-version: beta goes to web-beta; path prefix / goes to web. Five requests from the lab: / goes to web; /api/ goes to api; / with x-version beta goes to web-beta; /api/ with x-version beta goes to api, highlighted, because the Gateway API rules rank the longer path prefix above header matches; a request for another host name gets 404 because no hostname matches. The precedence order from the specification is exact path, longest prefix, method, most header matches, most query parameter matches, then the oldest route.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="430" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">The most specific match wins, and path length beats headers</text>
<text class="tm" x="24" y="70" text-anchor="start">HTTPRoute shop, hostnames: shop.example.test</text>
<rect class="boxb" x="24" y="84" width="470" height="28" rx="4"/>
<text class="ts" x="36" y="103" text-anchor="start">rule 1</text>
<text class="tm" x="90" y="103" text-anchor="start">PathPrefix /api</text>
<text class="tm" x="400" y="103" text-anchor="start">-&gt; api</text>
<rect class="boxb" x="24" y="118" width="470" height="28" rx="4"/>
<text class="ts" x="36" y="137" text-anchor="start">rule 2</text>
<text class="tm" x="90" y="137" text-anchor="start">PathPrefix /  +  header x-version: beta</text>
<text class="tm" x="400" y="137" text-anchor="start">-&gt; web-beta</text>
<rect class="boxb" x="24" y="152" width="470" height="28" rx="4"/>
<text class="ts" x="36" y="171" text-anchor="start">rule 3</text>
<text class="tm" x="90" y="171" text-anchor="start">PathPrefix /</text>
<text class="tm" x="400" y="171" text-anchor="start">-&gt; web</text>
<text class="ts" x="24" y="216" text-anchor="start">request (from the lab)</text>
<text class="ts" x="400" y="216" text-anchor="start">answered by</text>
<rect class="box" x="24" y="226" width="470" height="28" rx="4"/>
<text class="tm" x="36" y="245" text-anchor="start">GET /</text>
<text class="tm" x="400" y="245" text-anchor="start">web</text>
<rect class="box" x="24" y="260" width="470" height="28" rx="4"/>
<text class="tm" x="36" y="279" text-anchor="start">GET /api/</text>
<text class="tm" x="400" y="279" text-anchor="start">api</text>
<rect class="box" x="24" y="294" width="470" height="28" rx="4"/>
<text class="tm" x="36" y="313" text-anchor="start">GET /  x-version: beta</text>
<text class="tm" x="400" y="313" text-anchor="start">web-beta</text>
<rect class="boxc" x="24" y="328" width="470" height="28" rx="4"/>
<text class="tm" x="36" y="347" text-anchor="start">GET /api/  x-version: beta</text>
<text class="tm" x="400" y="347" text-anchor="start">api</text>
<rect class="box" x="24" y="362" width="470" height="28" rx="4"/>
<text class="tm" x="36" y="381" text-anchor="start">Host: other.example.test</text>
<text class="tm" x="400" y="381" text-anchor="start">404</text>
<text class="tc" x="36" y="410" text-anchor="start">Path length is compared before headers: /api (4 characters) beats / (1 character).</text>
<rect class="panel" x="520" y="84" width="256" height="300" rx="10"/>
<text class="th" x="536" y="108" text-anchor="start">Precedence, highest first</text>
<text class="t" x="536" y="138" text-anchor="start">1  Exact path match</text>
<text class="t" x="536" y="166" text-anchor="start">2  longest Prefix path</text>
<text class="t" x="536" y="194" text-anchor="start">3  method match</text>
<text class="t" x="536" y="222" text-anchor="start">4  most header matches</text>
<text class="t" x="536" y="250" text-anchor="start">5  most query param matches</text>
<text class="t" x="536" y="278" text-anchor="start">then: oldest route,</text>
<text class="t" x="536" y="306" text-anchor="start">then: name order,</text>
<text class="t" x="536" y="334" text-anchor="start">then: first rule in the list</text>
</svg>
