<text class="tm" x="533.0" y="381.0" text-anchor="middle">(ns k8s-from-zero)</text>
<text class="tm" x="533.0" y="398.0" text-anchor="middle">parentRef: traefik/shared</text>
<text class="ts" x="668" y="368" text-anchor="start">application</text>
<text class="ts" x="668" y="384" text-anchor="start">developer</text>
