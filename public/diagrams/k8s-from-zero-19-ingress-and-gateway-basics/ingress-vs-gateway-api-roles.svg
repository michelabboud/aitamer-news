<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Ingress compared with Gateway API roles</title>
<desc id="d">On the left, Ingress: a cluster admin installs a controller and an IngressClass, and each application team writes one Ingress object that holds host names, paths, TLS settings and controller-specific annotations together. On the right, Gateway API splits the same job into three kinds owned by three roles: the infrastructure provider owns the GatewayClass, which names the controller; the cluster operator owns the Gateway, with its listeners and the allowedRoutes field, highlighted, that decides which namespaces may attach routes; the application developer owns the HTTPRoute in their own namespace, which attaches to the Gateway with a parentRef and lists matches and backends.</desc>
