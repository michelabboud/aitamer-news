<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Ingress is one object; Gateway API is three, one per role</text>
<rect class="panel" x="24" y="52" width="340" height="392" rx="10"/>
