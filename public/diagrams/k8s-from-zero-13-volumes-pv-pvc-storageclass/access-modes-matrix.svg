<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Access modes and reclaim policies at a glance</title>
<desc id="d">A table of the four access modes. ReadWriteOnce, RWO, read-write from a single node, and several Pods on that node can share it. ReadOnlyMany, ROX, read-only from many nodes. ReadWriteMany, RWX, read-write from many nodes, offered by file storage such as NFS or CephFS. ReadWriteOncePod, RWOP, read-write from a single Pod in the whole cluster, CSI volumes only. The kind local-path provisioner offers only RWO and RWOP, highlighted, and our RWX claim failed. A second panel lists reclaim policies: Delete removes the volume when the claim is deleted, Retain keeps it as Released for manual cleanup, Recycle is deprecated.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Access modes say who may mount; reclaim says what happens after</text>
<rect class="panel" x="24" y="50" width="752" height="34" rx="6"/>
<text class="t" x="40" y="72" text-anchor="start">Mode</text>
<text class="t" x="190" y="72" text-anchor="start">Short</text>
<text class="t" x="256" y="72" text-anchor="start">Who can mount it</text>
<text class="t" x="560" y="72" text-anchor="start">Notes</text>
<rect class="box" x="24" y="92" width="752" height="34" rx="6"/>
<text class="tm" x="40" y="114" text-anchor="start">ReadWriteOnce</text>
<text class="tm" x="190" y="114" text-anchor="start">RWO</text>
<text class="ts" x="256" y="114" text-anchor="start">one node (Pods on it may share)</text>
<text class="ts" x="560" y="114" text-anchor="start">used by kind's standard class</text>
<rect class="box" x="24" y="132" width="752" height="34" rx="6"/>
<text class="tm" x="40" y="154" text-anchor="start">ReadOnlyMany</text>
<text class="tm" x="190" y="154" text-anchor="start">ROX</text>
<text class="ts" x="256" y="154" text-anchor="start">nobody; read-only on many nodes</text>
<text class="ts" x="560" y="154" text-anchor="start">shared reference data</text>
<rect class="box" x="24" y="172" width="752" height="34" rx="6"/>
<text class="tm" x="40" y="194" text-anchor="start">ReadWriteMany</text>
<text class="tm" x="190" y="194" text-anchor="start">RWX</text>
<text class="ts" x="256" y="194" text-anchor="start">many nodes at once</text>
<text class="ts" x="560" y="194" text-anchor="start">file storage: NFS, CephFS</text>
<rect class="box" x="24" y="212" width="752" height="34" rx="6"/>
<text class="tm" x="40" y="234" text-anchor="start">ReadWriteOncePod</text>
<text class="tm" x="190" y="234" text-anchor="start">RWOP</text>
<text class="ts" x="256" y="234" text-anchor="start">exactly one Pod in the cluster</text>
<text class="ts" x="560" y="234" text-anchor="start">CSI volumes only; GA v1.29</text>
<rect class="boxc" x="24" y="262" width="752" height="50" rx="8"/>
<text class="tc" x="40" y="284" text-anchor="start">kind local-path: only RWO and RWOP</text>
<text class="tm" x="40" y="302" text-anchor="start">"NodePath only supports ReadWriteOnce and ReadWriteOncePod (1.22+) access modes"</text>
<rect class="boxn" x="24" y="330" width="752" height="124" rx="10"/>
<text class="t" x="40" y="354" text-anchor="start">Reclaim policy (on the PV, copied from the StorageClass)</text>
<text class="tm" x="40" y="382" text-anchor="start">Delete</text>
<text class="ts" x="130" y="382" text-anchor="start">default for dynamic volumes: the PV and its storage go when the claim goes</text>
<text class="tm" x="40" y="406" text-anchor="start">Retain</text>
<text class="ts" x="130" y="406" text-anchor="start">the PV becomes Released and keeps its data; an admin cleans up by hand</text>
<text class="tm" x="40" y="430" text-anchor="start">Recycle</text>
<text class="ts" x="130" y="430" text-anchor="start">deprecated; use dynamic provisioning instead</text>
</svg>
