<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Dynamic provisioning with WaitForFirstConsumer, step by step</title>
<desc id="d">Six steps observed on our kind cluster. One: you apply the PersistentVolumeClaim and it stays Pending with the event WaitForFirstConsumer, highlighted, because the StorageClass waits for a Pod. Two: you apply a Pod that uses the claim. Three: the scheduler picks a node for the Pod, here k8s-ep13-worker2. Four: the external provisioner rancher.io/local-path creates a directory on that node and a PersistentVolume. Five: the persistent volume controller binds the claim to the new volume and the claim shows Bound. Six: the kubelet mounts the volume and the container starts.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">What happened on our cluster after kubectl apply</text>
<rect class="boxc" x="24" y="52" width="752" height="54" rx="10"/>
<circle class="dc" cx="54" cy="79" r="14"/>
<text class="th" x="54" y="84" text-anchor="middle">1</text>
<text class="t" x="84" y="76" text-anchor="start">You apply the PVC</text>
<text class="tm" x="84" y="96" text-anchor="start">STATUS Pending, event WaitForFirstConsumer</text>
<line class="ln" x1="400" y1="106" x2="400" y2="118" marker-end="url(#ah)"/>
<rect class="boxs" x="24" y="118" width="752" height="54" rx="10"/>
<circle class="dg" cx="54" cy="145" r="14"/>
<text class="th" x="54" y="150" text-anchor="middle">2</text>
<text class="t" x="84" y="142" text-anchor="start">You apply a Pod that uses it</text>
<text class="tm" x="84" y="162" text-anchor="start">claimName: data</text>
<line class="ln" x1="400" y1="172" x2="400" y2="184" marker-end="url(#ah)"/>
<rect class="boxb" x="24" y="184" width="752" height="54" rx="10"/>
<circle class="dg" cx="54" cy="211" r="14"/>
<text class="th" x="54" y="216" text-anchor="middle">3</text>
<text class="t" x="84" y="208" text-anchor="start">The scheduler picks a node</text>
<text class="tm" x="84" y="228" text-anchor="start">k8s-ep13-worker2</text>
<line class="ln" x1="400" y1="238" x2="400" y2="250" marker-end="url(#ah)"/>
<rect class="boxb" x="24" y="250" width="752" height="54" rx="10"/>
<circle class="dg" cx="54" cy="277" r="14"/>
<text class="th" x="54" y="282" text-anchor="middle">4</text>
<text class="t" x="84" y="274" text-anchor="start">The provisioner makes the volume</text>
<text class="tm" x="84" y="294" text-anchor="start">rancher.io/local-path: ProvisioningSucceeded</text>
<line class="ln" x1="400" y1="304" x2="400" y2="316" marker-end="url(#ah)"/>
<rect class="boxb" x="24" y="316" width="752" height="54" rx="10"/>
<circle class="dg" cx="54" cy="343" r="14"/>
<text class="th" x="54" y="348" text-anchor="middle">5</text>
<text class="t" x="84" y="340" text-anchor="start">The claim binds to the new PV</text>
<text class="tm" x="84" y="360" text-anchor="start">STATUS Bound, VOLUME pvc-812b73d8-...</text>
<line class="ln" x1="400" y1="370" x2="400" y2="382" marker-end="url(#ah)"/>
<rect class="boxs" x="24" y="382" width="752" height="54" rx="10"/>
<circle class="dg" cx="54" cy="409" r="14"/>
<text class="th" x="54" y="414" text-anchor="middle">6</text>
<text class="t" x="84" y="406" text-anchor="start">The kubelet mounts it</text>
<text class="tm" x="84" y="426" text-anchor="start">the container starts with /data</text>
</svg>
