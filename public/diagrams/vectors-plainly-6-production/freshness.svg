<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" aria-labelledby="t d">
<title id="t">Write freshness</title>
<desc id="d">A timeline: an upsert is sent, then acknowledged, and only later indexed and searchable; a query that arrives in the gap may not see the new record.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes slide { 0% { transform: translateX(60px); } 100% { transform: translateX(740px); } }
.qdot { transform: translateX(60px); }
@media (prefers-reduced-motion: no-preference) {
.qdot { animation: slide 6s linear infinite; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="316" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Freshness: a write is accepted before it is searchable</text>
<path class="ln" d="M40 150L770 150" marker-end="url(#ah)"/>
<text class="ts" x="760" y="174" text-anchor="end">time</text>
<path class="ln" d="M80 140 L80 160"/>
<text class="ts" x="80" y="128" text-anchor="middle">upsert sent</text>
<path class="ln" d="M220 140 L220 160"/>
<text class="ts" x="220" y="128" text-anchor="middle">write acknowledged</text>
<path class="ln" d="M470 140 L470 160"/>
<text class="ts" x="470" y="128" text-anchor="middle">indexed: now searchable</text>
<rect class="boxc" x="220" y="182" width="250" height="36" rx="6"/>
<text class="t" x="345" y="205" text-anchor="middle">a query here may not see it</text>
<circle class="qdot" cx="0" cy="150" r="7" fill="#5b85b8"/>
<text class="ts" x="24" y="256" text-anchor="start">Pinecone: eventually consistent; compare the write's LSN with the query's max indexed LSN.</text>
<text class="ts" x="24" y="276" text-anchor="start">Milvus: choose Strong, Bounded, Session or Eventually per request.</text>
<text class="ts" x="24" y="296" text-anchor="start">Upload-then-search-immediately flows need one of these, or a read of the source record.</text>
</svg>
