<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d">
<title id="t">GPU need by stage</title>
<desc id="d">A qualitative chart of GPU need by pipeline stage: bulk embedding and generation are high, reranking is high, per-query embedding is low to medium, and approximate nearest neighbour search usually runs fine on CPU.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="390" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Where a GPU earns its keep (self-hosted models)</text>
<text class="t" x="24" y="84" text-anchor="start">Embed (bulk ingest)</text>
<rect class="boxc g0" x="210" y="66" width="64" height="26" rx="4"/>
<rect class="boxc g0" x="280" y="66" width="64" height="26" rx="4"/>
<rect class="boxc g0" x="350" y="66" width="64" height="26" rx="4"/>
<rect class="boxc g0" x="420" y="66" width="64" height="26" rx="4"/>
<text class="ts" x="510" y="84" text-anchor="start">very high: throughput: batch it</text>
<text class="t" x="24" y="140" text-anchor="start">Embed (per query)</text>
<rect class="boxc g1" x="210" y="122" width="64" height="26" rx="4"/>
<rect class="boxc g1" x="280" y="122" width="64" height="26" rx="4"/>
<rect class="box g1" x="350" y="122" width="64" height="26" rx="4"/>
<rect class="box g1" x="420" y="122" width="64" height="26" rx="4"/>
<text class="ts" x="510" y="140" text-anchor="start">medium: small model, CPU often fine</text>
<text class="t" x="24" y="196" text-anchor="start">ANN search</text>
<rect class="boxs g2" x="210" y="178" width="64" height="26" rx="4"/>
<rect class="box g2" x="280" y="178" width="64" height="26" rx="4"/>
<rect class="box g2" x="350" y="178" width="64" height="26" rx="4"/>
<rect class="box g2" x="420" y="178" width="64" height="26" rx="4"/>
<text class="ts" x="510" y="196" text-anchor="start">low: CPU and RAM by default</text>
<text class="t" x="24" y="252" text-anchor="start">Rerank</text>
<rect class="boxc g3" x="210" y="234" width="64" height="26" rx="4"/>
<rect class="boxc g3" x="280" y="234" width="64" height="26" rx="4"/>
<rect class="boxc g3" x="350" y="234" width="64" height="26" rx="4"/>
<rect class="box g3" x="420" y="234" width="64" height="26" rx="4"/>
<text class="ts" x="510" y="252" text-anchor="start">high: one pass per candidate</text>
<text class="t" x="24" y="308" text-anchor="start">Generate</text>
<rect class="boxc g4" x="210" y="290" width="64" height="26" rx="4"/>
<rect class="boxc g4" x="280" y="290" width="64" height="26" rx="4"/>
<rect class="boxc g4" x="350" y="290" width="64" height="26" rx="4"/>
<rect class="boxc g4" x="420" y="290" width="64" height="26" rx="4"/>
<text class="ts" x="510" y="308" text-anchor="start">very high: usually the biggest share</text>
<text class="ts" x="24" y="350" text-anchor="start">Qualitative, per the stage's compute pattern. With hosted APIs, the GPU is the vendor's and you pay per call.</text>
<text class="ts" x="24" y="370" text-anchor="start">GPU ANN (cuVS CAGRA, Faiss GPU) pays off at very large scale or high query volume, not by default.</text>
</svg>
