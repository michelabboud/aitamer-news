<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" role="img" aria-labelledby="t d">
<title id="t">Sharding a vector database</title>
<desc id="d">A router sends each request to one of three shards, each holding whole tenants and an intact graph index; each shard has read replicas that add query throughput.</desc>
