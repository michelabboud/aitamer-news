<text class="ts" x="482" y="228.0" text-anchor="middle">replicas</text>
<rect class="boxd" x="544" y="180" width="100" height="70" rx="10"/>
<text class="tm" x="594" y="211.0" text-anchor="middle">machine 2</text>
<text class="ts" x="594" y="228.0" text-anchor="middle">replicas</text>
