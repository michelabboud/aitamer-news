<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">Compose and one machine</title>
<desc id="d">Left, one Docker host. Compose reads compose.yaml and talks to one Docker Engine, local or remote through DOCKER_HOST. The engine runs web and db and keeps the volume. Restart policies are applied by that engine. If the machine stops, everything on it stops with it, highlighted. Right, several machines run by a cluster manager. You state a desired state, for example ten replicas; when a machine crashes, the manager starts replacements on the others, as the Docker Swarm documentation describes. Kubernetes is the cluster manager Kubernetes from Zero teaches, starting with part 1.</desc>
