<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
<title id="t">docker system df, before and after</title>
<desc id="d">Two columns from the lab&#x27;s docker system df output. Before: Images 10 using 736.4MB, Containers 2 using 954.4kB, Local Volumes 1 using 65.94MB, Build Cache 24 entries using 76.52MB. After down -v --rmi local in both project folders, docker image rm for the remaining images and docker builder prune: every row is 0 and 0B, highlighted. The networks bridge, host and none stay; they belong to Docker itself.</desc>
