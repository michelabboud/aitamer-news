<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">What each clean-up command removes</title>
<desc id="d">A table. Rows are commands, columns are what they remove: containers, networks, volumes, images, build cache, and the scope. docker compose down: the project&#x27;s containers and networks; scope this project. down -v: also the project&#x27;s named volumes and anonymous volumes attached to its containers. down -v --rmi local: also images the project built that have no custom tag, such as notes-web. docker image rm NAME: the named images, refused while a container uses them. docker builder prune: dangling build cache, or all unused build cache with -a; scope the whole machine. docker system prune: all stopped containers, unused networks, dangling images and unused build cache on the whole machine, highlighted; --volumes adds unused anonymous volumes. docker volume prune: unused anonymous volumes on the whole machine; -a also unused named volumes.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="520" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Project commands stay in the project; prune commands cover the machine</text>
<rect class="panel" x="24" y="50" width="752" height="450" rx="10"/>
<text class="tb" x="44" y="84" text-anchor="start">Command</text>
<text class="tb" x="306" y="84" text-anchor="start">Removes</text>
<text class="tb" x="626" y="84" text-anchor="start">Scope</text>
<rect class="box" x="40" y="100" width="256" height="40" rx="10"/>
<text class="tm" x="52" y="124.5" text-anchor="start">docker compose down</text>
<rect class="box" x="302" y="100" width="314" height="40" rx="10"/>
<text class="ts" x="314" y="124.5" text-anchor="start">containers, networks</text>
<rect class="box" x="622" y="100" width="134" height="40" rx="10"/>
<text class="ts" x="689" y="124.5" text-anchor="middle">this project</text>
<rect class="box" x="40" y="148" width="256" height="40" rx="10"/>
<text class="tm" x="52" y="172.5" text-anchor="start">down -v</text>
<rect class="box" x="302" y="148" width="314" height="40" rx="10"/>
<text class="ts" x="314" y="172.5" text-anchor="start">+ named volumes, attached anonymous ones</text>
<rect class="box" x="622" y="148" width="134" height="40" rx="10"/>
<text class="ts" x="689" y="172.5" text-anchor="middle">this project</text>
<rect class="box" x="40" y="196" width="256" height="40" rx="10"/>
<text class="tm" x="52" y="220.5" text-anchor="start">down -v --rmi local</text>
<rect class="box" x="302" y="196" width="314" height="40" rx="10"/>
<text class="ts" x="314" y="220.5" text-anchor="start">+ images it built without a custom tag</text>
<rect class="box" x="622" y="196" width="134" height="40" rx="10"/>
<text class="ts" x="689" y="220.5" text-anchor="middle">this project</text>
<rect class="box" x="40" y="244" width="256" height="40" rx="10"/>
<text class="tm" x="52" y="268.5" text-anchor="start">docker image rm NAME</text>
<rect class="box" x="302" y="244" width="314" height="40" rx="10"/>
<text class="ts" x="314" y="268.5" text-anchor="start">those images; refused while in use</text>
<rect class="box" x="622" y="244" width="134" height="40" rx="10"/>
<text class="ts" x="689" y="268.5" text-anchor="middle">named images</text>
<rect class="boxd" x="40" y="292" width="256" height="56" rx="10"/>
<text class="tm" x="52" y="324.5" text-anchor="start">docker builder prune</text>
<rect class="boxd" x="302" y="292" width="314" height="56" rx="10"/>
<text class="ts" x="314" y="316.0" text-anchor="start">dangling build cache</text>
<text class="ts" x="314" y="333.0" text-anchor="start">(-a: all unused)</text>
<rect class="boxd" x="622" y="292" width="134" height="56" rx="10"/>
<text class="ts" x="689" y="324.5" text-anchor="middle">whole machine</text>
<rect class="boxc" x="40" y="356" width="256" height="56" rx="10"/>
<text class="tm" x="52" y="388.5" text-anchor="start">docker system prune</text>
<rect class="boxc" x="302" y="356" width="314" height="56" rx="10"/>
<text class="ts" x="314" y="380.0" text-anchor="start">stopped containers, unused networks,</text>
<text class="ts" x="314" y="397.0" text-anchor="start">dangling images, unused build cache</text>
<rect class="boxc" x="622" y="356" width="134" height="56" rx="10"/>
<text class="ts" x="689" y="388.5" text-anchor="middle">whole machine</text>
<rect class="boxc" x="40" y="420" width="256" height="40" rx="10"/>
<text class="tm" x="52" y="444.5" text-anchor="start">docker volume prune</text>
<rect class="boxc" x="302" y="420" width="314" height="40" rx="10"/>
<text class="ts" x="314" y="444.5" text-anchor="start">unused anonymous volumes; -a: unused named too</text>
<rect class="boxc" x="622" y="420" width="134" height="40" rx="10"/>
<text class="ts" x="689" y="444.5" text-anchor="middle">whole machine</text>
<text class="ts" x="400" y="482" text-anchor="middle">system prune --volumes also removes unused anonymous volumes. Every prune asks first; -f skips the question.</text>
</svg>
