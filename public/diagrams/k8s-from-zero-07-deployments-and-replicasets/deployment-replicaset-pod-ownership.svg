<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">A Deployment owns ReplicaSets, and each ReplicaSet owns Pods</title>
<desc id="d">A Deployment named web, drawn in blue, owns two ReplicaSets. The current ReplicaSet web-86f79b74d9 wants 3 replicas and owns three running Pods, drawn in green, whose names start with the same hash. The old ReplicaSet web-55dd75b68d is scaled to 0 and kept so that the Deployment can roll back. The pod-template-hash label, highlighted, is the hash of the Pod template; it appears in the ReplicaSet name, its selector and every Pod it creates. Each Pod points back to its ReplicaSet through ownerReferences, and each ReplicaSet points back to the Deployment.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Who owns what: Deployment, ReplicaSet, Pod</text>
<rect class="boxb" x="250" y="52" width="300" height="64" rx="10"/>
<text class="tm" x="266" y="78" text-anchor="start">Deployment  web</text>
<text class="ts" x="266" y="100" text-anchor="start">replicas: 3, image nginx:1.29-alpine</text>
<rect class="boxb" x="60" y="160" width="300" height="70" rx="10"/>
<text class="tm" x="76" y="186" text-anchor="start">ReplicaSet  web-86f79b74d9</text>
<text class="ts" x="76" y="208" text-anchor="start">current: desired 3, ready 3</text>
<rect class="boxd" x="440" y="160" width="300" height="70" rx="10"/>
<text class="tm" x="456" y="186" text-anchor="start">ReplicaSet  web-55dd75b68d</text>
<text class="ts" x="456" y="208" text-anchor="start">old: scaled to 0, kept for rollback</text>
<line class="ln" x1="340" y1="116" x2="240" y2="158" marker-end="url(#ah)"/>
<line class="ln" x1="460" y1="116" x2="560" y2="158" marker-end="url(#ah)"/>
<rect class="boxs" x="24" y="272" width="114" height="72" rx="8"/>
<text class="ts" x="32" y="292" text-anchor="start">Pod</text>
<text class="tm" x="32" y="312" text-anchor="start">web-86f79b74d9</text>
<text class="tm" x="32" y="332" text-anchor="start">-4jvbj</text>
<line class="ln" x1="210" y1="230" x2="81" y2="270" marker-end="url(#ah)"/>
<rect class="boxs" x="146" y="272" width="114" height="72" rx="8"/>
<text class="ts" x="154" y="292" text-anchor="start">Pod</text>
<text class="tm" x="154" y="312" text-anchor="start">web-86f79b74d9</text>
<text class="tm" x="154" y="332" text-anchor="start">-fcr2z</text>
<line class="ln" x1="210" y1="230" x2="203" y2="270" marker-end="url(#ah)"/>
<rect class="boxs" x="268" y="272" width="114" height="72" rx="8"/>
<text class="ts" x="276" y="292" text-anchor="start">Pod</text>
<text class="tm" x="276" y="312" text-anchor="start">web-86f79b74d9</text>
<text class="tm" x="276" y="332" text-anchor="start">-qzjcc</text>
<line class="ln" x1="210" y1="230" x2="325" y2="270" marker-end="url(#ah)"/>
<rect class="boxc" x="404" y="268" width="372" height="84" rx="10"/>
<text class="tm" x="420" y="292" text-anchor="start">pod-template-hash=86f79b74d9</text>
<text class="ts" x="420" y="314" text-anchor="start">hash of the Pod template; in the ReplicaSet name,</text>
<text class="ts" x="420" y="334" text-anchor="start">its selector and the label of every Pod it creates</text>
<line class="lnc" x1="402" y1="310" x2="386" y2="310" marker-end="url(#ahc)"/>
<rect class="panel" x="24" y="372" width="752" height="82" rx="10"/>
<text class="t" x="40" y="396" text-anchor="start">ownerReferences point upward</text>
<text class="tm" x="40" y="420" text-anchor="start">Pod  -&gt;  ReplicaSet web-86f79b74d9  -&gt;  Deployment web</text>
<text class="ts" x="40" y="442" text-anchor="start">Delete a Pod: the ReplicaSet makes a new one. Delete the Deployment: everything below goes too.</text>
</svg>
