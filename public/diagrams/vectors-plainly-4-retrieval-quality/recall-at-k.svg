<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 298" role="img" aria-labelledby="t d">
<title id="t">Recall at 10</title>
<desc id="d">The exact top ten neighbours are A to J. The approximate index returns eight of them plus two that are close but not in the true top ten, so recall at ten is 0.8.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
.miss { animation: blink 1.6s ease-in-out infinite; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="298" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">recall@10: how many of the true 10 nearest did the index return?</text>
<text class="t" x="24" y="64" text-anchor="start">Exact (brute force) top 10</text>
<text class="t" x="24" y="154" text-anchor="start">ANN index top 10</text>
<rect class="boxb" x="24" y="74" width="48" height="44" rx="6"/>
<text class="th" x="48.0" y="101.0" text-anchor="middle">A</text>
<rect class="boxb" x="80" y="74" width="48" height="44" rx="6"/>
<text class="th" x="104.0" y="101.0" text-anchor="middle">B</text>
<rect class="boxb" x="136" y="74" width="48" height="44" rx="6"/>
<text class="th" x="160.0" y="101.0" text-anchor="middle">C</text>
<rect class="boxb" x="192" y="74" width="48" height="44" rx="6"/>
<text class="th" x="216.0" y="101.0" text-anchor="middle">D</text>
<rect class="boxb" x="248" y="74" width="48" height="44" rx="6"/>
<text class="th" x="272.0" y="101.0" text-anchor="middle">E</text>
<rect class="boxb" x="304" y="74" width="48" height="44" rx="6"/>
<text class="th" x="328.0" y="101.0" text-anchor="middle">F</text>
<rect class="boxb" x="360" y="74" width="48" height="44" rx="6"/>
<text class="th" x="384.0" y="101.0" text-anchor="middle">G</text>
<rect class="boxb" x="416" y="74" width="48" height="44" rx="6"/>
<text class="th" x="440.0" y="101.0" text-anchor="middle">H</text>
<rect class="boxb" x="472" y="74" width="48" height="44" rx="6"/>
<text class="th" x="496.0" y="101.0" text-anchor="middle">I</text>
<rect class="boxb" x="528" y="74" width="48" height="44" rx="6"/>
<text class="th" x="552.0" y="101.0" text-anchor="middle">J</text>
<g class="hitm"><rect class="boxs" x="24" y="164" width="48" height="44" rx="6"/>
<text class="th" x="48.0" y="191.0" text-anchor="middle">A</text></g>
<g class="hitm"><rect class="boxs" x="80" y="164" width="48" height="44" rx="6"/>
<text class="th" x="104.0" y="191.0" text-anchor="middle">B</text></g>
<g class="hitm"><rect class="boxs" x="136" y="164" width="48" height="44" rx="6"/>
<text class="th" x="160.0" y="191.0" text-anchor="middle">C</text></g>
<g class="hitm"><rect class="boxs" x="192" y="164" width="48" height="44" rx="6"/>
<text class="th" x="216.0" y="191.0" text-anchor="middle">D</text></g>
<g class="hitm"><rect class="boxs" x="248" y="164" width="48" height="44" rx="6"/>
<text class="th" x="272.0" y="191.0" text-anchor="middle">F</text></g>
<g class="hitm"><rect class="boxs" x="304" y="164" width="48" height="44" rx="6"/>
<text class="th" x="328.0" y="191.0" text-anchor="middle">G</text></g>
<g class="hitm"><rect class="boxs" x="360" y="164" width="48" height="44" rx="6"/>
<text class="th" x="384.0" y="191.0" text-anchor="middle">H</text></g>
<g class="hitm"><rect class="boxs" x="416" y="164" width="48" height="44" rx="6"/>
<text class="th" x="440.0" y="191.0" text-anchor="middle">J</text></g>
<g class="miss"><rect class="boxc" x="472" y="164" width="48" height="44" rx="6"/>
<text class="th" x="496.0" y="191.0" text-anchor="middle">X</text></g>
<g class="miss"><rect class="boxc" x="528" y="164" width="48" height="44" rx="6"/>
<text class="th" x="552.0" y="191.0" text-anchor="middle">Y</text></g>
<text class="ts" x="600" y="100" text-anchor="start">E and I were never returned.</text>
<text class="ts" x="600" y="190" text-anchor="start">X and Y are near, not nearest.</text>
<text class="tc" x="24" y="252" text-anchor="start">recall@10 = 8 / 10 = 0.8</text>
<text class="ts" x="24" y="278" text-anchor="start">The latency graph looks the same either way; only this number tells you results went missing.</text>
</svg>
