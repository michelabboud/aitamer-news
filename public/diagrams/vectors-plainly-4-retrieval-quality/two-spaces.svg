<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" role="img" aria-labelledby="t d">
<title id="t">Incompatible embedding spaces</title>
<desc id="d">Each embedding model has its own space. Both contain a cluster of dog sentences, but a distance computed between a point in one space and a point in the other has no meaning.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="344" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Two models, two spaces: distances across them mean nothing</text>
<rect class="boxb" x="24" y="46" width="352" height="230" rx="10"/>
<text class="t" x="200" y="70" text-anchor="middle">Model A space (1024-d)</text>
<rect class="boxs" x="424" y="46" width="352" height="230" rx="10"/>
<text class="t" x="600" y="70" text-anchor="middle">Model B space (1536-d)</text>
<circle class="dc" cx="124" cy="159" r="5"/>
<circle class="dc" cx="118" cy="137" r="5"/>
<circle class="dc" cx="103" cy="131" r="5"/>
<circle class="dc" cx="138" cy="120" r="5"/>
<circle class="dc" cx="116" cy="152" r="5"/>
<circle class="dc" cx="124" cy="158" r="5"/>
<text class="ts" x="120" y="190" text-anchor="middle">dog cluster</text>
<circle class="dc" cx="630" cy="221" r="5"/>
<circle class="dc" cx="660" cy="239" r="5"/>
<circle class="dc" cx="669" cy="202" r="5"/>
<circle class="dc" cx="671" cy="224" r="5"/>
<circle class="dc" cx="635" cy="228" r="5"/>
<circle class="dc" cx="671" cy="227" r="5"/>
<text class="ts" x="650" y="266" text-anchor="middle">dog cluster</text>
<path class="lnc" d="M140 140 L630 215" stroke-dasharray="6 5"/>
<text class="tc" x="390" y="166" text-anchor="middle">cosine(A, B) = ?</text>
<text class="ts" x="24" y="306" text-anchor="start">Padding or truncating to equal length does not help: the axes are different axes.</text>
<text class="ts" x="24" y="326" text-anchor="start">Changing models means re-embedding the corpus. Store the model name and version on every vector.</text>
</svg>
