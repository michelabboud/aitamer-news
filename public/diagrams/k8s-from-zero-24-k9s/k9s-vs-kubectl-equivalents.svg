<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">k9s keys and the kubectl commands they stand for</title>
<desc id="d">A table with three columns: what you want, the k9s key or command, and the kubectl command it runs for you. List Deployments: :deploy, kubectl get deployments. Switch namespace: :ns or a number key, kubectl get with -n or kubens. All namespaces: 0, kubectl get with -A. Describe: d, kubectl describe. YAML: y, kubectl get -o yaml. Logs: l, kubectl logs -f. Previous logs: p, kubectl logs --previous. Shell: s, kubectl exec -it -- sh. Port-forward: shift-f, kubectl port-forward. Edit: e, kubectl edit. Restart a Deployment: r, kubectl rollout restart. Owner tree: :xray deploy, the kubectl tree plugin. Delete, highlighted: ctrl-d, kubectl delete; k9s asks for confirmation, and ctrl-k kills without asking. In our read-only test the keys e, r and ctrl-d were gone.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="520" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Every k9s key is a kubectl command you already know</text>
<text class="th" x="40" y="64" text-anchor="start">You want</text>
<text class="th" x="270" y="64" text-anchor="start">k9s</text>
<text class="th" x="420" y="64" text-anchor="start">kubectl</text>
<rect class="panel" x="24" y="76" width="752" height="30" rx="6"/>
<text class="t" x="40" y="96" text-anchor="start">List Deployments</text>
<text class="tm" x="270" y="96" text-anchor="start">:deploy</text>
<text class="tm" x="420" y="96" text-anchor="start">kubectl get deployments</text>
<rect class="bg" x="24" y="108" width="752" height="30" rx="6"/>
<text class="t" x="40" y="128" text-anchor="start">Switch namespace</text>
<text class="tm" x="270" y="128" text-anchor="start">:ns, or 1, 2 ...</text>
<text class="tm" x="420" y="128" text-anchor="start">kubectl get ... -n NS (or kubens)</text>
<rect class="panel" x="24" y="140" width="752" height="30" rx="6"/>
<text class="t" x="40" y="160" text-anchor="start">All namespaces</text>
<text class="tm" x="270" y="160" text-anchor="start">0</text>
<text class="tm" x="420" y="160" text-anchor="start">kubectl get ... -A</text>
<rect class="bg" x="24" y="172" width="752" height="30" rx="6"/>
<text class="t" x="40" y="192" text-anchor="start">Describe</text>
<text class="tm" x="270" y="192" text-anchor="start">d</text>
<text class="tm" x="420" y="192" text-anchor="start">kubectl describe pod NAME</text>
<rect class="panel" x="24" y="204" width="752" height="30" rx="6"/>
<text class="t" x="40" y="224" text-anchor="start">Show YAML</text>
<text class="tm" x="270" y="224" text-anchor="start">y</text>
<text class="tm" x="420" y="224" text-anchor="start">kubectl get pod NAME -o yaml</text>
<rect class="bg" x="24" y="236" width="752" height="30" rx="6"/>
<text class="t" x="40" y="256" text-anchor="start">Follow logs</text>
<text class="tm" x="270" y="256" text-anchor="start">l</text>
<text class="tm" x="420" y="256" text-anchor="start">kubectl logs -f NAME</text>
<rect class="panel" x="24" y="268" width="752" height="30" rx="6"/>
<text class="t" x="40" y="288" text-anchor="start">Logs of the last crash</text>
<text class="tm" x="270" y="288" text-anchor="start">p</text>
<text class="tm" x="420" y="288" text-anchor="start">kubectl logs --previous NAME</text>
<rect class="bg" x="24" y="300" width="752" height="30" rx="6"/>
<text class="t" x="40" y="320" text-anchor="start">Shell into a container</text>
<text class="tm" x="270" y="320" text-anchor="start">s</text>
<text class="tm" x="420" y="320" text-anchor="start">kubectl exec -it NAME -- sh</text>
<rect class="panel" x="24" y="332" width="752" height="30" rx="6"/>
<text class="t" x="40" y="352" text-anchor="start">Port-forward</text>
<text class="tm" x="270" y="352" text-anchor="start">shift-f</text>
<text class="tm" x="420" y="352" text-anchor="start">kubectl port-forward NAME 8081:80</text>
<rect class="bg" x="24" y="364" width="752" height="30" rx="6"/>
<text class="t" x="40" y="384" text-anchor="start">Edit live object</text>
<text class="tm" x="270" y="384" text-anchor="start">e</text>
<text class="tm" x="420" y="384" text-anchor="start">kubectl edit deploy NAME</text>
<rect class="panel" x="24" y="396" width="752" height="30" rx="6"/>
<text class="t" x="40" y="416" text-anchor="start">Restart a Deployment</text>
<text class="tm" x="270" y="416" text-anchor="start">r</text>
<text class="tm" x="420" y="416" text-anchor="start">kubectl rollout restart deploy NAME</text>
<rect class="bg" x="24" y="428" width="752" height="30" rx="6"/>
<text class="t" x="40" y="448" text-anchor="start">Owner tree</text>
<text class="tm" x="270" y="448" text-anchor="start">:xray deploy</text>
<text class="tm" x="420" y="448" text-anchor="start">kubectl tree deploy NAME (plugin)</text>
<rect class="boxc" x="24" y="460" width="752" height="30" rx="6"/>
<text class="tc" x="40" y="480" text-anchor="start">Delete (asks first)</text>
<text class="tm" x="270" y="480" text-anchor="start">ctrl-d</text>
<text class="tm" x="420" y="480" text-anchor="start">kubectl delete pod NAME</text>
<text class="ts" x="40" y="506" text-anchor="start">ctrl-k kills without a dialog (like kubectl delete --now). In our read-only test, e, r and ctrl-d were gone.</text>
</svg>
