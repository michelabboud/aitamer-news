<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">The k9s screen, area by area</title>
<desc id="d">A drawing of the k9s v0.51.0 screen as we saw it on our cluster, not a screenshot. Top left, the header: Context kind-k8s-ep22 with RW for read-write or R for read-only, Cluster, User, K9s Rev, K8s Rev, and CPU and MEM, which show n/a without metrics-server. Top middle, numbered namespace shortcuts such as 0 all and 1 k8s-from-zero, and the key hints for the current view such as ctrl-d Delete, d Describe and l Logs. Top right, the logo. Below, the command prompt, highlighted, which opens when you type a colon, for example :deploy; k9s draws a small dog icon before the cursor. The main area is the resource table, titled with the resource, the namespace and the row count, such as pods(k8s-from-zero)[4], plus the active filter such as /web. At the bottom, the breadcrumbs such as pod, and a status line such as Viewing v1/pods in namespace k8s-from-zero.</desc>
