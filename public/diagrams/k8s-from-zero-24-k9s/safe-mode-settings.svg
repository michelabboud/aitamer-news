<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
<title id="t">Layers that keep k9s from changing a cluster</title>
<desc id="d">Four layers, from the weakest to the strongest. One: readOnly in the global config.yaml under the k9s key, default false. Two: readOnly in the per-context config under the data directory, clusters, cluster name, context name, config.yaml; in our lab setting it to true made plain k9s start with R in the header. Three: the flags --readonly and --write, which override the setting for one run; with the context set to read-only, k9s --write started with RW again, highlighted, so these settings protect you from mistakes, not from yourself. Four, the real boundary: RBAC on the API server, which part 20 covers; a user who lacks delete permission cannot delete from k9s or kubectl. In read-only mode we saw the Delete, Edit and Restart hints and our plugin marked dangerous disappear; ctrl-d did nothing; Describe, Logs, YAML and Port-Forward stayed.</desc>
