<rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Read-only in k9s is a seat belt; RBAC is the wall</text>
<rect class="boxb" x="24" y="56" width="470" height="68" rx="10"/>
<circle class="db" cx="50" cy="90" r="14"/>
<text class="th" x="50" y="95" text-anchor="middle">1</text>
<text class="th" x="74" y="78" text-anchor="start">config.yaml (global)</text>
<text class="tm" x="74" y="98" text-anchor="start">k9s.readOnly: true</text>
<text class="ts" x="74" y="116" text-anchor="start">default false</text>
<rect class="boxb" x="24" y="134" width="470" height="68" rx="10"/>
<circle class="db" cx="50" cy="168" r="14"/>
<text class="th" x="50" y="173" text-anchor="middle">2</text>
<text class="th" x="74" y="156" text-anchor="start">context config.yaml</text>
<text class="tm" x="74" y="176" text-anchor="start">clusters/&lt;cluster&gt;/&lt;context&gt;/config.yaml</text>
<text class="ts" x="74" y="194" text-anchor="start">we set readOnly: true: header shows [R]</text>
<rect class="boxc" x="24" y="212" width="470" height="68" rx="10"/>
<circle class="dc" cx="50" cy="246" r="14"/>
<text class="th" x="50" y="251" text-anchor="middle">3</text>
<text class="th" x="74" y="234" text-anchor="start">flags for one run</text>
<text class="tm" x="74" y="254" text-anchor="start">k9s --readonly   or   k9s --write</text>
<text class="tc" x="74" y="272" text-anchor="start">--write turned [R] back into [RW]</text>
<rect class="boxs" x="24" y="290" width="470" height="68" rx="10"/>
<circle class="ds" cx="50" cy="324" r="14"/>
<text class="th" x="50" y="329" text-anchor="middle">4</text>
<text class="th" x="74" y="312" text-anchor="start">RBAC on the API server</text>
<text class="tm" x="74" y="332" text-anchor="start">Role / ClusterRole bindings (part 20)</text>
<text class="ts" x="74" y="350" text-anchor="start">the only setting k9s cannot override</text>
<rect class="panel" x="512" y="56" width="264" height="306" rx="10"/>
<text class="t" x="528" y="82" text-anchor="start">Read-only mode, as we saw it</text>
<text class="ts" x="528" y="110" text-anchor="start">hidden or blocked</text>
<text class="tm" x="540" y="132" text-anchor="start">&lt;ctrl-d&gt; Delete</text>
<text class="tm" x="540" y="152" text-anchor="start">&lt;e&gt; Edit</text>
<text class="tm" x="540" y="172" text-anchor="start">&lt;r&gt; Restart</text>
<text class="tm" x="540" y="192" text-anchor="start">&lt;shift-r&gt; our dangerous plugin</text>
<text class="ts" x="528" y="226" text-anchor="start">still there</text>
<text class="tm" x="540" y="248" text-anchor="start">&lt;d&gt; Describe</text>
<text class="tm" x="540" y="268" text-anchor="start">&lt;l&gt; Logs, &lt;y&gt; YAML</text>
<text class="tm" x="540" y="288" text-anchor="start">&lt;shift-f&gt; Port-Forward</text>
<text class="tm" x="540" y="308" text-anchor="start">&lt;shift-t&gt; our safe plugin</text>
<rect class="box" x="24" y="382" width="752" height="80" rx="10"/>
<text class="t" x="40" y="406" text-anchor="start">Safe habit for shared or production clusters:</text>
<text class="ts" x="40" y="428" text-anchor="start">set readOnly: true in the context config, use --write only when you mean it,</text>
<text class="ts" x="40" y="448" text-anchor="start">and give your everyday kubeconfig user a read-only RBAC role.</text>
</svg>
