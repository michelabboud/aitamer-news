<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
<title id="t">A container is a process with its own view</title>
<desc id="d">One Linux host runs ordinary processes: systemd, sshd, your shell and dockerd. The process sleep 600 is one of them, with host PID 22381, and it is the container. Seen from inside, the same process has PID 1, its own hostname e5463b99575d, Alpine Linux files and its own network interface. That inside view, made from namespaces, is highlighted. A cgroup can cap its memory and CPU. Every process, inside or outside the container, runs on the one shared Linux kernel shown at the bottom.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="460" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A container is a host process with its own view of the system</text>
<rect class="panel" x="24" y="50" width="752" height="390" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">One Linux host (Ubuntu 24.04)</text>
<text class="t" x="40" y="104" text-anchor="start">What the host sees (ps on the host):</text>
<rect class="box" x="40" y="116" width="220" height="36" rx="10"/>
<text class="tm" x="52" y="138.5" text-anchor="start">PID 1  systemd</text>
<rect class="box" x="40" y="162" width="220" height="36" rx="10"/>
<text class="tm" x="52" y="184.5" text-anchor="start">sshd</text>
<rect class="box" x="40" y="208" width="220" height="36" rx="10"/>
<text class="tm" x="52" y="230.5" text-anchor="start">bash (your shell)</text>
<rect class="box" x="40" y="254" width="220" height="36" rx="10"/>
<text class="tm" x="52" y="276.5" text-anchor="start">dockerd</text>
<rect class="boxc" x="40" y="300" width="220" height="48" rx="10"/>
<text class="tb" x="52" y="320.0" text-anchor="start">PID 22381  sleep 600</text>
<text class="ts" x="52" y="337.0" text-anchor="start">the container</text>
<line class="lnc" x1="262" y1="324" x2="330" y2="270" marker-end="url(#ahc)"/>
<rect class="boxd" x="332" y="92" width="428" height="262" rx="10"/>
<text class="t" x="346" y="114" text-anchor="start">What the container sees (docker exec sleeper ...):</text>
<rect class="boxc" x="350" y="128" width="190" height="50" rx="10"/>
<text class="tm" x="445" y="149.0" text-anchor="middle">PID 1  sleep 600</text>
<text class="ts" x="445" y="166.0" text-anchor="middle">pid namespace</text>
<rect class="boxc" x="552" y="128" width="190" height="50" rx="10"/>
<text class="tm" x="647" y="149.0" text-anchor="middle">hostname e5463b99575d</text>
<text class="ts" x="647" y="166.0" text-anchor="middle">uts namespace</text>
<rect class="boxc" x="350" y="190" width="190" height="50" rx="10"/>
<text class="tm" x="445" y="211.0" text-anchor="middle">Alpine Linux v3.24 files</text>
<text class="ts" x="445" y="228.0" text-anchor="middle">mount namespace</text>
<rect class="boxc" x="552" y="190" width="190" height="50" rx="10"/>
<text class="tm" x="647" y="211.0" text-anchor="middle">its own eth0 and IP</text>
<text class="ts" x="647" y="228.0" text-anchor="middle">network namespace</text>
<rect class="boxs" x="350" y="252" width="392" height="44" rx="10"/>
<text class="tm" x="546" y="270.0" text-anchor="middle">memory.max 67108864 when run with --memory 64m</text>
<text class="ts" x="546" y="287.0" text-anchor="middle">cgroup: limits on memory and CPU</text>
<text class="ts" x="546" y="330" text-anchor="middle">No other process on the host is visible from inside.</text>
<rect class="boxb" x="40" y="372" width="720" height="50" rx="10"/>
<text class="tb" x="400" y="401.5" text-anchor="middle">One shared Linux kernel 6.12  (uname -r prints the same inside and outside)</text>
</svg>
