<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">Who starts a container</title>
<desc id="d">The docker command is a client. It sends your request over the Docker socket, /var/run/docker.sock, to the Docker daemon, dockerd. dockerd keeps images, containers, networks and volumes, and hands the container to containerd. containerd prepares the container&#x27;s files from the image and calls runc, which asks the Linux kernel for namespaces and a cgroup and starts your process inside them. Docker Engine 29.10.1 ships with containerd 2.4.2 and runc 1.5.3. The final step, your process in its own namespaces, is highlighted.</desc>
