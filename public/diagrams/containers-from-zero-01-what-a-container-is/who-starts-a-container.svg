</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">From docker run to a running process</text>
<rect class="panel" x="24" y="50" width="752" height="350" rx="10"/>
<rect class="boxd" x="176" y="78" width="450" height="150" rx="10"/>
<text class="t" x="401" y="100" text-anchor="middle">Docker Engine 29.10.1  (containerd 2.4.2, runc 1.5.3)</text>
<rect class="box" x="40" y="130" width="124" height="64" rx="10"/>
<text class="tb" x="102" y="158.0" text-anchor="middle">docker</text>
<text class="ts" x="102" y="175.0" text-anchor="middle">the CLI</text>
<line class="ln" x1="164" y1="162" x2="188" y2="162" marker-end="url(#ah)"/>
<rect class="boxb" x="190" y="130" width="124" height="64" rx="10"/>
<text class="tb" x="252" y="158.0" text-anchor="middle">dockerd</text>
<text class="ts" x="252" y="175.0" text-anchor="middle">the daemon</text>
<line class="ln" x1="314" y1="162" x2="336" y2="162" marker-end="url(#ah)"/>
<rect class="boxb" x="338" y="130" width="124" height="64" rx="10"/>
<text class="tb" x="400" y="158.0" text-anchor="middle">containerd</text>
<text class="ts" x="400" y="175.0" text-anchor="middle">unpacks the image</text>
<line class="ln" x1="462" y1="162" x2="484" y2="162" marker-end="url(#ah)"/>
<rect class="boxb" x="486" y="130" width="124" height="64" rx="10"/>
<text class="tb" x="548" y="158.0" text-anchor="middle">runc</text>
<text class="ts" x="548" y="175.0" text-anchor="middle">asks the kernel</text>
<line class="lnc" x1="610" y1="162" x2="634" y2="162" marker-end="url(#ahc)"/>
<rect class="boxc" x="636" y="130" width="124" height="64" rx="10"/>
<text class="tb" x="698" y="158.0" text-anchor="middle">your process</text>
<text class="ts" x="698" y="175.0" text-anchor="middle">namespaces, cgroup</text>
<text class="ts" x="102" y="218" text-anchor="middle">talks to dockerd over</text>
<text class="tm" x="102" y="236" text-anchor="middle">/var/run/docker.sock</text>
<rect class="box" x="176" y="262" width="270" height="100" rx="10"/>
<text class="ts" x="311" y="299.5" text-anchor="middle">dockerd also keeps</text>
<text class="ts" x="311" y="316.5" text-anchor="middle">images, containers,</text>
<text class="ts" x="311" y="333.5" text-anchor="middle">networks and volumes</text>
<rect class="boxs" x="466" y="262" width="294" height="100" rx="10"/>
<text class="ts" x="613" y="299.5" text-anchor="middle">The Linux kernel provides</text>
<text class="ts" x="613" y="316.5" text-anchor="middle">namespaces (what it sees) and</text>
<text class="ts" x="613" y="333.5" text-anchor="middle">cgroups (how much it may use)</text>
<line class="ln" x1="548" y1="194" x2="590" y2="260" marker-end="url(#ah)"/>
</svg>
