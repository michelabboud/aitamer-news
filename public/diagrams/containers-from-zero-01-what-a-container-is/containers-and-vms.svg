<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">Containers and virtual machines</title>
<desc id="d">Two stacks side by side. On the left, virtual machines: hardware, then a hypervisor, then two VMs, each booting its own guest operating system and kernel before its app and libraries. On the right, containers: hardware, then one host operating system and kernel, then Docker Engine, then three containers, each holding only an app and its libraries and files. The single shared kernel on the right is highlighted. A VM is isolated by the hypervisor&#x27;s hardware boundary; containers are isolated by the shared kernel, which starts them fast but gives weaker isolation.</desc>
