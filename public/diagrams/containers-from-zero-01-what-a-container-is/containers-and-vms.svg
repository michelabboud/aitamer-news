<rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A VM boots a whole computer; a container shares the host kernel</text>
<rect class="panel" x="24" y="50" width="366" height="380" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Virtual machines</text>
<rect class="panel" x="410" y="50" width="366" height="380" rx="10"/>
<text class="th" x="426" y="76" text-anchor="start">Containers</text>
<rect class="boxs" x="40" y="92" width="160" height="50" rx="10"/>
<text class="tm" x="120" y="121.5" text-anchor="middle">app + libraries</text>
<rect class="box" x="40" y="150" width="160" height="74" rx="10"/>
<text class="tm" x="120" y="174.5" text-anchor="middle">guest OS</text>
<text class="tm" x="120" y="191.5" text-anchor="middle">with its own</text>
<text class="tm" x="120" y="208.5" text-anchor="middle">kernel</text>
<rect class="boxd" x="34" y="84" width="172" height="148" rx="10"/>
<rect class="boxs" x="214" y="92" width="160" height="50" rx="10"/>
<text class="tm" x="294" y="121.5" text-anchor="middle">app + libraries</text>
<rect class="box" x="214" y="150" width="160" height="74" rx="10"/>
<text class="tm" x="294" y="174.5" text-anchor="middle">guest OS</text>
<text class="tm" x="294" y="191.5" text-anchor="middle">with its own</text>
<text class="tm" x="294" y="208.5" text-anchor="middle">kernel</text>
<rect class="boxd" x="208" y="84" width="172" height="148" rx="10"/>
<text class="ts" x="200" y="252" text-anchor="middle">each VM boots a full OS</text>
<rect class="boxn" x="40" y="268" width="334" height="50" rx="10"/>
<text class="tm" x="207" y="297.5" text-anchor="middle">hypervisor</text>
<rect class="box" x="40" y="330" width="334" height="50" rx="10"/>
<text class="tm" x="207" y="359.5" text-anchor="middle">hardware</text>
<text class="ts" x="207" y="410" text-anchor="middle">Isolation: the hypervisor&#x27;s hardware boundary</text>
<rect class="boxs" x="426" y="92" width="106" height="70" rx="10"/>
<text class="tm" x="479" y="114.5" text-anchor="middle">app +</text>
<text class="tm" x="479" y="131.5" text-anchor="middle">libraries</text>
<text class="tm" x="479" y="148.5" text-anchor="middle">+ files</text>
<rect class="boxs" x="540" y="92" width="106" height="70" rx="10"/>
<text class="tm" x="593" y="114.5" text-anchor="middle">app +</text>
<text class="tm" x="593" y="131.5" text-anchor="middle">libraries</text>
<text class="tm" x="593" y="148.5" text-anchor="middle">+ files</text>
<rect class="boxs" x="654" y="92" width="106" height="70" rx="10"/>
<text class="tm" x="707" y="114.5" text-anchor="middle">app +</text>
<text class="tm" x="707" y="131.5" text-anchor="middle">libraries</text>
<text class="tm" x="707" y="148.5" text-anchor="middle">+ files</text>
<text class="ts" x="593" y="186" text-anchor="middle">containers are processes, nothing to boot</text>
<rect class="boxb" x="426" y="206" width="334" height="44" rx="10"/>
<text class="tm" x="593" y="232.5" text-anchor="middle">Docker Engine</text>
<rect class="boxc" x="426" y="262" width="334" height="56" rx="10"/>
<text class="tb" x="593" y="294.5" text-anchor="middle">host OS, one shared kernel</text>
<rect class="box" x="426" y="330" width="334" height="50" rx="10"/>
<text class="tm" x="593" y="359.5" text-anchor="middle">hardware (or a VM in the cloud)</text>
<text class="ts" x="593" y="410" text-anchor="middle">Isolation: the shared kernel. Starts in about a second.</text>
</svg>
