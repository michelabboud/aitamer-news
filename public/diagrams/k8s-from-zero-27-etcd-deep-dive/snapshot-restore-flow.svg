<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Snapshot and restore on a kubeadm-style control plane</title>
<desc id="d">Seven steps we ran on the kind control-plane node. One: etcdctl snapshot save over TLS writes snap-1.db. Two: etcdutl snapshot status shows hash 182aaa39, revision 3238, 681 keys, 5.1 MB. Three: stop kube-apiserver and etcd by moving their static Pod manifests out of /etc/kubernetes/manifests. Four: etcdutl snapshot restore into a new data directory, /var/lib/etcd-restored, with bump-revision and mark-compacted, highlighted. Five: point the etcd manifest hostPath at the new directory. Six: move the manifests back, etcd first, and restart the kubelet. Seven: check that an object created before the snapshot is back and one created after it is gone.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Backup and restore, the order we ran it</text>
<rect class="box" x="24" y="52" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="78" r="14"/>
<text class="th" x="54" y="83" text-anchor="middle">1</text>
<text class="tm" x="84" y="74" text-anchor="start">etcdctl snapshot save /var/backups/etcd/snap-1.db</text>
<text class="ts" x="84" y="94" text-anchor="start">over TLS to 127.0.0.1:2379, safe on a live member</text>
<line class="ln" x1="400" y1="104" x2="400" y2="114"/>
<rect class="box" x="24" y="114" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="140" r="14"/>
<text class="th" x="54" y="145" text-anchor="middle">2</text>
<text class="tm" x="84" y="136" text-anchor="start">etcdutl snapshot status snap-1.db</text>
<text class="ts" x="84" y="156" text-anchor="start">hash 182aaa39, revision 3238, 681 keys, 5.1 MB</text>
<line class="ln" x1="400" y1="166" x2="400" y2="176"/>
<rect class="boxb" x="24" y="176" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="202" r="14"/>
<text class="th" x="54" y="207" text-anchor="middle">3</text>
<text class="tm" x="84" y="198" text-anchor="start">mv manifests/{kube-apiserver,etcd}.yaml /root/stopped/</text>
<text class="ts" x="84" y="218" text-anchor="start">the kubelet stops both static Pods: API down</text>
<line class="ln" x1="400" y1="228" x2="400" y2="238"/>
<rect class="boxc" x="24" y="238" width="752" height="52" rx="8"/>
<circle class="dc" cx="54" cy="264" r="14"/>
<text class="th" x="54" y="269" text-anchor="middle">4</text>
<text class="tm" x="84" y="260" text-anchor="start">etcdutl snapshot restore ... --data-dir /var/lib/etcd-restored</text>
<text class="ts" x="84" y="280" text-anchor="start">--bump-revision 1000000000 --mark-compacted</text>
<line class="ln" x1="400" y1="290" x2="400" y2="300"/>
<rect class="boxb" x="24" y="300" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="326" r="14"/>
<text class="th" x="54" y="331" text-anchor="middle">5</text>
<text class="tm" x="84" y="322" text-anchor="start">etcd.yaml: hostPath /var/lib/etcd-restored</text>
<text class="ts" x="84" y="342" text-anchor="start">the container still sees /var/lib/etcd</text>
<line class="ln" x1="400" y1="352" x2="400" y2="362"/>
<rect class="boxb" x="24" y="362" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="388" r="14"/>
<text class="th" x="54" y="393" text-anchor="middle">6</text>
<text class="tm" x="84" y="384" text-anchor="start">move etcd.yaml back, then kube-apiserver.yaml</text>
<text class="ts" x="84" y="404" text-anchor="start">systemctl restart kubelet</text>
<line class="ln" x1="400" y1="414" x2="400" y2="424"/>
<rect class="boxs" x="24" y="424" width="752" height="52" rx="8"/>
<circle class="dg" cx="54" cy="450" r="14"/>
<text class="th" x="54" y="455" text-anchor="middle">7</text>
<text class="tm" x="84" y="446" text-anchor="start">kubectl get configmaps</text>
<text class="ts" x="84" y="466" text-anchor="start">before-backup is back, after-backup is gone</text>
<text class="tc" x="24" y="494" text-anchor="start">Anything written after the snapshot is lost. Encrypt and copy snapshot files off the node: they hold every Secret.</text>
</svg>
