<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">Quorum table for 1 to 7 members</title>
<desc id="d">A table of etcd cluster sizes from one to seven members, with the majority needed and the number of failures tolerated: 1 member, majority 1, tolerates 0; 2, majority 2, tolerates 0; 3, majority 2, tolerates 1; 4, majority 3, tolerates 1; 5, majority 3, tolerates 2; 6, majority 4, tolerates 2; 7, majority 4, tolerates 3. Even sizes add a member without adding tolerance. The 3-member row, highlighted, matches our lab: with two members stopped, writes and default reads timed out, and only a serializable read from the surviving member answered.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="430" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Quorum: majority = floor(n/2) + 1</text>
<rect class="panel" x="24" y="52" width="752" height="34" rx="6"/>
<text class="t" x="60" y="74" text-anchor="start">members</text>
<text class="t" x="220" y="74" text-anchor="start">majority needed</text>
<text class="t" x="420" y="74" text-anchor="start">failures tolerated</text>
<text class="t" x="600" y="74" text-anchor="start">note</text>
<rect class="box" x="24" y="92" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="112" text-anchor="start">1</text>
<text class="tm" x="220" y="112" text-anchor="start">1</text>
<text class="tm" x="420" y="112" text-anchor="start">0</text>
<text class="ts" x="600" y="112" text-anchor="start">kind, our single-node lab</text>
<rect class="boxd" x="24" y="128" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="148" text-anchor="start">2</text>
<text class="tm" x="220" y="148" text-anchor="start">2</text>
<text class="tm" x="420" y="148" text-anchor="start">0</text>
<text class="ts" x="600" y="148" text-anchor="start">no gain over 1</text>
<rect class="boxc" x="24" y="164" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="184" text-anchor="start">3</text>
<text class="tm" x="220" y="184" text-anchor="start">2</text>
<text class="tm" x="420" y="184" text-anchor="start">1</text>
<text class="ts" x="600" y="184" text-anchor="start">our three-member lab</text>
<rect class="boxd" x="24" y="200" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="220" text-anchor="start">4</text>
<text class="tm" x="220" y="220" text-anchor="start">3</text>
<text class="tm" x="420" y="220" text-anchor="start">1</text>
<text class="ts" x="600" y="220" text-anchor="start">no gain over 3</text>
<rect class="box" x="24" y="236" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="256" text-anchor="start">5</text>
<text class="tm" x="220" y="256" text-anchor="start">3</text>
<text class="tm" x="420" y="256" text-anchor="start">2</text>
<text class="ts" x="600" y="256" text-anchor="start">Kubernetes docs: production</text>
<rect class="boxd" x="24" y="272" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="292" text-anchor="start">6</text>
<text class="tm" x="220" y="292" text-anchor="start">4</text>
<text class="tm" x="420" y="292" text-anchor="start">2</text>
<text class="ts" x="600" y="292" text-anchor="start">no gain over 5</text>
<rect class="box" x="24" y="308" width="752" height="30" rx="4"/>
<text class="tm" x="60" y="328" text-anchor="start">7</text>
<text class="tm" x="220" y="328" text-anchor="start">4</text>
<text class="tm" x="420" y="328" text-anchor="start">3</text>
<text class="ts" x="600" y="328" text-anchor="start">etcd FAQ: about the maximum</text>
<text class="ts" x="24" y="370" text-anchor="start">Dashed rows: even sizes cost one more machine and tolerate no more failures than the odd size below them.</text>
<text class="tc" x="24" y="392" text-anchor="start">Lose the majority and etcd stops accepting writes; the API server cannot change anything until quorum returns.</text>
<text class="ts" x="24" y="414" text-anchor="start">Pods already scheduled may keep running, but no new Pods can be scheduled (Kubernetes docs).</text>
</svg>
