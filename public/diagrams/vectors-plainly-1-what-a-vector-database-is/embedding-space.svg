<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d">
<title id="t">Embedding space</title>
<desc id="d">Sentences about dogs sit close together, travel sentences form another cluster, and a tax sentence sits far away; a query about a dog finds the dog sentences as its nearest neighbours.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 70% { opacity: 0; transform: scale(2.4); } 100% { opacity: 0; transform: scale(2.4); } }
@keyframes march { to { stroke-dashoffset: -16; } }
.ring { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
.ring { animation: pulse 2.4s ease-out infinite; }
.q { animation: march 1.2s linear infinite; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="410" rx="12"/>
<text class="ts" x="24" y="34" text-anchor="start">A 2-D sketch of embedding space (real models use hundreds or thousands of dimensions)</text>
<circle class="ds" cx="190" cy="130" r="8"/>
<text class="ts" x="204" y="135" text-anchor="start">The dog chased the ball</text>
<circle class="ds" cx="250" cy="175" r="8"/>
<text class="ts" x="264" y="180" text-anchor="start">A puppy fetched a stick</text>
<circle class="ds" cx="170" cy="205" r="8"/>
<text class="ts" x="184" y="210" text-anchor="start">My retriever loves the park</text>
<circle class="db" cx="520" cy="120" r="8"/>
<text class="ts" x="534" y="125" text-anchor="start">Cheap flights to Tokyo</text>
<circle class="db" cx="585" cy="165" r="8"/>
<text class="ts" x="599" y="170" text-anchor="start">Affordable airfare to Japan</text>
<circle class="dn" cx="560" cy="300" r="8"/>
<text class="ts" x="574" y="305" text-anchor="start">How to file a tax return</text>
<circle class="dg" cx="380" cy="350" r="8"/>
<text class="ts" x="394" y="355" text-anchor="start">Stir the soup slowly</text>
<path class="lnc q" d="M250 250L190 130" stroke-dasharray="4 4"/>
<path class="lnc q" d="M250 250L250 175" stroke-dasharray="4 4"/>
<path class="lnc q" d="M250 250L170 205" stroke-dasharray="4 4"/>
<circle class="ring" cx="250" cy="250" r="12" fill="none" stroke="#d9674f" stroke-width="2"/>
<circle class="dc" cx="250" cy="250" r="7"/>
<text class="tc" x="264" y="274" text-anchor="start">Query: "my dog won't stop running off"</text>
<text class="ts" x="24" y="392" text-anchor="start">Nearest neighbours by meaning, not by shared words: the query shares almost no words with its neighbours.</text>
</svg>
