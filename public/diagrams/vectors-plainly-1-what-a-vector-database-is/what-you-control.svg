<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d">
<title id="t">What you control in an embedding pipeline</title>
<desc id="d">Text goes through a fixed embedding model and comes out as one list of numbers. You choose the model, chunking, metadata, normalisation and metric; the model decides what each dimension means and the geometry of the space.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="390" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">What you control, and what the model decides</text>
<rect class="box" x="24" y="70" width="150" height="70" rx="8"/>
<text class="t" x="99.0" y="101.0" text-anchor="middle">A chunk of text</text>
<text class="ts" x="99.0" y="119.0" text-anchor="middle">"Refunds take 5 days"</text>
<path class="ln" d="M176 105L236 105" marker-end="url(#ah)"/>
<rect class="boxb" x="240" y="50" width="190" height="110" rx="8"/>
<text class="t" x="335.0" y="92.0" text-anchor="middle">Embedding model</text>
<text class="ts" x="335.0" y="110.0" text-anchor="middle">weights fixed in training</text>
<text class="ts" x="335.0" y="128.0" text-anchor="middle">you call it; you don't edit it</text>
<path class="ln" d="M432 105L492 105" marker-end="url(#ah)"/>
<rect class="boxc" x="496" y="70" width="280" height="70" rx="8"/>
<text class="tm" x="636.0" y="101.0" text-anchor="middle">[0.021, -0.113, 0.087, ... ]</text>
<text class="ts" x="636.0" y="119.0" text-anchor="middle">one fixed-length list of numbers</text>
<text class="th" x="24" y="200" text-anchor="start">You control</text>
<text class="t" x="24" y="228" text-anchor="start">- Which model (and so the dimension count)</text>
<text class="t" x="24" y="252" text-anchor="start">- How text is chunked before embedding</text>
<text class="t" x="24" y="276" text-anchor="start">- The metadata stored beside each vector</text>
<text class="t" x="24" y="300" text-anchor="start">- Normalisation and the distance metric</text>
<text class="t" x="24" y="324" text-anchor="start">- Fine-tuning a model on your own pairs</text>
<text class="th" x="430" y="200" text-anchor="start">The model decides</text>
<text class="t" x="430" y="228" text-anchor="start">- What each dimension means</text>
<text class="t" x="430" y="252" text-anchor="start">- How much each input word counted</text>
<text class="t" x="430" y="276" text-anchor="start">- The geometry of the whole space</text>
<text class="t" x="430" y="300" text-anchor="start">- That its vectors compare only with its own</text>
<text class="ts" x="24" y="368" text-anchor="start">Query-time weighting (hybrid alpha, reranking) is the closest thing to "field weights" you get.</text>
</svg>
