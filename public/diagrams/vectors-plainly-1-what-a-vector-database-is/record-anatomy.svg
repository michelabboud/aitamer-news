<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a vector record</title>
<desc id="d">A record holds an id, a vector derived one-way from the text, a verbatim copy of the text as payload, and ordinary metadata fields used for filtering, isolation and versioning.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="350" rx="12"/>
<text class="th" x="24" y="34" text-anchor="start">One record in a vector database</text>
<rect class="box" x="24" y="60" width="752" height="44" rx="8"/>
<text class="tm" x="400.0" y="87.0" text-anchor="middle">id: "doc-4471#chunk-3"</text>
<rect class="boxc" x="24" y="114" width="320" height="90" rx="8"/>
<text class="tm" x="184.0" y="146.0" text-anchor="middle">vector: [0.021, -0.113, ...]</text>
<text class="ts" x="184.0" y="164.0" text-anchor="middle">derived from the text; one-way</text>
<text class="ts" x="184.0" y="182.0" text-anchor="middle">used for similarity search</text>
<rect class="boxb" x="440" y="114" width="336" height="90" rx="8"/>
<text class="tm" x="608.0" y="146.0" text-anchor="middle">payload.text: "Refunds take 5 days..."</text>
<text class="ts" x="608.0" y="164.0" text-anchor="middle">a verbatim copy of the chunk</text>
<text class="ts" x="608.0" y="182.0" text-anchor="middle">handed back to the app or the prompt</text>
<rect class="boxs" x="24" y="214" width="752" height="60" rx="8"/>
<text class="tm" x="400.0" y="240.0" text-anchor="middle">metadata: tenant_id="acme", lang="en", updated=2026-09-01, model="embed-v2"</text>
<text class="ts" x="400.0" y="258.0" text-anchor="middle">ordinary fields: filtering, isolation, versioning</text>
<path class="lnc" d="M438 159L348 159" marker-end="url(#ahc)"/>
<text class="tc" x="392" y="150" text-anchor="middle">embed</text>
<text class="tc" x="400" y="300" text-anchor="middle">Embedding runs one way: no decoder turns the vector back into the text.</text>
<text class="ts" x="24" y="330" text-anchor="start">Text can also live elsewhere (Postgres, S3) and be fetched by id; if the pipeline drops it, it is gone.</text>
</svg>
