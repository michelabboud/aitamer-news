<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">Publishing a container port on 127.0.0.1</title>
<desc id="d">The Docker host runs curl, which asks for 127.0.0.1:8080. The flag -p 127.0.0.1:8080:8000 tells Docker to forward that host address and port to port 8000 of the container named hello, where python app.py listens on its own network interface at an address such as 172.17.0.2. That forwarding rule is highlighted. The app sees requests arriving from 172.17.0.1, the host side of Docker&#x27;s default bridge network. Because the rule names 127.0.0.1, another computer on the network cannot reach the port. Without an address, -p 8080:8000 would publish on every address of the host, and Docker&#x27;s docs warn that published ports bypass ufw and firewalld rules.</desc>
