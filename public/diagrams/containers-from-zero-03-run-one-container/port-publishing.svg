<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">-p 127.0.0.1:8080:8000: host port 8080 to container port 8000</text>
<rect class="panel" x="24" y="50" width="560" height="350" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Docker host (your machine)</text>
<rect class="box" x="44" y="98" width="180" height="60" rx="10"/>
<text class="tm" x="134" y="124.0" text-anchor="middle">curl</text>
<text class="tm" x="134" y="141.0" text-anchor="middle">http://127.0.0.1:8080/</text>
<rect class="boxc" x="44" y="214" width="180" height="70" rx="10"/>
<text class="tb" x="134" y="245.0" text-anchor="middle">127.0.0.1:8080</text>
<text class="ts" x="134" y="262.0" text-anchor="middle">published port</text>
<line class="ln" x1="134" y1="158" x2="134" y2="212" marker-end="url(#ah)"/>
<rect class="boxd" x="260" y="92" width="304" height="290" rx="10"/>
<text class="t" x="274" y="114" text-anchor="start">container hello</text>
<rect class="boxs" x="280" y="132" width="264" height="64" rx="10"/>
<text class="tb" x="412" y="160.0" text-anchor="middle">python app.py</text>
<text class="ts" x="412" y="177.0" text-anchor="middle">listening on port 8000</text>
<rect class="box" x="280" y="214" width="264" height="70" rx="10"/>
<text class="tm" x="412" y="245.0" text-anchor="middle">its own eth0, e.g. 172.17.0.2</text>
<text class="ts" x="412" y="262.0" text-anchor="middle">logs show requests from 172.17.0.1</text>
<line class="lnc" x1="226" y1="249" x2="278" y2="175" marker-end="url(#ahc)"/>
<text class="tb" x="250" y="330" text-anchor="start">-p 127.0.0.1:8080:8000</text>
<text class="ts" x="250" y="350" text-anchor="start">HOST_IP : HOST_PORT : CONTAINER_PORT</text>
<rect class="panel" x="604" y="50" width="172" height="350" rx="10"/>
<text class="th" x="620" y="76" text-anchor="start">Another computer</text>
<rect class="box" x="620" y="98" width="140" height="70" rx="10"/>
<text class="tm" x="690" y="129.0" text-anchor="middle">curl</text>
<text class="tm" x="690" y="146.0" text-anchor="middle">your-ip:8080</text>
<rect class="boxd" x="620" y="214" width="140" height="70" rx="10"/>
<text class="ts" x="690" y="236.5" text-anchor="middle">no answer:</text>
<text class="ts" x="690" y="253.5" text-anchor="middle">only 127.0.0.1</text>
<text class="ts" x="690" y="270.5" text-anchor="middle">is published</text>
<line class="ln" x1="690" y1="168" x2="690" y2="212" marker-end="url(#ah)"/>
<text class="ts" x="690" y="330" text-anchor="middle">-p 8080:8000 would</text>
<text class="ts" x="690" y="348" text-anchor="middle">publish on every</text>
<text class="ts" x="690" y="366" text-anchor="middle">address and bypass</text>
<text class="ts" x="690" y="384" text-anchor="middle">ufw and firewalld</text>
</svg>
