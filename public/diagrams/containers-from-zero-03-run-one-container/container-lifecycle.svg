<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">The life of one container</title>
<desc id="d">Three states in a row: created, running and exited. docker run creates and starts a container in one step; docker create would only create it. docker stop moves a running container to exited by sending SIGTERM and, after a 10-second grace period on Linux, SIGKILL. docker start moves an exited container back to running with the same ID, name, settings and writable layer. docker rm deletes an exited or created container; docker rm -f also stops a running one first. A container started with --rm is deleted automatically when it exits. The running state is highlighted.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">created, running, exited, removed</text>
<rect class="panel" x="24" y="50" width="752" height="330" rx="10"/>
<rect class="box" x="48" y="150" width="150" height="70" rx="10"/>
<text class="tb" x="123" y="181.0" text-anchor="middle">created</text>
<text class="ts" x="123" y="198.0" text-anchor="middle">ID and settings exist</text>
<rect class="boxc" x="320" y="150" width="160" height="70" rx="10"/>
<text class="tb" x="400" y="181.0" text-anchor="middle">running</text>
<text class="ts" x="400" y="198.0" text-anchor="middle">PID 1 is your app</text>
<rect class="box" x="600" y="150" width="150" height="70" rx="10"/>
<text class="tb" x="675" y="181.0" text-anchor="middle">exited</text>
<text class="ts" x="675" y="198.0" text-anchor="middle">exit code kept</text>
<line class="ln" x1="198" y1="185" x2="318" y2="185" marker-end="url(#ah)"/>
<text class="tm" x="258" y="176" text-anchor="middle">docker start</text>
<path class="ln" d="M 480 170 L 598 170" marker-end="url(#ah)"/>
<text class="tm" x="539" y="160" text-anchor="middle">docker stop</text>
<path class="ln" d="M 598 202 L 482 202" marker-end="url(#ah)"/>
<text class="tm" x="539" y="222" text-anchor="middle">docker start</text>
<path class="lnc" d="M 120 104 C 160 84, 300 84, 380 148" marker-end="url(#ahc)"/>
<text class="tm" x="250" y="82" text-anchor="middle">docker run = create + start</text>
<rect class="boxd" x="48" y="290" width="702" height="64" rx="10"/>
<text class="tb" x="399" y="314" text-anchor="middle">removed</text>
<text class="ts" x="399" y="336" text-anchor="middle">docker rm (created or exited)  ·  docker rm -f (also running)  ·  --rm on docker run (on exit)</text>
<line class="ln" x1="123" y1="220" x2="123" y2="288" marker-end="url(#ah)"/>
<line class="ln" x1="675" y1="220" x2="675" y2="288" marker-end="url(#ah)"/>
<line class="ln" x1="400" y1="220" x2="400" y2="288" marker-end="url(#ah)"/>
<text class="tm" x="410" y="258" text-anchor="start">rm -f</text>
</svg>
