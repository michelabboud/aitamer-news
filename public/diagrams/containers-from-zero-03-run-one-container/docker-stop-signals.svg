<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">What docker stop does</title>
<desc id="d">docker stop sends SIGTERM to the container&#x27;s PID 1 and waits up to 10 seconds before sending SIGKILL. Three cases from the lab. hello-app has a SIGTERM handler, prints received SIGTERM, shutting down, and exits with code 0 after 0.22 seconds; this case is highlighted. python -m http.server has no handler. As PID 1 it ignores signals with the default action, so Docker waits the full 10 seconds, sends SIGKILL, and the exit code is 137, which is 128 plus 9. The same server started with --init runs under docker-init as PID 1, which passes SIGTERM on; Python&#x27;s default action ends it at once with exit code 143, which is 128 plus 15.</desc>
