<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">docker stop: SIGTERM, a 10-second wait, then SIGKILL</text>
<rect class="panel" x="24" y="50" width="752" height="350" rx="10"/>
<text class="tb" x="40" y="84" text-anchor="start">docker stop  sends SIGTERM to PID 1</text>
<text class="ts" x="760" y="84" text-anchor="end">10 s grace period, then SIGKILL</text>
<rect class="boxc" x="40" y="104" width="720" height="82" rx="10"/>
<text class="tb" x="56" y="130" text-anchor="start">hello-app (handles SIGTERM)</text>
<text class="tm" x="56" y="152" text-anchor="start">prints: received SIGTERM, shutting down</text>
<text class="ts" x="56" y="172" text-anchor="start">stopped in 0.22 s</text>
<text class="tb" x="744" y="152" text-anchor="end">Exited (0)</text>
<rect class="box" x="40" y="198" width="720" height="82" rx="10"/>
<text class="tb" x="56" y="224" text-anchor="start">python -m http.server as PID 1 (no handler)</text>
<text class="tm" x="56" y="246" text-anchor="start">PID 1 ignores signals with the default action</text>
<text class="ts" x="56" y="266" text-anchor="start">waited 10.1 s, then SIGKILL</text>
<text class="tb" x="744" y="246" text-anchor="end">Exited (137) = 128 + 9</text>
<rect class="boxs" x="40" y="292" width="720" height="82" rx="10"/>
<text class="tb" x="56" y="318" text-anchor="start">the same server with --init (docker-init is PID 1)</text>
<text class="tm" x="56" y="340" text-anchor="start">docker-init passes SIGTERM on, Python&#x27;s default ends it</text>
<text class="ts" x="56" y="360" text-anchor="start">stopped in 0.10 s</text>
<text class="tb" x="744" y="340" text-anchor="end">Exited (143) = 128 + 15</text>
</svg>
