<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">Who can do what on which</title>
<desc id="d">An RBAC permission reads as a sentence with four parts. Who: a subject, which is a User, a Group or a ServiceAccount, here the ServiceAccount inspector in k8s-from-zero. Can do what: verbs such as get, list and watch. On which: a resource in an API group, here pods in the core group, written as an empty string. Where: a namespace for a Role, or the whole cluster for a ClusterRole. The Role holds what, which and where; the subject is separate; the binding, highlighted, joins a subject to a Role. Without a binding nothing is allowed, because RBAC permissions are purely additive and there are no deny rules.</desc>
