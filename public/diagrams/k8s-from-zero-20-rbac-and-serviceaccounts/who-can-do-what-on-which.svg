<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">An RBAC permission is a sentence: who can do what on which, where</text>
<text class="th" x="112" y="70" text-anchor="middle">who</text>
<text class="ts" x="112" y="88" text-anchor="middle">subject</text>
<rect class="boxs" x="24" y="98" width="176" height="90" rx="10"/>
<text class="tm" x="112.0" y="131.0" text-anchor="middle">ServiceAccount</text>
<text class="tm" x="112.0" y="148.0" text-anchor="middle">inspector</text>
<text class="tm" x="112.0" y="165.0" text-anchor="middle">(or User, Group)</text>
<text class="th" x="304" y="70" text-anchor="middle">can do what</text>
<text class="ts" x="304" y="88" text-anchor="middle">verbs</text>
<rect class="boxb" x="216" y="98" width="176" height="90" rx="10"/>
<text class="tm" x="304.0" y="131.0" text-anchor="middle">get</text>
<text class="tm" x="304.0" y="148.0" text-anchor="middle">list</text>
<text class="tm" x="304.0" y="165.0" text-anchor="middle">watch</text>
<text class="th" x="496" y="70" text-anchor="middle">on which</text>
<text class="ts" x="496" y="88" text-anchor="middle">apiGroups + resources</text>
<rect class="boxb" x="408" y="98" width="176" height="90" rx="10"/>
<text class="tm" x="496.0" y="139.5" text-anchor="middle">&quot;&quot; (core)</text>
<text class="tm" x="496.0" y="156.5" text-anchor="middle">pods</text>
<text class="th" x="688" y="70" text-anchor="middle">where</text>
<text class="ts" x="688" y="88" text-anchor="middle">scope</text>
<rect class="boxb" x="600" y="98" width="176" height="90" rx="10"/>
<text class="tm" x="688.0" y="139.5" text-anchor="middle">namespace</text>
<text class="tm" x="688.0" y="156.5" text-anchor="middle">k8s-from-zero</text>
<rect class="panel" x="208" y="210" width="568" height="40" rx="8"/>
<text class="t" x="492" y="235" text-anchor="middle">Role pod-reader holds these three</text>
<line class="lnb" x1="216" y1="206" x2="776" y2="206"/>
<rect class="boxc" x="24" y="280" width="752" height="56" rx="10"/>
<text class="tm" x="400.0" y="304.5" text-anchor="middle">RoleBinding inspector-reads-pods</text>
<text class="tm" x="400.0" y="321.5" text-anchor="middle">joins the subject to the Role</text>
<line class="lnc" x1="112" y1="188" x2="112" y2="278" marker-end="url(#ahc)"/>
<line class="lnc" x1="492" y1="250" x2="492" y2="278" marker-end="url(#ahc)"/>
<text class="t" x="24" y="372" text-anchor="start">Permissions only add up. There are no deny rules: no binding, no access.</text>
</svg>
