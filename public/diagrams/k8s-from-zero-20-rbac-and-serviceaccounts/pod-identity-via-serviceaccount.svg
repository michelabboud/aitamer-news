}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A Pod proves who it is with a token the kubelet mounts for it</text>
<rect class="boxd" x="24" y="52" width="360" height="400" rx="10"/>
<text class="tm" x="40" y="76" text-anchor="start">Pod inspector (ns k8s-from-zero)</text>
<rect class="boxb" x="40" y="92" width="328" height="46" rx="10"/>
<text class="tm" x="204.0" y="120.0" text-anchor="middle">spec.serviceAccountName: inspector</text>
<text class="tm" x="40" y="162" text-anchor="start">/var/run/secrets/kubernetes.io/serviceaccount/</text>
<rect class="boxc" x="40" y="174" width="328" height="92" rx="10"/>
<text class="ts" x="204.0" y="194" text-anchor="middle">token</text>
<text class="ts" x="204.0" y="211" text-anchor="middle">JWT bound to this Pod, audience: API server</text>
<text class="ts" x="204.0" y="228" text-anchor="middle">kubelet refreshes it at 80% of its</text>
<text class="ts" x="204.0" y="245" text-anchor="middle">lifetime or after 24 hours</text>
<rect class="box" x="40" y="276" width="156" height="48" rx="10"/>
<text class="ts" x="118.0" y="296.5" text-anchor="middle">ca.crt</text>
<text class="ts" x="118.0" y="313.5" text-anchor="middle">from kube-root-ca.crt</text>
<rect class="box" x="212" y="276" width="156" height="48" rx="10"/>
<text class="ts" x="290.0" y="296.5" text-anchor="middle">namespace</text>
<text class="ts" x="290.0" y="313.5" text-anchor="middle">k8s-from-zero</text>
<rect class="boxs" x="40" y="350" width="328" height="84" rx="10"/>
<text class="tm" x="204.0" y="380.0" text-anchor="middle">curl in the app container</text>
<text class="tm" x="204.0" y="397.0" text-anchor="middle">Authorization: Bearer &lt;token&gt;</text>
<text class="tm" x="204.0" y="414.0" text-anchor="middle">https://kubernetes.default.svc</text>
<rect class="boxb" x="420" y="92" width="356" height="60" rx="10"/>
<text class="tm" x="598.0" y="118.5" text-anchor="middle">kubelet</text>
<text class="tm" x="598.0" y="135.5" text-anchor="middle">TokenRequest API -&gt; fills the volume</text>
<line class="ln" x1="420" y1="130" x2="370" y2="200" marker-end="url(#ah)"/>
<rect class="boxb" x="420" y="186" width="356" height="92" rx="10"/>
<text class="tm" x="598.0" y="208" text-anchor="middle">kube-apiserver: authentication</text>
<text class="tm" x="598.0" y="225" text-anchor="middle">user: system:serviceaccount:</text>
<text class="tm" x="598.0" y="242" text-anchor="middle">k8s-from-zero:inspector</text>
<text class="tm" x="598.0" y="259" text-anchor="middle">groups: system:serviceaccounts, ...</text>
<line class="ln" x1="368" y1="392" x2="418" y2="250" marker-end="url(#ah)"/>
<rect class="boxb" x="420" y="300" width="356" height="60" rx="10"/>
<text class="tm" x="598.0" y="326.5" text-anchor="middle">RBAC authorization</text>
<text class="tm" x="598.0" y="343.5" text-anchor="middle">is there a binding for this subject?</text>
<line class="ln" x1="598" y1="278" x2="598" y2="298" marker-end="url(#ah)"/>
<rect class="box" x="420" y="382" width="170" height="52" rx="10"/>
<text class="tm" x="505.0" y="404.5" text-anchor="middle">no binding</text>
<text class="tm" x="505.0" y="421.5" text-anchor="middle">403 Forbidden</text>
<rect class="boxs" x="606" y="382" width="170" height="52" rx="10"/>
<text class="tm" x="691.0" y="404.5" text-anchor="middle">RoleBinding</text>
<text class="tm" x="691.0" y="421.5" text-anchor="middle">200 PodList</text>
<line class="ln" x1="540" y1="360" x2="505" y2="380" marker-end="url(#ah)"/>
<line class="ln" x1="656" y1="360" x2="690" y2="380" marker-end="url(#ah)"/>
</svg>
