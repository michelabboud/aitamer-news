<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
<title id="t">Pod identity through a ServiceAccount</title>
<desc id="d">The Pod inspector names the ServiceAccount inspector in spec.serviceAccountName. The ServiceAccount admission controller adds a projected volume named kube-api-access, and the kubelet fills it through the TokenRequest API with three files at /var/run/secrets/kubernetes.io/serviceaccount: token, highlighted, a JWT bound to this Pod with the API server as audience, refreshed by the kubelet when it is older than 80 percent of its lifetime or 24 hours; ca.crt from the ConfigMap kube-root-ca.crt; and namespace. The app sends the token as a Bearer header to https://kubernetes.default.svc. The API server authenticates it as system:serviceaccount:k8s-from-zero:inspector with the groups system:serviceaccounts and system:serviceaccounts:k8s-from-zero, then RBAC authorizes the request: 403 Forbidden before the RoleBinding, 200 with a PodList after it.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
