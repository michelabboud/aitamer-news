<text class="t" x="390" y="122" text-anchor="start">one namespace</text>
<text class="tm" x="576" y="122" text-anchor="start">pod-reader</text>
<text class="ts" x="576" y="140" text-anchor="start">list pods in k8s-from-zero: yes</text>
<text class="ts" x="576" y="158" text-anchor="start">list pods in kube-system: no</text>
<rect class="boxc" x="24" y="194" width="752" height="96" rx="10"/>
<rect class="boxb" x="40" y="218" width="140" height="48" rx="10"/>
<text class="tm" x="110.0" y="247.0" text-anchor="middle">ClusterRole</text>
<line class="ln" x1="180" y1="242" x2="196" y2="242" marker-end="url(#ah)"/>
<rect class="boxb" x="198" y="218" width="170" height="48" rx="10"/>
<text class="tm" x="283.0" y="247.0" text-anchor="middle">RoleBinding</text>
<text class="t" x="390" y="234" text-anchor="start">one namespace,</text>
<text class="t" x="390" y="252" text-anchor="start">rules reused</text>
<text class="tm" x="576" y="234" text-anchor="start">view</text>
<text class="ts" x="576" y="252" text-anchor="start">list services in k8s-from-zero: yes</text>
<text class="ts" x="576" y="270" text-anchor="start">list services in kube-system: no</text>
<rect class="box" x="24" y="306" width="752" height="96" rx="10"/>
<rect class="boxb" x="40" y="330" width="140" height="48" rx="10"/>
<text class="tm" x="110.0" y="359.0" text-anchor="middle">ClusterRole</text>
<line class="ln" x1="180" y1="354" x2="196" y2="354" marker-end="url(#ah)"/>
<rect class="boxb" x="198" y="330" width="170" height="48" rx="10"/>
<text class="tm" x="283.0" y="359.0" text-anchor="middle">ClusterRoleBinding</text>
<text class="t" x="390" y="346" text-anchor="start">whole cluster</text>
<text class="tm" x="576" y="346" text-anchor="start">node-reader</text>
<text class="ts" x="576" y="364" text-anchor="start">list nodes: yes</text>
<text class="ts" x="576" y="382" text-anchor="start">nodes are cluster-scoped</text>
<text class="t" x="24" y="438" text-anchor="start">A ClusterRoleBinding cannot point at a Role: the API only accepts kind ClusterRole there.</text>
</svg>
