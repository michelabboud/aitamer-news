<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">The binding decides where the rules apply</text>
<text class="ts" x="40" y="70" text-anchor="start">rules</text>
<text class="ts" x="200" y="70" text-anchor="start">binding</text>
<text class="ts" x="390" y="70" text-anchor="start">grants</text>
<text class="ts" x="576" y="70" text-anchor="start">seen in the lab</text>
<rect class="box" x="24" y="82" width="752" height="96" rx="10"/>
<rect class="boxb" x="40" y="106" width="140" height="48" rx="10"/>
<text class="tm" x="110.0" y="135.0" text-anchor="middle">Role</text>
<line class="ln" x1="180" y1="130" x2="196" y2="130" marker-end="url(#ah)"/>
