<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Role versus ClusterRole scope</title>
<desc id="d">Three ways to combine rules and bindings, as tested in the lab. One: a Role with a RoleBinding grants the rules in one namespace only; pod-reader lets inspector list Pods in k8s-from-zero but not in kube-system. Two, highlighted: a ClusterRole with a RoleBinding reuses cluster-wide rules but grants them only in the binding namespace; the built-in view role let inspector list Services in k8s-from-zero but not in kube-system. Three: a ClusterRole with a ClusterRoleBinding grants the rules in every namespace and on cluster-scoped resources; node-reader let inspector list nodes. A RoleBinding decides where; a ClusterRoleBinding means everywhere, and it can only reference a ClusterRole.</desc>
