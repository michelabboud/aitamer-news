<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">The HPA control loop</title>
<desc id="d">Kubelets on each node expose container CPU and memory usage at /metrics/resource. metrics-server scrapes them every 15 seconds and serves the Metrics API, metrics.k8s.io, through the kube-apiserver. Every 15 seconds the HPA controller inside kube-controller-manager reads the average usage of the Pods, divides it by the target in the HorizontalPodAutoscaler and computes desiredReplicas as the ceiling of currentReplicas times current over target, highlighted. It then writes the new replica count to the scale subresource of the Deployment, whose ReplicaSet adds or removes Pods. In our lab six Pods averaging 116 percent against a 50 percent target gave ceil(6 x 116/50) = 14, which the HPA capped at maxReplicas 6.</desc>
