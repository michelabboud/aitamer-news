<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">The HPA reads metrics, does one division, and sets replicas</text>
<rect class="boxs" x="24" y="70" width="220" height="120" rx="10"/>
<text class="t" x="134.0" y="115.0" text-anchor="middle">kubelet on each node</text>
<text class="t" x="134.0" y="135.0" text-anchor="middle">/metrics/resource</text>
<text class="t" x="134.0" y="155.0" text-anchor="middle">(CPU and memory per container)</text>
<rect class="box" x="290" y="70" width="220" height="120" rx="10"/>
<text class="t" x="400.0" y="115.0" text-anchor="middle">metrics-server</text>
<text class="t" x="400.0" y="135.0" text-anchor="middle">scrapes every 15 s</text>
<text class="t" x="400.0" y="155.0" text-anchor="middle">kube-system Deployment</text>
<rect class="boxb" x="556" y="70" width="220" height="120" rx="10"/>
<text class="t" x="666.0" y="115.0" text-anchor="middle">kube-apiserver</text>
<text class="t" x="666.0" y="135.0" text-anchor="middle">serves metrics.k8s.io</text>
<text class="t" x="666.0" y="155.0" text-anchor="middle">(Metrics API)</text>
<line class="ln" x1="290" y1="130" x2="246" y2="130" marker-end="url(#ah)"/>
<text class="ts" x="268" y="118" text-anchor="middle">scrape</text>
<line class="ln" x1="510" y1="130" x2="554" y2="130" marker-end="url(#ah)"/>
<rect class="boxb" x="556" y="250" width="220" height="96" rx="10"/>
<text class="t" x="666.0" y="283.0" text-anchor="middle">HorizontalPodAutoscaler</text>
<text class="t" x="666.0" y="303.0" text-anchor="middle">target: 50% of CPU request</text>
<text class="t" x="666.0" y="323.0" text-anchor="middle">min 1, max 6</text>
<rect class="boxc" x="290" y="236" width="220" height="124" rx="10"/>
<text class="t" x="400.0" y="270.0" text-anchor="middle">HPA controller</text>
<text class="t" x="400.0" y="292.0" text-anchor="middle">in kube-controller-manager</text>
<text class="t" x="400.0" y="314.0" text-anchor="middle">every 15 s:</text>
<text class="t" x="400.0" y="336.0" text-anchor="middle">ceil(replicas x now / target)</text>
<line class="ln" x1="666" y1="190" x2="666" y2="248" marker-end="url(#ah)"/>
<line class="ln" x1="556" y1="298" x2="512" y2="298" marker-end="url(#ah)"/>
<text class="ts" x="534" y="286" text-anchor="middle">reads</text>
<path class="ln" d="M590 192 L512 240" marker-end="url(#ah)"/>
<text class="ts" x="505" y="212" text-anchor="end">reads Metrics API</text>
<rect class="boxs" x="24" y="250" width="220" height="96" rx="10"/>
<text class="t" x="134.0" y="283.0" text-anchor="middle">Deployment burner</text>
<text class="t" x="134.0" y="303.0" text-anchor="middle">scale subresource</text>
<text class="t" x="134.0" y="323.0" text-anchor="middle">ReplicaSet adds Pods</text>
<line class="lnc" x1="290" y1="298" x2="246" y2="298" marker-end="url(#ahc)"/>
<text class="ts" x="268" y="286" text-anchor="middle">sets</text>
<rect class="panel" x="24" y="380" width="752" height="72" rx="8"/>
<text class="t" x="40" y="404" text-anchor="start">Our lab, under load: 6 Pods averaging 116% of their 100m CPU request, target 50%</text>
<text class="ts" x="40" y="428" text-anchor="start">ceil(6 x 116 / 50) = ceil(13.92) = 14, capped at maxReplicas 6 (condition ScalingLimited: TooManyReplicas).</text>
<text class="ts" x="40" y="446" text-anchor="start">The HPA only changes the replica count; the scheduler and kubelet do the rest as usual.</text>
</svg>
