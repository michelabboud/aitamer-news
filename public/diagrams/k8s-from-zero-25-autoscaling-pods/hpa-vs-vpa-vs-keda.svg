</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Three autoscalers, three different knobs</text>
<rect class="panel" x="24" y="56" width="170" height="34" rx="6"/>
<text class="t" x="34" y="78" text-anchor="start"></text>
<rect class="boxb" x="200" y="56" width="194" height="34" rx="6"/>
<text class="th" x="210" y="78" text-anchor="start">HPA</text>
<rect class="boxs" x="400" y="56" width="182" height="34" rx="6"/>
<text class="th" x="410" y="78" text-anchor="start">VPA</text>
<rect class="boxc" x="588" y="56" width="182" height="34" rx="6"/>
<text class="th" x="598" y="78" text-anchor="start">KEDA</text>
<rect class="box" x="24" y="100" width="752" height="30" rx="4"/>
<text class="t" x="34" y="120" text-anchor="start">Ships with</text>
<text class="ts" x="210" y="120" text-anchor="start">Kubernetes (built in)</text>
<text class="ts" x="410" y="120" text-anchor="start">add-on, autoscaler project</text>
<text class="ts" x="598" y="120" text-anchor="start">add-on, CNCF graduated</text>
<rect class="box" x="24" y="134" width="752" height="30" rx="4"/>
<text class="t" x="34" y="154" text-anchor="start">Changes</text>
<text class="ts" x="210" y="154" text-anchor="start">number of replicas</text>
<text class="ts" x="410" y="154" text-anchor="start">requests per Pod</text>
<text class="ts" x="598" y="154" text-anchor="start">replicas, via an HPA</text>
<rect class="box" x="24" y="168" width="752" height="30" rx="4"/>
<text class="t" x="34" y="188" text-anchor="start">Reads</text>
<text class="ts" x="210" y="188" text-anchor="start">CPU, memory, custom</text>
<text class="ts" x="410" y="188" text-anchor="start">usage history from</text>
<text class="ts" x="598" y="188" text-anchor="start">events: queues, streams,</text>
<rect class="box" x="24" y="202" width="752" height="30" rx="4"/>
<text class="t" x="34" y="222" text-anchor="start"></text>
<text class="ts" x="210" y="222" text-anchor="start">or external metrics</text>
<text class="ts" x="410" y="222" text-anchor="start">metrics-server</text>
<text class="ts" x="598" y="222" text-anchor="start">databases, cron</text>
<rect class="box" x="24" y="236" width="752" height="30" rx="4"/>
<text class="t" x="34" y="256" text-anchor="start">Range</text>
<text class="ts" x="210" y="256" text-anchor="start">minReplicas..max</text>
<text class="ts" x="410" y="256" text-anchor="start">min/max per container</text>
<text class="ts" x="598" y="256" text-anchor="start">0..max (scale to zero)</text>
<rect class="box" x="24" y="270" width="752" height="30" rx="4"/>
<text class="t" x="34" y="290" text-anchor="start">Applies by</text>
<text class="ts" x="210" y="290" text-anchor="start">scale subresource</text>
<text class="ts" x="410" y="290" text-anchor="start">Off, Initial, Recreate,</text>
<text class="ts" x="598" y="290" text-anchor="start">its operator for 0 and 1,</text>
<rect class="box" x="24" y="304" width="752" height="30" rx="4"/>
<text class="t" x="34" y="324" text-anchor="start"></text>
<text class="ts" x="210" y="324" text-anchor="start"></text>
<text class="ts" x="410" y="324" text-anchor="start">InPlaceOrRecreate</text>
<text class="ts" x="598" y="324" text-anchor="start">the HPA above 1</text>
<rect class="box" x="24" y="338" width="752" height="30" rx="4"/>
<text class="t" x="34" y="358" text-anchor="start">Tested here</text>
<text class="ts" x="210" y="358" text-anchor="start">yes, on kind</text>
<text class="ts" x="410" y="358" text-anchor="start">recommender only</text>
<text class="ts" x="598" y="358" text-anchor="start">no (docs only)</text>
<text class="tc" x="24" y="388" text-anchor="start">Do not let an HPA and a VPA both act on CPU or memory for the same workload: each would fight the other.</text>
<text class="ts" x="24" y="410" text-anchor="start">The usual pairing: HPA on CPU for replicas, VPA in Off mode for request recommendations.</text>
<text class="ts" x="24" y="430" text-anchor="start">In-place Pod resize (stable since Kubernetes v1.35) is what VPA&#x27;s InPlaceOrRecreate mode uses.</text>
</svg>
