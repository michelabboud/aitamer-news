<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">HPA, VPA and KEDA compared</title>
<desc id="d">A comparison table. The HorizontalPodAutoscaler is built into Kubernetes, changes the number of replicas, reads CPU, memory, custom or external metrics, and never goes below minReplicas, at least 1 by default. The VerticalPodAutoscaler is an add-on from the Kubernetes autoscaler project, changes the CPU and memory requests of each Pod, either only recommending, at creation, by recreating Pods, or in place, and needs metrics-server. KEDA, highlighted, is a CNCF graduated add-on that scales on events such as queue length, feeds those metrics to an HPA it manages, and can scale a workload to zero and back. A footer warns not to let an HPA and a VPA both act on CPU or memory for the same workload.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
