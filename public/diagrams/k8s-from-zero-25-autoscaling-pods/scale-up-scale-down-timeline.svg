<text class="ts" x="24" y="440" text-anchor="start">Scale-up: no window, up to 4 Pods or 100% every 15 s (defaults). Scale-down: our behavior block set a 60 s window</text>
<text class="ts" x="24" y="458" text-anchor="start">and 1 Pod per 30 s; the default window is 300 s. Times are kubectl events and a 15 s polling loop.</text>
