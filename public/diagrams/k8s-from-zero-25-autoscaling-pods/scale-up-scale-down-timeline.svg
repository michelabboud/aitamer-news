<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Scale up fast, scale down slowly: our lab timeline</title>
<desc id="d">A step chart of the replica count of the burner Deployment over about six minutes on our kind cluster, with real times in UTC. Load starts at 21:28:01 with one replica. At 21:28:21 the HPA scales to 2, and at 21:28:51 to 6, the maximum. The load Pod is deleted at 21:29:50 and finishes its 30 second grace period; CPU reads 0 percent by 21:31:09. The scale-down waits for the 60 second stabilization window, then removes one Pod every 30 seconds as the policy allows: 5 at 21:31:37, 4 at 21:32:07, 3 at 21:32:37, 2 at 21:33:07 and 1 at 21:33:37. The slow scale-down, highlighted, is on purpose.</desc>
