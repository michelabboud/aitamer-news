  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
