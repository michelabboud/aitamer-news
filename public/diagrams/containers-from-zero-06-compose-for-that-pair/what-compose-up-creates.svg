<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">What docker compose up created</title>
<desc id="d">The project is named hello, from name: hello in compose.yaml. docker compose up -d built the image hello-web, then created the network hello_default, the volume hello_hello-data, and two containers, hello-web-1 and hello-proxy-1, in that order: web before proxy because of depends_on. Names are the project name, then the service, then a number. Both containers sit on hello_default and find each other by service name. Only hello-proxy-1 publishes a port, 127.0.0.1:8080 to 80. hello-web-1 mounts the volume at /data. The network is highlighted.</desc>
