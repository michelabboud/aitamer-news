}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Project hello: names are project, service, number</text>
<rect class="panel" x="24" y="50" width="752" height="330" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">project hello</text>
<rect class="box" x="48" y="90" width="200" height="56" rx="10"/>
<text class="tb" x="148" y="114.0" text-anchor="middle">image hello-web</text>
<text class="ts" x="148" y="131.0" text-anchor="middle">built from build: .</text>
<rect class="box" x="552" y="90" width="200" height="56" rx="10"/>
