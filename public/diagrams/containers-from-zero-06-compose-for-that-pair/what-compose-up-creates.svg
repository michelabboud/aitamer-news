<text class="tb" x="652" y="131.0" text-anchor="middle">hello_hello-data</text>
<rect class="boxd" x="48" y="170" width="704" height="150" rx="10"/>
<text class="t" x="62" y="192" text-anchor="start">network hello_default</text>
<rect class="boxc" x="80" y="214" width="260" height="80" rx="10"/>
<text class="tb" x="210" y="241.5" text-anchor="middle">hello-web-1</text>
<text class="ts" x="210" y="258.5" text-anchor="middle">service web, 8000/tcp</text>
<text class="ts" x="210" y="275.5" text-anchor="middle">/data = hello_hello-data</text>
<rect class="boxs" x="460" y="214" width="260" height="80" rx="10"/>
<text class="tb" x="590" y="241.5" text-anchor="middle">hello-proxy-1</text>
<text class="ts" x="590" y="258.5" text-anchor="middle">service proxy</text>
<text class="ts" x="590" y="275.5" text-anchor="middle">127.0.0.1:8080-&gt;80/tcp</text>
<line class="lnc" x1="458" y1="254" x2="342" y2="254" marker-end="url(#ahc)"/>
<text class="ts" x="400" y="244" text-anchor="middle">web:8000</text>
<line class="ln" x1="148" y1="146" x2="148" y2="212" marker-end="url(#ah)"/>
<path class="ln" d="M 652 146 C 652 190, 330 170, 300 212" marker-end="url(#ah)"/>
<text class="tm" x="400" y="350" text-anchor="middle">started in order: hello-web-1, then hello-proxy-1 (depends_on)</text>
</svg>
