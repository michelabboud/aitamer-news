<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">What docker compose down removes</title>
<desc id="d">A table of four things the project owns and what happens to each. The containers hello-web-1 and hello-proxy-1: removed by docker compose down and by docker compose down -v. The network hello_default: removed by both. The named volume hello_hello-data, holding the visit count: kept by docker compose down, so the next up continues at visit 3; removed by docker compose down -v, which is highlighted as the step that deletes data. The image hello-web: kept by both; docker compose down --rmi local would remove it.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="360" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">down keeps the volume; down -v deletes it</text>
<rect class="panel" x="24" y="50" width="752" height="290" rx="10"/>
<text class="th" x="48" y="90" text-anchor="start">what</text>
<text class="th" x="420" y="90" text-anchor="middle">docker compose down</text>
<text class="th" x="644" y="90" text-anchor="middle">docker compose down -v</text>
<rect class="box" x="40" y="110" width="270" height="44" rx="10"/>
<text class="ts" x="52" y="136.5" text-anchor="start">containers hello-web-1, hello-proxy-1</text>
<rect class="box" x="320" y="110" width="200" height="44" rx="10"/>
<text class="tm" x="420" y="136.5" text-anchor="middle">removed</text>
<rect class="box" x="534" y="110" width="220" height="44" rx="10"/>
<text class="tm" x="644" y="136.5" text-anchor="middle">removed</text>
<rect class="box" x="40" y="164" width="270" height="44" rx="10"/>
<text class="ts" x="52" y="190.5" text-anchor="start">network hello_default</text>
<rect class="box" x="320" y="164" width="200" height="44" rx="10"/>
<text class="tm" x="420" y="190.5" text-anchor="middle">removed</text>
<rect class="box" x="534" y="164" width="220" height="44" rx="10"/>
<text class="tm" x="644" y="190.5" text-anchor="middle">removed</text>
<rect class="box" x="40" y="218" width="270" height="44" rx="10"/>
<text class="ts" x="52" y="244.5" text-anchor="start">volume hello_hello-data (the count)</text>
<rect class="box" x="320" y="218" width="200" height="44" rx="10"/>
<text class="tm" x="420" y="244.5" text-anchor="middle">kept: next up says visit 3</text>
<rect class="boxc" x="534" y="218" width="220" height="44" rx="10"/>
<text class="tb" x="644" y="244.5" text-anchor="middle">removed</text>
<rect class="box" x="40" y="272" width="270" height="44" rx="10"/>
<text class="ts" x="52" y="298.5" text-anchor="start">image hello-web</text>
<rect class="box" x="320" y="272" width="200" height="44" rx="10"/>
<text class="tm" x="420" y="298.5" text-anchor="middle">kept</text>
<rect class="box" x="534" y="272" width="220" height="44" rx="10"/>
<text class="tm" x="644" y="298.5" text-anchor="middle">kept (--rmi local removes it)</text>
</svg>
