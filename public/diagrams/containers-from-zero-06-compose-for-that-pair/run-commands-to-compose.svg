<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">From docker run commands to one Compose file</title>
<desc id="d">Left: the commands from part 5. Right: the matching lines in compose.yaml. docker network create hello-net becomes nothing at all, because Compose creates a default network for the project. docker volume create hello-data becomes the top-level volumes key with hello-data. docker run --name web --network hello-net --mount type=volume,src=hello-data,dst=/data hello-app:1.2 becomes the service web with build: . and volumes: hello-data:/data; this row is highlighted. docker run --name proxy -p 127.0.0.1:8080:80 with the proxy.conf bind mount and nginx:1.30-alpine becomes the service proxy with image, ports and volumes ./proxy.conf:/etc/nginx/conf.d/default.conf:ro. Starting web before proxy by hand becomes depends_on: web.</desc>
<style>
