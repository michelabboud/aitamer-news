</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Each docker run flag has a place in compose.yaml</text>
<rect class="panel" x="24" y="50" width="360" height="400" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">part 5: commands</text>
<rect class="panel" x="416" y="50" width="360" height="400" rx="10"/>
<text class="th" x="432" y="76" text-anchor="start">part 6: compose.yaml</text>
<rect class="box" x="40" y="92" width="328" height="56" rx="10"/>
<text class="ts" x="52" y="124.5" text-anchor="start">docker network create hello-net</text>
<rect class="box" x="432" y="92" width="328" height="56" rx="10"/>
<text class="tm" x="444" y="116.0" text-anchor="start">(nothing: Compose creates</text>
<text class="tm" x="444" y="133.0" text-anchor="start">hello_default for you)</text>
<line class="ln" x1="370" y1="120.0" x2="430" y2="120.0" marker-end="url(#ah)"/>
<rect class="box" x="40" y="162" width="328" height="56" rx="10"/>
<text class="ts" x="52" y="194.5" text-anchor="start">docker volume create hello-data</text>
<rect class="box" x="432" y="162" width="328" height="56" rx="10"/>
<text class="tm" x="444" y="186.0" text-anchor="start">volumes:</text>
<text class="tm" x="460" y="203.0" text-anchor="start">hello-data:</text>
<line class="ln" x1="370" y1="190.0" x2="430" y2="190.0" marker-end="url(#ah)"/>
<rect class="boxc" x="40" y="232" width="328" height="92" rx="10"/>
<text class="ts" x="52" y="257.0" text-anchor="start">docker run --name web</text>
<text class="ts" x="52" y="274.0" text-anchor="start">--network hello-net</text>
<text class="ts" x="52" y="291.0" text-anchor="start">--mount ...hello-data,dst=/data</text>
<text class="ts" x="52" y="308.0" text-anchor="start">hello-app:1.2</text>
<rect class="boxs" x="432" y="232" width="328" height="92" rx="10"/>
<text class="tm" x="444" y="265.5" text-anchor="start">web:</text>
<text class="tm" x="460" y="282.5" text-anchor="start">build: .</text>
<text class="tm" x="460" y="299.5" text-anchor="start">volumes: [hello-data:/data]</text>
<line class="lnc" x1="370" y1="278.0" x2="430" y2="278.0" marker-end="url(#ahc)"/>
<rect class="box" x="40" y="332" width="328" height="80" rx="10"/>
<text class="ts" x="52" y="359.5" text-anchor="start">docker run --name proxy</text>
<text class="ts" x="52" y="376.5" text-anchor="start">-p 127.0.0.1:8080:80</text>
<text class="ts" x="52" y="393.5" text-anchor="start">--mount ...proxy.conf... nginx</text>
<rect class="box" x="432" y="332" width="328" height="80" rx="10"/>
<text class="tm" x="444" y="359.5" text-anchor="start">proxy:</text>
<text class="tm" x="460" y="376.5" text-anchor="start">image: nginx:1.30-alpine</text>
<text class="tm" x="460" y="393.5" text-anchor="start">ports, volumes, depends_on: web</text>
<line class="ln" x1="370" y1="372.0" x2="430" y2="372.0" marker-end="url(#ah)"/>
</svg>
