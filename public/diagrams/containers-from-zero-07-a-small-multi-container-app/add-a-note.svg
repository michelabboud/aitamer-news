<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">What happens when you add a note</title>
<desc id="d">Four steps between curl, the web service and the database. First, POST /notes with body=First note reaches web. Second, web runs INSERT INTO notes (body) VALUES (&#x27;First note&#x27;) in PostgreSQL; this step is highlighted. Third, web answers 303 See Other with Location: /, telling the browser to load the page again. Fourth, GET / makes web run SELECT id, body FROM notes ORDER BY id and return the page with the list, or GET /notes.txt returns 1. First note as plain text.</desc>
<style>
