.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">POST, insert, redirect, GET</text>
<rect class="panel" x="24" y="50" width="752" height="330" rx="10"/>
<rect class="box" x="20" y="74" width="180" height="40" rx="10"/>
<text class="tb" x="110" y="98.5" text-anchor="middle">curl or browser</text>
<line class="boxd" x1="110" y1="114" x2="110" y2="360"/>
<rect class="box" x="310" y="74" width="180" height="40" rx="10"/>
<text class="tb" x="400" y="98.5" text-anchor="middle">web (app.py)</text>
<line class="boxd" x1="400" y1="114" x2="400" y2="360"/>
<rect class="box" x="600" y="74" width="180" height="40" rx="10"/>
<text class="tb" x="690" y="98.5" text-anchor="middle">db (PostgreSQL)</text>
<line class="boxd" x1="690" y1="114" x2="690" y2="360"/>
<line class="ln" x1="110" y1="150" x2="398" y2="150" marker-end="url(#ah)"/>
<text class="ts" x="254" y="140" text-anchor="middle">1. POST /notes  body=First note</text>
<line class="lnc" x1="400" y1="190" x2="688" y2="190" marker-end="url(#ahc)"/>
<text class="ts" x="544" y="180" text-anchor="middle">2. INSERT INTO notes (body) ...</text>
<line class="ln" x1="398" y1="236" x2="112" y2="236" marker-end="url(#ah)"/>
<text class="ts" x="254" y="226" text-anchor="middle">3. 303 See Other, Location: /</text>
<line class="ln" x1="110" y1="286" x2="398" y2="286" marker-end="url(#ah)"/>
<text class="ts" x="254" y="276" text-anchor="middle">4. GET /  or  GET /notes.txt</text>
<line class="ln" x1="400" y1="306" x2="688" y2="306" marker-end="url(#ah)"/>
<text class="ts" x="544" y="298" text-anchor="middle">SELECT id, body FROM notes</text>
<line class="ln" x1="398" y1="340" x2="112" y2="340" marker-end="url(#ah)"/>
<text class="ts" x="254" y="332" text-anchor="middle">200: the list, 1. First note</text>
</svg>
