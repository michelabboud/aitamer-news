<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">The notes vanish after down and up</title>
<desc id="d">Three moments. After the first docker compose up, notes-db-1 stores the two notes in an anonymous volume named 0b0882cc..., created because the image declares /var/lib/postgresql as a volume. docker compose down removes the container; the anonymous volume stays, but nothing points at it any more. The next docker compose up creates a new notes-db-1 with a new anonymous volume, e75b303e..., and PostgreSQL initialises an empty database, so curl says no notes yet. The orphaned volume, highlighted, still holds the old notes and takes disk space until you remove it.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="360" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Anonymous volumes are not reattached</text>
<rect class="panel" x="24" y="50" width="240" height="226" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">first up</text>
<rect class="box" x="44" y="96" width="200" height="52" rx="10"/>
<text class="tb" x="144" y="126.5" text-anchor="middle">notes-db-1</text>
<line class="ln" x1="144" y1="148" x2="144" y2="190" marker-end="url(#ah)"/>
<rect class="box" x="44" y="192" width="200" height="64" rx="10"/>
<text class="tb" x="144" y="220.0" text-anchor="middle">volume 0b0882cc...</text>
<text class="ts" x="144" y="237.0" text-anchor="middle">2 notes</text>
<rect class="panel" x="280" y="50" width="240" height="226" rx="10"/>
<text class="th" x="296" y="76" text-anchor="start">after down</text>
<rect class="boxd" x="300" y="96" width="200" height="52" rx="10"/>
<text class="ts" x="400" y="126.5" text-anchor="middle">container removed</text>
<rect class="boxc" x="300" y="192" width="200" height="64" rx="10"/>
<text class="tb" x="400" y="220.0" text-anchor="middle">volume 0b0882cc...</text>
<text class="ts" x="400" y="237.0" text-anchor="middle">2 notes, orphaned</text>
<rect class="panel" x="536" y="50" width="240" height="226" rx="10"/>
<text class="th" x="552" y="76" text-anchor="start">next up</text>
<rect class="box" x="556" y="96" width="200" height="52" rx="10"/>
<text class="tb" x="656" y="126.5" text-anchor="middle">new notes-db-1</text>
<line class="ln" x1="656" y1="148" x2="656" y2="190" marker-end="url(#ah)"/>
<rect class="box" x="556" y="192" width="200" height="64" rx="10"/>
<text class="tb" x="656" y="220.0" text-anchor="middle">volume e75b303e...</text>
<text class="ts" x="656" y="237.0" text-anchor="middle">empty: no notes yet</text>
<text class="ts" x="400" y="308" text-anchor="middle">docker compose down leaves anonymous volumes behind, and the next up does not mount them again.</text>
<text class="ts" x="400" y="330" text-anchor="middle">Part 8 gives the database a named volume; step 7 removes the orphan by name.</text>
</svg>
