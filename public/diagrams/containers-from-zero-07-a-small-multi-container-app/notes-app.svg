<text class="tb" x="369" y="143.0" text-anchor="middle">web</text>
<text class="ts" x="369" y="160.0" text-anchor="middle">python app.py</text>
<text class="ts" x="369" y="177.0" text-anchor="middle">psycopg</text>
<text class="ts" x="369" y="194.0" text-anchor="middle">8000, published on 8080</text>
<rect class="boxc" x="530" y="112" width="206" height="104" rx="10"/>
<text class="tb" x="633" y="143.0" text-anchor="middle">db</text>
<text class="ts" x="633" y="160.0" text-anchor="middle">postgres:18-alpine</text>
<text class="ts" x="633" y="177.0" text-anchor="middle">user and database: notes</text>
<text class="ts" x="633" y="194.0" text-anchor="middle">5432, not published</text>
<line class="ln" x1="214" y1="123" x2="262" y2="140" marker-end="url(#ah)"/>
<line class="lnc" x1="476" y1="164" x2="528" y2="164" marker-end="url(#ahc)"/>
<text class="ts" x="502" y="154" text-anchor="middle">db:5432</text>
<rect class="boxd" x="530" y="248" width="206" height="56" rx="10"/>
<text class="tb" x="633" y="272.0" text-anchor="middle">anonymous volume</text>
<text class="ts" x="633" y="289.0" text-anchor="middle">/var/lib/postgresql</text>
<line class="ln" x1="633" y1="216" x2="633" y2="246" marker-end="url(#ah)"/>
<text class="ts" x="369" y="250" text-anchor="middle">DATABASE_URL=</text>
<text class="ts" x="369" y="268" text-anchor="middle">postgresql://notes:...@db:5432/notes</text>
<text class="tm" x="400" y="362" text-anchor="middle">Only web is published. The database answers only containers on notes_default.</text>
</svg>
