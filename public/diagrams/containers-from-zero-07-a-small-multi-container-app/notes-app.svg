<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">The notes app: a web service and a database</title>
<desc id="d">Your machine runs curl or a browser against 127.0.0.1:8080, the only published port. It leads to the container notes-web-1, service web, running python app.py with the psycopg driver, built from the notes folder. On the network notes_default, web connects to db:5432 using DATABASE_URL postgresql://notes:...@db:5432/notes; this connection is highlighted. The container notes-db-1, service db, runs postgres:18-alpine, created its user and database from POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, and does not publish 5432. Its data lives in /var/lib/postgresql, which the image declares as a volume, so Docker gives it an anonymous volume with a random name.</desc>
