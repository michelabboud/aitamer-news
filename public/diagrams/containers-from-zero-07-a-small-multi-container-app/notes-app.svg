<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Two services, one network, one published port</text>
<rect class="panel" x="24" y="50" width="752" height="350" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Docker host</text>
<rect class="box" x="44" y="92" width="170" height="62" rx="10"/>
<text class="tm" x="129" y="119.0" text-anchor="middle">curl or browser</text>
<text class="tm" x="129" y="136.0" text-anchor="middle">127.0.0.1:8080</text>
<rect class="boxd" x="244" y="80" width="512" height="240" rx="10"/>
