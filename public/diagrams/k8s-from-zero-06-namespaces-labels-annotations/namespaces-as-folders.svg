<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Namespaces are folders for names</title>
<desc id="d">One cluster holds several namespaces drawn like folders: the four that every cluster starts with, default, kube-system, kube-public and kube-node-lease, plus local-path-storage from kind and our own k8s-from-zero, team-a and team-b. team-a and team-b each hold a Pod named web, highlighted, which is allowed because a name only has to be unique inside its namespace. Outside every folder sit cluster-scoped objects such as Nodes, PersistentVolumes, StorageClasses and the Namespace objects themselves.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Names are unique per namespace, not per cluster</text>
<rect class="box" x="24" y="50" width="752" height="404" rx="12"/>
<text class="t" x="40" y="76" text-anchor="start">One cluster</text>
<rect class="box" x="40" y="92" width="228" height="68" rx="8"/>
<rect class="box" x="40" y="84" width="80" height="12" rx="3"/>
<text class="tm" x="52" y="118" text-anchor="start">default</text>
<text class="ts" x="52" y="142" text-anchor="start">used when you name no namespace</text>
<rect class="boxb" x="284" y="92" width="228" height="68" rx="8"/>
<rect class="boxb" x="284" y="84" width="80" height="12" rx="3"/>
<text class="tm" x="296" y="118" text-anchor="start">kube-system</text>
<text class="ts" x="296" y="142" text-anchor="start">control plane, CoreDNS, kube-proxy</text>
<rect class="boxb" x="528" y="92" width="228" height="68" rx="8"/>
<rect class="boxb" x="528" y="84" width="80" height="12" rx="3"/>
<text class="tm" x="540" y="118" text-anchor="start">kube-public</text>
<text class="ts" x="540" y="142" text-anchor="start">readable by all, by convention</text>
<rect class="boxb" x="40" y="176" width="228" height="68" rx="8"/>
<rect class="boxb" x="40" y="168" width="80" height="12" rx="3"/>
<text class="tm" x="52" y="202" text-anchor="start">kube-node-lease</text>
<text class="ts" x="52" y="226" text-anchor="start">one Lease per node (heartbeats)</text>
<rect class="box" x="284" y="176" width="228" height="68" rx="8"/>
<rect class="box" x="284" y="168" width="80" height="12" rx="3"/>
<text class="tm" x="296" y="202" text-anchor="start">k8s-from-zero</text>
<text class="ts" x="296" y="226" text-anchor="start">this series</text>
<rect class="boxd" x="528" y="176" width="228" height="68" rx="8"/>
<rect class="boxd" x="528" y="168" width="80" height="12" rx="3"/>
<text class="tm" x="540" y="202" text-anchor="start">local-path-storage</text>
<text class="ts" x="540" y="226" text-anchor="start">added by kind</text>
<rect class="box" x="40" y="276" width="228" height="86" rx="8"/>
<rect class="box" x="40" y="268" width="80" height="12" rx="3"/>
<text class="tm" x="52" y="300" text-anchor="start">team-a</text>
<rect class="boxc" x="52" y="312" width="204" height="36" rx="6"/>
<text class="tm" x="64" y="335" text-anchor="start">Pod web</text>
<text class="tc" x="150" y="335" text-anchor="start">same name, OK</text>
<rect class="box" x="284" y="276" width="228" height="86" rx="8"/>
<rect class="box" x="284" y="268" width="80" height="12" rx="3"/>
<text class="tm" x="296" y="300" text-anchor="start">team-b</text>
<rect class="boxc" x="296" y="312" width="204" height="36" rx="6"/>
<text class="tm" x="308" y="335" text-anchor="start">Pod web</text>
<text class="tc" x="394" y="335" text-anchor="start">same name, OK</text>
<rect class="panel" x="528" y="268" width="232" height="170" rx="8"/>
<text class="t" x="544" y="292" text-anchor="start">Not in any namespace</text>
<text class="tm" x="544" y="318" text-anchor="start">Node</text>
<text class="tm" x="544" y="340" text-anchor="start">PersistentVolume</text>
<text class="tm" x="544" y="362" text-anchor="start">StorageClass</text>
<text class="tm" x="544" y="384" text-anchor="start">Namespace</text>
<text class="tm" x="544" y="406" text-anchor="start">ClusterRole</text>
<text class="ts" x="40" y="392" text-anchor="start">Identity: API group, kind, namespace and name.</text>
<text class="ts" x="40" y="412" text-anchor="start">team-a/web and team-b/web are two different Pods.</text>
<text class="ts" x="40" y="432" text-anchor="start">Deleting a namespace deletes everything inside it.</text>
</svg>
