<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
<title id="t">The recommended app.kubernetes.io labels on the shop example</title>
<desc id="d">The six recommended labels share the prefix app.kubernetes.io. part-of, highlighted, names the larger application, shop, and joins two Pods: shop-web with name nginx and component frontend, and shop-cache with name busybox and component cache. instance gives each installation a unique name, version records the application version, and managed-by records the tool that manages the object, here kubectl. One selector on part-of=shop finds both Pods.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Six shared labels describe what an object is part of</text>
<rect class="boxc" x="24" y="52" width="752" height="58" rx="10"/>
<text class="tm" x="40" y="76" text-anchor="start">app.kubernetes.io/part-of: shop</text>
<text class="ts" x="40" y="98" text-anchor="start">the higher-level application; one selector finds every piece of it</text>
<line class="lnc" x1="200" y1="110" x2="200" y2="146" marker-end="url(#ahc)"/>
<line class="lnc" x1="600" y1="110" x2="600" y2="146" marker-end="url(#ahc)"/>
<rect class="boxs" x="24" y="148" width="352" height="200" rx="10"/>
<text class="ts" x="40" y="174" text-anchor="start">Pod</text>
<text class="tm" x="72" y="174" text-anchor="start">shop-web</text>
<text class="tm" x="40" y="204" text-anchor="start">app.kubernetes.io/name</text>
<text class="tm" x="270" y="204" text-anchor="start">nginx</text>
<text class="tm" x="40" y="232" text-anchor="start">app.kubernetes.io/instance</text>
<text class="tm" x="270" y="232" text-anchor="start">shop-web</text>
<text class="tm" x="40" y="260" text-anchor="start">app.kubernetes.io/version</text>
<text class="tm" x="270" y="260" text-anchor="start">"1.29"</text>
<text class="tm" x="40" y="288" text-anchor="start">app.kubernetes.io/component</text>
<text class="tm" x="270" y="288" text-anchor="start">frontend</text>
<text class="tm" x="40" y="316" text-anchor="start">app.kubernetes.io/managed-by</text>
<text class="tm" x="270" y="316" text-anchor="start">kubectl</text>
<rect class="boxs" x="424" y="148" width="352" height="200" rx="10"/>
<text class="ts" x="440" y="174" text-anchor="start">Pod</text>
<text class="tm" x="472" y="174" text-anchor="start">shop-cache</text>
<text class="tm" x="440" y="204" text-anchor="start">app.kubernetes.io/name</text>
<text class="tm" x="670" y="204" text-anchor="start">busybox</text>
<text class="tm" x="440" y="232" text-anchor="start">app.kubernetes.io/instance</text>
<text class="tm" x="670" y="232" text-anchor="start">shop-cache</text>
<text class="tm" x="440" y="260" text-anchor="start">app.kubernetes.io/version</text>
<text class="tm" x="670" y="260" text-anchor="start">(not set)</text>
<text class="tm" x="440" y="288" text-anchor="start">app.kubernetes.io/component</text>
<text class="tm" x="670" y="288" text-anchor="start">cache</text>
<text class="tm" x="440" y="316" text-anchor="start">app.kubernetes.io/managed-by</text>
<text class="tm" x="670" y="316" text-anchor="start">kubectl</text>
<rect class="panel" x="24" y="366" width="752" height="98" rx="10"/>
<text class="t" x="40" y="390" text-anchor="start">What each one answers</text>
<text class="tm" x="40" y="414" text-anchor="start">name</text>
<text class="ts" x="140" y="414" text-anchor="start">which application is this?</text>
<text class="tm" x="410" y="414" text-anchor="start">instance</text>
<text class="ts" x="510" y="414" text-anchor="start">which installation of it?</text>
<text class="tm" x="40" y="434" text-anchor="start">version</text>
<text class="ts" x="140" y="434" text-anchor="start">which version is running?</text>
<text class="tm" x="410" y="434" text-anchor="start">component</text>
<text class="ts" x="510" y="434" text-anchor="start">which part of the architecture?</text>
<text class="tm" x="40" y="454" text-anchor="start">part-of</text>
<text class="ts" x="140" y="454" text-anchor="start">which bigger app does it belong to?</text>
<text class="tm" x="410" y="454" text-anchor="start">managed-by</text>
<text class="ts" x="510" y="454" text-anchor="start">which tool owns it?</text>
</svg>
