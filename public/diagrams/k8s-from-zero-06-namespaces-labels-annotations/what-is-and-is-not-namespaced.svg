<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">What is and is not namespaced</title>
<desc id="d">Two columns list resources as kubectl api-resources reported them on our kind cluster. Namespaced resources include Pods, Services, Deployments, ConfigMaps, Secrets, ServiceAccounts, Roles, Jobs, Ingresses, Events, Leases and PersistentVolumeClaims. Cluster-scoped resources include Nodes, Namespaces, PersistentVolumes, StorageClasses, ClusterRoles, IngressClasses, PriorityClasses and CustomResourceDefinitions. The pair PersistentVolumeClaim and PersistentVolume is highlighted, because the claim lives in a namespace while the volume it binds to does not.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">kubectl api-resources --namespaced=true / false</text>
<rect class="boxs" x="24" y="52" width="368" height="370" rx="12"/>
<text class="t" x="40" y="80" text-anchor="start">Namespaced (NAMESPACED true)</text>
<text class="ts" x="40" y="100" text-anchor="start">-n changes which ones you see</text>
<rect class="box" x="408" y="52" width="368" height="370" rx="12"/>
<text class="t" x="424" y="80" text-anchor="start">Cluster-scoped (NAMESPACED false)</text>
<text class="ts" x="424" y="100" text-anchor="start">-n is ignored for these</text>
<text class="tm" x="40" y="132" text-anchor="start">pods</text>
<text class="tm" x="40" y="158" text-anchor="start">services</text>
<text class="tm" x="40" y="184" text-anchor="start">deployments</text>
<text class="tm" x="40" y="210" text-anchor="start">configmaps</text>
<text class="tm" x="40" y="236" text-anchor="start">secrets</text>
<text class="tm" x="40" y="262" text-anchor="start">serviceaccounts</text>
<text class="tm" x="210" y="132" text-anchor="start">roles</text>
<text class="tm" x="210" y="158" text-anchor="start">jobs</text>
<text class="tm" x="210" y="184" text-anchor="start">ingresses</text>
<text class="tm" x="210" y="210" text-anchor="start">events</text>
<text class="tm" x="210" y="236" text-anchor="start">leases</text>
<text class="tm" x="424" y="132" text-anchor="start">nodes</text>
<text class="tm" x="424" y="158" text-anchor="start">namespaces</text>
<text class="tm" x="424" y="184" text-anchor="start">storageclasses</text>
<text class="tm" x="424" y="210" text-anchor="start">clusterroles</text>
<text class="tm" x="424" y="236" text-anchor="start">ingressclasses</text>
<text class="tm" x="424" y="262" text-anchor="start">priorityclasses</text>
<text class="tm" x="424" y="288" text-anchor="start">customresourcedefinitions</text>
<rect class="boxc" x="40" y="330" width="336" height="74" rx="8"/>
<text class="tm" x="56" y="356" text-anchor="start">persistentvolumeclaims</text>
<text class="tc" x="56" y="380" text-anchor="start">a claim lives in a namespace</text>
<rect class="boxc" x="424" y="330" width="336" height="74" rx="8"/>
<text class="tm" x="440" y="356" text-anchor="start">persistentvolumes</text>
<text class="tc" x="440" y="380" text-anchor="start">the disk it binds to does not</text>
<line class="lnc" x1="376" y1="367" x2="422" y2="367" marker-end="url(#ahc)"/>
</svg>
