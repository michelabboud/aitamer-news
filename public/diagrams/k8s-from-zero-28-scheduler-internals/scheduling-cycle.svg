<text class="tm" x="38" y="250" text-anchor="start">skips this path</text>
<text class="ts" x="38" y="274" text-anchor="start">spec.nodeName set by</text>
<text class="ts" x="38" y="292" text-anchor="start">hand: straight to the</text>
<text class="ts" x="38" y="310" text-anchor="start">kubelet</text>
<text class="ts" x="38" y="342" text-anchor="start">unknown schedulerName:</text>
<text class="ts" x="38" y="360" text-anchor="start">nobody picks it up,</text>
