<rect class="box" x="266" y="96" width="112" height="40" rx="8"/>
<text class="tm" x="322" y="121" text-anchor="middle">PreFilter</text>
<line class="ln" x1="378" y1="116" x2="390" y2="116" marker-end="url(#ah)"/>
<rect class="box" x="392" y="96" width="112" height="40" rx="8"/>
<text class="tm" x="448" y="121" text-anchor="middle">Filter</text>
<line class="ln" x1="504" y1="116" x2="516" y2="116" marker-end="url(#ah)"/>
<rect class="boxd" x="518" y="96" width="112" height="40" rx="8"/>
<text class="tm" x="574" y="121" text-anchor="middle">PostFilter</text>
<line class="ln" x1="630" y1="116" x2="642" y2="116" marker-end="url(#ah)"/>
<rect class="box" x="644" y="96" width="112" height="40" rx="8"/>
<text class="tm" x="700" y="121" text-anchor="middle">PreScore</text>
<rect class="boxc" x="266" y="152" width="112" height="40" rx="8"/>
<text class="tc" x="322" y="177" text-anchor="middle">Score</text>
<line class="ln" x1="378" y1="172" x2="390" y2="172" marker-end="url(#ah)"/>
<rect class="box" x="392" y="152" width="112" height="40" rx="8"/>
<text class="tm" x="448" y="177" text-anchor="middle">Normalize</text>
<line class="ln" x1="504" y1="172" x2="516" y2="172" marker-end="url(#ah)"/>
<rect class="box" x="518" y="152" width="112" height="40" rx="8"/>
<text class="tm" x="574" y="177" text-anchor="middle">Reserve</text>
<line class="ln" x1="630" y1="172" x2="642" y2="172" marker-end="url(#ah)"/>
<rect class="box" x="644" y="152" width="112" height="40" rx="8"/>
<text class="tm" x="700" y="177" text-anchor="middle">Permit</text>
<path class="ln" d="M 700 136 L 700 144 L 322 144 L 322 150" marker-end="url(#ah)"/>
<text class="ts" x="266" y="222" text-anchor="start">PostFilter runs only if no node passed Filter: DefaultPreemption</text>
<line class="ln" x1="514" y1="206" x2="514" y2="250" marker-end="url(#ah)"/>
<rect class="panel" x="252" y="252" width="524" height="80" rx="10"/>
<text class="tm" x="266" y="276" text-anchor="start">binding cycle: may run for several Pods at once</text>
<rect class="box" x="266" y="288" width="156" height="32" rx="8"/>
<text class="tm" x="344" y="309" text-anchor="middle">PreBind</text>
<line class="ln" x1="422" y1="304" x2="434" y2="304" marker-end="url(#ah)"/>
<rect class="box" x="436" y="288" width="156" height="32" rx="8"/>
<text class="tm" x="514" y="309" text-anchor="middle">Bind (DefaultBinder)</text>
<line class="ln" x1="592" y1="304" x2="604" y2="304" marker-end="url(#ah)"/>
<rect class="box" x="606" y="288" width="156" height="32" rx="8"/>
<text class="tm" x="684" y="309" text-anchor="middle">PostBind</text>
<line class="ln" x1="514" y1="332" x2="514" y2="356" marker-end="url(#ah)"/>
<rect class="boxs" x="252" y="358" width="250" height="52" rx="10"/>
<text class="tm" x="266" y="382" text-anchor="start">API server</text>
<text class="ts" x="266" y="400" text-anchor="start">sets spec.nodeName</text>
<line class="ln" x1="502" y1="384" x2="524" y2="384" marker-end="url(#ah)"/>
<rect class="boxs" x="526" y="358" width="250" height="52" rx="10"/>
<text class="tm" x="540" y="382" text-anchor="start">kubelet on that node</text>
