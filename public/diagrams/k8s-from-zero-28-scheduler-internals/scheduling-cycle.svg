<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">One Pod through kube-scheduler: queue, scheduling cycle, binding cycle</title>
<desc id="d">A new Pod with no node enters the scheduling queue, sorted by priority with PrioritySort; failed Pods wait in a backoff queue or an unschedulable list until QueueingHints say a cluster change may help. The scheduling cycle runs for one Pod at a time: PreFilter and Filter drop nodes that cannot run the Pod, PostFilter runs only when no node passed and is where DefaultPreemption lives, PreScore, Score and NormalizeScore rank the rest, highlighted, then Reserve and Permit hold the choice. The binding cycle, which may run concurrently for several Pods, runs PreBind, Bind and PostBind; DefaultBinder writes spec.nodeName through the API server, and the kubelet on that node starts the Pod.</desc>
