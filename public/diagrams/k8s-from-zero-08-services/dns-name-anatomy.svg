<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">The parts of a Service DNS name</title>
<desc id="d">The full name web.k8s-from-zero.svc.cluster.local is split into its parts: the Service name web, the namespace k8s-from-zero, which is highlighted, the fixed word svc, and the cluster domain cluster.local. Below, the search list from a Pod resolv.conf shows why short names work: from the same namespace, web is enough; from another namespace, use web.k8s-from-zero; the full name works from anywhere in the cluster. ndots 5 means names with fewer than five dots are tried with each search suffix first.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Anatomy of web.k8s-from-zero.svc.cluster.local</text>
<rect class="boxb" x="24" y="56" width="120" height="70" rx="10"/>
<text class="tm" x="36" y="86" text-anchor="start">web</text>
<text class="ts" x="36" y="110" text-anchor="start">Service name</text>
<rect class="boxc" x="156" y="56" width="190" height="70" rx="10"/>
<text class="tm" x="168" y="86" text-anchor="start">k8s-from-zero</text>
<text class="ts" x="168" y="110" text-anchor="start">namespace</text>
<rect class="boxb" x="358" y="56" width="150" height="70" rx="10"/>
<text class="tm" x="370" y="86" text-anchor="start">svc</text>
<text class="ts" x="370" y="110" text-anchor="start">Services live here</text>
<rect class="boxb" x="520" y="56" width="256" height="70" rx="10"/>
<text class="tm" x="532" y="86" text-anchor="start">cluster.local</text>
<text class="ts" x="532" y="110" text-anchor="start">cluster domain</text>
<text class="th" x="146" y="92" text-anchor="start">.</text>
<text class="th" x="348" y="92" text-anchor="start">.</text>
<text class="th" x="510" y="92" text-anchor="start">.</text>
<rect class="panel" x="24" y="144" width="752" height="110" rx="10"/>
<text class="t" x="40" y="168" text-anchor="start">/etc/resolv.conf in a Pod in k8s-from-zero</text>
<text class="tm" x="40" y="192" text-anchor="start">search k8s-from-zero.svc.cluster.local svc.cluster.local cluster.local</text>
<text class="tm" x="40" y="212" text-anchor="start">nameserver 10.96.0.10</text>
<text class="tm" x="40" y="232" text-anchor="start">options ndots:5</text>
<rect class="box" x="24" y="270" width="752" height="130" rx="10"/>
<text class="t" x="40" y="294" text-anchor="start">Names that reach the Service (we tested all three from k8s-from-zero)</text>
<text class="tm" x="40" y="322" text-anchor="start">web</text>
<text class="ts" x="420" y="322" text-anchor="start">from the same namespace</text>
<text class="tm" x="40" y="348" text-anchor="start">web.k8s-from-zero</text>
<text class="ts" x="420" y="348" text-anchor="start">from any namespace</text>
<text class="tm" x="40" y="374" text-anchor="start">web.k8s-from-zero.svc.cluster.local</text>
<text class="ts" x="420" y="374" text-anchor="start">from anywhere, no search needed</text>
</svg>
