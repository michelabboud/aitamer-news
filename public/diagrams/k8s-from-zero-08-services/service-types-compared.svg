<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">The four Service types, and what each added on our kind cluster</title>
<desc id="d">Four columns compare Service types. ClusterIP gives a stable virtual IP and DNS name reachable only inside the cluster; ours was 10.96.120.171 on port 80. NodePort adds a port from 30000 to 32767 on every node; ours was 30080, reached with curl from the host. LoadBalancer adds an external load balancer from a cloud provider; on kind with no provider its EXTERNAL-IP stayed pending. ExternalName has no IP at all and returns a DNS CNAME, here to kubernetes.io. A highlighted band says that ClusterIP, NodePort and LoadBalancer each build on the one before. A footer notes that a headless Service sets clusterIP None and returns Pod IPs.</desc>
