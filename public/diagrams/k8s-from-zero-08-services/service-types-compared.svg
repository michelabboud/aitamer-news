<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Service types: who can reach it, and how</text>
<rect class="boxb" x="24" y="52" width="178" height="250" rx="10"/>
<text class="tm" x="36" y="78" text-anchor="start">ClusterIP</text>
<text class="ts" x="36" y="100" text-anchor="start">default type</text>
<text class="ts" x="36" y="140" text-anchor="start">reachable by</text>
<text class="ts" x="36" y="160" text-anchor="start">inside the cluster only</text>
<text class="ts" x="36" y="200" text-anchor="start">on our kind cluster</text>
<text class="tm" x="36" y="220" text-anchor="start">10.96.120.171:80</text>
<text class="ts" x="36" y="244" text-anchor="start">web.k8s-from-zero</text>
<rect class="boxb" x="214" y="52" width="178" height="250" rx="10"/>
<text class="tm" x="226" y="78" text-anchor="start">NodePort</text>
<text class="ts" x="226" y="100" text-anchor="start">ClusterIP + node port</text>
<text class="ts" x="226" y="140" text-anchor="start">reachable by</text>
<text class="ts" x="226" y="160" text-anchor="start">clients that reach a node</text>
<text class="ts" x="226" y="200" text-anchor="start">on our kind cluster</text>
<text class="tm" x="226" y="220" text-anchor="start">node IP:30080</text>
<text class="ts" x="226" y="244" text-anchor="start">range 30000-32767</text>
<rect class="boxb" x="404" y="52" width="178" height="250" rx="10"/>
<text class="tm" x="416" y="78" text-anchor="start">LoadBalancer</text>
<text class="ts" x="416" y="100" text-anchor="start">NodePort + cloud LB</text>
<text class="ts" x="416" y="140" text-anchor="start">reachable by</text>
<text class="ts" x="416" y="160" text-anchor="start">clients outside, via the LB</text>
<text class="ts" x="416" y="200" text-anchor="start">on our kind cluster</text>
<text class="tm" x="416" y="220" text-anchor="start">EXTERNAL-IP &lt;pending&gt;</text>
<text class="ts" x="416" y="244" text-anchor="start">needs a cloud provider</text>
<rect class="boxd" x="594" y="52" width="178" height="250" rx="10"/>
<text class="tm" x="606" y="78" text-anchor="start">ExternalName</text>
<text class="ts" x="606" y="100" text-anchor="start">no IP, no proxy</text>
<text class="ts" x="606" y="140" text-anchor="start">reachable by</text>
<text class="ts" x="606" y="160" text-anchor="start">DNS lookups only</text>
<text class="ts" x="606" y="200" text-anchor="start">on our kind cluster</text>
<text class="tm" x="606" y="220" text-anchor="start">CNAME kubernetes.io</text>
<text class="ts" x="606" y="244" text-anchor="start">points outside</text>
<rect class="boxc" x="24" y="316" width="560" height="50" rx="10"/>
<text class="tc" x="40" y="346" text-anchor="start">Each of these three adds a layer on top of the one to its left</text>
<line class="lnc" x1="120" y1="316" x2="120" y2="304" marker-end="url(#ahc)"/>
<line class="lnc" x1="310" y1="316" x2="310" y2="304" marker-end="url(#ahc)"/>
<line class="lnc" x1="500" y1="316" x2="500" y2="304" marker-end="url(#ahc)"/>
<rect class="panel" x="24" y="382" width="752" height="74" rx="10"/>
<text class="tm" x="40" y="406" text-anchor="start">Headless: clusterIP: None</text>
<text class="ts" x="40" y="428" text-anchor="start">No virtual IP and no load balancing; DNS returns the ready Pod IPs directly.</text>
<text class="ts" x="40" y="446" text-anchor="start">Used by StatefulSets (part 14) and clients that pick their own backend.</text>
</svg>
