<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">How a request to a Service reaches a Pod</title>
<desc id="d">A client Pod asks CoreDNS for the name web and gets the ClusterIP 10.96.120.171. It connects to port 80. kube-proxy on every node has programmed rules that pick one of the ready endpoints and forward to it on port 8080. The endpoints come from an EndpointSlice that the EndpointSlice controller keeps up to date by watching for Pods that match the Service selector app.kubernetes.io/name=web, which is highlighted. When Pods are replaced or scaled, the slice changes and the ClusterIP stays the same.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Service to Pods: DNS, virtual IP, EndpointSlice</text>
<rect class="boxs" x="24" y="60" width="150" height="60" rx="10"/>
<text class="tm" x="40" y="86" text-anchor="start">Pod client</text>
<text class="ts" x="40" y="106" text-anchor="start">wget http://web</text>
<rect class="boxb" x="234" y="60" width="170" height="60" rx="10"/>
<text class="tm" x="250" y="86" text-anchor="start">CoreDNS</text>
<text class="ts" x="250" y="106" text-anchor="start">web -&gt; 10.96.120.171</text>
<line class="ln" x1="174" y1="84" x2="232" y2="84" marker-end="url(#ah)"/>
<line class="ln" x1="232" y1="100" x2="176" y2="100" marker-end="url(#ah)"/>
<rect class="boxb" x="464" y="60" width="312" height="60" rx="10"/>
<text class="tm" x="480" y="86" text-anchor="start">Service web (ClusterIP)</text>
<text class="ts" x="480" y="106" text-anchor="start">10.96.120.171 port 80 -&gt; targetPort http</text>
<line class="lnb" x1="700" y1="120" x2="700" y2="190" marker-end="url(#ah)"/>
<text class="ts" x="708" y="160" text-anchor="start">programs</text>
<line class="ln" x1="100" y1="120" x2="100" y2="170"/>
<line class="ln" x1="100" y1="170" x2="480" y2="170"/>
<line class="ln" x1="480" y1="170" x2="480" y2="190" marker-end="url(#ah)"/>
<text class="ts" x="140" y="162" text-anchor="start">connect 10.96.120.171:80</text>
<rect class="box" x="380" y="192" width="396" height="60" rx="10"/>
<text class="t" x="396" y="218" text-anchor="start">kube-proxy rules on every node</text>
<text class="ts" x="396" y="240" text-anchor="start">pick one ready endpoint per connection</text>
<rect class="boxs" x="380" y="300" width="128" height="56" rx="8"/>
<text class="ts" x="387" y="322" text-anchor="start">Pod web</text>
<text class="tm" x="387" y="342" text-anchor="start">10.244.0.15:8080</text>
<line class="ln" x1="578" y1="252" x2="443" y2="298" marker-end="url(#ah)"/>
<rect class="boxs" x="514" y="300" width="128" height="56" rx="8"/>
<text class="ts" x="521" y="322" text-anchor="start">Pod web</text>
<text class="tm" x="521" y="342" text-anchor="start">10.244.0.18:8080</text>
<line class="ln" x1="578" y1="252" x2="577" y2="298" marker-end="url(#ah)"/>
<rect class="boxs" x="648" y="300" width="128" height="56" rx="8"/>
<text class="ts" x="655" y="322" text-anchor="start">Pod web</text>
<text class="tm" x="655" y="342" text-anchor="start">10.244.0.19:8080</text>
<line class="ln" x1="578" y1="252" x2="711" y2="298" marker-end="url(#ah)"/>
<rect class="boxb" x="24" y="192" width="330" height="164" rx="10"/>
<text class="tm" x="40" y="218" text-anchor="start">EndpointSlice web-q5pmn</text>
<text class="tm" x="40" y="240" text-anchor="start">endpoints: 10.244.0.15, .18, .19</text>
<text class="ts" x="40" y="262" text-anchor="start">ready=true for each</text>
<text class="ts" x="40" y="292" text-anchor="start">kept current by the</text>
<text class="ts" x="40" y="310" text-anchor="start">EndpointSlice controller</text>
<line class="ln" x1="354" y1="270" x2="378" y2="222" marker-end="url(#ah)"/>
<rect class="boxc" x="24" y="374" width="752" height="80" rx="10"/>
<text class="tm" x="40" y="398" text-anchor="start">selector: app.kubernetes.io/name=web</text>
<text class="ts" x="40" y="420" text-anchor="start">The only link between a Service and its Pods. Pods come and go; the slice follows the label.</text>
<text class="ts" x="40" y="440" text-anchor="start">A selector that matches nothing gives an empty slice and connection refused.</text>
</svg>
