<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d">
<title id="t">The desired-state loop</title>
<desc id="d">On the left, you declare the desired state, for example replicas: 3, and the API server stores it. On the right, a controller runs a loop that never ends: it observes what is really running (two pods, because one crashed), compares that with the desired state (want 3, have 2), and acts by asking for one more pod. Then it observes again. The comparison step is highlighted because it is the heart of Kubernetes.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="410" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Desired state: you say what, a controller works out how</text>
<rect class="boxb" x="24" y="70" width="200" height="80" rx="10"/>
<text class="t" x="124.0" y="106.5" text-anchor="middle">You declare</text>
<text class="t" x="124.0" y="123.5" text-anchor="middle">replicas: 3</text>
<rect class="boxb" x="24" y="230" width="200" height="80" rx="10"/>
<text class="t" x="124.0" y="266.5" text-anchor="middle">The API server</text>
<text class="t" x="124.0" y="283.5" text-anchor="middle">stores the desired state</text>
<line class="ln" x1="124" y1="150" x2="124" y2="228" marker-end="url(#ah)"/>
<text class="tm" x="134" y="195" text-anchor="start">kubectl apply</text>
<rect class="boxs" x="330" y="70" width="200" height="80" rx="10"/>
<text class="t" x="430.0" y="106.5" text-anchor="middle">1. Observe</text>
<text class="t" x="430.0" y="123.5" text-anchor="middle">2 pods running</text>
<rect class="boxc" x="570" y="150" width="200" height="80" rx="10"/>
<text class="t" x="670.0" y="186.5" text-anchor="middle">2. Compare</text>
<text class="t" x="670.0" y="203.5" text-anchor="middle">want 3, have 2</text>
<rect class="boxs" x="330" y="230" width="200" height="80" rx="10"/>
<text class="t" x="430.0" y="266.5" text-anchor="middle">3. Act</text>
<text class="t" x="430.0" y="283.5" text-anchor="middle">ask for 1 more pod</text>
<line class="ln" x1="530" y1="110" x2="600" y2="148" marker-end="url(#ah)"/>
<line class="ln" x1="600" y1="232" x2="532" y2="270" marker-end="url(#ah)"/>
<path class="ln" d="M330 270 L300 270 L300 110 L328 110" marker-end="url(#ah)"/>
<path class="ln" d="M224 290 L250 290 L250 345 L670 345 L670 232" marker-end="url(#ah)"/>
<text class="ts" x="460" y="338" text-anchor="middle">the desired state feeds the comparison</text>
<text class="tc" x="430" y="196" text-anchor="middle">the loop runs forever</text>
<text class="ts" x="24" y="392" text-anchor="start">It does not matter how the gap appeared (a crash, a deleted pod, a lost node): the loop closes it.</text>
</svg>
