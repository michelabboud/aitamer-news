<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">From one server to a cluster</title>
<desc id="d">On the left, before: one server runs three containers that a person started by hand with docker run. When one container crashes, nothing replaces it until the person notices. On the right, after: you tell the Kubernetes control plane that you want three copies. It places them on three worker nodes, and when a container or a node fails, it starts a replacement on its own.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Before and after: who keeps your containers running</text>
<text class="t" x="24" y="62" text-anchor="start">Before: one server, you are the scheduler</text>
<rect class="box" x="24" y="78" width="340" height="230" rx="10"/>
<text class="tm" x="40" y="102" text-anchor="start">server-1</text>
<rect class="boxs" x="40" y="118" width="200" height="40" rx="10"/>
<text class="tm" x="140.0" y="143.0" text-anchor="middle">web (docker run)</text>
<rect class="boxd" x="40" y="170" width="200" height="40" rx="10"/>
<text class="tm" x="140.0" y="195.0" text-anchor="middle">web (docker run) : exited</text>
<rect class="boxs" x="40" y="222" width="200" height="40" rx="10"/>
<text class="tm" x="140.0" y="247.0" text-anchor="middle">web (docker run)</text>
<rect class="panel" x="252" y="118" width="100" height="144" rx="10"/>
<text class="ts" x="302.0" y="178.0" text-anchor="middle">you, at 3am,</text>
<text class="ts" x="302.0" y="195.0" text-anchor="middle">ssh in and</text>
<text class="ts" x="302.0" y="212.0" text-anchor="middle">run it again</text>
<text class="ts" x="40" y="290" text-anchor="start">Nothing restarts the crashed copy for you.</text>
<text class="t" x="420" y="62" text-anchor="start">After: a cluster, Kubernetes keeps the count</text>
<rect class="boxb" x="420" y="78" width="356" height="50" rx="10"/>
<text class="t" x="598.0" y="108.0" text-anchor="middle">control plane: &quot;I want 3 copies of web&quot;</text>
<rect class="box" x="420" y="160" width="112" height="148" rx="10"/>
<text class="tm" x="476" y="182" text-anchor="middle">node-1</text>
<rect class="boxs" x="430" y="196" width="92" height="36" rx="10"/>
<text class="tm" x="476.0" y="219.0" text-anchor="middle">web</text>
<line class="ln" x1="598" y1="128" x2="476" y2="158" marker-end="url(#ah)"/>
<rect class="box" x="542" y="160" width="112" height="148" rx="10"/>
<text class="tm" x="598" y="182" text-anchor="middle">node-2</text>
<rect class="boxs" x="552" y="196" width="92" height="36" rx="10"/>
<text class="tm" x="598.0" y="219.0" text-anchor="middle">web</text>
<line class="ln" x1="598" y1="128" x2="598" y2="158" marker-end="url(#ah)"/>
<rect class="box" x="664" y="160" width="112" height="148" rx="10"/>
<text class="tm" x="720" y="182" text-anchor="middle">node-3</text>
<rect class="boxs" x="674" y="196" width="92" height="36" rx="10"/>
<text class="tm" x="720.0" y="219.0" text-anchor="middle">web</text>
<line class="ln" x1="598" y1="128" x2="720" y2="158" marker-end="url(#ah)"/>
<rect class="boxc" x="430" y="250" width="92" height="36" rx="10"/>
<text class="tm" x="476.0" y="273.0" text-anchor="middle">web (new)</text>
<text class="ts" x="476" y="330" text-anchor="middle">A failed copy is replaced automatically.</text>
<text class="t" x="24" y="372" text-anchor="start">Kubernetes compares what you asked for with what is running, and fixes the difference.</text>
<text class="ts" x="24" y="396" text-anchor="start">You still build the image; Kubernetes runs it, places it and keeps it alive.</text>
</svg>
