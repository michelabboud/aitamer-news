<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">What Kubernetes does, and what you still bring</text>
<rect class="boxs" x="24" y="52" width="366" height="326" rx="10"/>
<text class="th" x="44" y="82" text-anchor="start">Kubernetes does</text>
<text class="t" x="44" y="114" text-anchor="start">• Schedules containers onto machines</text>
<text class="t" x="44" y="150" text-anchor="start">• Restarts and replaces failed containers</text>
<text class="t" x="44" y="186" text-anchor="start">• Scales copies up and down</text>
<text class="t" x="44" y="222" text-anchor="start">• Gives pods one stable name and</text>
<text class="t" x="44" y="244" text-anchor="start">   spreads traffic across them</text>
<text class="t" x="44" y="280" text-anchor="start">• Rolls out new versions, rolls them back</text>
<text class="t" x="44" y="316" text-anchor="start">• Hands config and secrets to containers</text>
<text class="t" x="44" y="352" text-anchor="start">• Mounts the storage you choose</text>
<rect class="box" x="410" y="52" width="366" height="326" rx="10"/>
<text class="th" x="430" y="82" text-anchor="start">You still bring</text>
<rect class="boxc" x="426" y="98" width="334" height="52" rx="10"/>
<text class="t" x="438" y="120.5" text-anchor="start">Your build and CI/CD pipeline:</text>
<text class="t" x="438" y="137.5" text-anchor="start">Kubernetes runs images, it does not build them</text>
<text class="t" x="430" y="184" text-anchor="start">• Databases, caches, message queues</text>
<text class="ts" x="444" y="206" text-anchor="start">(they run on Kubernetes, not built in)</text>
<text class="t" x="430" y="242" text-anchor="start">• Logging, monitoring and alerting choices</text>
<text class="t" x="430" y="278" text-anchor="start">• Machine setup, OS patching and repair</text>
<text class="t" x="430" y="314" text-anchor="start">• A configuration language for your YAML</text>
<text class="ts" x="400" y="402" text-anchor="middle">Based on the Overview page on kubernetes.io (What Kubernetes is not)</text>
</svg>
