<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">What Kubernetes does and does not do</title>
<desc id="d">Two columns. Kubernetes does: schedule containers onto machines, restart and replace failed containers, scale copies up and down, give a set of containers one stable name and spread traffic across them, roll out new versions and roll them back, hand configuration and secrets to containers, and mount storage. Kubernetes does not: build your code or run your CI pipeline, provide databases, caches or message queues as built-in services, choose your logging and monitoring, or configure and repair the machines themselves. The first item on the right is highlighted because it is the most common beginner surprise.</desc>
