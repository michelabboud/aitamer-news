<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d">
<title id="t">Grading checklist</title>
<desc id="d">The thirteen checks that check.sh runs, grouped by tier, each with the part of the series that taught it. Redis tier: Secret redis-auth exists (part 9); redis Deployment has 1 ready replica (part 7); it runs redis:8.10-alpine (part 4); it has a readiness probe (part 10); its Pod is Guaranteed (part 11); maxmemory is 48mb from the ConfigMap (part 9); it refuses clients without the password (part 9). Web tier: 2 ready replicas (part 7); readiness probe on /index.html (part 10); a preStop hook (part 10); Pods are Burstable (part 11); the Service web has 2 ready endpoints (part 8). End to end, highlighted: the counter answers through the Service (part 8).</desc>
