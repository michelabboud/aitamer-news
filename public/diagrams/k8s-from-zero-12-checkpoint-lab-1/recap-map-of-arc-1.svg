<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Map of arc 1</title>
<desc id="d">A route map of the twelve parts of arc 1, Foundations, in three rows of four stations. Row one, the ideas: 1 what Kubernetes is, 2 the architecture tour, 3 your local lab, 4 your first Pod. Row two, the daily tools and objects: 5 kubectl essentials, 6 namespaces, labels and annotations, 7 Deployments and ReplicaSets, 8 Services. Row three, running an app well: 9 ConfigMaps and Secrets, 10 probes and graceful shutdown, 11 requests, limits and QoS, and 12, this checkpoint lab, highlighted. An arrow leads on to arc 2, which starts with volumes, PersistentVolumes and StorageClasses.</desc>
