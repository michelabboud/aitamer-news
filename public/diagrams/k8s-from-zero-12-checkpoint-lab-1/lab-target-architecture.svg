<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Checkpoint lab target architecture</title>
<desc id="d">Everything runs in the namespace k8s-from-zero. A client Pod calls the Service web on port 80, which sends traffic to port 8080 of two web Pods from the Deployment web. Each web Pod runs busybox httpd with a readiness probe on /index.html, a preStop sleep and Burstable resources; it mounts the ConfigMap web-files at /www and the Secret redis-auth at /etc/redis-auth. The CGI script calls the Service redis on port 6379, which sends traffic to one redis Pod from the Deployment redis. The redis Pod reads its password from the same Secret as an environment variable, mounts the ConfigMap redis-config at /etc/redis, has a redis-cli ping readiness probe and Guaranteed resources. It has no volume, highlighted: the visit counter is lost whenever the redis Pod is replaced.</desc>
