<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
<title id="t">The effort dial: score against cost per task</title>
<desc id="d">Artificial Analysis Intelligence Index score against cost per task. Opus 5.5 at medium effort scores 51 for 1.34 dollars a task, at high effort 54 for 1.82 dollars, at max effort 58 for 5.98 dollars. Opus 5 at max effort scores 51 for 5.86 dollars. Medium matches Opus 5 max for under a quarter of the cost; max costs over three times high for four more points.</desc>
<style>
.bg { fill: #f6f1e7; }
.ink { fill: #1f2a44; font-family: system-ui, sans-serif; }
.muted { fill: #55607a; font-family: system-ui, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; }
.h2 { font-size: 15px; font-weight: 700; }
.sm { font-size: 13.5px; }
.xs { font-size: 12.5px; }
.axis { stroke: #55607a; stroke-width: 1.5; }
.grid { stroke: #d8d1c2; stroke-width: 1; }
.line { fill: none; stroke: #e07a5f; stroke-width: 2.5; }
.pt { fill: #e07a5f; }
.old { fill: #3d5a80; }
.guide { stroke: #3d5a80; stroke-width: 1.5; stroke-dasharray: 5 5; }
@media (prefers-color-scheme: dark) {
.bg { fill: #141b2d; }
.ink { fill: #e8ecf4; }
.muted { fill: #a9b3c7; }
.axis { stroke: #a9b3c7; }
.grid { stroke: #2c3752; }
.line { stroke: #f2a38c; }
.pt { fill: #f2a38c; }
.old { fill: #8fb3e0; }
.guide { stroke: #8fb3e0; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="480" rx="18"/>
<text class="ink h1" x="32" y="44">The effort dial: what each level buys</text>
<text class="muted sm" x="32" y="68">Artificial Analysis Intelligence Index score against cost per index task (USD). Measured by Artificial Analysis, not Anthropic.</text>
<line class="grid" x1="110" y1="110" x2="880" y2="110"/>
<line class="grid" x1="110" y1="160" x2="880" y2="160"/>
<line class="grid" x1="110" y1="210" x2="880" y2="210"/>
<line class="grid" x1="110" y1="260" x2="880" y2="260"/>
<line class="grid" x1="110" y1="310" x2="880" y2="310"/>
<line class="axis" x1="110" y1="360" x2="880" y2="360"/>
<line class="axis" x1="110" y1="100" x2="110" y2="360"/>
<text class="muted xs" x="100" y="364" text-anchor="end">48</text>
<text class="muted xs" x="100" y="314" text-anchor="end">50</text>
<text class="muted xs" x="100" y="264" text-anchor="end">52</text>
<text class="muted xs" x="100" y="214" text-anchor="end">54</text>
<text class="muted xs" x="100" y="164" text-anchor="end">56</text>
<text class="muted xs" x="100" y="114" text-anchor="end">58</text>
<text class="muted xs" x="110" y="382" text-anchor="middle">$0</text>
<text class="muted xs" x="330" y="382" text-anchor="middle">$2</text>
<text class="muted xs" x="550" y="382" text-anchor="middle">$4</text>
<text class="muted xs" x="770" y="382" text-anchor="middle">$6</text>
<text class="muted xs" x="495" y="404" text-anchor="middle">cost per Intelligence Index task</text>
<text class="muted xs" x="40" y="236" text-anchor="middle">score</text>
<line class="guide" x1="257" y1="285" x2="755" y2="285"/>
<polyline class="line" points="257,285 310,210 768,110"/>
<circle class="pt" cx="257" cy="285" r="8"/>
<circle class="pt" cx="310" cy="210" r="8"/>
<circle class="pt" cx="768" cy="110" r="8"/>
<circle class="old" cx="755" cy="285" r="8"/>
<text class="ink h2" x="236" y="318" text-anchor="middle">Opus 5.5 medium</text>
<text class="muted xs" x="236" y="336" text-anchor="middle">51 for $1.34, 38M tokens</text>
<text class="ink h2" x="298" y="186" text-anchor="end">Opus 5.5 high</text>
<text class="muted xs" x="298" y="168" text-anchor="end">54 for $1.82, 53M tokens</text>
<text class="ink h2" x="752" y="100" text-anchor="end">Opus 5.5 max</text>
<text class="muted xs" x="880" y="144" text-anchor="end">58 for $5.98, 260M tokens</text>
<text class="ink h2" x="755" y="318" text-anchor="middle">Opus 5 max</text>
<text class="muted xs" x="755" y="336" text-anchor="middle">51 for $5.86, 140M tokens</text>
<text class="muted xs" x="506" y="276" text-anchor="middle">same score, under a quarter of the cost</text>
<text class="muted xs" x="32" y="440">Tokens are output tokens across the whole index. Pages read 2026-09-28; index scores and costs change as it is re-run.</text>
<text class="muted xs" x="32" y="460">Source: artificialanalysis.ai model pages for Claude Opus 5.5 (medium, high, max) and Claude Opus 5 (max).</text>
</svg>
