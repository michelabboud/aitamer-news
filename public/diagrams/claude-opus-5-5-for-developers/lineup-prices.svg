<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
<title id="t">Where Claude Opus 5.5 sits in the lineup, by list price</title>
<desc id="d">Horizontal bars of output price per million tokens, from Anthropic's pricing page read on 2026-09-28: Haiku 4.5 at 5 dollars, Sonnet 5 at 10, Opus 5.5 at 20, Opus 5 at 25, Fable 5.1 at 50. Opus 5.5's cache read price of 20 cents per million tokens equals Sonnet 5's.</desc>
<style>
.bg { fill: #f6f1e7; }
.ink { fill: #1f2a44; font-family: system-ui, sans-serif; }
.muted { fill: #55607a; font-family: system-ui, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; }
.h2 { font-size: 16px; font-weight: 700; }
.sm { font-size: 13.5px; }
.xs { font-size: 12.5px; }
.bar { fill: #9fb3cc; }
.star { fill: #e07a5f; }
.grid { stroke: #d8d1c2; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
.bg { fill: #141b2d; }
.ink { fill: #e8ecf4; }
.muted { fill: #a9b3c7; }
.bar { fill: #4b6286; }
.star { fill: #f2a38c; }
.grid { stroke: #2c3752; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="470" rx="18"/>
<text class="ink h1" x="32" y="44">Where Opus 5.5 sits, by list price</text>
<text class="muted sm" x="32" y="68">Output price per million tokens (bar), with input and cache-read prices. Claude API, read 2026-09-28.</text>
<line class="grid" x1="200" y1="92" x2="200" y2="392"/>
<line class="grid" x1="304" y1="92" x2="304" y2="392"/>
<line class="grid" x1="408" y1="92" x2="408" y2="392"/>
<line class="grid" x1="512" y1="92" x2="512" y2="392"/>
<line class="grid" x1="616" y1="92" x2="616" y2="392"/>
<line class="grid" x1="720" y1="92" x2="720" y2="392"/>
<text class="muted xs" x="200" y="412" text-anchor="middle">$0</text>
<text class="muted xs" x="304" y="412" text-anchor="middle">$10</text>
<text class="muted xs" x="408" y="412" text-anchor="middle">$20</text>
<text class="muted xs" x="512" y="412" text-anchor="middle">$30</text>
<text class="muted xs" x="616" y="412" text-anchor="middle">$40</text>
<text class="muted xs" x="720" y="412" text-anchor="middle">$50</text>
<text class="ink h2" x="32" y="122">Haiku 4.5</text>
<text class="muted xs" x="32" y="140">fastest, 200K context</text>
<rect class="bar" x="200" y="104" width="52" height="36" rx="4"/>
<text class="muted sm" x="262" y="127">$1 in, $5 out, cache read $0.10</text>
<text class="ink h2" x="32" y="182">Sonnet 5</text>
<text class="muted xs" x="32" y="200">fast, 1M context</text>
<rect class="bar" x="200" y="164" width="104" height="36" rx="4"/>
<text class="muted sm" x="314" y="187">$2 in, $10 out, cache read $0.20</text>
<text class="ink h2" x="32" y="242">Opus 5.5</text>
<text class="muted xs" x="32" y="260">moderate, 1M context</text>
<rect class="star" x="200" y="224" width="208" height="36" rx="4"/>
<text class="ink sm" x="418" y="247">$4 in, $20 out, cache read $0.20 (0.05x input)</text>
<text class="ink h2" x="32" y="302">Opus 5</text>
<text class="muted xs" x="32" y="320">legacy, 1M context</text>
<rect class="bar" x="200" y="284" width="260" height="36" rx="4"/>
<text class="muted sm" x="470" y="307">$5 in, $25 out, cache read $0.50</text>
<text class="ink h2" x="32" y="362">Fable 5.1</text>
<text class="muted xs" x="32" y="380">slower, 1M context</text>
<rect class="bar" x="200" y="344" width="520" height="36" rx="4"/>
<text class="muted sm" x="730" y="367">$10 in, $50 out</text>
<text class="muted sm" x="730" y="385">cache read $0.25</text>
<text class="muted xs" x="32" y="440">Speed labels are Anthropic's relative latency descriptors. Batch API: half price. US-only inference: 1.1x.</text>
<text class="muted xs" x="32" y="458">Source: Anthropic pricing page and models overview. Prices in USD per million tokens.</text>
</svg>
