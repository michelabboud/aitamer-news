<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
<title id="t">One agent turn on Claude Opus 5.5: what moved</title>
<desc id="d">A tool loop runs clockwise from the harness to Claude Opus 5.5, to the developer's tools, to the appended result and back. Four numbered notes mark what changed from Opus 5: thinking is always on and effort is the only dial; notes written between tool calls arrive as thinking blocks; a text-only end of turn is a report, not proof the task is done; a safeguard decline is an HTTP 200 refusal, with fallback opt-in on the API.</desc>
<style>
.bg { fill: #f6f1e7; }
.box { fill: #ffffff; stroke: #3d5a80; stroke-width: 2; }
.hot { fill: #ffffff; stroke: #e07a5f; stroke-width: 2.5; }
.card { fill: #ffffff; stroke: #c9c2b3; stroke-width: 1.5; }
.ink { fill: #1f2a44; font-family: system-ui, sans-serif; }
.muted { fill: #55607a; font-family: system-ui, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; }
.h2 { font-size: 16px; font-weight: 700; }
.sm { font-size: 13.5px; }
.xs { font-size: 12.5px; }
.ring { fill: none; stroke: #3d5a80; stroke-width: 3; stroke-dasharray: 10 8; }
.head { fill: #3d5a80; }
.dot { fill: #e07a5f; }
.num { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; }
.flow { animation: flow 2.4s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
@media (prefers-color-scheme: dark) {
.bg { fill: #141b2d; }
.box { fill: #1e2740; stroke: #8fb3e0; }
.hot { fill: #1e2740; stroke: #f2a38c; }
.card { fill: #1e2740; stroke: #3a4666; }
.ink { fill: #e8ecf4; }
.muted { fill: #a9b3c7; }
.ring { stroke: #8fb3e0; }
.head { fill: #8fb3e0; }
.dot { fill: #f2a38c; }
.num { fill: #141b2d; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="560" rx="18"/>
<text class="ink h1" x="32" y="44">One agent turn on Claude Opus 5.5: what moved</text>
<text class="muted sm" x="32" y="68">The loop is the same as on Opus 5. The numbered points are where code written for Opus 5 breaks or goes quiet.</text>
<rect class="ring flow" x="170" y="170" width="280" height="250" rx="26"/>
<polygon class="head" points="302,162 318,170 302,178"/>
<polygon class="head" points="442,287 450,303 458,287"/>
<polygon class="head" points="318,412 302,420 318,428"/>
<polygon class="head" points="162,303 170,287 178,303"/>
<text class="muted xs" x="310" y="290" text-anchor="middle">tool loop,</text>
<text class="muted xs" x="310" y="307" text-anchor="middle">clockwise</text>
<rect class="box" x="70" y="135" width="200" height="70" rx="10"/>
<text class="ink h2" x="170" y="164" text-anchor="middle">Your harness</text>
<text class="muted xs" x="170" y="186" text-anchor="middle">sends history + effort</text>
<rect class="hot" x="350" y="135" width="200" height="70" rx="10"/>
<text class="ink h2" x="450" y="164" text-anchor="middle">Claude Opus 5.5</text>
<text class="muted xs" x="450" y="186" text-anchor="middle">adaptive thinking, always on</text>
<rect class="box" x="350" y="385" width="200" height="70" rx="10"/>
<text class="ink h2" x="450" y="414" text-anchor="middle">Your tools run</text>
<text class="muted xs" x="450" y="436" text-anchor="middle">tool_use in, tool_result out</text>
<rect class="box" x="70" y="385" width="200" height="70" rx="10"/>
<text class="ink h2" x="170" y="414" text-anchor="middle">Result appended</text>
<text class="muted xs" x="170" y="436" text-anchor="middle">prefix unchanged: cache hits</text>
<circle class="dot" cx="560" cy="132" r="13"/>
<text class="num" x="560" y="137" text-anchor="middle">1</text>
<circle class="dot" cx="482" cy="300" r="13"/>
<text class="num" x="482" y="305" text-anchor="middle">2</text>
<circle class="dot" cx="60" cy="132" r="13"/>
<text class="num" x="60" y="137" text-anchor="middle">3</text>
<circle class="dot" cx="340" cy="215" r="13"/>
<text class="num" x="340" y="220" text-anchor="middle">4</text>
<rect class="card" x="600" y="96" width="336" height="96" rx="10"/>
<circle class="dot" cx="626" cy="122" r="13"/>
<text class="num" x="626" y="127" text-anchor="middle">1</text>
<text class="ink h2" x="648" y="127">Thinking is always on</text>
<text class="muted sm" x="616" y="154">Effort is the only dial, and its default is</text>
<text class="muted sm" x="616" y="174">medium. Turning thinking off returns a 400.</text>
<rect class="card" x="600" y="204" width="336" height="96" rx="10"/>
<circle class="dot" cx="626" cy="230" r="13"/>
<text class="num" x="626" y="235" text-anchor="middle">2</text>
<text class="ink h2" x="648" y="235">Notes between tool calls</text>
<text class="muted sm" x="616" y="262">arrive as thinking blocks, empty unless</text>
<text class="muted sm" x="616" y="282">thinking.display asks for them.</text>
<rect class="card" x="600" y="312" width="336" height="96" rx="10"/>
<circle class="dot" cx="626" cy="338" r="13"/>
<text class="num" x="626" y="343" text-anchor="middle">3</text>
<text class="ink h2" x="648" y="343">A text-only end_turn</text>
<text class="muted sm" x="616" y="370">is a progress report, not proof of done.</text>
<text class="muted sm" x="616" y="390">Check the task list; nudge two or three times.</text>
<rect class="card" x="600" y="420" width="336" height="96" rx="10"/>
<circle class="dot" cx="626" cy="446" r="13"/>
<text class="num" x="626" y="451" text-anchor="middle">4</text>
<text class="ink h2" x="648" y="451">A safeguard decline</text>
<text class="muted sm" x="616" y="478">is HTTP 200 with stop_reason refusal. API</text>
<text class="muted sm" x="616" y="498">fallback is opt-in; cyber goes to Opus 4.8.</text>
<text class="muted xs" x="32" y="508">Also removed: forced tool use (tool_choice any or tool).</text>
<text class="muted xs" x="32" y="528">Use auto with strict tools. Source: Anthropic, What's new in Claude Opus 5.5.</text>
</svg>
