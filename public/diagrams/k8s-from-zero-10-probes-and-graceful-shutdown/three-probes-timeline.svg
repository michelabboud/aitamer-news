<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Three probes on one timeline</title>
<desc id="d">A timeline from 0 to 60 seconds for a container that takes about 25 seconds to start, probed every 5 seconds. The startup probe fails at 5, 10, 15, 20 and 25 seconds and succeeds at 30 seconds, then stops running. Only from that moment, which is highlighted, do the liveness and readiness probes begin, every 5 seconds, for the rest of the container&#x27;s life. Under the timeline, a legend says what a failure means for each probe: a startup or liveness failure past failureThreshold makes the kubelet restart the container; a readiness failure only marks the Pod not ready, so Services stop sending it traffic.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Startup first, then liveness and readiness for the rest of the container&#x27;s life</text>
<line class="lnf" x1="170.0" y1="70" x2="170.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="170.0" y="318" text-anchor="middle">0s</text>
<line class="lnf" x1="265.0" y1="70" x2="265.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="265.0" y="318" text-anchor="middle">10s</text>
<line class="lnf" x1="360.0" y1="70" x2="360.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="360.0" y="318" text-anchor="middle">20s</text>
<line class="lnf" x1="455.0" y1="70" x2="455.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="455.0" y="318" text-anchor="middle">30s</text>
<line class="lnf" x1="550.0" y1="70" x2="550.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="550.0" y="318" text-anchor="middle">40s</text>
<line class="lnf" x1="645.0" y1="70" x2="645.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="645.0" y="318" text-anchor="middle">50s</text>
<line class="lnf" x1="740.0" y1="70" x2="740.0" y2="300" stroke-dasharray="5 4"/>
<text class="ts" x="740.0" y="318" text-anchor="middle">60s</text>
<text class="ts" x="455.0" y="340" text-anchor="middle">probe period: 5 seconds</text>
<text class="tm" x="24" y="115" text-anchor="start">startupProbe</text>
<line class="ln" x1="170" y1="110" x2="740.0" y2="110"/>
<text class="tm" x="24" y="185" text-anchor="start">livenessProbe</text>
<line class="ln" x1="170" y1="180" x2="740.0" y2="180"/>
<text class="tm" x="24" y="255" text-anchor="start">readinessProbe</text>
<line class="ln" x1="170" y1="250" x2="740.0" y2="250"/>
<circle class="dg" cx="217.5" cy="110" r="6"/>
<circle class="dg" cx="265.0" cy="110" r="6"/>
<circle class="dg" cx="312.5" cy="110" r="6"/>
<circle class="dg" cx="360.0" cy="110" r="6"/>
<circle class="dg" cx="407.5" cy="110" r="6"/>
<circle class="ds" cx="455.0" cy="110" r="7"/>
<text class="ts" x="312.5" y="92" text-anchor="middle">fails while the app starts</text>
<text class="ts" x="512.0" y="92" text-anchor="start">succeeds once, then stops</text>
<circle class="ds" cx="502.5" cy="180" r="6"/>
<circle class="ds" cx="502.5" cy="250" r="6"/>
<circle class="ds" cx="550.0" cy="180" r="6"/>
<circle class="ds" cx="550.0" cy="250" r="6"/>
<circle class="ds" cx="597.5" cy="180" r="6"/>
<circle class="ds" cx="597.5" cy="250" r="6"/>
<circle class="ds" cx="645.0" cy="180" r="6"/>
<circle class="ds" cx="645.0" cy="250" r="6"/>
<circle class="ds" cx="692.5" cy="180" r="6"/>
<circle class="ds" cx="692.5" cy="250" r="6"/>
<circle class="ds" cx="740.0" cy="180" r="6"/>
<circle class="ds" cx="740.0" cy="250" r="6"/>
<text class="ts" x="265.0" y="174" text-anchor="middle">not started yet</text>
<text class="ts" x="265.0" y="244" text-anchor="middle">Pod READY 0/1</text>
<text class="ts" x="626.0" y="226" text-anchor="middle">Pod READY 1/1</text>
<rect class="boxc" x="443.0" y="70" width="24" height="230" rx="6"/>
<circle class="ds" cx="455.0" cy="110" r="7"/>
<text class="tc" x="455.0" y="64" text-anchor="middle">startup succeeded: the other two begin</text>
<circle class="dg" cx="40" cy="372" r="6"/>
<text class="ts" x="54" y="377" text-anchor="start">failed check</text>
<circle class="ds" cx="160" cy="372" r="6"/>
<text class="ts" x="174" y="377" text-anchor="start">passed check</text>
<rect class="box" x="24" y="396" width="370" height="56" rx="10"/>
<text class="ts" x="209.0" y="420.5" text-anchor="middle">startup or liveness fails failureThreshold times:</text>
<text class="ts" x="209.0" y="437.5" text-anchor="middle">the kubelet restarts the container</text>
<rect class="boxb" x="406" y="396" width="370" height="56" rx="10"/>
<text class="ts" x="591.0" y="420.5" text-anchor="middle">readiness fails failureThreshold times:</text>
<text class="ts" x="591.0" y="437.5" text-anchor="middle">Pod not ready, Services skip it, no restart</text>
</svg>
