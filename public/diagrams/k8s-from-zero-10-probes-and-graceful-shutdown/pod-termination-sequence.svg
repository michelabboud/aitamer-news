<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">What happens when a Pod is deleted</title>
<desc id="d">A timeline from 0 to 22 seconds after kubectl delete pod graceful, with terminationGracePeriodSeconds set to 20. At 0 seconds the API server marks the Pod Terminating and, at the same time, its EndpointSlice entry becomes ready=false and terminating=true, so any Service that selects it stops sending new traffic. The Pod disappears from the API at 8.3 seconds. Also at 0 seconds the kubelet runs the preStop hook, which sleeps for 4 seconds. Only after the hook finishes, at about 4.8 seconds in our lab, does the container receive SIGTERM; its handler finishes work and exits cleanly at about 7.8 seconds. The grace period clock started at 0, before the preStop hook, and is highlighted: if anything is still running at 20 seconds, the runtime sends SIGKILL.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Deleting a Pod: preStop, then SIGTERM, all inside one grace period</text>
<line class="lnf" x1="190" y1="66" x2="190" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="190" y="348" text-anchor="middle">0s</text>
<line class="lnf" x1="242" y1="66" x2="242" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="242" y="348" text-anchor="middle">2s</text>
<line class="lnf" x1="294" y1="66" x2="294" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="294" y="348" text-anchor="middle">4s</text>
<line class="lnf" x1="346" y1="66" x2="346" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="346" y="348" text-anchor="middle">6s</text>
<line class="lnf" x1="398" y1="66" x2="398" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="398" y="348" text-anchor="middle">8s</text>
<line class="lnf" x1="450" y1="66" x2="450" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="450" y="348" text-anchor="middle">10s</text>
<line class="lnf" x1="502" y1="66" x2="502" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="502" y="348" text-anchor="middle">12s</text>
<line class="lnf" x1="554" y1="66" x2="554" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="554" y="348" text-anchor="middle">14s</text>
<line class="lnf" x1="606" y1="66" x2="606" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="606" y="348" text-anchor="middle">16s</text>
<line class="lnf" x1="658" y1="66" x2="658" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="658" y="348" text-anchor="middle">18s</text>
<line class="lnf" x1="710" y1="66" x2="710" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="710" y="348" text-anchor="middle">20s</text>
<line class="lnf" x1="762" y1="66" x2="762" y2="330" stroke-dasharray="5 4"/>
<text class="ts" x="762" y="348" text-anchor="middle">22s</text>
<text class="t" x="24" y="105" text-anchor="start">API server</text>
<text class="t" x="24" y="155" text-anchor="start">EndpointSlice</text>
<text class="t" x="24" y="205" text-anchor="start">preStop hook</text>
<text class="t" x="24" y="255" text-anchor="start">main process</text>
<text class="t" x="24" y="305" text-anchor="start">grace period</text>
<rect class="box" x="190" y="84" width="215.8" height="32" rx="10"/>
<text class="ts" x="297.9" y="105.0" text-anchor="middle">STATUS Terminating</text>
<text class="ts" x="413.8" y="105" text-anchor="start">deleted from the API at 8.3s</text>
<rect class="boxb" x="190" y="134" width="215.8" height="32" rx="10"/>
<text class="ts" x="297.9" y="155.0" text-anchor="middle">ready=false</text>
<text class="ts" x="413.8" y="147" text-anchor="start">terminating=true: no new Service traffic</text>
<text class="ts" x="413.8" y="162" text-anchor="start">(when a Service selects the Pod)</text>
<rect class="boxs" x="190" y="184" width="124.80000000000001" height="32" rx="10"/>
<text class="ts" x="252.4" y="205.0" text-anchor="middle">sleep / script</text>
<rect class="boxs" x="314.8" y="234" width="77.99999999999994" height="32" rx="10"/>
<text class="ts" x="353.79999999999995" y="255" text-anchor="middle">cleanup</text>
<line class="ln" x1="314.8" y1="226" x2="314.8" y2="232" marker-end="url(#ah)"/>
<text class="tm" x="318.8" y="226" text-anchor="start">SIGTERM at 4.8s</text>
<text class="ts" x="400.79999999999995" y="255" text-anchor="start">exit 0 at 7.8s</text>
<rect class="boxc" x="190" y="286" width="520" height="28" rx="6"/>
<text class="tc" x="450" y="305" text-anchor="middle">terminationGracePeriodSeconds: 20 (clock starts before preStop)</text>
<line class="lnc" x1="710" y1="280" x2="710" y2="330"/>
<text class="tm" x="714" y="276" text-anchor="end">SIGKILL if still running</text>
<text class="ts" x="24" y="388" text-anchor="start">Times are from the lab Pod &quot;graceful&quot;: preStop slept 4 seconds, the SIGTERM handler took 3 seconds,</text>
<text class="ts" x="24" y="406" text-anchor="start">and kubectl delete returned after 8.3 seconds. A process that ignores SIGTERM runs until SIGKILL.</text>
<text class="ts" x="24" y="436" text-anchor="start">Endpoint removal and the preStop hook start at the same moment; they are not ordered.</text>
</svg>
