<title id="t">Recap map of arc 2</title>
<desc id="d">A map of arc 2 of the series, parts 13 to 25, in three groups. Workloads and storage: part 13 volumes and claims, 14 StatefulSets, 15 DaemonSets, Jobs and CronJobs, 16 init and sidecar containers. Scheduling and access: 17 scheduling basics, 18 taints, priority and disruption, 19 Ingress and Gateway API, 20 RBAC and ServiceAccounts. Operating: 21 and 22 troubleshooting, 23 kubectl power tools, 24 k9s, 25 autoscaling. Arrows show which of the ten lab faults draw on which group; the checkpoint lab, part 26, is highlighted at the bottom.</desc>
