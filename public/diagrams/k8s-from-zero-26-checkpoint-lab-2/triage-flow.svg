<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">A triage flow for a broken app</title>
<desc id="d">A decision flow. Start with kubectl get pods. If the Pod is Pending, run kubectl describe pod and read FailedScheduling: insufficient CPU or memory means lower the request or add capacity; an unbound PersistentVolumeClaim means describe the claim and check the StorageClass. If the status is ErrImagePull or ImagePullBackOff, check the image name, tag and registry. If it is CrashLoopBackOff or Error, read kubectl logs, with --previous for the last run. CreateContainerConfigError means a missing ConfigMap, Secret or key. OOMKilled means the memory limit is too low or the app leaks. If the Pod is Running but 0 of 1 ready, read the probe events. If it is ready but the app does not answer, check the Service EndpointSlice, highlighted: empty means a selector mismatch, present but refusing means a wrong targetPort. If an HPA shows unknown, describe the HPA.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="520" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Triage: start from the STATUS column, then follow the evidence</text>
<rect class="boxb" x="300" y="48" width="200" height="40" rx="10"/>
<text class="tm" x="400.0" y="73.0" text-anchor="middle">kubectl get pods</text>
<rect class="box" x="24" y="104" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="129" text-anchor="start">Pending</text>
<text class="ts" x="272" y="129" text-anchor="start">describe pod: FailedScheduling</text>
<text class="ts" x="476" y="121" text-anchor="start">Insufficient cpu: lower the request. Unbound</text>
<text class="ts" x="476" y="137" text-anchor="start">claim: describe pvc, get storageclass</text>
<rect class="box" x="24" y="152" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="177" text-anchor="start">ErrImagePull / ImagePullBackOff</text>
<text class="ts" x="272" y="177" text-anchor="start">describe pod: Failed to pull image</text>
<text class="ts" x="476" y="169" text-anchor="start">fix the image name, tag or registry (and</text>
<text class="ts" x="476" y="185" text-anchor="start">pull secret)</text>
<rect class="box" x="24" y="200" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="225" text-anchor="start">CrashLoopBackOff / Error</text>
<text class="ts" x="272" y="225" text-anchor="start">kubectl logs (--previous)</text>
<text class="ts" x="476" y="217" text-anchor="start">the app exits: read its last words, fix</text>
<text class="ts" x="476" y="233" text-anchor="start">config or command</text>
<rect class="box" x="24" y="248" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="273" text-anchor="start">CreateContainerConfigError</text>
<text class="ts" x="272" y="273" text-anchor="start">describe pod: ... not found</text>
<text class="ts" x="476" y="265" text-anchor="start">create the missing ConfigMap, Secret or key,</text>
<text class="ts" x="476" y="281" text-anchor="start">or fix the reference</text>
<rect class="box" x="24" y="296" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="321" text-anchor="start">OOMKilled (exit code 137)</text>
<text class="ts" x="272" y="321" text-anchor="start">describe pod: Last State</text>
<text class="ts" x="476" y="321" text-anchor="start">raise the memory limit or fix the leak</text>
<rect class="box" x="24" y="344" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="369" text-anchor="start">Running, READY 0/1</text>
<text class="ts" x="272" y="369" text-anchor="start">describe pod: Unhealthy events</text>
<text class="ts" x="476" y="369" text-anchor="start">fix the probe path, port or timing</text>
<rect class="boxc" x="24" y="392" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="417" text-anchor="start">Running, ready, no answer</text>
<text class="ts" x="272" y="417" text-anchor="start">get endpointslice for the Service</text>
<text class="ts" x="476" y="409" text-anchor="start">empty: selector mismatch. Present but</text>
<text class="ts" x="476" y="425" text-anchor="start">refused: wrong targetPort</text>
<rect class="box" x="24" y="440" width="752" height="40" rx="8"/>
<text class="tm" x="36" y="465" text-anchor="start">HPA cpu: &lt;unknown&gt;</text>
<text class="ts" x="272" y="465" text-anchor="start">describe hpa: Events</text>
<text class="ts" x="476" y="457" text-anchor="start">missing CPU request, or metrics-server not</text>
<text class="ts" x="476" y="473" text-anchor="start">ready</text>
<line class="ln" x1="400" y1="88" x2="400" y2="104"/>
<text class="ts" x="24" y="502" text-anchor="start">Read logs and events before you delete a Pod: a crashed container&#x27;s logs go away with its Pod.</text>
</svg>
