<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">The broken namespace: ten apps, ten faults</title>
<desc id="d">A map of the namespace k8s-from-zero after applying the ten broken manifests, grouped by where the symptom shows. Pod status column: shop in ImagePullBackOff, worker in CrashLoopBackOff, api in CreateContainerConfigError, cache OOMKilled. Pending column: the report Job Pod waits for CPU and the uploads Pod waits for its claim. Running but not working column: status is Running with 0 of 1 ready, blog and docs Pods are fine but their Services do not reach them, and the search HPA shows unknown targets, highlighted, because a fault can hide in an object other than the Pod.</desc>
