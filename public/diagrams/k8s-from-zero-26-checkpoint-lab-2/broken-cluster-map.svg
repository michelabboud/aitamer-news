<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">After kubectl apply -f broken/: where each fault shows</text>
<text class="th" x="24" y="70" text-anchor="start">Pod STATUS says it</text>
<rect class="boxs" x="24" y="86" width="236" height="70" rx="10"/>
<text class="t" x="142.0" y="115.0" text-anchor="middle">01 shop</text>
<text class="t" x="142.0" y="137.0" text-anchor="middle">ImagePullBackOff</text>
<rect class="boxs" x="24" y="170" width="236" height="70" rx="10"/>
<text class="t" x="142.0" y="199.0" text-anchor="middle">02 worker</text>
<text class="t" x="142.0" y="221.0" text-anchor="middle">CrashLoopBackOff</text>
<rect class="boxs" x="24" y="254" width="236" height="70" rx="10"/>
