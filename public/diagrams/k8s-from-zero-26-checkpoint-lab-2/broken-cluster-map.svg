<text class="t" x="142.0" y="367.0" text-anchor="middle">04 cache</text>
<text class="t" x="142.0" y="389.0" text-anchor="middle">OOMKilled</text>
<text class="th" x="282" y="70" text-anchor="start">Pod is Pending</text>
<rect class="boxb" x="282" y="86" width="236" height="70" rx="10"/>
<text class="t" x="400.0" y="115.0" text-anchor="middle">05 report (Job)</text>
<text class="t" x="400.0" y="137.0" text-anchor="middle">Pending: Insufficient cpu</text>
<rect class="boxb" x="282" y="170" width="236" height="70" rx="10"/>
<text class="t" x="400.0" y="199.0" text-anchor="middle">06 uploads</text>
<text class="t" x="400.0" y="221.0" text-anchor="middle">Pending: claim not bound</text>
<text class="th" x="540" y="70" text-anchor="start">Running, still broken</text>
<rect class="box" x="540" y="86" width="236" height="70" rx="10"/>
<text class="t" x="658.0" y="115.0" text-anchor="middle">07 blog</text>
<text class="t" x="658.0" y="137.0" text-anchor="middle">Service has no endpoints</text>
<rect class="box" x="540" y="170" width="236" height="70" rx="10"/>
<text class="t" x="658.0" y="199.0" text-anchor="middle">08 docs</text>
<text class="t" x="658.0" y="221.0" text-anchor="middle">connection refused</text>
<rect class="box" x="540" y="254" width="236" height="70" rx="10"/>
<text class="t" x="658.0" y="283.0" text-anchor="middle">09 status</text>
<text class="t" x="658.0" y="305.0" text-anchor="middle">Running, READY 0/1</text>
<rect class="boxc" x="540" y="338" width="236" height="70" rx="10"/>
<text class="t" x="658.0" y="367.0" text-anchor="middle">10 search</text>
<text class="t" x="658.0" y="389.0" text-anchor="middle">HPA cpu: &lt;unknown&gt;</text>
<text class="ts" x="282" y="290" text-anchor="start">kubectl describe pod: Events</text>
<text class="ts" x="282" y="310" text-anchor="start">kubectl describe pvc / get storageclass</text>
<text class="ts" x="24" y="436" text-anchor="start">kubectl get pods shows the first two columns. The third needs describe, EndpointSlices and the HPA itself.</text>
<text class="ts" x="24" y="456" text-anchor="start">All ten are our own faults, built only from parts 13 to 25 plus arc 1.</text>
</svg>
