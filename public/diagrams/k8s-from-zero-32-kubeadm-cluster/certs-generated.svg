<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">Certificates and kubeconfig files kubeadm init wrote on cp1</title>
<desc id="d">Three certificate authorities, valid for ten years: ca signs the API server serving certificate, the apiserver-kubelet-client certificate and the kubeconfig files admin.conf, super-admin.conf, controller-manager.conf and scheduler.conf; etcd-ca signs etcd server, etcd peer, etcd healthcheck-client and apiserver-etcd-client; front-proxy-ca signs front-proxy-client. sa.key and sa.pub are a key pair for signing service account tokens, not a certificate. Leaf certificates are valid for one year, and kubeadm certs check-expiration showed 364 days left and 9 years for the CAs. kubelet.conf is left out because the kubelet rotates its own client certificate under /var/lib/kubelet/pki. kubeadm renews certificates during every control plane upgrade.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="560" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">/etc/kubernetes after kubeadm init: 3 CAs, 1 key pair, many 1-year leaves</text>
<rect class="boxb" x="24" y="56" width="240" height="44" rx="10"/>
<text class="tm" x="40" y="84" text-anchor="start">ca</text>
<text class="ts" x="248" y="84" text-anchor="end">10 years</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="132"/>
<rect class="box" x="60" y="116" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="137" text-anchor="start">apiserver</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="172"/>
<rect class="box" x="60" y="156" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="177" text-anchor="start">apiserver-kubelet-client</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="212"/>
<rect class="box" x="60" y="196" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="217" text-anchor="start">admin.conf</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="252"/>
<rect class="box" x="60" y="236" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="257" text-anchor="start">super-admin.conf</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="292"/>
<rect class="box" x="60" y="276" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="297" text-anchor="start">controller-manager.conf</text>
<line class="lnf" x1="48" y1="100" x2="48" y2="332"/>
<rect class="box" x="60" y="316" width="204" height="32" rx="6"/>
<text class="tm" x="72" y="337" text-anchor="start">scheduler.conf</text>
<rect class="boxs" x="280" y="56" width="240" height="44" rx="10"/>
<text class="tm" x="296" y="84" text-anchor="start">etcd-ca</text>
<text class="ts" x="504" y="84" text-anchor="end">10 years</text>
<line class="lnf" x1="304" y1="100" x2="304" y2="132"/>
<rect class="box" x="316" y="116" width="204" height="32" rx="6"/>
<text class="tm" x="328" y="137" text-anchor="start">etcd/server</text>
<line class="lnf" x1="304" y1="100" x2="304" y2="172"/>
<rect class="box" x="316" y="156" width="204" height="32" rx="6"/>
<text class="tm" x="328" y="177" text-anchor="start">etcd/peer</text>
<line class="lnf" x1="304" y1="100" x2="304" y2="212"/>
<rect class="box" x="316" y="196" width="204" height="32" rx="6"/>
<text class="tm" x="328" y="217" text-anchor="start">etcd/healthcheck-client</text>
<line class="lnf" x1="304" y1="100" x2="304" y2="252"/>
<rect class="box" x="316" y="236" width="204" height="32" rx="6"/>
<text class="tm" x="328" y="257" text-anchor="start">apiserver-etcd-client</text>
<rect class="boxn" x="536" y="56" width="240" height="44" rx="10"/>
<text class="tm" x="552" y="84" text-anchor="start">front-proxy-ca</text>
<text class="ts" x="760" y="84" text-anchor="end">10 years</text>
<line class="lnf" x1="560" y1="100" x2="560" y2="132"/>
<rect class="box" x="572" y="116" width="204" height="32" rx="6"/>
<text class="tm" x="584" y="137" text-anchor="start">front-proxy-client</text>
<rect class="panel" x="536" y="180" width="240" height="70" rx="10"/>
<text class="tm" x="552" y="204" text-anchor="start">sa.key + sa.pub</text>
<text class="ts" x="552" y="226" text-anchor="start">signs ServiceAccount tokens;</text>
<text class="ts" x="552" y="242" text-anchor="start">a key pair, not a certificate</text>
<rect class="panel" x="24" y="372" width="752" height="80" rx="10"/>
<text class="t" x="40" y="396" text-anchor="start">kubeadm certs check-expiration on cp1, right after init:</text>
<text class="ts" x="40" y="420" text-anchor="start">11 certificates (admin.conf to super-admin.conf): Nov 10, 2027, 364d left</text>
<text class="ts" x="40" y="440" text-anchor="start">3 CAs (ca, etcd-ca, front-proxy-ca): Nov 07, 2036, 9y left</text>
<rect class="boxs" x="24" y="466" width="752" height="80" rx="10"/>
<text class="t" x="40" y="490" text-anchor="start">Renewal: kubeadm renews all of these during every control plane upgrade.</text>
<text class="ts" x="40" y="514" text-anchor="start">Upgrade at least once a year, or run kubeadm certs renew all.</text>
<text class="ts" x="40" y="534" text-anchor="start">kubelet.conf is not in the list: the kubelet rotates its own client certificate.</text>
</svg>
