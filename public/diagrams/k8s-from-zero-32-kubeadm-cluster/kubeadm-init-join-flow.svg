<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="560" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Build order: init one control plane, add a CNI, then join everyone else</text>
<rect class="boxb" x="24" y="56" width="360" height="392" rx="12"/>
<text class="tm" x="40" y="82" text-anchor="start">kubeadm init  (cp1)</text>
<rect class="box" x="40" y="96" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="117" text-anchor="start">preflight</text>
<text class="ts" x="356" y="117" text-anchor="end">pulls images</text>
<rect class="box" x="40" y="134" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="155" text-anchor="start">certs</text>
<text class="ts" x="356" y="155" text-anchor="end">CAs and certs</text>
<rect class="box" x="40" y="172" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="193" text-anchor="start">kubeconfig</text>
<text class="ts" x="356" y="193" text-anchor="end">admin.conf, ...</text>
<rect class="box" x="40" y="210" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="231" text-anchor="start">etcd, control-plane</text>
<text class="ts" x="356" y="231" text-anchor="end">static Pods</text>
<rect class="box" x="40" y="248" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="269" text-anchor="start">kubelet-start</text>
<text class="ts" x="356" y="269" text-anchor="end">runs them</text>
<rect class="box" x="40" y="286" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="307" text-anchor="start">upload-config, -certs</text>
<text class="ts" x="356" y="307" text-anchor="end">ConfigMap, Secret</text>
<rect class="box" x="40" y="324" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="345" text-anchor="start">mark-control-plane</text>
<text class="ts" x="356" y="345" text-anchor="end">label, taint</text>
<rect class="box" x="40" y="362" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="383" text-anchor="start">bootstrap-token</text>
<text class="ts" x="356" y="383" text-anchor="end">join token</text>
<rect class="box" x="40" y="400" width="328" height="32" rx="6"/>
<text class="tm" x="52" y="421" text-anchor="start">addons</text>
<text class="ts" x="356" y="421" text-anchor="end">CoreDNS, proxy</text>
<rect class="boxc" x="24" y="460" width="360" height="84" rx="10"/>
<text class="tc" x="40" y="484" text-anchor="start">node NotReady, CoreDNS Pending</text>
<text class="tm" x="40" y="508" text-anchor="start">kubectl apply -f &lt;cni&gt;.yaml</text>
<text class="ts" x="40" y="530" text-anchor="start">about 25 s later: node Ready, CoreDNS Running</text>
<rect class="boxs" x="416" y="56" width="360" height="180" rx="12"/>
<text class="tm" x="432" y="82" text-anchor="start">kubeadm join  (w1, w2)</text>
<text class="tm" x="432" y="112" text-anchor="start">&lt;endpoint&gt;:6443   (the load balancer)</text>
<text class="tm" x="432" y="142" text-anchor="start">--token &lt;token&gt;   (24h TTL by default)</text>
<text class="tm" x="432" y="172" text-anchor="start">--discovery-token-ca-cert-hash sha256:&lt;hash&gt;</text>
<text class="ts" x="432" y="220" text-anchor="start">discovery, then TLS bootstrap: kubelet gets a cert</text>
<rect class="boxs" x="416" y="252" width="360" height="196" rx="12"/>
<text class="tm" x="432" y="278" text-anchor="start">kubeadm join --control-plane</text>
<text class="ts" x="432" y="300" text-anchor="start">(cp2, cp3)</text>
<text class="ts" x="432" y="328" text-anchor="start">same endpoint, token and hash</text>
<text class="ts" x="432" y="352" text-anchor="start">--certificate-key: decrypts kubeadm-certs</text>
<text class="ts" x="432" y="376" text-anchor="start">own apiserver and etcd certificates</text>
<text class="ts" x="432" y="400" text-anchor="start">own static Pods for the control plane</text>
<text class="ts" x="432" y="424" text-anchor="start">new member in the stacked etcd cluster</text>
<rect class="panel" x="416" y="460" width="360" height="84" rx="10"/>
<text class="t" x="432" y="484" text-anchor="start">Lost the join line?</text>
<text class="tm" x="432" y="508" text-anchor="start">kubeadm token create --print-join-command</text>
<text class="ts" x="432" y="530" text-anchor="start">certificate key: init phase upload-certs</text>
<line class="ln" x1="384" y1="150" x2="414" y2="150" marker-end="url(#ah)"/>
<line class="ln" x1="384" y1="340" x2="414" y2="340" marker-end="url(#ah)"/>
</svg>
