<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">kubeadm init on the first machine, then kubeadm join on the rest</title>
<desc id="d">Left column, kubeadm init on cp1: preflight checks and image pulls, certificates in /etc/kubernetes/pki, kubeconfig files, static Pod manifests for etcd, kube-apiserver, kube-controller-manager and kube-scheduler, the kubelet starts them, upload-config, upload-certs into the Secret kubeadm-certs, the control-plane label and taint, a bootstrap token, and the add-ons CoreDNS and kube-proxy. The node stays NotReady and CoreDNS Pending until you apply a CNI add-on; after that the node is Ready. Right column: workers run kubeadm join with the endpoint, the token and the CA certificate hash, which gives discovery and then TLS bootstrap, and the kubelet gets its own certificate. More control planes run the same join with --control-plane and the certificate key, download the shared certificates, create their own static Pods, and add an etcd member.</desc>
