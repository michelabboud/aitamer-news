<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Two HA control plane topologies: stacked etcd and external etcd</title>
<desc id="d">Left, stacked etcd, the kubeadm default and what we built: a TCP load balancer in front of three control plane nodes, each running kube-apiserver, the controller manager, the scheduler and an etcd member. Workers talk to the load balancer. Fewer machines, but losing a node removes a control plane and an etcd member together. Right, external etcd: the same load balancer and three control plane nodes, plus three separate etcd hosts that every API server talks to. Twice the hosts, but a lost control plane node does not cost an etcd member. A bottom note says etcd needs a majority: with three members, one may fail; with two down, the API stops, which our lab showed.</desc>
