<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
<title id="t">The three QoS classes</title>
<desc id="d">Three columns. BestEffort: no container sets any CPU or memory request or limit; our lab Pod qos-besteffort got oom_score_adj 1000. Burstable: at least one request or limit is set but the Pod is not Guaranteed; qos-burstable with a 50m CPU and 32Mi memory request and a 64Mi memory limit got oom_score_adj 999. Guaranteed: every container has CPU and memory requests equal to limits; qos-guaranteed set only limits, which were copied into requests, and got oom_score_adj -997. An arrow underneath, highlighted, shows the eviction order under node pressure: BestEffort first, then Burstable, then Guaranteed.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">QoS class comes from requests and limits, and sets who goes first</text>
<rect class="box" x="24" y="56" width="240" height="300" rx="10"/>
<text class="th" x="144" y="86" text-anchor="middle">BestEffort</text>
<text class="t" x="144" y="120" text-anchor="middle">no requests,</text>
<text class="t" x="144" y="139" text-anchor="middle">no limits</text>
<text class="t" x="144" y="158" text-anchor="middle">in any container</text>
<line class="lnf" x1="40" y1="190" x2="248" y2="190"/>
<text class="ts" x="144" y="214" text-anchor="middle">lab Pod</text>
<text class="tm" x="144" y="234" text-anchor="middle">qos-besteffort</text>
<text class="ts" x="144" y="270" text-anchor="middle">oom_score_adj</text>
<text class="tb" x="144" y="292" text-anchor="middle">1000</text>
<rect class="boxs" x="280" y="56" width="240" height="300" rx="10"/>
<text class="th" x="400" y="86" text-anchor="middle">Burstable</text>
<text class="t" x="400" y="120" text-anchor="middle">some request or limit,</text>
<text class="t" x="400" y="139" text-anchor="middle">not Guaranteed</text>
<line class="lnf" x1="296" y1="190" x2="504" y2="190"/>
<text class="ts" x="400" y="214" text-anchor="middle">lab Pod</text>
<text class="tm" x="400" y="234" text-anchor="middle">qos-burstable</text>
<text class="ts" x="400" y="270" text-anchor="middle">oom_score_adj</text>
<text class="tb" x="400" y="292" text-anchor="middle">999</text>
<rect class="boxb" x="536" y="56" width="240" height="300" rx="10"/>
<text class="th" x="656" y="86" text-anchor="middle">Guaranteed</text>
<text class="t" x="656" y="120" text-anchor="middle">every container:</text>
<text class="t" x="656" y="139" text-anchor="middle">cpu and memory</text>
<text class="t" x="656" y="158" text-anchor="middle">requests == limits</text>
<line class="lnf" x1="552" y1="190" x2="760" y2="190"/>
<text class="ts" x="656" y="214" text-anchor="middle">lab Pod</text>
<text class="tm" x="656" y="234" text-anchor="middle">qos-guaranteed</text>
<text class="ts" x="656" y="270" text-anchor="middle">oom_score_adj</text>
<text class="tb" x="656" y="292" text-anchor="middle">-997</text>
<text class="ts" x="400" y="330" text-anchor="middle">requests 50m / 32Mi, limit 64Mi</text>
<text class="ts" x="656" y="330" text-anchor="middle">limits only: copied to requests</text>
<text class="tm" x="144" y="330" text-anchor="middle">resources: {}</text>
<line class="lnc" x1="60" y1="400" x2="740" y2="400" marker-end="url(#ahc)"/>
<text class="tc" x="400" y="390" text-anchor="middle">under node memory pressure the kubelet evicts in this order</text>
<text class="t" x="144" y="428" text-anchor="middle">first</text>
<text class="t" x="400" y="428" text-anchor="middle">then</text>
<text class="t" x="656" y="428" text-anchor="middle">last</text>
<text class="ts" x="24" y="464" text-anchor="start">Higher oom_score_adj means the kernel OOM killer picks that process sooner when the whole node runs out.</text>
</svg>
