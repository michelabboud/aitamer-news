<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">What happens at the limit: CPU versus memory</title>
<desc id="d">Two panels. Left, CPU: the cpu-hog container with a 200m limit tries to use a whole core. The kernel sets cpu.max to 20000 out of every 100000 microseconds and throttles it; cpu.stat showed about 2 seconds of CPU in about 10 seconds and a growing nr_throttled count. The container keeps running, just slower, with zero restarts. Right, memory: the mem-hog container with a 64Mi limit keeps allocating. The kernel OOM killer stops it, highlighted: status OOMKilled, exit code 137, then the kubelet restarts it and backs off, and kubectl shows the restart count climbing.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">At the limit, CPU slows down, memory gets killed</text>
<rect class="panel" x="24" y="56" width="364" height="330" rx="10"/>
<rect class="panel" x="412" y="56" width="364" height="330" rx="10"/>
<text class="th" x="206" y="86" text-anchor="middle">CPU limit 200m</text>
<text class="th" x="594" y="86" text-anchor="middle">memory limit 64Mi</text>
<rect class="box" x="48" y="104" width="316" height="44" rx="10"/>
<text class="t" x="206.0" y="131.0" text-anchor="middle">wants: a whole core (busy loop)</text>
<line class="ln" x1="206" y1="150" x2="206" y2="174" marker-end="url(#ah)"/>
<rect class="boxs" x="48" y="176" width="316" height="70" rx="10"/>
<text class="t" x="206.0" y="197.0" text-anchor="middle">throttled by the kernel</text>
<text class="t" x="206.0" y="216.0" text-anchor="middle">cpu.max: 20000 100000</text>
<text class="t" x="206.0" y="235.0" text-anchor="middle">(20 ms of every 100 ms)</text>
<line class="ln" x1="206" y1="248" x2="206" y2="272" marker-end="url(#ah)"/>
<rect class="boxs" x="48" y="274" width="316" height="92" rx="10"/>
<text class="t" x="206.0" y="296.5" text-anchor="middle">keeps running, slower</text>
<text class="t" x="206.0" y="315.5" text-anchor="middle">usage ~2 s CPU in ~10 s</text>
<text class="t" x="206.0" y="334.5" text-anchor="middle">nr_throttled grows</text>
<text class="t" x="206.0" y="353.5" text-anchor="middle">RESTARTS 0</text>
<rect class="box" x="436" y="104" width="316" height="44" rx="10"/>
<text class="t" x="594.0" y="131.0" text-anchor="middle">wants: more and more memory</text>
<line class="ln" x1="594" y1="150" x2="594" y2="174" marker-end="url(#ah)"/>
<rect class="boxc" x="436" y="176" width="316" height="70" rx="10"/>
<text class="t" x="594.0" y="197.0" text-anchor="middle">killed by the kernel OOM killer</text>
<text class="t" x="594.0" y="216.0" text-anchor="middle">reason: OOMKilled</text>
<text class="t" x="594.0" y="235.0" text-anchor="middle">exit code 137</text>
<line class="ln" x1="594" y1="248" x2="594" y2="272" marker-end="url(#ah)"/>
<rect class="boxs" x="436" y="274" width="316" height="92" rx="10"/>
<text class="t" x="594.0" y="296.5" text-anchor="middle">kubelet restarts it</text>
<text class="t" x="594.0" y="315.5" text-anchor="middle">with back-off: 10s, 20s, 40s</text>
<text class="t" x="594.0" y="334.5" text-anchor="middle">up to 5 minutes</text>
<text class="t" x="594.0" y="353.5" text-anchor="middle">RESTARTS 1, 2, ...</text>
<text class="ts" x="24" y="414" text-anchor="start">To enforce a CPU limit the kernel slows the process down; to enforce a memory limit it can only stop it.</text>
</svg>
