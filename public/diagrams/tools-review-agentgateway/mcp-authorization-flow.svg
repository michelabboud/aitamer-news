<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d">
<title id="t">How agentgateway enforces MCP authorization</title>
<desc id="d">A sequence between an MCP client, agentgateway and an MCP server. The client lists tools; the gateway asks the server, gets three tools, filters them through CEL rules and returns only the two the caller may use. When the client calls the hidden third tool anyway, the gateway answers with a JSON-RPC error, Unknown tool, and never contacts the server.</desc>
<style>
.bg { fill: #fbf8f1; }
.head { fill: #e8eff7; stroke: #4a6f99; stroke-width: 1.5; }
.gw { fill: #fdeee9; stroke: #c4573f; stroke-width: 1.5; }
.life { stroke: #9aa7b6; stroke-width: 1.2; stroke-dasharray: 4 5; }
.m { stroke: #4a6f99; stroke-width: 1.6; fill: none; }
.bad { stroke: #c4573f; stroke-width: 1.8; fill: none; }
.note { fill: #ffffff; stroke: #c4573f; stroke-width: 1.2; }
.t { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 14px; }
.h { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; }
.s { fill: #4b5563; font-family: system-ui, sans-serif; font-size: 12.5px; }
.c { fill: #1f2a37; font-family: ui-monospace, monospace; font-size: 12.5px; }
.r { fill: #b3452e; font-family: ui-monospace, monospace; font-size: 12.5px; }
.ah { fill: #4a6f99; }
.ar { fill: #c4573f; }
.dot { fill: #c4573f; opacity: 0; }
.dotb { fill: #2f5680; opacity: 0; }
@media (prefers-color-scheme: dark) {
.bg { fill: #141a21; }
.head { fill: #1d2a38; stroke: #86acd8; }
.gw { fill: #3a241f; stroke: #f0927a; }
.life { stroke: #5b6775; }
.m { stroke: #86acd8; }
.bad { stroke: #f0927a; }
.note { fill: #202d3b; stroke: #f0927a; }
.t { fill: #e6edf3; }
.h { fill: #f2f6fa; }
.s { fill: #aab4c0; }
.c { fill: #e6edf3; }
.r { fill: #f5a08b; }
.ah { fill: #86acd8; }
.ar { fill: #f0927a; }
.dot { fill: #f0927a; }
.dotb { fill: #9cc0ea; }
}
.p1 { animation: p1 14s linear infinite; }
.p2 { animation: p2 14s linear infinite; }
.p3 { animation: p3 14s linear infinite; }
.p4 { animation: p4 14s linear infinite; }
.p5 { animation: p5 14s linear infinite; }
.p6 { animation: p6 14s linear infinite; }
@keyframes p1 { 0% { opacity: 1; transform: translateX(0px); } 8% { opacity: 1; transform: translateX(330px); } 9% { opacity: 0; } 100% { opacity: 0; } }
@keyframes p2 { 0%, 10% { opacity: 0; transform: translateX(0px); } 10.5% { opacity: 1; transform: translateX(0px); } 18% { opacity: 1; transform: translateX(330px); } 19% { opacity: 0; } 100% { opacity: 0; } }
@keyframes p3 { 0%, 20% { opacity: 0; transform: translateX(0px); } 20.5% { opacity: 1; transform: translateX(0px); } 28% { opacity: 1; transform: translateX(-330px); } 29% { opacity: 0; } 100% { opacity: 0; } }
@keyframes p4 { 0%, 38% { opacity: 0; transform: translateX(0px); } 38.5% { opacity: 1; transform: translateX(0px); } 46% { opacity: 1; transform: translateX(-330px); } 47% { opacity: 0; } 100% { opacity: 0; } }
@keyframes p5 { 0%, 56% { opacity: 0; transform: translateX(0px); } 56.5% { opacity: 1; transform: translateX(0px); } 64% { opacity: 1; transform: translateX(330px); } 65% { opacity: 0; } 100% { opacity: 0; } }
@keyframes p6 { 0%, 76% { opacity: 0; transform: translateX(0px); } 76.5% { opacity: 1; transform: translateX(0px); } 84% { opacity: 1; transform: translateX(-330px); } 90% { opacity: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="500" rx="10"/>
<rect class="head" x="40" y="20" width="180" height="50" rx="8"/>
<text class="h" x="130" y="42" text-anchor="middle">MCP client</text>
<text class="s" x="130" y="60" text-anchor="middle">token: sub = support-bot</text>
<rect class="gw" x="350" y="20" width="180" height="50" rx="8"/>
<text class="h" x="440" y="42" text-anchor="middle">agentgateway</text>
<text class="s" x="440" y="60" text-anchor="middle">mcpAuthorization rules</text>
<rect class="head" x="660" y="20" width="180" height="50" rx="8"/>
<text class="h" x="750" y="42" text-anchor="middle">MCP server</text>
<text class="s" x="750" y="60" text-anchor="middle">three tools</text>
<line class="life" x1="110" y1="70" x2="110" y2="480"/>
<line class="life" x1="440" y1="70" x2="440" y2="480"/>
<line class="life" x1="770" y1="70" x2="770" y2="480"/>
<path class="m" d="M110 110 L438 110" marker-end="url(#a)"/>
<text class="c" x="124" y="102">tools/list</text>
<path class="m" d="M440 150 L768 150" marker-end="url(#a)"/>
<text class="c" x="454" y="142">tools/list</text>
<path class="m" d="M770 190 L442 190" marker-end="url(#a)"/>
<text class="c" x="454" y="182">search_docs, create_ticket, delete_ticket</text>
<rect class="note" x="300" y="206" width="280" height="54" rx="6"/>
<text class="s" x="312" y="226">allow: jwt.sub == "support-bot" and</text>
<text class="s" x="312" y="244">mcp.tool.name in [search_docs, create_ticket]</text>
<path class="m" d="M440 290 L112 290" marker-end="url(#a)"/>
<text class="c" x="124" y="282">search_docs, create_ticket</text>
<text class="s" x="124" y="308">delete_ticket is filtered out of the list</text>
<path class="bad" d="M110 350 L438 350" marker-end="url(#b)"/>
<text class="c" x="124" y="342">tools/call delete_ticket</text>
<path class="bad" d="M440 410 L112 410" marker-end="url(#b)"/>
<text class="r" x="124" y="402">error -32602: Unknown tool: delete_ticket</text>
<text class="s" x="124" y="430">the same answer a typo would get</text>
<text class="s" x="652" y="392">server never sees the call</text>
<circle class="dotb p1" cx="110" cy="110" r="6"/>
<circle class="dotb p2" cx="440" cy="150" r="6"/>
<circle class="dotb p3" cx="770" cy="190" r="6"/>
<circle class="dotb p4" cx="440" cy="290" r="6"/>
<circle class="dot p5" cx="110" cy="350" r="6"/>
<circle class="dot p6" cx="440" cy="410" r="6"/>
</svg>
