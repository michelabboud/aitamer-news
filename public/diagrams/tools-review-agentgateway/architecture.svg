<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
<title id="t">agentgateway architecture</title>
<desc id="d">Clients on the left send LLM, MCP and A2A traffic to agentgateway. Inside, gateways and listeners feed routes, which apply policies before reaching backends. On the right, backends are LLM providers, MCP servers and other agents. Below, a local YAML file or an xDS control plane both compile into one internal representation.</desc>
<style>
.bg { fill: #fbf8f1; }
.box { fill: #e8eff7; stroke: #4a6f99; stroke-width: 1.5; }
.core { fill: #f3f7fb; stroke: #2f5680; stroke-width: 2; }
.layer { fill: #ffffff; stroke: #4a6f99; stroke-width: 1.2; }
.pol { fill: #fdeee9; stroke: #c4573f; stroke-width: 1.2; }
.cfg { fill: #e9f4ef; stroke: #3f7d68; stroke-width: 1.2; }
.t { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 14px; }
.h { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; }
.s { fill: #4b5563; font-family: system-ui, sans-serif; font-size: 12px; }
.ln { stroke: #4a6f99; stroke-width: 1.6; fill: none; }
.lg { stroke: #3f7d68; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.ah { fill: #4a6f99; }
.ag { fill: #3f7d68; }
@media (prefers-color-scheme: dark) {
.bg { fill: #141a21; }
.box { fill: #1d2a38; stroke: #86acd8; }
.core { fill: #18222d; stroke: #9cc0ea; }
.layer { fill: #202d3b; stroke: #86acd8; }
.pol { fill: #3a241f; stroke: #f0927a; }
.cfg { fill: #1b3129; stroke: #7cc3a9; }
.t { fill: #e6edf3; }
.h { fill: #f2f6fa; }
.s { fill: #aab4c0; }
.ln { stroke: #86acd8; }
.lg { stroke: #7cc3a9; }
.ah { fill: #86acd8; }
.ag { fill: #7cc3a9; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ag" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="560" rx="10"/>
<text class="h" x="20" y="34">Clients</text>
<rect class="box" x="20" y="52" width="160" height="62" rx="8"/>
<text class="t" x="34" y="78">Agents and apps</text>
<text class="s" x="34" y="98">OpenAI, Anthropic, Gemini</text>
<rect class="box" x="20" y="134" width="160" height="62" rx="8"/>
<text class="t" x="34" y="160">MCP clients</text>
<text class="s" x="34" y="180">IDEs, agent runtimes</text>
<rect class="box" x="20" y="216" width="160" height="62" rx="8"/>
<text class="t" x="34" y="242">A2A agents</text>
<text class="s" x="34" y="262">agent-to-agent tasks</text>
<rect class="core" x="220" y="20" width="420" height="300" rx="12"/>
<text class="h" x="236" y="46">agentgateway (one Rust binary)</text>
<rect class="layer" x="238" y="62" width="384" height="40" rx="6"/>
<text class="t" x="252" y="87">Gateways and listeners: ports, TLS, hostnames</text>
<rect class="layer" x="238" y="114" width="384" height="40" rx="6"/>
<text class="t" x="252" y="139">Routes: match path, header, model name, target</text>
<rect class="pol" x="238" y="166" width="384" height="84" rx="6"/>
<text class="t" x="252" y="190">Policies, evaluated per request</text>
<text class="s" x="252" y="210">JWT, API key, OIDC, OAuth for MCP; CEL authorization</text>
<text class="s" x="252" y="228">rate limits, per-key budgets, guardrails</text>
<text class="s" x="252" y="244">transformations, CORS, access logs, OpenTelemetry</text>
<rect class="layer" x="238" y="262" width="384" height="40" rx="6"/>
<text class="t" x="252" y="287">Backends: provider, MCP targets, A2A, plain HTTP</text>
<text class="h" x="668" y="34">Backends</text>
<rect class="box" x="668" y="52" width="196" height="62" rx="8"/>
<text class="t" x="682" y="78">LLM providers</text>
<text class="s" x="682" y="98">hosted or self-hosted</text>
<rect class="box" x="668" y="134" width="196" height="62" rx="8"/>
<text class="t" x="682" y="160">MCP servers</text>
<text class="s" x="682" y="180">stdio, HTTP, SSE, OpenAPI</text>
<rect class="box" x="668" y="216" width="196" height="62" rx="8"/>
<text class="t" x="682" y="242">Other agents</text>
<text class="s" x="682" y="262">A2A endpoints</text>
<path class="ln" d="M180 83 L236 83" marker-end="url(#a)"/>
<path class="ln" d="M180 165 L236 135" marker-end="url(#a)"/>
<path class="ln" d="M180 247 L236 190" marker-end="url(#a)"/>
<path class="ln" d="M622 282 L650 282 L650 83 L666 83" marker-end="url(#a)"/>
<path class="ln" d="M650 165 L666 165" marker-end="url(#a)"/>
<path class="ln" d="M650 247 L666 247" marker-end="url(#a)"/>
<text class="h" x="20" y="372">Configuration</text>
<rect class="cfg" x="20" y="388" width="250" height="72" rx="8"/>
<text class="t" x="34" y="414">Local YAML or JSON file</text>
<text class="s" x="34" y="434">watched on disk, hot reloads routes</text>
<text class="s" x="34" y="450">and policies; UI can write to it</text>
<rect class="cfg" x="20" y="474" width="250" height="72" rx="8"/>
<text class="t" x="34" y="500">xDS from a control plane</text>
<text class="s" x="34" y="520">Kubernetes controller, Gateway API;</text>
<text class="s" x="34" y="536">purpose-built types, not Envoy's</text>
<rect class="cfg" x="330" y="430" width="250" height="72" rx="8"/>
<text class="t" x="344" y="456">Shared internal representation</text>
<text class="s" x="344" y="476">what the proxy actually runs;</text>
<text class="s" x="344" y="492">policies merged at runtime</text>
<rect class="cfg" x="640" y="388" width="220" height="72" rx="8"/>
<text class="t" x="654" y="414">Static config section</text>
<text class="s" x="654" y="434">ports, logging, database;</text>
<text class="s" x="654" y="450">read once, needs a restart</text>
<rect class="box" x="640" y="474" width="220" height="72" rx="8"/>
<text class="t" x="654" y="500">Admin interface</text>
<text class="s" x="654" y="520">localhost:15000, UI and API,</text>
<text class="s" x="654" y="536">no authentication</text>
<path class="lg" d="M270 424 L300 424 L300 456 L328 456" marker-end="url(#g)"/>
<path class="lg" d="M270 510 L300 510 L300 476 L328 476" marker-end="url(#g)"/>
<path class="lg" d="M455 430 L455 322" marker-end="url(#g)"/>
<path class="lg" d="M750 388 L750 350 L600 350 L600 322" marker-end="url(#g)"/>
</svg>
