<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">A StatefulSet gives each Pod a name, a DNS record and a disk of its own</title>
<desc id="d">The StatefulSet web and the headless Service web, which has no cluster IP, manage three Pods: web-0, web-1 and web-2. Each Pod has a stable DNS name of the form web-N.web.k8s-from-zero.svc.cluster.local and its own PersistentVolumeClaim, www-web-0, www-web-1 and www-web-2. web-1 is highlighted: when we deleted it, the controller recreated a Pod with the same name and the same claim, and only its IP changed, from 10.244.1.13 to 10.244.1.16.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Same name, same DNS record, same disk after a restart</text>
<rect class="boxb" x="24" y="52" width="360" height="64" rx="10"/>
<text class="tm" x="40" y="78" text-anchor="start">StatefulSet web</text>
<text class="tm" x="40" y="100" text-anchor="start">replicas: 3, serviceName: web</text>
<rect class="boxb" x="416" y="52" width="360" height="64" rx="10"/>
<text class="tm" x="432" y="78" text-anchor="start">Service web (headless)</text>
<text class="ts" x="432" y="100" text-anchor="start">clusterIP: None, DNS returns Pod IPs</text>
<line class="ln" x1="204" y1="116" x2="140" y2="148" marker-end="url(#ah)"/>
<rect class="boxs" x="24" y="150" width="232" height="150" rx="10"/>
<text class="tm" x="40" y="176" text-anchor="start">Pod web-0</text>
<text class="tm" x="40" y="200" text-anchor="start">web-0.web.k8s-from-zero</text>
<text class="tm" x="40" y="218" text-anchor="start">.svc.cluster.local</text>
<text class="ts" x="40" y="246" text-anchor="start">label apps.kubernetes.io/</text>
<text class="ts" x="40" y="264" text-anchor="start">pod-index: 0</text>
<line class="ln" x1="140" y1="300" x2="140" y2="332" marker-end="url(#ah)"/>
<rect class="boxn" x="24" y="334" width="232" height="52" rx="10"/>
<text class="tm" x="40" y="358" text-anchor="start">PVC www-web-0</text>
<text class="ts" x="40" y="376" text-anchor="start">1Gi RWO, standard</text>
<line class="ln" x1="204" y1="116" x2="396" y2="148" marker-end="url(#ah)"/>
<rect class="boxc" x="280" y="150" width="232" height="150" rx="10"/>
<text class="tm" x="296" y="176" text-anchor="start">Pod web-1</text>
<text class="tm" x="296" y="200" text-anchor="start">web-1.web.k8s-from-zero</text>
<text class="tm" x="296" y="218" text-anchor="start">.svc.cluster.local</text>
<text class="ts" x="296" y="246" text-anchor="start">label apps.kubernetes.io/</text>
<text class="ts" x="296" y="264" text-anchor="start">pod-index: 1</text>
<line class="ln" x1="396" y1="300" x2="396" y2="332" marker-end="url(#ah)"/>
<rect class="boxn" x="280" y="334" width="232" height="52" rx="10"/>
<text class="tm" x="296" y="358" text-anchor="start">PVC www-web-1</text>
<text class="ts" x="296" y="376" text-anchor="start">1Gi RWO, standard</text>
<line class="ln" x1="204" y1="116" x2="652" y2="148" marker-end="url(#ah)"/>
<rect class="boxs" x="536" y="150" width="232" height="150" rx="10"/>
<text class="tm" x="552" y="176" text-anchor="start">Pod web-2</text>
<text class="tm" x="552" y="200" text-anchor="start">web-2.web.k8s-from-zero</text>
<text class="tm" x="552" y="218" text-anchor="start">.svc.cluster.local</text>
<text class="ts" x="552" y="246" text-anchor="start">label apps.kubernetes.io/</text>
<text class="ts" x="552" y="264" text-anchor="start">pod-index: 2</text>
<line class="ln" x1="652" y1="300" x2="652" y2="332" marker-end="url(#ah)"/>
<rect class="boxn" x="536" y="334" width="232" height="52" rx="10"/>
<text class="tm" x="552" y="358" text-anchor="start">PVC www-web-2</text>
<text class="ts" x="552" y="376" text-anchor="start">1Gi RWO, standard</text>
<rect class="panel" x="24" y="404" width="752" height="52" rx="10"/>
<text class="tc" x="40" y="426" text-anchor="start">We deleted web-1: it came back as web-1 with www-web-1 and its index.html.</text>
<text class="ts" x="40" y="446" text-anchor="start">Only the Pod IP changed (10.244.1.13 to 10.244.1.16), so clients use the DNS name.</text>
</svg>
