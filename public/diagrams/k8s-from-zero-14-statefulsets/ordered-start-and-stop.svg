<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">OrderedReady: StatefulSet Pods start in order and stop in reverse</title>
<desc id="d">A timeline of what we watched on kind. Start: web-0 is created and becomes Ready, only then web-1 is created and becomes Ready, then web-2; the three Pods were Ready about 14, 10 and 5 seconds before our next command. Scale down from three to one: web-2 terminates first, then web-1, and web-0 stays. The highlighted box shows what blocks the chain: if a Pod never becomes Ready, the next ordinal is never created. podManagementPolicy Parallel starts and stops all Pods at once.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Start 0, 1, 2. Stop 2, 1. Each step waits for Ready</text>
<text class="t" x="24" y="72" text-anchor="start">Scale up (create)</text>
<rect class="boxs" x="40" y="86" width="200" height="56" rx="10"/>
<text class="tm" x="54" y="110" text-anchor="start">web-0</text>
<text class="ts" x="54" y="130" text-anchor="start">Pending, Running, Ready</text>
<line class="ln" x1="240" y1="114" x2="288" y2="114" marker-end="url(#ah)"/>
<text class="ts" x="244" y="104" text-anchor="start">Ready</text>
<rect class="boxs" x="290" y="86" width="200" height="56" rx="10"/>
<text class="tm" x="304" y="110" text-anchor="start">web-1</text>
<text class="ts" x="304" y="130" text-anchor="start">Pending, Running, Ready</text>
<line class="ln" x1="490" y1="114" x2="538" y2="114" marker-end="url(#ah)"/>
<text class="ts" x="494" y="104" text-anchor="start">Ready</text>
<rect class="boxs" x="540" y="86" width="200" height="56" rx="10"/>
<text class="tm" x="554" y="110" text-anchor="start">web-2</text>
<text class="ts" x="554" y="130" text-anchor="start">Pending, Running, Ready</text>
<text class="t" x="24" y="182" text-anchor="start">Scale down to 1 (delete)</text>
<rect class="box" x="540" y="196" width="200" height="56" rx="10"/>
<text class="tm" x="554" y="220" text-anchor="start">web-2</text>
<text class="ts" x="554" y="240" text-anchor="start">terminates first</text>
<rect class="box" x="290" y="196" width="200" height="56" rx="10"/>
<text class="tm" x="304" y="220" text-anchor="start">web-1</text>
<text class="ts" x="304" y="240" text-anchor="start">terminates second</text>
<line class="ln" x1="540" y1="224" x2="492" y2="224" marker-end="url(#ah)"/>
<rect class="boxs" x="40" y="196" width="200" height="56" rx="10"/>
<text class="tm" x="54" y="220" text-anchor="start">web-0</text>
<text class="ts" x="54" y="240" text-anchor="start">keeps running</text>
<rect class="boxc" x="24" y="274" width="752" height="54" rx="10"/>
<text class="tc" x="40" y="298" text-anchor="start">A Pod that never gets Ready stops the line</text>
<text class="ts" x="40" y="316" text-anchor="start">our first try: web-0 stuck at 0/1 (probe got HTTP 403), web-1 was never created</text>
<rect class="panel" x="24" y="340" width="752" height="44" rx="10"/>
<text class="ts" x="40" y="367" text-anchor="start">podManagementPolicy: Parallel launches or terminates all Pods at once (identity is kept)</text>
</svg>
