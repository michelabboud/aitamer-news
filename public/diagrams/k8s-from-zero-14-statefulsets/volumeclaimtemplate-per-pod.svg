<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">volumeClaimTemplates make one claim per Pod, and the claims outlive the Pods</title>
<desc id="d">On the left, the StatefulSet carries one volumeClaimTemplate named www asking for 1Gi ReadWriteOnce. The controller stamps out one PersistentVolumeClaim per Pod, named template name, StatefulSet name and ordinal: www-web-0, www-web-1, www-web-2, each bound to its own PersistentVolume. On the right, after scaling to one replica, only web-0 runs, but all three claims are still Bound, highlighted. Scaling back to three reattached www-web-2 and its old content. Deleting the StatefulSet also left the claims, unless persistentVolumeClaimRetentionPolicy says Delete.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">One template, one claim per Pod, kept by default</text>
<rect class="boxb" x="24" y="52" width="240" height="120" rx="10"/>
<text class="tm" x="40" y="78" text-anchor="start">volumeClaimTemplates:</text>
<text class="tm" x="40" y="100" text-anchor="start">- name: www</text>
<text class="tm" x="40" y="120" text-anchor="start">  storage: 1Gi</text>
<text class="tm" x="40" y="140" text-anchor="start">  ReadWriteOnce</text>
<text class="ts" x="40" y="162" text-anchor="start">claim name = www-web-N</text>
<line class="ln" x1="264" y1="112" x2="300" y2="70" marker-end="url(#ah)"/>
<rect class="boxn" x="302" y="52" width="170" height="36" rx="8"/>
<text class="tm" x="314" y="75" text-anchor="start">www-web-0</text>
<line class="ln" x1="472" y1="70" x2="498" y2="70" marker-end="url(#ah)"/>
<rect class="boxb" x="500" y="52" width="140" height="36" rx="8"/>
<text class="tm" x="512" y="75" text-anchor="start">PV pvc-...</text>
<line class="ln" x1="264" y1="112" x2="300" y2="114" marker-end="url(#ah)"/>
<rect class="boxn" x="302" y="96" width="170" height="36" rx="8"/>
<text class="tm" x="314" y="119" text-anchor="start">www-web-1</text>
<line class="ln" x1="472" y1="114" x2="498" y2="114" marker-end="url(#ah)"/>
<rect class="boxb" x="500" y="96" width="140" height="36" rx="8"/>
<text class="tm" x="512" y="119" text-anchor="start">PV pvc-...</text>
<line class="ln" x1="264" y1="112" x2="300" y2="158" marker-end="url(#ah)"/>
<rect class="boxn" x="302" y="140" width="170" height="36" rx="8"/>
<text class="tm" x="314" y="163" text-anchor="start">www-web-2</text>
<line class="ln" x1="472" y1="158" x2="498" y2="158" marker-end="url(#ah)"/>
<rect class="boxb" x="500" y="140" width="140" height="36" rx="8"/>
<text class="tm" x="512" y="163" text-anchor="start">PV pvc-...</text>
<text class="ts" x="660" y="80" text-anchor="start">scale to 3</text>
<text class="ts" x="660" y="100" text-anchor="start">all Bound</text>
<rect class="boxc" x="24" y="200" width="752" height="128" rx="10"/>
<text class="tc" x="40" y="224" text-anchor="start">After kubectl scale statefulset web --replicas=1</text>
<rect class="boxs" x="40" y="238" width="160" height="36" rx="8"/>
<text class="tm" x="52" y="261" text-anchor="start">Pod web-0 Running</text>
<rect class="boxn" x="232" y="238" width="164" height="36" rx="8"/>
<text class="tm" x="244" y="261" text-anchor="start">www-web-0 Bound</text>
<rect class="boxn" x="412" y="238" width="164" height="36" rx="8"/>
<text class="tm" x="424" y="261" text-anchor="start">www-web-1 Bound</text>
<rect class="boxn" x="592" y="238" width="164" height="36" rx="8"/>
<text class="tm" x="604" y="261" text-anchor="start">www-web-2 Bound</text>
<text class="ts" x="40" y="302" text-anchor="start">web-1 and web-2 are gone, their claims and data stay. Scale back up and they reattach.</text>
<rect class="panel" x="24" y="346" width="752" height="78" rx="10"/>
<text class="t" x="40" y="370" text-anchor="start">persistentVolumeClaimRetentionPolicy (stable since v1.32)</text>
<text class="tm" x="40" y="394" text-anchor="start">whenDeleted / whenScaled: Retain (default) keeps claims; Delete removes them</text>
<text class="ts" x="40" y="414" text-anchor="start">We set whenDeleted: Delete on pg, deleted it, and data-pg-0 went too.</text>
</svg>
