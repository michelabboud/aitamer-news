<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.soft{fill:#f4efe4;stroke:#2f4763;stroke-width:2;stroke-dasharray:6 4}.ban{fill:#f4efe4;stroke:#f26b4f;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ws{font:13px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}.arr{fill:#2f4763}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ws{fill:#152130}.ln{stroke:#9fb4cc}.soft{fill:#152130;stroke:#9fb4cc}.ban{fill:#152130}.arr{fill:#9fb4cc}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arr"/></marker></defs><rect class="bg" width="800" height="320"/><rect class="soft" x="10" y="30" width="220" height="230" rx="10"/><text class="s" x="25" y="52">Proactive research (read-only)</text><rect class="box" x="30" y="90" width="180" height="70" rx="8"/><text class="t" x="120.0" y="114" text-anchor="middle">Dot observes</text><text class="s" x="120.0" y="135" text-anchor="middle">inspects, cannot send or change</text><rect class="gate" x="290" y="100" width="140" height="60" rx="8"/><text class="w" x="360.0" y="135.0" text-anchor="middle">Action rules</text><path class="ln" d="M210 125L290 125" marker-end="url(#a)"/><rect class="box" x="540" y="20" width="240" height="60" rx="8"/><text class="t" x="660.0" y="44" text-anchor="middle">Allow</text><text class="s" x="660.0" y="65" text-anchor="middle">runs without asking</text><rect class="box" x="540" y="110" width="240" height="60" rx="8"/><text class="t" x="660.0" y="134" text-anchor="middle">Require approval</text><text class="s" x="660.0" y="155" text-anchor="middle">waits for a human yes</text><rect class="ban" x="540" y="200" width="240" height="60" rx="8"/><text class="t" x="660.0" y="224" text-anchor="middle">Ban</text><text class="s" x="660.0" y="245" text-anchor="middle">never allowed</text><path class="ln" d="M430 115L540 50" marker-end="url(#a)"/><path class="ln" d="M430 130L540 140" marker-end="url(#a)"/><path class="no" d="M430 145L540 230"/><text class="s" x="10" y="300">Changing a password always stays with the human, per the reports.</text></svg>
