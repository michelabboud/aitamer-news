<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.soft{fill:#f4efe4;stroke:#2f4763;stroke-width:2;stroke-dasharray:6 4}.ban{fill:#f4efe4;stroke:#f26b4f;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ws{font:13px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}.arr{fill:#2f4763}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ws{fill:#152130}.ln{stroke:#9fb4cc}.soft{fill:#152130;stroke:#9fb4cc}.ban{fill:#152130}.arr{fill:#9fb4cc}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arr"/></marker></defs><rect class="bg" width="800" height="320"/><rect class="box" x="10" y="80" width="130" height="70" rx="8"/><text class="t" x="75.0" y="104" text-anchor="middle">Chat</text><text class="s" x="75.0" y="125" text-anchor="middle">you message your Dot</text><rect class="soft" x="190" y="30" width="330" height="200" rx="10"/><text class="s" x="205" y="52">Visible to you while it works</text><rect class="core" x="210" y="70" width="150" height="70" rx="8"/><text class="w" x="285.0" y="94" text-anchor="middle">Cloud computer</text><text class="ws" x="285.0" y="115" text-anchor="middle">its own, runs 24/7</text><rect class="box" x="210" y="150" width="150" height="60" rx="8"/><text class="t" x="285.0" y="174" text-anchor="middle">Browser</text><text class="s" x="285.0" y="195" text-anchor="middle">in the cloud computer</text><rect class="box" x="390" y="90" width="110" height="90" rx="8"/><text class="t" x="445.0" y="114" text-anchor="middle">Plugins</text><text class="s" x="445.0" y="135" text-anchor="middle">4,000+ apps</text><path class="ln" d="M140 115L190 115" marker-end="url(#a)"/><path class="ln" d="M360 105L390 120" marker-end="url(#a)"/><path class="ln" d="M285 140L285 150" marker-end="url(#a)"/><rect class="gate" x="590" y="80" width="190" height="70" rx="8"/><text class="w" x="685.0" y="104" text-anchor="middle">Action review and approval</text><text class="ws" x="685.0" y="125" text-anchor="middle">before sending, changing content or controlling a browser</text><path class="ln" d="M520 115L590 115" marker-end="url(#a)"/><text class="s" x="10" y="275">Proactive research: read-only tools that cannot send messages, change content or control a browser.</text><text class="s" x="10" y="297">Follow-up actions follow the rules: allow, require approval, or ban.</text></svg>
