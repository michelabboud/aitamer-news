<rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Pod duo: one sandbox, two containers, one IP</text>
<rect class="panel" x="24" y="52" width="752" height="300" rx="12"/>
<text class="tm" x="38" y="76" text-anchor="start">sandbox 8d7cbeb76f082 (shim PID 5067), IP 10.244.2.19</text>
<rect class="boxb" x="44" y="92" width="712" height="52" rx="10"/>
<text class="ts" x="58" y="114" text-anchor="start">shared: network namespace (IP, localhost, ports), IPC namespace</text>
<text class="ts" x="58" y="134" text-anchor="start">held open by /pause (PID 5092, image registry.k8s.io/pause:3.10)</text>
<rect class="box" x="44" y="160" width="340" height="170" rx="10"/>
