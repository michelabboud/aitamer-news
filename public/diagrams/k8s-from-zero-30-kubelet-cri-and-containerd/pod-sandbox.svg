<text class="ts" x="430" y="206" text-anchor="start">sleep 3600, PID 5147</text>
<text class="ts" x="430" y="226" text-anchor="start">own PID namespace</text>
<text class="ts" x="430" y="264" text-anchor="start">untouched by the restart</text>
<rect class="boxn" x="24" y="368" width="752" height="62" rx="10"/>
<text class="tm" x="38" y="392" text-anchor="start">cgroup: kubelet-kubepods-besteffort-pod7f557ec9_..._.slice</text>
<text class="ts" x="38" y="414" text-anchor="start">three scopes inside: the sandbox and both containers; cpu.weight 1 (BestEffort)</text>
