<rect class="boxd" x="58" y="244" width="312" height="30" rx="6"/>
<text class="ts" x="70" y="264" text-anchor="start">attempt 0: Exited, code 137</text>
<rect class="boxc" x="58" y="284" width="312" height="30" rx="6"/>
<text class="ts" x="70" y="304" text-anchor="start">attempt 1: Running, same sandbox</text>
<rect class="box" x="416" y="160" width="340" height="170" rx="10"/>
