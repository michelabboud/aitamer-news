<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">A Pod is a sandbox plus containers that join its namespaces</title>
<desc id="d">Pod duo, sandbox ID 8d7cbeb76f082, IP 10.244.2.19. The shim PID 5067 is the parent of /pause PID 5092, the sandbox, and two sleep 3600 processes: container app PID 5118 and container helper PID 5147. The sandbox holds the network namespace, so both containers share the IP and localhost, and the IPC namespace. Each container has its own PID namespace by default. After we stopped container app with crictl, the kubelet started attempt 1 in the same sandbox, highlighted, so the Pod IP stayed the same; the old container stayed Exited with code 137.</desc>
