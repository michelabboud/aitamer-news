<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
<title id="t">From the API server down to runc on one node</title>
<desc id="d">The API server stores Pod duo with spec.nodeName k8s-ep28-worker. On the node, the kubelet, a systemd service with PID 260, watches for Pods bound to it and calls containerd over CRI, gRPC on unix:///run/containerd/containerd.sock. containerd 2.3.4 starts one containerd-shim-runc-v2 per Pod, here PID 5067, and the shim uses runc to create the pause sandbox and the two app containers, highlighted. Each container runs in a cgroup under kubelet-kubepods, systemd driver, cgroup v2. Side tools: crictl talks to the same CRI socket and sees what the kubelet sees; ctr -n k8s.io talks to containerd directly; runc list shows the processes.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">The kubelet asks; containerd and runc do the work</text>
<rect class="boxb" x="24" y="52" width="752" height="46" rx="10"/>
<text class="tm" x="38" y="80" text-anchor="start">API server: Pod duo, spec.nodeName k8s-ep28-worker</text>
<rect class="panel" x="24" y="112" width="520" height="350" rx="10"/>
<text class="tm" x="38" y="134" text-anchor="start">node k8s-ep28-worker</text>
<line class="ln" x1="240" y1="98" x2="240" y2="146" marker-end="url(#ah)"/>
<rect class="box" x="44" y="148" width="480" height="46" rx="8"/>
<text class="tm" x="58" y="176" text-anchor="start">kubelet (systemd service, PID 260)</text>
<line class="ln" x1="284" y1="194" x2="284" y2="220" marker-end="url(#ah)"/>
<text class="ts" x="296" y="214" text-anchor="start">CRI gRPC: /run/containerd/containerd.sock</text>
<rect class="box" x="44" y="222" width="480" height="46" rx="8"/>
<text class="tm" x="58" y="250" text-anchor="start">containerd 2.3.4 (CRI plugin)</text>
<line class="ln" x1="284" y1="268" x2="284" y2="290" marker-end="url(#ah)"/>
<rect class="box" x="44" y="292" width="480" height="46" rx="8"/>
<text class="tm" x="58" y="320" text-anchor="start">containerd-shim-runc-v2, one per Pod (PID 5067)</text>
<line class="ln" x1="284" y1="338" x2="284" y2="360" marker-end="url(#ah)"/>
<text class="ts" x="296" y="354" text-anchor="start">runc create / start</text>
<rect class="boxs" x="44" y="362" width="152" height="40" rx="8"/>
<text class="tm" x="120" y="387" text-anchor="middle">/pause</text>
<rect class="boxc" x="208" y="362" width="152" height="40" rx="8"/>
<text class="tc" x="284" y="387" text-anchor="middle">app: sleep</text>
<rect class="boxc" x="372" y="362" width="152" height="40" rx="8"/>
<text class="tc" x="448" y="387" text-anchor="middle">helper: sleep</text>
<text class="ts" x="44" y="428" text-anchor="start">each in a cgroup under kubelet-kubepods (systemd driver, v2)</text>
<rect class="boxn" x="568" y="112" width="208" height="100" rx="10"/>
<text class="tm" x="582" y="138" text-anchor="start">crictl</text>
<text class="ts" x="582" y="160" text-anchor="start">same CRI socket:</text>
<text class="ts" x="582" y="180" text-anchor="start">sees Pods and containers</text>
<path class="ln" d="M 568 170 L 528 245" marker-end="url(#ah)"/>
<rect class="boxn" x="568" y="226" width="208" height="90" rx="10"/>
<text class="tm" x="582" y="252" text-anchor="start">ctr -n k8s.io</text>
<text class="ts" x="582" y="274" text-anchor="start">containerd directly,</text>
<text class="ts" x="582" y="294" text-anchor="start">full IDs</text>
<path class="ln" d="M 568 280 L 528 255" marker-end="url(#ah)"/>
<rect class="boxn" x="568" y="330" width="208" height="90" rx="10"/>
<text class="tm" x="582" y="356" text-anchor="start">runc list</text>
<text class="ts" x="582" y="378" text-anchor="start">--root /run/containerd/</text>
<text class="ts" x="582" y="398" text-anchor="start">runc/k8s.io</text>
<path class="ln" d="M 568 372 L 528 330" marker-end="url(#ah)"/>
<text class="ts" x="568" y="452" text-anchor="start">look with these; change via the API</text>
</svg>
