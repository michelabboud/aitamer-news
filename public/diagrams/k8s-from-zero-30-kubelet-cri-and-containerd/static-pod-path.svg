<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Two paths to a running Pod: through the API, or from a file</title>
<desc id="d">Top path: a normal Pod is created in the API server, the scheduler sets nodeName, and the kubelet on that node starts it through CRI. Bottom path: the file static-web.yaml in /etc/kubernetes/manifests on k8s-ep28-worker is read by the kubelet, which rechecks the folder every 20 seconds, starts it through CRI, and reports a mirror Pod static-web-k8s-ep28-worker to the API server, owned by Node k8s-ep28-worker, with annotation config.source file, highlighted. In our run, deleting the mirror Pod left the container running and the mirror came back about 60 seconds later; deleting the file removed the container and the mirror Pod within 5 seconds. kubeadm and kind run etcd, the API server, the controller manager and the scheduler this way.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A static Pod lives in a file; the API only gets a mirror</text>
<rect class="boxb" x="24" y="56" width="170" height="52" rx="10"/>
<text class="tm" x="38" y="87" text-anchor="start">API server</text>
<line class="ln" x1="194" y1="82" x2="240" y2="82" marker-end="url(#ah)"/>
<rect class="box" x="242" y="56" width="170" height="52" rx="10"/>
<text class="tm" x="256" y="80" text-anchor="start">scheduler</text>
<text class="ts" x="256" y="98" text-anchor="start">sets nodeName</text>
<line class="ln" x1="412" y1="82" x2="458" y2="82" marker-end="url(#ah)"/>
<rect class="box" x="460" y="56" width="316" height="52" rx="10"/>
<text class="tm" x="474" y="80" text-anchor="start">kubelet</text>
<text class="ts" x="474" y="98" text-anchor="start">starts it through CRI</text>
<text class="ts" x="24" y="136" text-anchor="start">normal Pod: created through the API</text>
<line class="lnf" x1="24" y1="154" x2="776" y2="154"/>
<rect class="boxn" x="24" y="176" width="250" height="84" rx="10"/>
<text class="tm" x="38" y="200" text-anchor="start">file on the node</text>
<text class="ts" x="38" y="222" text-anchor="start">/etc/kubernetes/manifests/</text>
<text class="ts" x="38" y="242" text-anchor="start">static-web.yaml</text>
<line class="ln" x1="274" y1="218" x2="320" y2="218" marker-end="url(#ah)"/>
<rect class="box" x="322" y="176" width="200" height="84" rx="10"/>
<text class="tm" x="336" y="200" text-anchor="start">kubelet</text>
<text class="ts" x="336" y="222" text-anchor="start">rechecks every 20s</text>
<text class="ts" x="336" y="242" text-anchor="start">starts via CRI</text>
<line class="lnc" x1="522" y1="218" x2="568" y2="218" marker-end="url(#ahc)"/>
<rect class="boxc" x="570" y="176" width="206" height="84" rx="10"/>
<text class="tc" x="584" y="200" text-anchor="start">mirror Pod</text>
<text class="ts" x="584" y="222" text-anchor="start">static-web-k8s-ep28-</text>
<text class="ts" x="584" y="242" text-anchor="start">worker, owner Node</text>
<rect class="panel" x="24" y="280" width="370" height="136" rx="10"/>
<text class="tm" x="38" y="304" text-anchor="start">delete the mirror Pod</text>
<text class="ts" x="38" y="328" text-anchor="start">Terminating for about 60s,</text>
<text class="ts" x="38" y="348" text-anchor="start">then a new mirror Pod;</text>
<text class="ts" x="38" y="368" text-anchor="start">the container kept running,</text>
<text class="ts" x="38" y="388" text-anchor="start">attempt 0</text>
<rect class="panel" x="406" y="280" width="370" height="136" rx="10"/>
<text class="tm" x="420" y="304" text-anchor="start">delete the file</text>
<text class="ts" x="420" y="328" text-anchor="start">container and mirror Pod</text>
<text class="ts" x="420" y="348" text-anchor="start">gone within 5s</text>
<text class="ts" x="420" y="384" text-anchor="start">control plane on kind: etcd, apiserver,</text>
<text class="ts" x="420" y="404" text-anchor="start">controller-manager, scheduler</text>
</svg>
