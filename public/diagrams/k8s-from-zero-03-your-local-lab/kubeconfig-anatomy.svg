<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a kubeconfig file</title>
<desc id="d">A kubeconfig file has three lists and one pointer. clusters holds a name, the API server address and its CA certificate. users holds a name and the credentials, here a client certificate and key. contexts joins one cluster, one user and an optional default namespace under one name, such as kind-first and kind-lab. current-context names the context kubectl uses when you give no --context flag; it is highlighted because it decides which cluster every command hits.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">kubeconfig: clusters plus users, joined by contexts</text>
<rect class="boxb" x="24" y="56" width="268" height="150" rx="10"/>
<text class="tb" x="36" y="82" text-anchor="start">clusters:</text>
<text class="tm" x="36" y="99" text-anchor="start">- name: kind-first</text>
<text class="tm" x="52" y="116" text-anchor="start">server: https://127.0.0.1:33343</text>
<text class="tm" x="52" y="133" text-anchor="start">certificate-authority-data</text>
<text class="tm" x="36" y="150" text-anchor="start">- name: kind-lab</text>
<rect class="boxs" x="24" y="236" width="268" height="150" rx="10"/>
<text class="tb" x="36" y="262" text-anchor="start">users:</text>
<text class="tm" x="36" y="279" text-anchor="start">- name: kind-first</text>
<text class="tm" x="52" y="296" text-anchor="start">client-certificate-data</text>
<text class="tm" x="52" y="313" text-anchor="start">client-key-data</text>
<text class="tm" x="36" y="330" text-anchor="start">- name: kind-lab</text>
<rect class="box" x="336" y="120" width="236" height="180" rx="10"/>
<text class="tb" x="348" y="146" text-anchor="start">contexts:</text>
<text class="tm" x="348" y="164" text-anchor="start">- name: kind-first</text>
<text class="tm" x="364" y="182" text-anchor="start">cluster: kind-first</text>
<text class="tm" x="364" y="200" text-anchor="start">user: kind-first</text>
<text class="tm" x="364" y="218" text-anchor="start">namespace: kube-system</text>
<text class="tm" x="348" y="236" text-anchor="start">- name: kind-lab</text>
<text class="tm" x="364" y="254" text-anchor="start">cluster: kind-lab</text>
<text class="tm" x="364" y="272" text-anchor="start">user: kind-lab</text>
<line class="ln" x1="292" y1="130" x2="334" y2="170" marker-end="url(#ah)"/>
<line class="ln" x1="292" y1="310" x2="334" y2="250" marker-end="url(#ah)"/>
<rect class="boxc" x="610" y="170" width="166" height="80" rx="10"/>
<text class="tb" x="622" y="200" text-anchor="start">current-context:</text>
<text class="tm" x="622" y="220" text-anchor="start">kind-first</text>
<line class="lnc" x1="608" y1="210" x2="574" y2="190" marker-end="url(#ahc)"/>
<text class="ts" x="24" y="414" text-anchor="start">kubectl reads ~/.kube/config, or the files listed in $KUBECONFIG, merged in order. --context picks a context for one command.</text>
</svg>
