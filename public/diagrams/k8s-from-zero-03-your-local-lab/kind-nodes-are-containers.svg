<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">kind nodes are containers</title>
<desc id="d">Your computer runs Docker. kind asks Docker to start one container per Kubernetes node: lab-control-plane, lab-worker and lab-worker2, all from the kindest/node image. Inside each node container, systemd runs the kubelet and containerd, and containerd runs that node&#x27;s pods as nested containers. The control-plane container also runs the API server, and Docker publishes its port 6443 on a random port of 127.0.0.1 on your computer, which is where kubectl connects. That published port is highlighted.</desc>
