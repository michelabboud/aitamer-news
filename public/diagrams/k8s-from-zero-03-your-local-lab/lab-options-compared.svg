<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Local lab options compared</title>
<desc id="d">A table comparing four ways to run Kubernetes on your own computer: kind, minikube, k3d and Docker Desktop. kind runs each node as a container, supports several nodes, picks the Kubernetes version by node image, and runs upstream Kubernetes; it is the series default and is highlighted. minikube runs in a virtual machine, a container or on bare metal, supports several nodes with --nodes, picks the version with --kubernetes-version, and runs upstream Kubernetes. k3d runs k3s, a lightweight Kubernetes distribution, in Docker containers, with one or several nodes. Docker Desktop has a built-in cluster with two provisioners: kubeadm, one node with the version set by Docker Desktop, and kind, several nodes with a version you choose; large companies need a paid Docker subscription.</desc>
