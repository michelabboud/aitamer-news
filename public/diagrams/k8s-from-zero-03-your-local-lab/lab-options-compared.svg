<text class="ts" x="510" y="208" text-anchor="start">--kubernetes-version</text>
<text class="ts" x="640" y="208" text-anchor="start">upstream</text>
<rect class="box" x="24" y="256" width="752" height="70" rx="8"/>
<text class="tb" x="34" y="286" text-anchor="start">k3d</text>
<text class="ts" x="180" y="286" text-anchor="start">containers (Docker)</text>
