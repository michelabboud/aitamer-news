<text class="tm" x="554" y="234" text-anchor="start">Informer</text>
<text class="ts" x="554" y="258" text-anchor="start">updates cache,</text>
<text class="ts" x="554" y="278" text-anchor="start">calls event handlers</text>
<line class="ln" x1="540" y1="252" x2="494" y2="252" marker-end="url(#ah)"/>
<rect class="boxs" x="272" y="208" width="220" height="90" rx="10"/>
<text class="tm" x="286" y="234" text-anchor="start">Indexer cache</text>
<text class="ts" x="286" y="258" text-anchor="start">key: namespace/name</text>
<text class="ts" x="286" y="278" text-anchor="start">in memory</text>
<line class="ln" x1="658" y1="298" x2="658" y2="328" marker-end="url(#ah)"/>
<rect class="boxn" x="540" y="330" width="236" height="74" rx="10"/>
<text class="tm" x="554" y="356" text-anchor="start">work queue (keys only)</text>
<text class="ts" x="554" y="380" text-anchor="start">k8s-from-zero/web-...</text>
<line class="ln" x1="540" y1="366" x2="494" y2="366" marker-end="url(#ah)"/>
<rect class="box" x="272" y="330" width="220" height="74" rx="10"/>
<text class="tm" x="286" y="356" text-anchor="start">worker: reconcile</text>
<text class="ts" x="286" y="380" text-anchor="start">reads from the cache</text>
<line class="ln" x1="382" y1="330" x2="382" y2="300" marker-end="url(#ah)"/>
<path class="lnc" d="M 272 380 L 124 380 L 124 178" marker-end="url(#ahc)"/>
<text class="ts" x="38" y="404" text-anchor="start">writes: create,</text>
<text class="ts" x="38" y="424" text-anchor="start">update, delete</text>
<text class="ts" x="24" y="452" text-anchor="start">Ten quick changes to one object can become one reconcile of its latest state.</text>
</svg>
