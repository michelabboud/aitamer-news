<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Inside a client-go controller: list, watch, cache, queue, reconcile</title>
<desc id="d">The Reflector lists Pods once, collection resourceVersion 2118 in our run, then watches from that version. Watch events such as MODIFIED for web-54b4c486f7-7qnq8, ADDED for web-54b4c486f7-5kjh8 and DELETED flow into a DeltaFIFO queue. The Informer pops them, updates the local Indexer cache keyed by namespace and name, and calls resource event handlers. The handlers add only keys, such as k8s-from-zero/web-54b4c486f7, to a work queue. Worker functions pop a key, read the latest object from the cache, reconcile, and write changes back through the API server, highlighted. Reads come from memory; only writes go to the API server.</desc>
