<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Reads come from a local cache; only writes go to the API server</text>
<rect class="boxb" x="24" y="56" width="200" height="120" rx="10"/>
<text class="tm" x="38" y="82" text-anchor="start">API server</text>
