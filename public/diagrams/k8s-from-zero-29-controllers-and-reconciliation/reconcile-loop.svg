}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="456" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A controller closes the gap between spec and reality, every pass</text>
<rect class="boxb" x="24" y="56" width="220" height="70" rx="10"/>
<text class="tm" x="38" y="82" text-anchor="start">desired state</text>
<text class="ts" x="38" y="104" text-anchor="start">spec.replicas: 3</text>
<rect class="boxs" x="24" y="250" width="220" height="70" rx="10"/>
<text class="tm" x="38" y="276" text-anchor="start">actual state</text>
<text class="ts" x="38" y="298" text-anchor="start">Pods that exist now</text>
<rect class="panel" x="300" y="150" width="200" height="76" rx="10"/>
<text class="tm" x="400" y="180" text-anchor="middle">compare</text>
<text class="ts" x="400" y="202" text-anchor="middle">want vs have</text>
<line class="ln" x1="244" y1="100" x2="300" y2="170" marker-end="url(#ah)"/>
<line class="ln" x1="244" y1="280" x2="300" y2="210" marker-end="url(#ah)"/>
<rect class="boxc" x="556" y="56" width="220" height="70" rx="10"/>
<text class="tc" x="570" y="82" text-anchor="start">act</text>
<text class="ts" x="570" y="104" text-anchor="start">create or delete Pods</text>
<rect class="box" x="556" y="250" width="220" height="70" rx="10"/>
<text class="tm" x="570" y="276" text-anchor="start">API server</text>
<text class="ts" x="570" y="298" text-anchor="start">stores the change</text>
<line class="lnc" x1="500" y1="170" x2="556" y2="100" marker-end="url(#ahc)"/>
<line class="ln" x1="666" y1="126" x2="666" y2="250" marker-end="url(#ah)"/>
<path class="ln" d="M 556 300 L 400 340 L 244 300" marker-end="url(#ah)"/>
<text class="ts" x="400" y="356" text-anchor="middle">next pass sees the new state</text>
<rect class="boxn" x="24" y="366" width="752" height="74" rx="10"/>
<text class="ts" x="38" y="386" text-anchor="start">toy-controller.sh, passes that acted (UTC):</text>
<text class="tm" x="38" y="406" text-anchor="start">21:41:36 want=2 have=0 create; 21:41:38 have=1 create; 21:41:47 want=3 have=2 create</text>
<text class="tm" x="38" y="426" text-anchor="start">21:41:53 have=2 create (our delete); 21:42:02 want=1 have=3 delete; 21:42:04 delete</text>
<rect class="panel" x="300" y="56" width="200" height="70" rx="10"/>
<text class="tm" x="400" y="84" text-anchor="middle">level-triggered</text>
<text class="ts" x="400" y="106" text-anchor="middle">reads the whole state</text>
</svg>
