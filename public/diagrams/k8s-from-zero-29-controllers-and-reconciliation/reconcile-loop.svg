<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="t d">
<title id="t">The reconcile loop: observe, compare, act, repeat</title>
<desc id="d">A controller reads desired state from the spec of the object it tracks, for example ReplicaSet spec.replicas or, in our shell controller, the ConfigMap toy-desired. It observes actual state, the Pods it manages. It computes the difference and acts through the API server, creating or deleting Pods, highlighted, and writes status. The change returns as new actual state on the next pass. Because it is level-triggered, a missed event does not matter. A log panel shows the passes that acted in our run: want 2 have 0 create, want 2 have 1 create, want 3 have 2 create, want 3 have 2 create after a manual delete, want 1 have 3 delete, want 1 have 2 delete.</desc>
<style>
