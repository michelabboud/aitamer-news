<text class="tm" x="250" y="445" text-anchor="start">Running</text>
<text class="tm" x="380" y="445" text-anchor="start">Terminated / Waiting</text>
<text class="ts" x="560" y="445" text-anchor="start">exit 1, restarting</text>
<text class="tm" x="40" y="466" text-anchor="start">Completed</text>
<text class="tm" x="250" y="466" text-anchor="start">Succeeded</text>
<text class="tm" x="380" y="466" text-anchor="start">Terminated</text>
<text class="ts" x="560" y="466" text-anchor="start">exit 0, Never</text>
</svg>
