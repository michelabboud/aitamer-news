<rect class="boxd" x="610" y="74" width="166" height="40" rx="8"/>
<text class="tm" x="693" y="99" text-anchor="middle">Unknown</text>
<text class="ts" x="693" y="132" text-anchor="middle">node not reachable</text>
<text class="t" x="24" y="200" text-anchor="start">Container state</text>
<text class="tm" x="146" y="200" text-anchor="start">status.containerStatuses[].state</text>
<rect class="boxs" x="24" y="212" width="150" height="40" rx="8"/>
<text class="tm" x="99" y="237" text-anchor="middle">Waiting</text>
<rect class="boxs" x="214" y="212" width="150" height="40" rx="8"/>
<text class="tm" x="289" y="237" text-anchor="middle">Running</text>
<rect class="boxs" x="404" y="212" width="150" height="40" rx="8"/>
<text class="tm" x="479" y="237" text-anchor="middle">Terminated</text>
<line class="ln" x1="174" y1="232" x2="212" y2="232" marker-end="url(#ah)"/>
<line class="ln" x1="364" y1="232" x2="402" y2="232" marker-end="url(#ah)"/>
<path class="ln" d="M479 252 L479 276 L99 276 L99 254" marker-end="url(#ah)"/>
<text class="ts" x="289" y="294" text-anchor="middle">restart, if restartPolicy allows it (with a growing back-off delay)</text>
<rect class="boxc" x="24" y="312" width="752" height="174" rx="10"/>
<text class="tc" x="40" y="336" text-anchor="start">What the STATUS column showed in our lab</text>
<text class="t" x="40" y="360" text-anchor="start">STATUS</text>
