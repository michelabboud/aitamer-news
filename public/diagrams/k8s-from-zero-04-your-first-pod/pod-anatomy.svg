  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">What a Pod wraps around one container</text>
<rect class="boxs" x="24" y="50" width="500" height="330" rx="12"/>
<text class="th" x="40" y="74" text-anchor="start">Node</text>
<text class="tm" x="92" y="74" text-anchor="start">k8s-ep04-control-plane</text>
<text class="ts" x="40" y="94" text-anchor="start">the kubelet on this node starts and watches the Pod</text>
<rect class="box" x="44" y="108" width="460" height="256" rx="10"/>
<text class="th" x="60" y="132" text-anchor="start">Pod</text>
<text class="tm" x="98" y="132" text-anchor="start">hello</text>
<text class="ts" x="150" y="132" text-anchor="start">namespace k8s-from-zero</text>
<rect class="boxc" x="60" y="146" width="428" height="40" rx="8"/>
<text class="tc" x="76" y="171" text-anchor="start">One IP for the whole Pod:</text>
<text class="tm" x="276" y="171" text-anchor="start">10.244.0.5</text>
<rect class="boxn" x="60" y="200" width="162" height="148" rx="8"/>
<text class="t" x="76" y="224" text-anchor="start">volume</text>
<text class="tm" x="76" y="248" text-anchor="start">kube-api-access</text>
<text class="ts" x="76" y="270" text-anchor="start">mounted read-only</text>
<text class="ts" x="76" y="290" text-anchor="start">added by Kubernetes</text>
<text class="ts" x="76" y="310" text-anchor="start">(token for talking</text>
<text class="ts" x="76" y="328" text-anchor="start">to the API)</text>
<rect class="boxs" x="238" y="200" width="250" height="148" rx="8"/>
<text class="t" x="254" y="224" text-anchor="start">container</text>
<text class="tm" x="324" y="224" text-anchor="start">web</text>
<text class="tm" x="254" y="250" text-anchor="start">image: nginx:1.29-alpine</text>
<text class="tm" x="254" y="272" text-anchor="start">containerPort: 80</text>
<text class="ts" x="254" y="294" text-anchor="start">main process: nginx</text>
<text class="ts" x="254" y="316" text-anchor="start">stdout and stderr go to the log</text>
<text class="ts" x="254" y="336" text-anchor="start">restartPolicy: Always (default)</text>
<line class="ln" x1="222" y1="274" x2="236" y2="274"/>
<rect class="boxb" x="548" y="110" width="228" height="62" rx="8"/>
<text class="tm" x="562" y="136" text-anchor="start">kubectl logs hello</text>
<text class="ts" x="562" y="156" text-anchor="start">reads the container log</text>
<line class="lnb" x1="548" y1="141" x2="490" y2="236" marker-end="url(#ah)"/>
<rect class="boxb" x="548" y="200" width="228" height="62" rx="8"/>
<text class="tm" x="562" y="226" text-anchor="start">kubectl exec hello -- ...</text>
<text class="ts" x="562" y="246" text-anchor="start">runs a command inside</text>
<line class="lnb" x1="548" y1="231" x2="490" y2="272" marker-end="url(#ah)"/>
<rect class="boxb" x="548" y="290" width="228" height="62" rx="8"/>
<text class="tm" x="562" y="316" text-anchor="start">kubectl port-forward</text>
<text class="ts" x="562" y="336" text-anchor="start">localhost:8080 to Pod port 80</text>
<line class="lnb" x1="548" y1="321" x2="490" y2="308" marker-end="url(#ah)"/>
<text class="ts" x="548" y="378" text-anchor="start">Each command goes through the API server.</text>
</svg>
