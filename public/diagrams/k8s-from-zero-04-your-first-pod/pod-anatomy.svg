<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">Anatomy of the Pod named hello</title>
<desc id="d">A node runs the Pod named hello. Inside the Pod is one container called web, built from the image nginx:1.29-alpine and listening on port 80, plus a read-only volume that Kubernetes mounts for the service account token. The Pod, not the container, owns the IP address 10.244.0.5, which is highlighted. On the right, kubectl logs reads the container output, kubectl exec runs a command inside the container, and kubectl port-forward tunnels local port 8080 to port 80 of the Pod.</desc>
<style>
