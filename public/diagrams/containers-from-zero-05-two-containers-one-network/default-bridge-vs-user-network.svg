<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">Names work on a user-defined network</title>
<desc id="d">Two panels. On the left, the default bridge network: the container web has the address 172.17.0.2. A second container asks for http://web:8000/ and gets wget: bad address &#x27;web:8000&#x27;, because the default bridge has no name lookup between containers; asking for the address 172.17.0.2 works. On the right, the user-defined network hello-net: the second container asks Docker&#x27;s embedded DNS server at 127.0.0.11 for web, gets 172.18.0.2, and reaches the app. The right-hand panel is highlighted.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="430" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Default bridge: addresses only. Your own network: names too.</text>
<rect class="panel" x="24" y="50" width="364" height="360" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">default bridge network</text>
<rect class="box" x="44" y="96" width="324" height="56" rx="10"/>
<text class="tb" x="206" y="120.0" text-anchor="middle">web</text>
<text class="ts" x="206" y="137.0" text-anchor="middle">172.17.0.2:8000</text>
<rect class="box" x="44" y="220" width="152" height="72" rx="10"/>
<text class="tb" x="120" y="243.5" text-anchor="middle">alpine</text>
<text class="ts" x="120" y="260.5" text-anchor="middle">wget</text>
<text class="ts" x="120" y="277.5" text-anchor="middle">http://web:8000/</text>
<rect class="box" x="216" y="220" width="152" height="72" rx="10"/>
<text class="tb" x="292" y="243.5" text-anchor="middle">alpine</text>
<text class="ts" x="292" y="260.5" text-anchor="middle">wget</text>
<text class="ts" x="292" y="277.5" text-anchor="middle">http://172.17.0.2:8000/</text>
<text class="tb" x="120" y="322" text-anchor="middle">bad address &#x27;web:8000&#x27;</text>
<text class="ts" x="120" y="342" text-anchor="middle">no name lookup</text>
<line class="ln" x1="292" y1="218" x2="292" y2="154" marker-end="url(#ah)"/>
<text class="tb" x="292" y="322" text-anchor="middle">by address: works</text>
<text class="ts" x="292" y="342" text-anchor="middle">visit 1</text>
<rect class="panel" x="412" y="50" width="364" height="360" rx="10"/>
<text class="th" x="428" y="76" text-anchor="start">user-defined network hello-net</text>
<rect class="boxc" x="432" y="96" width="324" height="56" rx="10"/>
<text class="tb" x="594" y="120.0" text-anchor="middle">web</text>
<text class="ts" x="594" y="137.0" text-anchor="middle">172.18.0.2:8000</text>
<rect class="boxs" x="432" y="196" width="160" height="72" rx="10"/>
<text class="tb" x="512" y="228.0" text-anchor="middle">embedded DNS</text>
<text class="ts" x="512" y="245.0" text-anchor="middle">127.0.0.11</text>
<rect class="box" x="608" y="196" width="148" height="72" rx="10"/>
<text class="tb" x="682" y="219.5" text-anchor="middle">alpine</text>
<text class="ts" x="682" y="236.5" text-anchor="middle">wget</text>
<text class="ts" x="682" y="253.5" text-anchor="middle">http://web:8000/</text>
<line class="ln" x1="606" y1="232" x2="594" y2="232" marker-end="url(#ah)"/>
<text class="ts" x="512" y="296" text-anchor="middle">web is 172.18.0.2</text>
<line class="lnc" x1="682" y1="194" x2="682" y2="154" marker-end="url(#ahc)"/>
<text class="tm" x="594" y="340" text-anchor="middle">Hello from container 080f5f53068e,</text>
<text class="tm" x="594" y="360" text-anchor="middle">visit 1</text>
</svg>
