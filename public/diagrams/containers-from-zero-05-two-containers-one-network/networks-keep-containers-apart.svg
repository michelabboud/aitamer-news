<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
<title id="t">Networks keep containers apart</title>
<desc id="d">Two bridge networks on one host: the default bridge and hello-net. The container client starts on the default bridge and asks for web&#x27;s address on hello-net, 172.18.0.2; the request times out, because Docker&#x27;s rules let containers on different bridge networks talk only through published ports. After docker network connect hello-net client, the client is on both networks, and wget http://web:8000/ answers visit 5. This connected state is highlighted.</desc>
