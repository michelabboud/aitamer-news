<rect class="boxc" x="520" y="116" width="150" height="52" rx="10"/>
<text class="tb" x="595" y="138.0" text-anchor="middle">client</text>
<text class="ts" x="595" y="155.0" text-anchor="middle">on both networks</text>
<rect class="box" x="624" y="200" width="118" height="30" rx="10"/>
<text class="tb" x="683" y="219.5" text-anchor="middle">web</text>
