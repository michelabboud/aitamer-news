<rect class="bg" x="0" y="0" width="800" height="380" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Different networks: no route. Connect the container to talk.</text>
<rect class="panel" x="24" y="50" width="364" height="310" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">before</text>
