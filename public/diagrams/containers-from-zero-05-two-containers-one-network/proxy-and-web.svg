<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">A proxy in front of the app</title>
<desc id="d">Your machine runs curl http://127.0.0.1:8080/. Only the proxy container has a published port, 127.0.0.1:8080 to its port 80. The proxy runs nginx with proxy.conf, which says proxy_pass http://web:8000. It finds web by name on the network hello-net, highlighted, and forwards the request to port 8000. The container web, running hello-app with the volume hello-data at /data, has no published port: docker ps shows only 8000/tcp, and only containers on hello-net can reach it. The app logs requests from 172.18.0.3, the proxy&#x27;s address on hello-net.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">One published port; the app stays inside the network</text>
<rect class="panel" x="24" y="50" width="752" height="330" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Docker host</text>
<rect class="box" x="44" y="92" width="170" height="62" rx="10"/>
<text class="tm" x="129" y="119.0" text-anchor="middle">curl</text>
<text class="tm" x="129" y="136.0" text-anchor="middle">127.0.0.1:8080</text>
<rect class="boxd" x="244" y="80" width="512" height="220" rx="10"/>
<text class="t" x="258" y="102" text-anchor="start">network hello-net</text>
<rect class="boxs" x="264" y="112" width="200" height="92" rx="10"/>
<text class="tb" x="364" y="145.5" text-anchor="middle">proxy</text>
<text class="ts" x="364" y="162.5" text-anchor="middle">nginx:1.30-alpine</text>
<text class="ts" x="364" y="179.5" text-anchor="middle">proxy_pass http://web:8000</text>
<rect class="boxc" x="536" y="112" width="200" height="92" rx="10"/>
<text class="tb" x="636" y="145.5" text-anchor="middle">web</text>
<text class="ts" x="636" y="162.5" text-anchor="middle">hello-app:1.2</text>
<text class="ts" x="636" y="179.5" text-anchor="middle">/data = volume hello-data</text>
<line class="ln" x1="214" y1="123" x2="262" y2="140" marker-end="url(#ah)"/>
<text class="ts" x="238" y="230" text-anchor="start"></text>
<line class="lnc" x1="464" y1="158" x2="534" y2="158" marker-end="url(#ahc)"/>
<text class="ts" x="500" y="148" text-anchor="middle">web:8000</text>
<text class="ts" x="364" y="236" text-anchor="middle">published: 127.0.0.1:8080-&gt;80/tcp</text>
<text class="ts" x="636" y="236" text-anchor="middle">not published: 8000/tcp</text>
<text class="ts" x="636" y="256" text-anchor="middle">logs requests from 172.18.0.3</text>
<text class="tm" x="400" y="334" text-anchor="middle">Only the proxy is reachable from the host. Containers on hello-net reach web by name.</text>
</svg>
