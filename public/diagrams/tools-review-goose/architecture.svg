<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="t d">
<title id="t">goose architecture</title>
<desc id="d">Three interfaces sit on top: the desktop app, which talks to a background goose serve process over the Agent Client Protocol; the CLI, which runs the agent in its own process; and editors, which start goose acp over stdio. All reach one agent core that runs the loop, applies the permission mode and recipes, manages context and stores sessions in SQLite. Below, the core talks to model providers, either HTTP APIs or external agents over ACP, and to extensions, which are MCP servers: built-in, platform, stdio and streamable HTTP.</desc>
<style>
.bg { fill: #fbf8f1; }
.box { fill: #e8eff7; stroke: #4a6f99; stroke-width: 1.5; }
.core { fill: #f3f7fb; stroke: #2f5680; stroke-width: 2; }
.inner { fill: #ffffff; stroke: #4a6f99; stroke-width: 1.2; }
.ext { fill: #e9f4ef; stroke: #3f7d68; stroke-width: 1.3; }
.warn { fill: #fdeee9; stroke: #c4573f; stroke-width: 1.3; }
.t { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 14px; }
.h { fill: #1f2a37; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; }
.s { fill: #4b5563; font-family: system-ui, sans-serif; font-size: 12.5px; }
.ln { stroke: #4a6f99; stroke-width: 1.6; fill: none; }
.ah { fill: #4a6f99; }
@media (prefers-color-scheme: dark) {
.bg { fill: #141a21; }
.box { fill: #1d2a38; stroke: #86acd8; }
.core { fill: #18222d; stroke: #9cc0ea; }
.inner { fill: #202d3b; stroke: #86acd8; }
.ext { fill: #1b3129; stroke: #7cc3a9; }
.warn { fill: #3a241f; stroke: #f0927a; }
.t { fill: #e6edf3; }
.h { fill: #f2f6fa; }
.s { fill: #aab4c0; }
.ln { stroke: #86acd8; }
.ah { fill: #86acd8; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="540" rx="10"/>
<text class="h" x="20" y="32">Interfaces</text>
<rect class="box" x="20" y="44" width="260" height="70" rx="8"/>
<text class="t" x="34" y="70">Desktop app (Electron)</text>
<text class="s" x="34" y="90">starts goose serve in the background:</text>
<text class="s" x="34" y="106">ACP over HTTP and WebSocket</text>
<rect class="box" x="310" y="44" width="260" height="70" rx="8"/>
<text class="t" x="324" y="70">CLI</text>
<text class="s" x="324" y="90">goose session, interactive</text>
<text class="s" x="324" y="106">goose run, headless and scripted</text>
<rect class="box" x="600" y="44" width="260" height="70" rx="8"/>
<text class="t" x="614" y="70">Editors (Zed, JetBrains)</text>
<text class="s" x="614" y="90">launch goose acp</text>
<text class="s" x="614" y="106">ACP over stdio</text>
<rect class="core" x="20" y="146" width="840" height="170" rx="12"/>
<text class="h" x="36" y="172">Agent core (Rust)</text>
<rect class="inner" x="36" y="186" width="190" height="112" rx="8"/>
<text class="t" x="48" y="210">Agent loop</text>
<text class="s" x="48" y="230">send tools, run calls,</text>
<text class="s" x="48" y="246">return results, repeat;</text>
<text class="s" x="48" y="262">errors go back to the</text>
<text class="s" x="48" y="278">model as tool results</text>
<rect class="inner" x="240" y="186" width="190" height="112" rx="8"/>
<text class="t" x="252" y="210">Permission mode</text>
<text class="s" x="252" y="230">autonomous (default),</text>
<text class="s" x="252" y="246">manual, smart, chat only;</text>
<text class="s" x="252" y="262">per-tool overrides</text>
<rect class="inner" x="444" y="186" width="190" height="112" rx="8"/>
<text class="t" x="456" y="210">Recipes</text>
<text class="s" x="456" y="230">instructions, parameters,</text>
<text class="s" x="456" y="246">extensions, tool allow-list,</text>
<text class="s" x="456" y="262">output schema, retries</text>
<rect class="inner" x="648" y="186" width="196" height="112" rx="8"/>
<text class="t" x="660" y="210">Context and state</text>
<text class="s" x="660" y="230">summarising, trimming;</text>
<text class="s" x="660" y="246">sessions in SQLite;</text>
<text class="s" x="660" y="262">LLM request logs</text>
<text class="h" x="20" y="356">Model providers</text>
<rect class="box" x="20" y="368" width="410" height="70" rx="8"/>
<text class="t" x="34" y="394">HTTP APIs, 15+ providers</text>
<text class="s" x="34" y="414">Anthropic, OpenAI, Google, Ollama, OpenRouter,</text>
<text class="s" x="34" y="430">Azure, Bedrock, any OpenAI-compatible endpoint</text>
<rect class="warn" x="20" y="452" width="410" height="70" rx="8"/>
<text class="t" x="34" y="478">ACP providers: Claude Code, Codex, Amp, Pi</text>
<text class="s" x="34" y="498">the external agent runs the tools itself;</text>
<text class="s" x="34" y="514">goose passes extensions through as MCP servers</text>
<text class="h" x="450" y="356">Extensions (MCP)</text>
<rect class="ext" x="450" y="368" width="200" height="70" rx="8"/>
<text class="t" x="462" y="394">Built-in</text>
<text class="s" x="462" y="414">Developer: shell, edit,</text>
<text class="s" x="462" y="430">write; on by default</text>
<rect class="ext" x="660" y="368" width="200" height="70" rx="8"/>
<text class="t" x="672" y="394">Platform, in-process</text>
<text class="s" x="672" y="414">Summon, Skills, Analyze,</text>
<text class="s" x="672" y="430">Extension Manager, Todo</text>
<rect class="ext" x="450" y="452" width="410" height="70" rx="8"/>
<text class="t" x="462" y="478">Any MCP server</text>
<text class="s" x="462" y="498">stdio child process or streamable HTTP;</text>
<text class="s" x="462" y="514">70+ listed in the docs</text>
<path class="ln" d="M150 114 L150 144" marker-end="url(#a)"/>
<path class="ln" d="M440 114 L440 144" marker-end="url(#a)"/>
<path class="ln" d="M730 114 L730 144" marker-end="url(#a)"/>
<path class="ln" d="M225 316 L225 366" marker-end="url(#a)"/>
<path class="ln" d="M655 316 L655 366" marker-end="url(#a)"/>
</svg>
