.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Drain worker: the budget decides when an eviction may happen</text>
<text class="t" x="24" y="74" text-anchor="start">Before: minAvailable 3, ALLOWED DISRUPTIONS 0</text>
<rect class="boxd" x="24" y="88" width="240" height="96" rx="10"/>
<text class="ts" x="40" y="112" text-anchor="start">worker  SchedulingDisabled</text>
<rect class="box" x="40" y="128" width="96" height="36" rx="6"/>
<text class="tm" x="48" y="151" text-anchor="start">web</text>
<rect class="boxs" x="280" y="88" width="240" height="96" rx="10"/>
<text class="tm" x="296" y="112" text-anchor="start">worker2</text>
<rect class="box" x="296" y="128" width="96" height="36" rx="6"/>
<text class="tm" x="304" y="151" text-anchor="start">web</text>
<rect class="boxs" x="536" y="88" width="240" height="96" rx="10"/>
<text class="tm" x="552" y="112" text-anchor="start">worker3</text>
<rect class="box" x="552" y="128" width="96" height="36" rx="6"/>
<text class="tm" x="560" y="151" text-anchor="start">web</text>
<rect class="boxc" x="24" y="196" width="752" height="48" rx="8"/>
<text class="tc" x="40" y="216" text-anchor="start">Cannot evict pod as it would violate the pod's disruption budget.</text>
<text class="ts" x="40" y="236" text-anchor="start">retries every 5 s; drain stops at --timeout=20s, the node stays cordoned</text>
<text class="t" x="24" y="280" text-anchor="start">After: minAvailable 2, ALLOWED DISRUPTIONS 1</text>
<rect class="boxd" x="24" y="294" width="240" height="96" rx="10"/>
<text class="ts" x="40" y="318" text-anchor="start">worker  SchedulingDisabled</text>
<rect class="boxs" x="280" y="294" width="240" height="96" rx="10"/>
<text class="tm" x="296" y="318" text-anchor="start">worker2</text>
<rect class="box" x="296" y="334" width="96" height="36" rx="6"/>
<text class="tm" x="304" y="357" text-anchor="start">web</text>
<rect class="box" x="400" y="334" width="96" height="36" rx="6"/>
<text class="tm" x="408" y="357" text-anchor="start">web (new)</text>
<rect class="boxs" x="536" y="294" width="240" height="96" rx="10"/>
<text class="tm" x="552" y="318" text-anchor="start">worker3</text>
<rect class="box" x="552" y="334" width="96" height="36" rx="6"/>
<text class="tm" x="560" y="357" text-anchor="start">web</text>
<text class="tm" x="40" y="414" text-anchor="start">pod/web-... evicted, node/k8s-ep16-worker drained</text>
<rect class="panel" x="24" y="430" width="752" height="56" rx="10"/>
<text class="ts" x="40" y="454" text-anchor="start">kubectl uncordon worker: new Pods may land there again.</text>
<text class="ts" x="40" y="474" text-anchor="start">Running Pods do not move back on their own.</text>
</svg>
