<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">kubectl drain against a PodDisruptionBudget, before and after</title>
<desc id="d">Before: Deployment web with three replicas, one per worker, and a PodDisruptionBudget with minAvailable 3, so ALLOWED DISRUPTIONS is 0. kubectl drain worker cordoned the node, shown dashed as SchedulingDisabled, then every eviction attempt failed with: Cannot evict pod as it would violate the pod's disruption budget, highlighted, and drain gave up at its 20 second timeout. After: we lowered minAvailable to 2, ALLOWED DISRUPTIONS became 1, and drain evicted the Pod. The Deployment created a replacement on worker2 and drain reported node drained. A panel notes that uncordon lets new Pods in but does not move the replacement back.</desc>
<style>
