<text class="tm" x="304" y="140" text-anchor="start">batch 3</text>
<rect class="box" x="404" y="116" width="100" height="40" rx="6"/>
<text class="tm" x="412" y="140" text-anchor="start">batch 3</text>
<text class="ts" x="296" y="180" text-anchor="start">1.9 CPU free</text>
<rect class="boxs" x="536" y="76" width="240" height="120" rx="10"/>
<text class="tm" x="552" y="100" text-anchor="start">worker3  (8 CPU)</text>
<rect class="box" x="552" y="116" width="100" height="40" rx="6"/>
<text class="tm" x="560" y="140" text-anchor="start">batch 3</text>
<rect class="box" x="660" y="116" width="100" height="40" rx="6"/>
<text class="tm" x="668" y="140" text-anchor="start">batch 3</text>
<text class="ts" x="552" y="180" text-anchor="start">1.9 CPU free</text>
<rect class="boxc" x="24" y="212" width="752" height="40" rx="8"/>
<text class="tc" x="40" y="238" text-anchor="start">Preempted by pod ... on node k8s-ep16-worker3: batch-...-mw2hl gets its grace period</text>
<text class="t" x="24" y="280" text-anchor="start">After: checkout runs on worker3</text>
<rect class="boxs" x="24" y="290" width="240" height="120" rx="10"/>
<text class="tm" x="40" y="314" text-anchor="start">worker  (8 CPU)</text>
<rect class="box" x="40" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="48" y="354" text-anchor="start">batch 3</text>
<rect class="box" x="148" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="156" y="354" text-anchor="start">batch 3</text>
<text class="ts" x="40" y="394" text-anchor="start">1.9 CPU free</text>
<rect class="boxs" x="280" y="290" width="240" height="120" rx="10"/>
<text class="tm" x="296" y="314" text-anchor="start">worker2  (8 CPU)</text>
<rect class="box" x="296" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="304" y="354" text-anchor="start">batch 3</text>
<rect class="box" x="404" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="412" y="354" text-anchor="start">batch 3</text>
<text class="ts" x="296" y="394" text-anchor="start">1.9 CPU free</text>
<rect class="boxs" x="536" y="290" width="240" height="120" rx="10"/>
<text class="tm" x="552" y="314" text-anchor="start">worker3  (8 CPU)</text>
<rect class="box" x="552" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="560" y="354" text-anchor="start">batch 3</text>
<rect class="boxb" x="660" y="330" width="100" height="40" rx="6"/>
<text class="tm" x="668" y="354" text-anchor="start">checkout 4</text>
<text class="ts" x="552" y="394" text-anchor="start">0.9 CPU free</text>
<rect class="panel" x="24" y="420" width="752" height="50" rx="10"/>
<text class="ts" x="40" y="442" text-anchor="start">The replacement batch Pod stays Pending: Insufficient cpu, no preemption victims.</text>
<text class="ts" x="40" y="460" text-anchor="start">Pods of equal or higher priority are never victims.</text>
</svg>
