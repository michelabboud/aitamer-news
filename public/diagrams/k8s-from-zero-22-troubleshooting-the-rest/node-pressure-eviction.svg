<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Two ways Pods leave a node</title>
<desc id="d">Left, a node that stops reporting, as observed on our cluster after stopping the kubelet on the worker: about 50 seconds later the node is NotReady and its conditions are Unknown with Kubelet stopped posting node status; the control plane adds the taints node.kubernetes.io/unreachable with effects NoSchedule and NoExecute; the EndpointSlice marks the Pods not ready, so Services stop sending them traffic; every Pod has a default toleration of 300 seconds, highlighted; after it runs out the taint eviction controller deletes the Pods and their Deployment creates replacements, which stay Pending when no other node accepts them. Right, the kubelet evicting Pods on a healthy node: it watches signals such as memory.available, nodefs.available, imagefs.available and inodesFree against hard thresholds, defaults memory.available below 100Mi, nodefs.available below 10 percent, imagefs.available below 15 percent and inodesFree below 5 percent, and sets MemoryPressure or DiskPressure; it also evicts a single Pod whose ephemeral storage use exceeds its limit, which we saw as Evicted: Pod ephemeral local storage usage exceeds the total limit of containers 20Mi. Note that kind sets the disk thresholds to 0 percent.</desc>
