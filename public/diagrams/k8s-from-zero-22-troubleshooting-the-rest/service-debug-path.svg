<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Debugging a Service in four checks</title>
<desc id="d">Four checks in order, from the client towards the Pod. One: does the name resolve; run nslookup with the full name; the symptom of a failure is wget: bad address; check the name and namespace, the CoreDNS Pods and the kube-dns endpoints. Two, highlighted: does the Service have endpoints; run kubectl get endpointslice; ENDPOINTS unset means the selector matches no Pod labels; compare with kubectl get pods --show-labels. Three: does targetPort match the port the container listens on; with endpoints present but the wrong port the client still sees Connection refused; check with netstat inside the Pod. Four: does the Pod answer on its own IP; wget the Pod IP from a client Pod. If all four pass, the Service works.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Follow the request: name, endpoints, port, Pod</text>
<rect class="boxb" x="24" y="56" width="752" height="92" rx="10"/>
<circle class="db" cx="52" cy="86" r="14"/>
<text class="th" x="52" y="91" text-anchor="middle">1</text>
<text class="th" x="78" y="84" text-anchor="start">The name resolves</text>
<text class="tm" x="78" y="108" text-anchor="start">nslookup web.k8s-from-zero.svc.cluster.local</text>
<text class="ts" x="78" y="132" text-anchor="start">symptom: fails with: wget: bad address</text>
<text class="ts" x="470" y="132" text-anchor="start">fix: check namespace, CoreDNS, kube-dns</text>
<line class="ln" x1="40" y1="148" x2="40" y2="160" marker-end="url(#ah)"/>
<rect class="boxc" x="24" y="162" width="752" height="92" rx="10"/>
<circle class="dc" cx="52" cy="192" r="14"/>
<text class="th" x="52" y="197" text-anchor="middle">2</text>
<text class="th" x="78" y="190" text-anchor="start">The Service has endpoints</text>
<text class="tm" x="78" y="214" text-anchor="start">kubectl get endpointslice -l kubernetes.io/service-name=web</text>
<text class="ts" x="78" y="238" text-anchor="start">symptom: ENDPOINTS &lt;unset&gt;: Connection refused</text>
<text class="tc" x="470" y="238" text-anchor="start">fix: selector does not match Pod labels</text>
<line class="ln" x1="40" y1="254" x2="40" y2="266" marker-end="url(#ah)"/>
<rect class="boxb" x="24" y="268" width="752" height="92" rx="10"/>
<circle class="db" cx="52" cy="298" r="14"/>
<text class="th" x="52" y="303" text-anchor="middle">3</text>
<text class="th" x="78" y="296" text-anchor="start">targetPort matches the container</text>
<text class="tm" x="78" y="320" text-anchor="start">kubectl exec deploy/web -- netstat -tln</text>
<text class="ts" x="78" y="344" text-anchor="start">symptom: endpoints exist, still Connection refused</text>
<text class="ts" x="470" y="344" text-anchor="start">fix: set targetPort to the port that LISTENs</text>
<line class="ln" x1="40" y1="360" x2="40" y2="372" marker-end="url(#ah)"/>
<rect class="boxs" x="24" y="374" width="752" height="92" rx="10"/>
<circle class="db" cx="52" cy="404" r="14"/>
<text class="th" x="52" y="409" text-anchor="middle">4</text>
<text class="th" x="78" y="402" text-anchor="start">The Pod answers on its own IP</text>
<text class="tm" x="78" y="426" text-anchor="start">wget -qO- http://&lt;pod IP&gt;:80</text>
<text class="ts" x="78" y="450" text-anchor="start">symptom: timeout or refused from the Pod itself</text>
<text class="ts" x="470" y="450" text-anchor="start">fix: the app is the problem: logs, probes</text>
<text class="ts" x="400" y="488" text-anchor="middle">All four pass: the Service works. Change one thing, then wait a second before you test again.</text>
</svg>
