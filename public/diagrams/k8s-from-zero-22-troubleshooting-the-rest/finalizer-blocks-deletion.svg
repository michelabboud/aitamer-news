<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">How a finalizer holds an object in Terminating</title>
<desc id="d">Top row, an object with a finalizer: you run kubectl delete; the API server only sets deletionTimestamp and the object stays, shown as Terminating; the finalizers list, highlighted, still holds example.com/cleanup, and nothing removes it because no controller owns that name; once the list is empty, by the owning controller or by your patch that sets finalizers to null, the API server removes the object. Bottom row, the same effect on a namespace: kubectl delete namespace stuck-demo leaves the namespace Terminating, and its conditions say NamespaceContentRemaining and NamespaceFinalizersRemaining: example.com/cleanup in 1 resource instances, until the ConfigMap inside is released.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Delete marks the object; the finalizer list decides when it goes</text>
<rect class="box" x="24" y="62" width="170" height="86" rx="10"/>
<text class="tm" x="109.0" y="101.5" text-anchor="middle">kubectl delete</text>
<text class="tm" x="109.0" y="118.5" text-anchor="middle">configmap stuck</text>
<line class="ln" x1="194" y1="105" x2="214" y2="105" marker-end="url(#ah)"/>
<rect class="boxb" x="216" y="62" width="170" height="86" rx="10"/>
<text class="tm" x="301.0" y="101.5" text-anchor="middle">deletionTimestamp set</text>
<text class="tm" x="301.0" y="118.5" text-anchor="middle">object still exists</text>
<line class="lnc" x1="386" y1="105" x2="406" y2="105" marker-end="url(#ahc)"/>
<rect class="boxc" x="408" y="62" width="170" height="86" rx="10"/>
<text class="tm" x="493.0" y="101.5" text-anchor="middle">finalizers:</text>
<text class="tm" x="493.0" y="118.5" text-anchor="middle">[example.com/cleanup]</text>
<line class="ln" x1="578" y1="105" x2="598" y2="105" marker-end="url(#ah)"/>
<rect class="boxs" x="600" y="62" width="170" height="86" rx="10"/>
<text class="tm" x="685.0" y="101.5" text-anchor="middle">list empty</text>
<text class="tm" x="685.0" y="118.5" text-anchor="middle">object removed</text>
<text class="ts" x="497" y="176" text-anchor="middle">nobody removes it: no controller</text>
<text class="ts" x="497" y="194" text-anchor="middle">owns example.com/cleanup</text>
<line class="ln" x1="684" y1="206" x2="684" y2="152" marker-end="url(#ah)"/>
<text class="ts" x="400" y="232" text-anchor="middle">released by the owning controller after its cleanup, or by you:</text>
<text class="tm" x="400" y="256" text-anchor="middle">kubectl patch configmap stuck --type=merge -p &#x27;{&quot;metadata&quot;:{&quot;finalizers&quot;:null}}&#x27;</text>
<text class="ts" x="690" y="224" text-anchor="start"></text>
<rect class="boxd" x="24" y="296" width="752" height="152" rx="10"/>
<text class="t" x="40" y="320" text-anchor="start">Same thing one level up: a namespace waits for everything inside it</text>
<rect class="box" x="40" y="336" width="200" height="56" rx="10"/>
<text class="tm" x="140.0" y="360.5" text-anchor="middle">namespace stuck-demo</text>
<text class="tm" x="140.0" y="377.5" text-anchor="middle">STATUS Terminating</text>
<line class="ln" x1="240" y1="364" x2="272" y2="364" marker-end="url(#ah)"/>
<rect class="boxn" x="274" y="336" width="486" height="96" rx="10"/>
<text class="tm" x="286" y="360" text-anchor="start">NamespaceContentRemaining=True</text>
<text class="tm" x="302" y="377" text-anchor="start">configmaps. has 1 resource instances</text>
<text class="tm" x="286" y="394" text-anchor="start">NamespaceFinalizersRemaining=True</text>
<text class="tm" x="302" y="411" text-anchor="start">example.com/cleanup in 1 resource instances</text>
<text class="ts" x="40" y="420" text-anchor="start">read them with:</text>
<text class="tm" x="40" y="438" text-anchor="start">kubectl get ns stuck-demo -o jsonpath=&#x27;{.status.conditions}&#x27;</text>
</svg>
