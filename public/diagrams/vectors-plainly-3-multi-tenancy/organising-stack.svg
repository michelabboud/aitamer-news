<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" aria-labelledby="t d">
<title id="t">Organising data in a vector database</title>
<desc id="d">Nested boxes: a collection per data domain holds a namespace per tenant, inside which metadata filters narrow by category, status or date; clusters discovered from the vectors themselves reveal topics nobody labelled.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="316" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Organising data: four mechanisms, coarsest to finest</text>
<rect class="box" x="24" y="46" width="752" height="250" rx="12"/>
<text class="t" x="40" y="70" text-anchor="start">Collection / index: one data domain, one model, one dimension (e.g. support-docs, 1024-d)</text>
<rect class="boxb" x="44" y="84" width="712" height="196" rx="10"/>
<text class="t" x="60" y="108" text-anchor="start">Namespace / partition: one tenant (acme)</text>
<rect class="boxs" x="64" y="120" width="440" height="146" rx="8"/>
<text class="t" x="80" y="144" text-anchor="start">Metadata filters inside the tenant</text>
<text class="tm" x="80" y="166" text-anchor="start">category = "billing", status = "published",</text>
<text class="tm" x="80" y="184" text-anchor="start">updated after 2026-01-01</text>
<ellipse class="boxd" cx="140" cy="230" rx="48" ry="24"/>
<circle class="dc" cx="165" cy="219" r="3"/>
<circle class="dc" cx="115" cy="220" r="3"/>
<circle class="dc" cx="133" cy="223" r="3"/>
<circle class="dc" cx="157" cy="239" r="3"/>
<circle class="dc" cx="164" cy="227" r="3"/>
<circle class="dc" cx="126" cy="237" r="3"/>
<ellipse class="boxd" cx="260" cy="225" rx="48" ry="24"/>
<circle class="db" cx="243" cy="232" r="3"/>
<circle class="db" cx="232" cy="231" r="3"/>
<circle class="db" cx="273" cy="218" r="3"/>
<circle class="db" cx="257" cy="233" r="3"/>
<circle class="db" cx="255" cy="236" r="3"/>
<circle class="db" cx="285" cy="229" r="3"/>
<ellipse class="boxd" cx="400" cy="232" rx="48" ry="24"/>
<circle class="dn" cx="430" cy="231" r="3"/>
<circle class="dn" cx="404" cy="234" r="3"/>
<circle class="dn" cx="402" cy="228" r="3"/>
<circle class="dn" cx="427" cy="221" r="3"/>
<circle class="dn" cx="425" cy="220" r="3"/>
<circle class="dn" cx="393" cy="234" r="3"/>
<text class="t" x="520" y="150" text-anchor="start">Clusters (discovered):</text>
<text class="ts" x="520" y="172" text-anchor="start">k-means or HDBSCAN over</text>
<text class="ts" x="520" y="190" text-anchor="start">the vectors reveal topics</text>
<text class="ts" x="520" y="208" text-anchor="start">nobody labelled; use them to</text>
<text class="ts" x="520" y="226" text-anchor="start">discover structure, not to</text>
<text class="ts" x="520" y="244" text-anchor="start">enforce it</text>
</svg>
