<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="t d">
<title id="t">Tenant isolation levels</title>
<desc id="d">From left to right: a shared index with a tenant filter, a namespace or partition per tenant, and a separate collection or cluster per tenant. Isolation grows from left to right, and so does the number of indexes to operate.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="356" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Three levels of tenant isolation</text>
<rect class="box" x="24" y="50" width="232" height="190" rx="10"/>
<text class="th" x="140" y="76" text-anchor="middle">Shared index + filter</text>
<text class="ts" x="140" y="100" text-anchor="middle">one index, tenant_id on</text>
<text class="ts" x="140" y="118" text-anchor="middle">every record; every query</text>
<text class="ts" x="140" y="136" text-anchor="middle">must carry the filter</text>
<rect class="boxb" x="284" y="50" width="232" height="190" rx="10"/>
<text class="th" x="400" y="76" text-anchor="middle">Namespace / partition</text>
<text class="ts" x="400" y="100" text-anchor="middle">one logical index, queries</text>
<text class="ts" x="400" y="118" text-anchor="middle">structurally scoped to</text>
<text class="ts" x="400" y="136" text-anchor="middle">one tenant</text>
<rect class="boxs" x="544" y="50" width="232" height="190" rx="10"/>
<text class="th" x="660" y="76" text-anchor="middle">Collection / cluster</text>
<text class="ts" x="660" y="100" text-anchor="middle">a separate index (or</text>
<text class="ts" x="660" y="118" text-anchor="middle">cluster) per tenant; own</text>
<text class="ts" x="660" y="136" text-anchor="middle">keys and deletes possible</text>
