<path class="ln" d="M40 274L760 274" marker-end="url(#ah)"/>
<text class="ts" x="400" y="266" text-anchor="middle">stronger isolation, smaller blast radius</text>
<path class="lnc" d="M40 304L760 304" marker-end="url(#ahc)"/>
<text class="tc" x="400" y="296" text-anchor="middle">more indexes to run, slower cold queries for small tenants</text>
<text class="ts" x="24" y="336" text-anchor="start">Common shapes: Qdrant payload partition (is_tenant), Pinecone namespaces, Weaviate tenant shards, Milvus partition key.</text>
</svg>
