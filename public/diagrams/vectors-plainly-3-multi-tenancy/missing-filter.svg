<circle class="ds" cx="273" cy="217" r="5"/>
<circle class="ds" cx="402" cy="181" r="5"/>
<circle class="ds" cx="439" cy="237" r="5"/>
<circle class="ds" cx="409" cy="83" r="5"/>
<circle class="ds" cx="265" cy="89" r="5"/>
<circle class="ds" cx="403" cy="87" r="5"/>
<circle class="ds" cx="362" cy="231" r="5"/>
<circle class="ds" cx="309" cy="243" r="5"/>
<circle class="ds" cx="251" cy="249" r="5"/>
<circle class="ds" cx="417" cy="151" r="5"/>
<circle class="lnc hit" cx="262" cy="170" r="80"/>
<circle class="dc" cx="262" cy="170" r="7"/>
<circle class="db" cx="40" cy="318" r="5"/>
<text class="ts" x="52" y="322" text-anchor="start">tenant acme</text>
<circle class="ds" cx="150" cy="318" r="5"/>
<text class="ts" x="162" y="322" text-anchor="start">tenant globex</text>
<circle class="dc" cx="270" cy="318" r="6"/>
<text class="ts" x="282" y="322" text-anchor="start">acme user's query</text>
<text class="t" x="520" y="70" text-anchor="start">top_k = 5, no tenant filter</text>
<text class="tc" x="520" y="96" text-anchor="start">2 of 5 results belong to globex</text>
<text class="ts" x="520" y="130" text-anchor="start">No error is raised. Search returns</text>
<text class="ts" x="520" y="148" text-anchor="start">"closest", not "matching", so the</text>
<text class="ts" x="520" y="166" text-anchor="start">leak looks like a normal answer.</text>
<text class="t" x="520" y="206" text-anchor="start">Fix below the application:</text>
<text class="ts" x="520" y="228" text-anchor="start">- namespace-bound clients or keys</text>
<text class="ts" x="520" y="246" text-anchor="start">- a proxy that injects the filter</text>
<text class="ts" x="520" y="264" text-anchor="start">- a CI test that queries across</text>
<text class="ts" x="520" y="282" text-anchor="start">  tenants and expects nothing</text>
</svg>
