</style><rect class="bg" width="800" height="380"/><rect class="vend" x="20" y="20" width="760" height="100" rx="8"/><text class="t" x="40" y="52">Reported by OpenAI (vendor claims)</text><text class="s" x="40" y="78">Near-Astra performance; DeepSWE v1.1, OSWorld 2.0, AutomationBench, Terminal-Bench Science;</text><text class="s" x="40" y="100">error rates and safety-review figures. Reported through TechCrunch and The Next Web.</text><rect class="ind" x="20" y="140" width="760" height="100" rx="8"/><text class="w" x="40" y="172">OpenAI-reported scores on Surge AI&apos;s GDP.pdf</text><text class="ws" x="40" y="198">GPT-6.1 Sol 32.0%, GPT-6 Astra 32.2%, as reproduced by Vellum.</text><text class="ws" x="40" y="220">Independent Sol result unavailable. No overall winner is claimed.</text><rect class="conf" x="20" y="260" width="760" height="100" rx="8"/><text class="w" x="40" y="292">Different comparison models and settings</text><text class="ws" x="40" y="318">AutomationBench: OpenAI says Sol (medium effort) is 2.2 points above Opus 5.5;</text><text class="ws" x="40" y="340">Vellum lists higher-setting Sol 36.0% and Sonnet 5.5 44.7%. No direct conflict established.</text></svg>
