<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Three multi-container patterns: sidecar, ambassador, adapter</title>
<desc id="d">Three Pods side by side, each with the main app in blue-grey and the helper in green. Sidecar: the app writes logs into a shared emptyDir volume and a log shipper reads them and sends them to a log backend outside the Pod. Ambassador: the app connects to localhost:6379 and a proxy container in the same Pod forwards to the right remote database, so the app never knows the real address. Adapter: the app exposes status in its own format, and an adapter container rewrites it as Prometheus metrics on /metrics for the monitoring system. A panel notes that all containers in a Pod share the network namespace and can share volumes, and are scheduled together on one node.</desc>
