<text class="ts" x="52" y="417" text-anchor="start">log backend</text>
<line class="ln" x1="144" y1="296" x2="144" y2="388" marker-end="url(#ah)"/>
<rect class="panel" x="280" y="56" width="240" height="300" rx="12"/>
<text class="t" x="296" y="82" text-anchor="start">Ambassador</text>
<text class="ts" x="296" y="102" text-anchor="start">proxies outbound</text>
<rect class="box" x="296" y="118" width="208" height="64" rx="8"/>
<text class="tm" x="308" y="142" text-anchor="start">app</text>
<text class="ts" x="308" y="164" text-anchor="start">talks to localhost:6379</text>
<rect class="boxs" x="296" y="232" width="208" height="64" rx="8"/>
<text class="tm" x="308" y="256" text-anchor="start">proxy</text>
<text class="ts" x="308" y="278" text-anchor="start">picks the real host</text>
<line class="ln" x1="400" y1="182" x2="400" y2="230" marker-end="url(#ah)"/>
<rect class="boxd" x="296" y="390" width="208" height="44" rx="8"/>
<text class="ts" x="308" y="417" text-anchor="start">remote database</text>
<line class="ln" x1="400" y1="296" x2="400" y2="388" marker-end="url(#ah)"/>
<rect class="panel" x="536" y="56" width="240" height="300" rx="12"/>
<text class="t" x="552" y="82" text-anchor="start">Adapter</text>
<text class="ts" x="552" y="102" text-anchor="start">reshapes output</text>
<rect class="box" x="552" y="118" width="208" height="64" rx="8"/>
<text class="tm" x="564" y="142" text-anchor="start">app</text>
<text class="ts" x="564" y="164" text-anchor="start">status in its own format</text>
<rect class="boxs" x="552" y="232" width="208" height="64" rx="8"/>
<text class="tm" x="564" y="256" text-anchor="start">adapter</text>
<text class="ts" x="564" y="278" text-anchor="start">serves /metrics</text>
<line class="ln" x1="656" y1="182" x2="656" y2="230" marker-end="url(#ah)"/>
<rect class="boxd" x="552" y="390" width="208" height="44" rx="8"/>
<text class="ts" x="564" y="417" text-anchor="start">Prometheus</text>
<line class="ln" x1="656" y1="296" x2="656" y2="388" marker-end="url(#ah)"/>
<text class="ts" x="40" y="212" text-anchor="start">shared emptyDir</text>
<text class="ts" x="296" y="212" text-anchor="start">localhost</text>
<text class="ts" x="552" y="212" text-anchor="start">localhost:8080</text>
<text class="ts" x="40" y="372" text-anchor="start">outside the Pod</text>
<rect class="panel" x="24" y="448" width="752" height="42" rx="10"/>
<text class="ts" x="40" y="474" text-anchor="start">One Pod, one node, one network namespace: helpers reach the app on localhost.</text>
</svg>
