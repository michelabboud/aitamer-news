<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Native sidecar: initContainers entry with restartPolicy: Always</text>
<line class="lnf" x1="170" y1="70" x2="770" y2="70"/>
<line class="ln" x1="170" y1="62" x2="170" y2="78"/>
<text class="ts" x="174" y="58" text-anchor="start">21:10:47</text>
