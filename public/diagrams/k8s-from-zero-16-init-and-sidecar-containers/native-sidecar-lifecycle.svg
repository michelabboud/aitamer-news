<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">A native sidecar starts first, stays up, and stops last</title>
<desc id="d">Top: the lab Pod app-with-sidecar. The log-shipper is listed under initContainers with restartPolicy Always. It started at 21:10:47 UTC, its startupProbe passed about 5 seconds later, and only then did the app container start at 21:10:53. Both ran side by side for the life of the Pod; on shutdown the app stops first and the sidecar after it. Bottom: two Jobs from the lab. With the log shipper as a second regular container, the Job stayed Running at 0/1 completions after the work finished, highlighted. With a native sidecar, the Job reached Complete; with a TERM trap in the sidecar it took 8 seconds instead of 39.</desc>
