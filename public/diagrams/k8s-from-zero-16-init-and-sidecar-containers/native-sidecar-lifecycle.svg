<rect class="box" x="330" y="152" width="320" height="44" rx="8"/>
<text class="ts" x="340" y="180" text-anchor="start">starts after the probe passes</text>
<line class="ln" x1="330" y1="136" x2="330" y2="150" marker-end="url(#ah)"/>
<text class="ts" x="172" y="156" text-anchor="start">startupProbe ok</text>
<text class="ts" x="660" y="180" text-anchor="start">stops first</text>
<text class="ts" x="736" y="120" text-anchor="start">last</text>
<rect class="panel" x="24" y="222" width="752" height="40" rx="10"/>
<text class="ts" x="40" y="247" text-anchor="start">READY 2/2. Logs: kubectl logs app-with-sidecar -c log-shipper</text>
<text class="t" x="24" y="294" text-anchor="start">Same idea in a Job (lab, 25 s after start)</text>
<rect class="boxc" x="24" y="308" width="368" height="120" rx="10"/>
<text class="tc" x="40" y="334" text-anchor="start">sidecar in containers</text>
<text class="ts" x="40" y="360" text-anchor="start">work done, shipper still running</text>
<text class="tm" x="40" y="384" text-anchor="start">Pod 1/2 NotReady</text>
<text class="tm" x="40" y="408" text-anchor="start">Job Running 0/1, never ends</text>
<rect class="boxs" x="408" y="308" width="368" height="120" rx="10"/>
<text class="t" x="424" y="334" text-anchor="start">native sidecar</text>
<text class="ts" x="424" y="360" text-anchor="start">kubelet stops it when work ends</text>
<text class="tm" x="424" y="384" text-anchor="start">Job Complete 1/1</text>
<text class="tm" x="424" y="408" text-anchor="start">39 s, or 8 s with a TERM trap</text>
<rect class="panel" x="24" y="444" width="752" height="46" rx="10"/>
<text class="ts" x="40" y="472" text-anchor="start">A sidecar that ignores SIGTERM is killed after the 30 s grace period (exit 137).</text>
</svg>
