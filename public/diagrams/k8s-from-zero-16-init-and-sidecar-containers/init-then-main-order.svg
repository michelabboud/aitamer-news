<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
<title id="t">Init containers run one at a time, then the app starts</title>
<desc id="d">A timeline from the lab Pod web-init. The init container fetch-config ran from 21:07:37 to 21:07:42 UTC and wrote index.html into a shared emptyDir volume. Only after it exited with code 0 did render-page start, running from 21:07:43 to 21:07:48 and appending a second line. The app container web, highlighted, started at 21:07:49 and served the finished file. Under the timeline, the STATUS column of kubectl get pod moved from Init:0/2 to Init:1/2 to PodInitializing to Running. A panel notes that if an init container fails, the kubelet restarts it and the app never starts.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="460" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Pod web-init: each step must exit 0 before the next starts</text>
<line class="lnf" x1="170" y1="70" x2="770" y2="70"/>
<line class="ln" x1="170" y1="62" x2="170" y2="78"/>
<text class="ts" x="174" y="58" text-anchor="start">21:07:37</text>
<line class="ln" x1="330" y1="62" x2="330" y2="78"/>
<text class="ts" x="334" y="58" text-anchor="start">21:07:43</text>
<line class="ln" x1="490" y1="62" x2="490" y2="78"/>
<text class="ts" x="494" y="58" text-anchor="start">21:07:49</text>
<line class="ln" x1="690" y1="62" x2="690" y2="78"/>
<text class="ts" x="694" y="58" text-anchor="start">later</text>
<text class="tm" x="24" y="120" text-anchor="start">fetch-config</text>
<rect class="box" x="170" y="92" width="150" height="44" rx="8"/>
<text class="ts" x="180" y="120" text-anchor="start">exit 0</text>
<text class="tm" x="24" y="180" text-anchor="start">render-page</text>
<rect class="box" x="330" y="152" width="150" height="44" rx="8"/>
<text class="ts" x="340" y="180" text-anchor="start">exit 0</text>
<text class="tm" x="24" y="240" text-anchor="start">web (app)</text>
<rect class="boxc" x="490" y="212" width="280" height="44" rx="8"/>
<text class="tc" x="500" y="240" text-anchor="start">Running, serves index.html</text>
<line class="ln" x1="320" y1="136" x2="330" y2="152" marker-end="url(#ah)"/>
<line class="ln" x1="480" y1="196" x2="490" y2="212" marker-end="url(#ah)"/>
<text class="tm" x="24" y="300" text-anchor="start">STATUS</text>
<text class="tm" x="174" y="300" text-anchor="start">Init:0/2</text>
<text class="tm" x="334" y="300" text-anchor="start">Init:1/2</text>
<text class="tm" x="494" y="300" text-anchor="start">PodInitializing</text>
<text class="tm" x="644" y="300" text-anchor="start">Running</text>
<rect class="boxn" x="24" y="320" width="360" height="60" rx="10"/>
<text class="tm" x="40" y="344" text-anchor="start">emptyDir volume "work"</text>
<text class="ts" x="40" y="366" text-anchor="start">step 1 line, then step 2 line</text>
<rect class="panel" x="400" y="320" width="376" height="60" rx="10"/>
<text class="ts" x="416" y="344" text-anchor="start">init exits non-zero: kubelet restarts it</text>
<text class="ts" x="416" y="366" text-anchor="start">STATUS Init:Error, app never starts</text>
<rect class="panel" x="24" y="396" width="752" height="50" rx="10"/>
<text class="ts" x="40" y="426" text-anchor="start">Init containers have no readiness or liveness probes: finishing is the only signal.</text>
</svg>
