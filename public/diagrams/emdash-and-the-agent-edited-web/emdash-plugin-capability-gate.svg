<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.stop{fill:#f4efe4;stroke:#f26b4f;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ln{stroke:#9fb4cc}.stop{fill:#152130}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="core"/></marker></defs><rect class="bg" width="780" height="260"/><rect class="box" x="20" y="30" width="200" height="100" rx="8"/><text class="t" x="120.0" y="54" text-anchor="middle">Sandboxed plugin</text><text class="s" x="120.0" y="75" text-anchor="middle">declares content:read, content:write, network:request</text><rect class="gate" x="300" y="50" width="120" height="60" rx="8"/><text class="w" x="360.0" y="85.0" text-anchor="middle">Capability gate</text><rect class="box" x="520" y="20" width="220" height="56" rx="8"/><text class="t" x="630.0" y="44" text-anchor="middle">Content API</text><text class="s" x="630.0" y="65" text-anchor="middle">allowed: content:read + content:write</text><rect class="box" x="520" y="100" width="220" height="56" rx="8"/><text class="t" x="630.0" y="124" text-anchor="middle">HTTP</text><text class="s" x="630.0" y="145" text-anchor="middle">allowed: network:request</text><rect class="stop" x="520" y="180" width="220" height="56" rx="8"/><text class="t" x="630.0" y="204" text-anchor="middle">Media API</text><text class="s" x="630.0" y="225" text-anchor="middle">not declared: stopped</text><path class="ln" d="M220 80L300 80" marker-end="url(#a)"/><path class="ln" d="M420 70L520 48" marker-end="url(#a)"/><path class="ln" d="M420 85L520 128" marker-end="url(#a)"/><path class="no" d="M420 100L470 208L520 208"/><text class="s" x="20" y="180">Approved calls reach the host API.</text><text class="s" x="20" y="200">Undeclared calls stop at the gate.</text></svg>
