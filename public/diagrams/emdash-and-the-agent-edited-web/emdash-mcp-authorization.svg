<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.stop{fill:#f4efe4;stroke:#f26b4f;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ln{stroke:#9fb4cc}.stop{fill:#152130}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="core"/></marker></defs><rect class="bg" width="780" height="280"/><rect class="box" x="10" y="80" width="150" height="70" rx="8"/><text class="t" x="85.0" y="104" text-anchor="middle">MCP client</text><text class="s" x="85.0" y="125" text-anchor="middle">JSON-RPC tool call</text><rect class="gate" x="200" y="80" width="150" height="70" rx="8"/><text class="w" x="275.0" y="104" text-anchor="middle">Token scopes</text><text class="w" x="275.0" y="125" text-anchor="middle">bearer token check</text><rect class="gate" x="390" y="80" width="150" height="70" rx="8"/><text class="w" x="465.0" y="104" text-anchor="middle">Role check</text><text class="w" x="465.0" y="125" text-anchor="middle">user role permits it?</text><rect class="core" x="580" y="80" width="190" height="70" rx="8"/><text class="w" x="675.0" y="104" text-anchor="middle">Content tool</text><text class="w" x="675.0" y="125" text-anchor="middle">update or publish</text><path class="ln" d="M160 115L200 115" marker-end="url(#a)"/><path class="ln" d="M350 115L390 115" marker-end="url(#a)"/><path class="ln" d="M540 115L580 115" marker-end="url(#a)"/><rect class="box" x="200" y="200" width="150" height="50" rx="8"/><text class="t" x="275.0" y="224" text-anchor="middle">Refused: scope</text><text class="s" x="275.0" y="245" text-anchor="middle">stop</text><rect class="box" x="390" y="200" width="150" height="50" rx="8"/><text class="t" x="465.0" y="224" text-anchor="middle">Refused: role</text><text class="s" x="465.0" y="245" text-anchor="middle">stop</text><path class="no" d="M275 150L275 200"/><path class="no" d="M465 150L465 200"/><text class="s" x="10" y="40">Request goes to /_emdash/api/mcp. A failed check stops before the tool runs.</text></svg>
