<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t d">
<title id="t">Pod failure decision tree</title>
<desc id="d">Start with kubectl get pods and read the STATUS column, highlighted. Pending with no node assigned: run kubectl describe pod and read the FailedScheduling event, for example Insufficient cpu; fix requests, node selectors or taints. ErrImagePull or ImagePullBackOff: read the Failed event; not found means a wrong name or tag, other messages point at the registry or credentials. CreateContainerConfigError: a ConfigMap, Secret or key the Pod references does not exist; create it and the kubelet starts the container. RunContainerError with last state StartError, exit code 128: the runtime could not start the command, for example a missing file. Error or CrashLoopBackOff with exit code 1: the app started and exited; read kubectl logs and logs --previous. OOMKilled with exit code 137: the container passed its memory limit.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="490" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Read the STATUS first; each value points to one place to look</text>
<rect class="boxc" x="260" y="50" width="280" height="52" rx="10"/>
<text class="tm" x="400.0" y="72.5" text-anchor="middle">kubectl get pods</text>
<text class="tm" x="400.0" y="89.5" text-anchor="middle">read STATUS</text>
<rect class="boxb" x="24" y="126" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="154.0" text-anchor="middle">Pending</text>
<line class="ln" x1="294" y1="149" x2="318" y2="149" marker-end="url(#ah)"/>
<rect class="box" x="320" y="126" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="154.0" text-anchor="middle">describe: FailedScheduling</text>
<line class="ln" x1="540" y1="149" x2="562" y2="149" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="126" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="146.0" text-anchor="middle">Insufficient cpu: lower requests,</text>
<text class="ts" x="670.0" y="162.0" text-anchor="middle">check nodeSelector, taints</text>
<rect class="boxb" x="24" y="186" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="214.0" text-anchor="middle">ErrImagePull / ImagePullBackOff</text>
<line class="ln" x1="294" y1="209" x2="318" y2="209" marker-end="url(#ah)"/>
<rect class="box" x="320" y="186" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="214.0" text-anchor="middle">describe or events: Failed</text>
<line class="ln" x1="540" y1="209" x2="562" y2="209" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="186" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="206.0" text-anchor="middle">not found: fix name or tag;</text>
<text class="ts" x="670.0" y="222.0" text-anchor="middle">else registry or credentials</text>
<rect class="boxb" x="24" y="246" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="274.0" text-anchor="middle">CreateContainerConfigError</text>
<line class="ln" x1="294" y1="269" x2="318" y2="269" marker-end="url(#ah)"/>
<rect class="box" x="320" y="246" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="274.0" text-anchor="middle">describe: Error: configmap ...</text>
<line class="ln" x1="540" y1="269" x2="562" y2="269" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="246" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="266.0" text-anchor="middle">create the missing ConfigMap,</text>
<text class="ts" x="670.0" y="282.0" text-anchor="middle">Secret or key</text>
<rect class="boxb" x="24" y="306" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="334.0" text-anchor="middle">RunContainerError (StartError, 128)</text>
<line class="ln" x1="294" y1="329" x2="318" y2="329" marker-end="url(#ah)"/>
<rect class="box" x="320" y="306" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="334.0" text-anchor="middle">describe: Last State Message</text>
<line class="ln" x1="540" y1="329" x2="562" y2="329" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="306" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="326.0" text-anchor="middle">command or file missing:</text>
<text class="ts" x="670.0" y="342.0" text-anchor="middle">fix command or image</text>
<rect class="boxb" x="24" y="366" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="394.0" text-anchor="middle">Error / CrashLoopBackOff (exit 1)</text>
<line class="ln" x1="294" y1="389" x2="318" y2="389" marker-end="url(#ah)"/>
<rect class="box" x="320" y="366" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="394.0" text-anchor="middle">logs, logs --previous</text>
<line class="ln" x1="540" y1="389" x2="562" y2="389" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="366" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="386.0" text-anchor="middle">the app exited: fix what</text>
<text class="ts" x="670.0" y="402.0" text-anchor="middle">its log says</text>
<rect class="boxb" x="24" y="426" width="270" height="46" rx="10"/>
<text class="tm" x="159.0" y="454.0" text-anchor="middle">OOMKilled (exit 137)</text>
<line class="ln" x1="294" y1="449" x2="318" y2="449" marker-end="url(#ah)"/>
<rect class="box" x="320" y="426" width="220" height="46" rx="10"/>
<text class="ts" x="430.0" y="454.0" text-anchor="middle">describe: Last State</text>
<line class="ln" x1="540" y1="449" x2="562" y2="449" marker-end="url(#ah)"/>
<rect class="boxs" x="564" y="426" width="212" height="46" rx="10"/>
<text class="ts" x="670.0" y="446.0" text-anchor="middle">memory limit too low</text>
<text class="ts" x="670.0" y="462.0" text-anchor="middle">or the app leaks</text>
<line class="ln" x1="400" y1="102" x2="400" y2="118"/>
<line class="lnf" x1="24" y1="118" x2="776" y2="118"/>
</svg>
