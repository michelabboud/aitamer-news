<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
<title id="t">CrashLoopBackOff timeline</title>
<desc id="d">After a container exits, the kubelet waits before each restart: 10 seconds, then 20, 40, 80, 160, and then the cap of 300 seconds, highlighted, which repeats for every further restart. While it waits, kubectl shows CrashLoopBackOff, and on our cluster often Error, for the Pod. If a container runs for 10 minutes without trouble, the kubelet resets the delay, so the next crash waits 10 seconds again.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="380" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Restart delays double from 10 seconds to a 5-minute cap</text>
<text class="ts" x="24" y="70" text-anchor="start">first crash, then:</text>
<rect class="boxb" x="40" y="90" width="34" height="40" rx="4"/>
<text class="tm" x="57.0" y="115" text-anchor="middle">10s</text>
<circle class="dg" cx="80" cy="110" r="5"/>
<rect class="boxb" x="86" y="90" width="34" height="40" rx="4"/>
<text class="tm" x="103.0" y="115" text-anchor="middle">20s</text>
<circle class="dg" cx="126" cy="110" r="5"/>
<rect class="boxb" x="132" y="90" width="34" height="40" rx="4"/>
<text class="tm" x="149.0" y="115" text-anchor="middle">40s</text>
<circle class="dg" cx="172" cy="110" r="5"/>
<rect class="boxb" x="178" y="90" width="48.0" height="40" rx="4"/>
<text class="tm" x="202.0" y="115" text-anchor="middle">80s</text>
<circle class="dg" cx="232.0" cy="110" r="5"/>
<rect class="boxb" x="238.0" y="90" width="96.0" height="40" rx="4"/>
<text class="tm" x="286.0" y="115" text-anchor="middle">160s</text>
<circle class="dg" cx="340.0" cy="110" r="5"/>
<rect class="boxc" x="346.0" y="90" width="180.0" height="40" rx="4"/>
<text class="tm" x="436.0" y="115" text-anchor="middle">300s</text>
<circle class="dg" cx="532.0" cy="110" r="5"/>
<rect class="boxc" x="538.0" y="90" width="180.0" height="40" rx="4"/>
<text class="tm" x="628.0" y="115" text-anchor="middle">300s</text>
<circle class="dg" cx="724.0" cy="110" r="5"/>
<text class="ts" x="40" y="160" text-anchor="start">each block: wait before the next restart; each dot: the container starts again and crashes</text>
<text class="ts" x="40" y="184" text-anchor="start">delays from the Pod lifecycle docs; a node&#x27;s kubelet config can lower the cap (maxContainerRestartPeriod)</text>
<rect class="panel" x="24" y="214" width="752" height="140" rx="10"/>
<text class="th" x="44" y="242" text-anchor="start">Reset</text>
<rect class="boxs" x="44" y="258" width="420" height="32" rx="4"/>
<text class="ts" x="254" y="279" text-anchor="middle">container runs 10 minutes without a crash</text>
<line class="ln" x1="464" y1="274" x2="500" y2="274" marker-end="url(#ah)"/>
<rect class="boxb" x="502" y="258" width="60" height="32" rx="4"/>
<text class="tm" x="532" y="279" text-anchor="middle">10s</text>
<text class="ts" x="576" y="279" text-anchor="start">next crash starts from 10s</text>
<text class="t" x="44" y="330" text-anchor="start">Image pulls use the same idea: ImagePullBackOff retries with a growing delay, capped at 300 s.</text>
</svg>
