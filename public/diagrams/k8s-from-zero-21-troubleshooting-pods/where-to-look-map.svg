<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
<title id="t">Where to look map</title>
<desc id="d">Four commands cover almost every Pod problem, from the quickest to the most detailed. kubectl get pods gives STATUS and RESTARTS. kubectl describe pod gives State, Last State with reason, exit code and message, highlighted because it holds the cause for config, start and memory failures, and the Events of that Pod. kubectl logs, with --previous for the run before, gives what the app printed. kubectl events, filtered with --for pod/NAME or --types=Warning, gives the event stream for the namespace. The exit codes seen in the lab were 1 for an app that exited with an error, 128 for a start error and 137 for OOMKilled.</desc>
