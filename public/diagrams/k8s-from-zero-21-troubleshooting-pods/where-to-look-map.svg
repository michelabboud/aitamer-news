}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="460" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Four commands, from the summary to the detail</text>
<text class="ts" x="24" y="66" text-anchor="start">command</text>
<text class="ts" x="330" y="66" text-anchor="start">what it shows</text>
<text class="ts" x="620" y="66" text-anchor="start">best for</text>
<rect class="box" x="24" y="78" width="752" height="54" rx="8"/>
<text class="tm" x="40" y="110" text-anchor="start">kubectl get pods</text>
<text class="ts" x="330" y="110" text-anchor="start">STATUS, READY, RESTARTS</text>
<text class="ts" x="620" y="110" text-anchor="start">the first clue</text>
<rect class="boxc" x="24" y="144" width="752" height="54" rx="8"/>
<text class="tm" x="40" y="176" text-anchor="start">kubectl describe pod NAME</text>
<text class="ts" x="330" y="176" text-anchor="start">State, Last State: Reason, Exit Code, Message</text>
<text class="ts" x="620" y="176" text-anchor="start">config, start, memory</text>
<rect class="box" x="24" y="210" width="752" height="54" rx="8"/>
<text class="tm" x="40" y="242" text-anchor="start">kubectl logs NAME [--previous]</text>
<text class="ts" x="330" y="242" text-anchor="start">what the app printed (this run, or the one before)</text>
<text class="ts" x="620" y="242" text-anchor="start">app crashes</text>
<rect class="box" x="24" y="276" width="752" height="54" rx="8"/>
<text class="tm" x="40" y="308" text-anchor="start">kubectl events --for pod/NAME</text>
<text class="ts" x="330" y="308" text-anchor="start">scheduling, pulls, back-off, in time order</text>
<text class="ts" x="620" y="308" text-anchor="start">Pending and image pulls</text>
<text class="th" x="24" y="370" text-anchor="start">Exit codes we saw in the lab</text>
<text class="tm" x="40" y="396" text-anchor="start">1</text>
<text class="ts" x="90" y="396" text-anchor="start">the app exited with an error (crash)</text>
<text class="tm" x="40" y="416" text-anchor="start">128</text>
<text class="ts" x="90" y="416" text-anchor="start">StartError: the command could not start (runerr)</text>
<text class="tm" x="40" y="436" text-anchor="start">137</text>
<text class="ts" x="90" y="436" text-anchor="start">OOMKilled: over the memory limit (oom)</text>
</svg>
