<line class="ln" x1="504" y1="126" x2="554" y2="196" marker-end="url(#ah)"/>
<line class="ln" x1="656" y1="232" x2="656" y2="252" marker-end="url(#ah)"/>
<text class="tm" x="160" y="230" text-anchor="middle">No build step:</text>
<text class="ts" x="160" y="250" text-anchor="middle">configuration lives outside</text>
<text class="ts" x="160" y="268" text-anchor="middle">the image</text>
