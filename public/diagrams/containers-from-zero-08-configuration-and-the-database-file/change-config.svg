<rect class="bg" x="0" y="0" width="800" height="360" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">up -d recreates only what changed</text>
<rect class="panel" x="24" y="50" width="752" height="290" rx="10"/>
<rect class="box" x="48" y="90" width="200" height="56" rx="10"/>
<text class="tb" x="148" y="114.0" text-anchor="middle">.env</text>
<text class="ts" x="148" y="131.0" text-anchor="middle">APP_TITLE=Shared notes</text>
