<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">Changing APP_TITLE in .env</title>
<desc id="d">After editing .env from Kitchen notes to Shared notes, docker compose up -d compares the new model with what runs. web&#x27;s environment changed, so Compose recreates notes-web-1 from the same image notes-web; this is highlighted. db did not change, so notes-db-1 keeps running. The named volume notes_db-data is untouched, so the two notes are still there, and the page heading now says Shared notes.</desc>
