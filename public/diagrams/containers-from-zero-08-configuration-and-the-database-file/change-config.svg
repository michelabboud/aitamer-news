<text class="tb" x="656" y="200.0" text-anchor="middle">notes-db-1</text>
<text class="ts" x="656" y="217.0" text-anchor="middle">Running</text>
<rect class="boxs" x="556" y="254" width="200" height="56" rx="10"/>
<text class="tb" x="656" y="278.0" text-anchor="middle">volume notes_db-data</text>
<text class="ts" x="656" y="295.0" text-anchor="middle">2 notes, untouched</text>
