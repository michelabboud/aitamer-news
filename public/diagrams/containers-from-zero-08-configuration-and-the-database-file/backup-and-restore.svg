<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">A backup and a restore you have tried</title>
<desc id="d">Five steps. 1, docker compose exec db pg_dump -U notes notes writes backup.sql on your machine, 98 lines with the two notes. 2, docker compose down -v deletes the volume notes_db-data and the notes in it; this destructive step is highlighted. 3, docker compose up -d db creates a new empty volume, and PostgreSQL initialises a fresh database. 4, pg_isready -h 127.0.0.1 repeats until it says accepting connections, then psql reads backup.sql into the new database. 5, docker compose up -d starts web, and /notes.txt lists 1. First note and 2. Buy coffee beans again.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Back up, delete, restore, check</text>
<rect class="panel" x="24" y="50" width="752" height="330" rx="10"/>
<rect class="boxs" x="48" y="110" width="124" height="110" rx="10"/>
<text class="tb" x="110" y="152.5" text-anchor="middle">1. pg_dump</text>
<text class="ts" x="110" y="169.5" text-anchor="middle">backup.sql</text>
<text class="ts" x="110" y="186.5" text-anchor="middle">98 lines</text>
<rect class="boxc" x="194" y="110" width="124" height="110" rx="10"/>
<text class="tb" x="256" y="152.5" text-anchor="middle">2. down -v</text>
<text class="ts" x="256" y="169.5" text-anchor="middle">volume deleted</text>
<text class="ts" x="256" y="186.5" text-anchor="middle">notes gone</text>
<rect class="box" x="340" y="110" width="124" height="110" rx="10"/>
<text class="tb" x="402" y="152.5" text-anchor="middle">3. up -d db</text>
<text class="ts" x="402" y="169.5" text-anchor="middle">new empty volume</text>
<text class="ts" x="402" y="186.5" text-anchor="middle">fresh database</text>
<rect class="box" x="486" y="110" width="124" height="110" rx="10"/>
<text class="tb" x="548" y="152.5" text-anchor="middle">4. psql &lt;</text>
<text class="ts" x="548" y="169.5" text-anchor="middle">pg_isready first,</text>
<text class="ts" x="548" y="186.5" text-anchor="middle">then backup.sql</text>
<rect class="boxs" x="632" y="110" width="124" height="110" rx="10"/>
<text class="tb" x="694" y="152.5" text-anchor="middle">5. up -d</text>
<text class="ts" x="694" y="169.5" text-anchor="middle">1. First note</text>
<text class="ts" x="694" y="186.5" text-anchor="middle">2. Buy coffee beans</text>
<line class="ln" x1="172" y1="165" x2="192" y2="165" marker-end="url(#ah)"/>
<line class="ln" x1="318" y1="165" x2="338" y2="165" marker-end="url(#ah)"/>
<line class="ln" x1="464" y1="165" x2="484" y2="165" marker-end="url(#ah)"/>
<line class="ln" x1="610" y1="165" x2="630" y2="165" marker-end="url(#ah)"/>
<text class="tm" x="400" y="270" text-anchor="middle">Keep backup.sql somewhere other than the volume. A backup counts once you have restored it.</text>
<text class="ts" x="400" y="300" text-anchor="middle">docker compose exec db pg_dump -U notes notes &gt; backup.sql</text>
<text class="ts" x="400" y="320" text-anchor="middle">docker compose exec -T db psql -q -U notes -d notes &lt; backup.sql</text>
</svg>
