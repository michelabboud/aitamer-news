<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">How a value in .env reaches the container</title>
<desc id="d">Three stages from left to right. The .env file next to compose.yaml holds APP_TITLE=Kitchen notes and POSTGRES_PASSWORD=local-dev-only-7c2f. compose.yaml refers to them as ${APP_TITLE:-Notes}, which falls back to Notes when the variable is unset or empty, and ${POSTGRES_PASSWORD:?set it in .env}, which stops Compose with that message when it is missing. Compose replaces them when it reads the file; docker compose config shows the result, highlighted: APP_TITLE: Kitchen notes and DATABASE_URL with the password filled in. The containers receive those values as ordinary environment variables. A variable set in your shell wins over .env, and --env-file replaces .env.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="430" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Compose fills ${...} in compose.yaml before starting anything</text>
<rect class="panel" x="24" y="50" width="228" height="340" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">.env</text>
<rect class="box" x="40" y="92" width="196" height="80" rx="10"/>
<text class="tm" x="52" y="119.5" text-anchor="start">APP_TITLE=</text>
<text class="tm" x="52" y="136.5" text-anchor="start">Kitchen notes</text>
<text class="tm" x="52" y="153.5" text-anchor="start">POSTGRES_PASSWORD=...</text>
<text class="ts" x="138" y="210" text-anchor="middle">shell variables win;</text>
<text class="ts" x="138" y="228" text-anchor="middle">--env-file replaces .env</text>
<rect class="panel" x="286" y="50" width="228" height="340" rx="10"/>
<text class="th" x="302" y="76" text-anchor="start">compose.yaml</text>
<rect class="box" x="302" y="92" width="196" height="56" rx="10"/>
<text class="tm" x="400" y="116.0" text-anchor="middle">${APP_TITLE:-Notes}</text>
<text class="ts" x="400" y="133.0" text-anchor="middle">default if unset or empty</text>
<rect class="box" x="302" y="164" width="196" height="72" rx="10"/>
<text class="tm" x="400" y="187.5" text-anchor="middle">${POSTGRES_PASSWORD</text>
<text class="tm" x="400" y="204.5" text-anchor="middle">:?set it in .env}</text>
<text class="ts" x="400" y="221.5" text-anchor="middle">error if missing</text>
<rect class="panel" x="548" y="50" width="228" height="340" rx="10"/>
<text class="th" x="564" y="76" text-anchor="start">docker compose config</text>
<rect class="boxc" x="564" y="92" width="196" height="144" rx="10"/>
<text class="tm" x="576" y="126.0" text-anchor="start">web:</text>
<text class="tm" x="576" y="143.0" text-anchor="start">APP_TITLE:</text>
<text class="tm" x="576" y="160.0" text-anchor="start">Kitchen notes</text>
<text class="tm" x="576" y="177.0" text-anchor="start">DATABASE_URL:</text>
<text class="ts" x="576" y="194.0" text-anchor="start">postgresql://notes:</text>
<text class="ts" x="576" y="211.0" text-anchor="start">local-dev-only-7c2f@db...</text>
<line class="ln" x1="238" y1="132" x2="300" y2="120" marker-end="url(#ah)"/>
<line class="ln" x1="238" y1="150" x2="300" y2="196" marker-end="url(#ah)"/>
<line class="lnc" x1="500" y1="120" x2="562" y2="140" marker-end="url(#ahc)"/>
<line class="lnc" x1="500" y1="200" x2="562" y2="180" marker-end="url(#ahc)"/>
<text class="tb" x="400" y="290" text-anchor="middle">Missing .env:</text>
<text class="ts" x="400" y="310" text-anchor="middle">required variable POSTGRES_PASSWORD is missing a value: set it in .env</text>
<text class="tm" x="400" y="350" text-anchor="middle">No rebuild: the image stays the same, only the container&#x27;s environment changes.</text>
</svg>
