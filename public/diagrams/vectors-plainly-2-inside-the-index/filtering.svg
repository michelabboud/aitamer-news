<text class="ts" x="420" y="130" text-anchor="start">or keeps scanning until it has 10</text>
<text class="ts" x="24" y="190" text-anchor="start">pgvector: iterative index scans (0.8.0+). Qdrant: payload-aware HNSW edges.</text>
<text class="ts" x="24" y="208" text-anchor="start">Research: ACORN, Filtered-DiskANN. Very selective filters often suit an exact scan instead.</text>
