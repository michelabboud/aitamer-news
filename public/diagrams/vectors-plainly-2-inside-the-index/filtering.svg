<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 226" role="img" aria-labelledby="t d">
<title id="t">Pre- and post-filtering</title>
<desc id="d">With post-filtering, an approximate search returns 40 candidates and a filter matching 10 percent of rows leaves about 4, fewer than the 10 asked for. Filtering inside the search, or iterating, returns the full 10.</desc>
