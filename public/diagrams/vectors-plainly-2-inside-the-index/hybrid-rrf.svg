<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d">
<title id="t">Hybrid search with RRF</title>
<desc id="d">A dense vector ranking and a BM25 keyword ranking are merged with reciprocal rank fusion, which adds 1 over 60 plus the rank from each list; documents ranked well in both lists rise to the top.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes rise { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
.f0 { animation: rise 6s ease-out 0.0s infinite backwards; }
.f1 { animation: rise 6s ease-out 0.5s infinite backwards; }
.f2 { animation: rise 6s ease-out 1.0s infinite backwards; }
.f3 { animation: rise 6s ease-out 1.5s infinite backwards; }
.f4 { animation: rise 6s ease-out 2.0s infinite backwards; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="384" rx="12"/>
<text class="th" x="24" y="30" text-anchor="start">Hybrid search: fuse two rankings with Reciprocal Rank Fusion</text>
<text class="t" x="24" y="64" text-anchor="start">Dense (vector) ranking</text>
<text class="t" x="24" y="214" text-anchor="start">Sparse (BM25) ranking</text>
<rect class="boxb" x="24" y="74" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="92.0" text-anchor="middle">1. refund-policy</text>
<rect class="boxb" x="24" y="104" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="122.0" text-anchor="middle">2. returns-faq</text>
<rect class="boxb" x="24" y="134" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="152.0" text-anchor="middle">3. shipping-times</text>
<rect class="boxb" x="24" y="164" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="182.0" text-anchor="middle">4. order-SKU-4471</text>
<rect class="boxs" x="24" y="224" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="242.0" text-anchor="middle">1. order-SKU-4471</text>
<rect class="boxs" x="24" y="254" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="272.0" text-anchor="middle">2. refund-policy</text>
<rect class="boxs" x="24" y="284" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="302.0" text-anchor="middle">3. invoice-4471</text>
<rect class="boxs" x="24" y="314" width="200" height="26" rx="5"/>
<text class="tm" x="124.0" y="332.0" text-anchor="middle">4. returns-faq</text>
<text class="t" x="470" y="64" text-anchor="start">Fused: score = sum of 1 / (60 + rank)</text>
<g class="f f0"><rect class="boxc" x="470" y="74" width="300" height="28" rx="5"/>
<text class="tm" x="620.0" y="93.0" text-anchor="middle">1. refund-policy   0.0325</text></g>
<g class="f f1"><rect class="boxc" x="470" y="108" width="300" height="28" rx="5"/>
<text class="tm" x="620.0" y="127.0" text-anchor="middle">2. order-SKU-4471   0.0320</text></g>
<g class="f f2"><rect class="boxc" x="470" y="142" width="300" height="28" rx="5"/>
<text class="tm" x="620.0" y="161.0" text-anchor="middle">3. returns-faq   0.0318</text></g>
<g class="f f3"><rect class="boxc" x="470" y="176" width="300" height="28" rx="5"/>
<text class="tm" x="620.0" y="195.0" text-anchor="middle">4. shipping-times   0.0159</text></g>
<g class="f f4"><rect class="boxc" x="470" y="210" width="300" height="28" rx="5"/>
<text class="tm" x="620.0" y="229.0" text-anchor="middle">5. invoice-4471   0.0159</text></g>
<path class="ln" d="M232 150L460 150" marker-end="url(#ah)"/>
<path class="ln" d="M232 290L460 190" marker-end="url(#ah)"/>
<text class="ts" x="24" y="364" text-anchor="start">A document ranked high by both lists wins; exact IDs like SKU-4471 get rescued by the keyword side.</text>
</svg>
