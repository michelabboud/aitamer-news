  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
}

@keyframes draw { 0% { stroke-dashoffset: 100; } 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
.walk { stroke-dasharray: 100; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
.walk { animation: draw 5s ease-in-out infinite; }
}
</style>
