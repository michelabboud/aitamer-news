<text class="ts" x="225" y="364" text-anchor="middle">query probes the 2 nearest centroids (nprobe = 2)</text>
<text class="th" x="420" y="30" text-anchor="start">PQ: compress each vector to a few bytes</text>
<text class="tm" x="420" y="62" text-anchor="start">768 floats x 4 bytes = 3,072 bytes</text>
<rect class="boxb" x="420" y="74" width="42" height="34" rx="4"/>
<text class="ts" x="441" y="96" text-anchor="middle">96d</text>
<rect class="boxs" x="464" y="74" width="42" height="34" rx="4"/>
