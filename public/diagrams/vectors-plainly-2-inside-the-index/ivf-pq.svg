<text class="ts" x="420" y="236" text-anchor="start">each replaced by the id of its nearest of 256</text>
<text class="ts" x="420" y="254" text-anchor="start">learned centroids: 8 codes x 1 byte = 8 bytes</text>
<text class="t" x="420" y="290" text-anchor="start">Distances are then estimated from small</text>
<text class="t" x="420" y="310" text-anchor="start">lookup tables, not the original floats.</text>
<text class="tc" x="420" y="340" text-anchor="start">Smaller and faster; recall drops a little.</text>
</svg>
