<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
<title id="t">IVF and product quantization</title>
<desc id="d">Left: vectors are grouped into cells around centroids, and a query searches only the two nearest cells. Right: product quantization splits a 768-dimension vector into 8 pieces and replaces each with a one-byte code, shrinking 3,072 bytes to 8.</desc>
<style>
