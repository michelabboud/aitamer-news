<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.soft{fill:#f4efe4;stroke:#2f4763;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}.arr{fill:#2f4763}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ln{stroke:#9fb4cc}.soft{fill:#152130;stroke:#9fb4cc}.arr{fill:#9fb4cc}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arr"/></marker></defs><rect class="bg" width="800" height="260"/><rect class="box" x="10" y="40" width="190" height="70" rx="8"/><text class="t" x="105.0" y="64" text-anchor="middle">drive()</text><text class="s" x="105.0" y="85" text-anchor="middle">polls ready tasks, returns, never parks</text><rect class="gate" x="250" y="40" width="180" height="70" rx="8"/><text class="w" x="340.0" y="64" text-anchor="middle">Wait registered</text><text class="w" x="340.0" y="85" text-anchor="middle">socket or timer wake path</text><rect class="core" x="480" y="40" width="140" height="70" rx="8"/><text class="w" x="550.0" y="64" text-anchor="middle">Host loop</text><text class="w" x="550.0" y="85" text-anchor="middle">keeps running</text><rect class="box" x="670" y="40" width="110" height="70" rx="8"/><text class="t" x="725.0" y="64" text-anchor="middle">Host waker</text><text class="s" x="725.0" y="85" text-anchor="middle">fires on readiness</text><path class="ln" d="M200 75L250 75" marker-end="url(#a)"/><path class="ln" d="M430 75L480 75" marker-end="url(#a)"/><path class="ln" d="M620 75L670 75" marker-end="url(#a)"/><path class="ln" d="M725 110L725 190L105 190L105 110" marker-end="url(#a)"/><text class="s" x="250" y="180">The host calls drive() again on the owning thread.</text><text class="s" x="10" y="240">No Tokio thread blocks inside the Workers event loop.</text></svg>
