<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.soft{fill:#f4efe4;stroke:#2f4763;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}.arr{fill:#2f4763}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ln{stroke:#9fb4cc}.soft{fill:#152130;stroke:#9fb4cc}.arr{fill:#9fb4cc}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arr"/></marker></defs><rect class="bg" width="800" height="270"/><rect class="box" x="10" y="70" width="130" height="64" rx="8"/><text class="t" x="75.0" y="94" text-anchor="middle">Rust source</text><text class="s" x="75.0" y="115" text-anchor="middle">wasm32-unknown-emscripten</text><rect class="box" x="180" y="70" width="110" height="64" rx="8"/><text class="t" x="235.0" y="94" text-anchor="middle">rustc</text><text class="s" x="235.0" y="115" text-anchor="middle">compiles</text><rect class="box" x="330" y="70" width="120" height="64" rx="8"/><text class="t" x="390.0" y="94" text-anchor="middle">emcc linker</text><text class="s" x="390.0" y="115" text-anchor="middle">driven by rustc</text><rect class="box" x="490" y="70" width="120" height="64" rx="8"/><text class="t" x="550.0" y="94" text-anchor="middle">wasm-bindgen</text><text class="s" x="550.0" y="115" text-anchor="middle">post-link step</text><rect class="core" x="650" y="70" width="140" height="64" rx="8"/><text class="w" x="720.0" y="94" text-anchor="middle">Workers runtime</text><text class="w" x="720.0" y="115" text-anchor="middle">loads JS and Wasm</text><path class="ln" d="M140 102L180 102" marker-end="url(#a)"/><path class="ln" d="M290 102L330 102" marker-end="url(#a)"/><path class="ln" d="M450 102L490 102" marker-end="url(#a)"/><path class="ln" d="M610 102L650 102" marker-end="url(#a)"/><rect class="soft" x="330" y="190" width="120" height="50" rx="8"/><text class="t" x="390.0" y="220.0" text-anchor="middle">Emscripten runtime</text><path class="ln" d="M390 134L390 190" marker-end="url(#a)"/><text class="s" x="490" y="205">wasm-bindgen emits bindings; emcc integrates them into the JS output.</text><text class="s" x="490" y="225">Emscripten supplies the platform layer.</text></svg>
