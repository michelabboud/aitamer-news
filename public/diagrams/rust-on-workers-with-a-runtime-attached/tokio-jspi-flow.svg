<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290"><style type="text/css">
.bg{fill:#f4efe4}.box{fill:#dfe6ee;stroke:#2f4763;stroke-width:2}.core{fill:#2f4763;stroke:#2f4763;stroke-width:2}.gate{fill:#f26b4f;stroke:#f26b4f;stroke-width:2}.soft{fill:#f4efe4;stroke:#2f4763;stroke-width:2;stroke-dasharray:6 4}
.t{font:600 15px sans-serif;fill:#1d2b3c}.s{font:13px sans-serif;fill:#3c4d62}.w{font:600 15px sans-serif;fill:#f4efe4}.ln{stroke:#2f4763;stroke-width:2.5;fill:none}.no{stroke:#f26b4f;stroke-width:2.5;fill:none;stroke-dasharray:6 4}.arr{fill:#2f4763}
@media (prefers-color-scheme: dark){.bg{fill:#152130}.box{fill:#22344a;stroke:#9fb4cc}.core{fill:#9fb4cc;stroke:#9fb4cc}.t{fill:#ecf1f7}.s{fill:#b8c7d9}.w{fill:#152130}.ln{stroke:#9fb4cc}.soft{fill:#152130;stroke:#9fb4cc}.arr{fill:#9fb4cc}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arr"/></marker></defs><rect class="bg" width="780" height="290"/><rect class="box" x="10" y="40" width="150" height="70" rx="8"/><text class="t" x="85.0" y="64" text-anchor="middle">Tokio future</text><text class="s" x="85.0" y="85" text-anchor="middle">reaches a pending socket or timer</text><rect class="gate" x="210" y="40" width="150" height="70" rx="8"/><text class="w" x="285.0" y="64" text-anchor="middle">JSPI suspends</text><text class="w" x="285.0" y="85" text-anchor="middle">the Wasm stack, host not blocked</text><rect class="core" x="410" y="40" width="150" height="70" rx="8"/><text class="w" x="485.0" y="64" text-anchor="middle">JavaScript</text><text class="w" x="485.0" y="85" text-anchor="middle">keeps handling other work</text><rect class="box" x="610" y="40" width="150" height="70" rx="8"/><text class="t" x="685.0" y="64" text-anchor="middle">Suspended Wasm resumes</text><text class="s" x="685.0" y="85" text-anchor="middle">when the operation is ready</text><path class="ln" d="M160 75L210 75" marker-end="url(#a)"/><path class="ln" d="M360 75L410 75" marker-end="url(#a)"/><path class="ln" d="M560 75L610 75" marker-end="url(#a)"/><rect class="soft" x="210" y="170" width="340" height="60" rx="8"/><text class="t" x="380.0" y="205.0" text-anchor="middle">Each suspended stack needs its own Tokio runtime context</text><path class="no" d="M285 110L285 170"/><text class="s" x="10" y="270">Suspended stacks can be re-entered later, so runtime context cannot be shared between them.</text></svg>
