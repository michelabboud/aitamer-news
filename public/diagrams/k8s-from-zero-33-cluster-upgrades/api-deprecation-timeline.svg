<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Removed Kubernetes API versions by release, and what is only deprecated</title>
<desc id="d">A timeline from 1.25 to 1.37. Releases that stopped serving API versions, from the Deprecated API Migration Guide: 1.25 removed batch/v1beta1 CronJob, policy/v1beta1 PodDisruptionBudget, discovery.k8s.io/v1beta1 EndpointSlice, events.k8s.io/v1beta1 Event and autoscaling/v2beta1 HorizontalPodAutoscaler; 1.26 removed flowcontrol v1beta1 and autoscaling/v2beta2; 1.27 removed storage.k8s.io/v1beta1 CSIStorageCapacity; 1.29 removed flowcontrol v1beta2; 1.32 removed flowcontrol v1beta3. The guide lists no removals after 1.32. Below the line, deprecated but still served on 1.37: v1 Endpoints, deprecated since 1.33 in favour of EndpointSlice, and v1 ComponentStatus, deprecated since 1.19. GA versions are never removed within a major version; a deprecated beta stays served for at least 9 months or 3 releases.</desc>
