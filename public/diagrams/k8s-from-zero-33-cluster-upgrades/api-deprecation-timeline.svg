<rect class="boxc" x="24" y="150" width="370" height="180" rx="10"/>
<text class="tc" x="40" y="174" text-anchor="start">Stopped serving (Deprecated API Migration Guide)</text>
<text class="ts" x="40" y="200" text-anchor="start">1.25  CronJob, PDB, EndpointSlice, Event, HPA (beta)</text>
<text class="ts" x="40" y="222" text-anchor="start">1.26  FlowSchema v1beta1, HPA v2beta2</text>
<text class="ts" x="40" y="244" text-anchor="start">1.27  CSIStorageCapacity v1beta1</text>
<text class="ts" x="40" y="266" text-anchor="start">1.29  FlowSchema v1beta2</text>
<text class="ts" x="40" y="288" text-anchor="start">1.32  FlowSchema v1beta3</text>
<text class="ts" x="40" y="310" text-anchor="start">1.33 to 1.37: none listed</text>
<rect class="boxs" x="406" y="150" width="370" height="180" rx="10"/>
<text class="t" x="422" y="174" text-anchor="start">Deprecated, still served on 1.37</text>
<text class="tm" x="422" y="200" text-anchor="start">v1 Endpoints: deprecated in 1.33+</text>
<text class="ts" x="422" y="222" text-anchor="start">use discovery.k8s.io/v1 EndpointSlice</text>
<text class="tm" x="422" y="244" text-anchor="start">v1 ComponentStatus: deprecated in 1.19+</text>
<text class="ts" x="422" y="266" text-anchor="start">kubectl prints a Warning: line</text>
<text class="tm" x="422" y="288" text-anchor="start">apiserver_requested_deprecated_apis</text>
<text class="ts" x="422" y="310" text-anchor="start">counts every call (lab: both seen)</text>
<rect class="panel" x="24" y="346" width="752" height="130" rx="10"/>
<text class="t" x="40" y="370" text-anchor="start">The rules (deprecation policy, Rule #4a)</text>
<text class="ts" x="40" y="396" text-anchor="start">GA (v1) versions may be deprecated but are not removed within a major version.</text>
<text class="ts" x="40" y="418" text-anchor="start">A deprecated beta is still served for 9 months or 3 minor releases, whichever is longer.</text>
<text class="ts" x="40" y="440" text-anchor="start">Alpha versions may go in any release without notice.</text>
<text class="ts" x="40" y="462" text-anchor="start">Before each upgrade: check the guide for the target release and your deprecated API metric.</text>
</svg>
