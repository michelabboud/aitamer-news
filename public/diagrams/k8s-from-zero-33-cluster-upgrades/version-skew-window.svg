<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Supported version skew when kube-apiserver is at 1.37</title>
<desc id="d">A grid with minor versions 1.34 to 1.38 across and components down. With the newest kube-apiserver at 1.37: other kube-apiserver instances in an HA cluster may be 1.37 or 1.36; kube-controller-manager and kube-scheduler 1.37 or 1.36; kubelet and kube-proxy 1.37, 1.36, 1.35 or 1.34, never newer than the API server; kubectl 1.38, 1.37 or 1.36. The highlighted column is 1.37. A note says upgrades go one minor version at a time, and that our lab ran with the API server at 1.37 while both workers were still at 1.36.4.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
