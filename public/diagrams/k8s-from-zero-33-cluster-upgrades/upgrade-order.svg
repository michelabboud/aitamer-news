<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">kubeadm upgrade order, as run in the lab</title>
<desc id="d">Five steps from top to bottom. Step 0, prepare: read the release notes, look for deprecated API use in warnings and the apiserver_requested_deprecated_apis metric, back up etcd, and check that PodDisruptionBudgets allow at least one disruption. Step 1, first control plane: install kubeadm 1.37, run kubeadm upgrade plan and kubeadm upgrade apply v1.37.0, which upgraded etcd to 3.7.0-0, the API server, controller manager and scheduler to v1.37.0, renewed certificates, and then upgraded CoreDNS to v1.14.6 and kube-proxy to v1.37.0. Step 2, other control planes: kubeadm upgrade node. Step 3, kubelets one node at a time: drain, install kubelet and kubectl, restart kubelet, uncordon; first the control plane node, then each worker after kubeadm upgrade node. After the first control plane, the CNI is upgraded by its own instructions. Step 4: upgrade kubectl on every client, move manifests to current API versions, and verify.</desc>
