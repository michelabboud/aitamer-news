<text class="ts" x="40" y="396" text-anchor="start">drain, new kubelet and kubectl, restart kubelet, uncordon</text>
<text class="tm" x="56" y="422" text-anchor="start">ucp1: drain, kubelet v1.37.0, uncordon</text>
<text class="tm" x="56" y="444" text-anchor="start">uw1, then uw2: kubeadm upgrade node, drain, kubelet v1.37.0, uncordon</text>
<line class="ln" x1="400" y1="468" x2="400" y2="482" marker-end="url(#ah)"/>
<rect class="box" x="24" y="484" width="752" height="64" rx="10"/>
<text class="t" x="40" y="508" text-anchor="start">4  Clients and manifests, then verify</text>
<text class="ts" x="40" y="530" text-anchor="start">kubectl everywhere, manifests moved to current APIs; nodes Ready</text>
