<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">Three ways to manage objects with kubectl</title>
<desc id="d">Three columns compare the management techniques from the Kubernetes documentation. Imperative commands such as kubectl run act on live objects and leave no file behind. Imperative object configuration such as kubectl create -f and kubectl replace -f acts on individual files and tells the cluster exactly which operation to do. Declarative object configuration with kubectl diff and kubectl apply, highlighted, acts on files or directories and lets kubectl work out whether to create or patch each object. A note warns that one object should be managed with only one technique.</desc>
