<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="430" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Three ways to tell the cluster what you want</text>
<rect class="box" x="24" y="52" width="240" height="320" rx="10"/>
<text class="t" x="40" y="80" text-anchor="start">Imperative commands</text>
<rect class="boxb" x="36" y="96" width="216" height="104" rx="8"/>
<text class="tm" x="46" y="122" text-anchor="start">kubectl run web</text>
<text class="tm" x="46" y="150" text-anchor="start">  --image=nginx:1.29-alpine</text>
<text class="tm" x="46" y="178" text-anchor="start">kubectl label pod web tier=x</text>
<text class="ts" x="40" y="234" text-anchor="start">acts on: live objects</text>
<text class="ts" x="40" y="264" text-anchor="start">record: none but the cluster</text>
<text class="ts" x="40" y="294" text-anchor="start">good for: learning, one-offs</text>
<rect class="box" x="280" y="52" width="240" height="320" rx="10"/>
<text class="t" x="296" y="80" text-anchor="start">Imperative object config</text>
<rect class="boxb" x="292" y="96" width="216" height="104" rx="8"/>
<text class="tm" x="302" y="122" text-anchor="start">kubectl create -f web.yaml</text>
<text class="tm" x="302" y="150" text-anchor="start">kubectl replace -f web.yaml</text>
<text class="tm" x="302" y="178" text-anchor="start">kubectl delete -f web.yaml</text>
<text class="ts" x="296" y="234" text-anchor="start">acts on: individual files</text>
<text class="ts" x="296" y="264" text-anchor="start">you choose the verb</text>
<text class="ts" x="296" y="294" text-anchor="start">create fails if it exists</text>
<rect class="boxc" x="536" y="52" width="240" height="320" rx="10"/>
<text class="tc" x="552" y="80" text-anchor="start">Declarative object config</text>
<rect class="boxb" x="548" y="96" width="216" height="104" rx="8"/>
<text class="tm" x="558" y="122" text-anchor="start">kubectl diff -f web.yaml</text>
<text class="tm" x="558" y="150" text-anchor="start">kubectl apply -f web.yaml</text>
<text class="tm" x="558" y="178" text-anchor="start">kubectl apply -f configs/</text>
<text class="ts" x="552" y="234" text-anchor="start">acts on: files or directories</text>
<text class="ts" x="552" y="264" text-anchor="start">kubectl works out the verb</text>
<text class="ts" x="552" y="294" text-anchor="start">what this series uses</text>
<text class="ts" x="24" y="404" text-anchor="start">Review and history grow from left to right. Pick one technique per object: mixing them is undefined.</text>
</svg>
