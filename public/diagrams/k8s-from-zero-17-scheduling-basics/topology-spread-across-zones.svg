<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">topologySpreadConstraints keep zones within maxSkew</title>
<desc id="d">Three zones, each one worker. Left: the Deployment shop with 6 replicas, maxSkew 1, topologyKey zone and whenUnsatisfiable DoNotSchedule, placed 2, 2 and 2. Right: worker3 in zone-c was cordoned and the Deployment scaled to 9. zone-a and zone-b grew to 3 each, which keeps the difference to zone-c at 1. The ninth Pod, highlighted, stayed Pending: putting it in zone-a or zone-b would make 4 against 2, a skew of 2. The event said 1 node was unschedulable and 2 did not match pod topology spread constraints. After uncordon, it went to zone-c and the count became 3, 3, 3.</desc>
