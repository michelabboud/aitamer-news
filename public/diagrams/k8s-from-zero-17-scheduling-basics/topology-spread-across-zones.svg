<text class="ts" x="40" y="416" text-anchor="start">DoNotSchedule: leave the Pod Pending. ScheduleAnyway: place it, prefer the lower skew.</text>
<text class="ts" x="40" y="440" text-anchor="start">After kubectl uncordon worker3, the Pending Pod went to zone-c: 3 / 3 / 3.</text>
