<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">How the scheduler places a Pod: filter, then score</title>
<desc id="d">The lab Pod fast-disk asks for nodeSelector disktype=ssd. The scheduler first filters the four nodes. The control-plane node is removed because it has the taint node-role.kubernetes.io/control-plane NoSchedule. worker and worker3 are removed because they lack the label disktype=ssd. Only worker2, highlighted, passes. Scoring then ranks the nodes that are left, and the scheduler binds the Pod to the top one, so spec.nodeName becomes k8s-ep16-worker2. If no node passes, the Pod stays Pending and the FailedScheduling event lists the reason count for each node, as in the panel: 0/4 nodes are available, 1 had untolerated taints, 3 did not match the node selector.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Pod fast-disk (nodeSelector disktype: ssd) meets 4 nodes</text>
<rect class="boxs" x="24" y="56" width="160" height="70" rx="10"/>
<text class="tm" x="40" y="84" text-anchor="start">Pod fast-disk</text>
<text class="ts" x="40" y="108" text-anchor="start">Pending, no node</text>
<line class="ln" x1="184" y1="91" x2="222" y2="91" marker-end="url(#ah)"/>
<text class="t" x="232" y="74" text-anchor="start">1. filter: may it run here?</text>
<rect class="box" x="232" y="90" width="300" height="46" rx="8"/>
<text class="tm" x="244" y="110" text-anchor="start">control-plane</text>
<text class="ts" x="244" y="128" text-anchor="start">taint: NoSchedule</text>
<text class="ts" x="548" y="120" text-anchor="start">out</text>
<rect class="box" x="232" y="148" width="300" height="46" rx="8"/>
<text class="tm" x="244" y="168" text-anchor="start">worker</text>
<text class="ts" x="244" y="186" text-anchor="start">no disktype=ssd</text>
<text class="ts" x="548" y="178" text-anchor="start">out</text>
<rect class="boxc" x="232" y="206" width="300" height="46" rx="8"/>
<text class="tm" x="244" y="226" text-anchor="start">worker2</text>
<text class="tc" x="244" y="244" text-anchor="start">zone-b, ssd: passes</text>
<text class="tc" x="548" y="222" text-anchor="start">kept</text>
<rect class="box" x="232" y="264" width="300" height="46" rx="8"/>
<text class="tm" x="244" y="284" text-anchor="start">worker3</text>
<text class="ts" x="244" y="302" text-anchor="start">no disktype=ssd</text>
<text class="ts" x="548" y="294" text-anchor="start">out</text>
<text class="t" x="600" y="74" text-anchor="start">2. score, 3. bind</text>
<rect class="boxb" x="600" y="206" width="176" height="46" rx="8"/>
<text class="tm" x="612" y="226" text-anchor="start">nodeName:</text>
<text class="tm" x="612" y="244" text-anchor="start">k8s-ep16-worker2</text>
<line class="lnc" x1="532" y1="229" x2="598" y2="229" marker-end="url(#ahc)"/>
<rect class="panel" x="600" y="90" width="176" height="96" rx="8"/>
<text class="ts" x="612" y="112" text-anchor="start">scoring ranks the</text>
<text class="ts" x="612" y="132" text-anchor="start">nodes that passed:</text>
<text class="ts" x="612" y="152" text-anchor="start">spread, affinity</text>
<text class="ts" x="612" y="172" text-anchor="start">weights, resources</text>
<rect class="panel" x="24" y="334" width="752" height="96" rx="10"/>
<text class="t" x="40" y="358" text-anchor="start">No node passes: the Pod stays Pending (needs-gpu, nodeSelector gpu: "true")</text>
<text class="tm" x="40" y="384" text-anchor="start">0/4 nodes are available: 1 node(s) had untolerated taint(s),</text>
<text class="tm" x="40" y="404" text-anchor="start">3 node(s) didn't match Pod's node affinity/selector.</text>
<rect class="panel" x="24" y="444" width="752" height="46" rx="10"/>
<text class="ts" x="40" y="472" text-anchor="start">Read it as a count per reason. Fix the label or the rule; the scheduler retries on its own.</text>
</svg>
