.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Rules about other Pods: away from, or next to</text>
<rect class="panel" x="24" y="56" width="368" height="300" rx="12"/>
<text class="t" x="40" y="82" text-anchor="start">podAntiAffinity: away from app=web</text>
<text class="ts" x="40" y="102" text-anchor="start">topologyKey: kubernetes.io/hostname</text>
<rect class="boxs" x="40" y="118" width="200" height="50" rx="8"/>
<text class="tm" x="52" y="140" text-anchor="start">worker</text>
<rect class="box" x="256" y="126" width="120" height="34" rx="6"/>
<text class="tm" x="266" y="148" text-anchor="start">web</text>
<rect class="boxs" x="40" y="180" width="200" height="50" rx="8"/>
<text class="tm" x="52" y="202" text-anchor="start">worker2</text>
<rect class="box" x="256" y="188" width="120" height="34" rx="6"/>
<text class="tm" x="266" y="210" text-anchor="start">web</text>
<rect class="boxs" x="40" y="242" width="200" height="50" rx="8"/>
<text class="tm" x="52" y="264" text-anchor="start">worker3</text>
<rect class="box" x="256" y="250" width="120" height="34" rx="6"/>
<text class="tm" x="266" y="272" text-anchor="start">web</text>
<rect class="boxc" x="40" y="310" width="336" height="34" rx="6"/>
<text class="tc" x="52" y="332" text-anchor="start">4th web replica: Pending</text>
<rect class="panel" x="408" y="56" width="368" height="300" rx="12"/>
<text class="t" x="424" y="82" text-anchor="start">podAffinity: next to app=cache</text>
<text class="ts" x="424" y="102" text-anchor="start">topologyKey: topology.kubernetes.io/zone</text>
<rect class="boxs" x="424" y="118" width="336" height="50" rx="8"/>
<text class="tm" x="436" y="140" text-anchor="start">worker  zone-a</text>
<rect class="boxs" x="424" y="180" width="336" height="108" rx="8"/>
<text class="tm" x="436" y="202" text-anchor="start">worker2  zone-b</text>
<rect class="boxs" x="424" y="300" width="336" height="44" rx="8"/>
<text class="tm" x="436" y="322" text-anchor="start">worker3  zone-c</text>
<rect class="boxn" x="436" y="206" width="90" height="30" rx="6"/>
<text class="tm" x="446" y="226" text-anchor="start">cache</text>
<rect class="box" x="536" y="206" width="66" height="30" rx="6"/>
<text class="ts" x="544" y="226" text-anchor="start">worker</text>
<rect class="box" x="610" y="206" width="66" height="30" rx="6"/>
<text class="ts" x="618" y="226" text-anchor="start">worker</text>
<rect class="box" x="684" y="206" width="66" height="30" rx="6"/>
<text class="ts" x="692" y="226" text-anchor="start">worker</text>
<text class="ts" x="436" y="272" text-anchor="start">all three followed the cache</text>
<rect class="panel" x="24" y="372" width="752" height="84" rx="10"/>
<text class="ts" x="40" y="396" text-anchor="start">required...: a hard rule, Pending if no place fits. preferred...: a weighted hint.</text>
<text class="ts" x="40" y="420" text-anchor="start">topologyKey sets the size of "the same place": one node, or one zone.</text>
<text class="ts" x="40" y="444" text-anchor="start">Both rules cost scheduler time; the docs advise against them past several hundred nodes.</text>
</svg>
