<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Pod anti-affinity spreads replicas, pod affinity groups them</title>
<desc id="d">Left: the Deployment web with required pod anti-affinity on kubernetes.io/hostname. Each of the three workers ran one web Pod. When we scaled to four replicas, the fourth Pod, highlighted, stayed Pending because every worker already had a web Pod and the control plane is tainted. Right: the Deployment worker with required pod affinity to app=cache on topology.kubernetes.io/zone. The cache Pod landed on worker2 in zone-b, and all three worker Pods followed it into zone-b. A panel notes that the topologyKey decides what counts as the same place: a node for hostname, a zone for the zone label.</desc>
