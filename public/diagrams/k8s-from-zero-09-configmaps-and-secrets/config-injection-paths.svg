<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Three ways a container reads a ConfigMap or Secret</title>
<desc id="d">On the left, the ConfigMap app-config holds APP_COLOR, APP_MODE and app.properties, and the Secret db-creds holds username and password, both drawn in sand as stored data. Arrows show three paths into the container on the right. env with valueFrom copies one key into a variable you name, such as APP_COLOR or DB_USER. envFrom copies every key, which is highlighted because it also turned the file key app.properties into a variable named CFG_app.properties. A volume turns each key into a file, so app.properties appears at /etc/app/app.properties and the Secret appears as files under /etc/db on a tmpfs with mode 0400.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="500" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">ConfigMap and Secret into a container: env, envFrom, volume</text>
<rect class="boxn" x="24" y="56" width="230" height="150" rx="10"/>
<text class="tm" x="40" y="82" text-anchor="start">ConfigMap app-config</text>
<text class="tm" x="40" y="108" text-anchor="start">APP_COLOR: blue</text>
<text class="tm" x="40" y="128" text-anchor="start">APP_MODE: dev</text>
<text class="tm" x="40" y="148" text-anchor="start">app.properties: |</text>
<text class="tm" x="40" y="168" text-anchor="start">  greeting=hello</text>
<text class="tm" x="40" y="188" text-anchor="start">  retries=3</text>
<rect class="boxn" x="24" y="240" width="230" height="104" rx="10"/>
<text class="tm" x="40" y="266" text-anchor="start">Secret db-creds</text>
<text class="tm" x="40" y="292" text-anchor="start">username: YXBw</text>
<text class="tm" x="40" y="312" text-anchor="start">password: czNjcjN0...</text>
<text class="ts" x="40" y="332" text-anchor="start">(base64 in the API)</text>
<rect class="boxs" x="504" y="56" width="272" height="370" rx="12"/>
<text class="t" x="520" y="82" text-anchor="start">container in the Pod</text>
<rect class="box" x="520" y="100" width="240" height="70" rx="8"/>
<text class="tm" x="532" y="122" text-anchor="start">env (valueFrom)</text>
<text class="tm" x="532" y="142" text-anchor="start">APP_COLOR=blue</text>
<text class="tm" x="532" y="160" text-anchor="start">DB_USER=app</text>
<rect class="boxc" x="520" y="184" width="240" height="90" rx="8"/>
<text class="tm" x="532" y="206" text-anchor="start">envFrom, prefix CFG_</text>
<text class="tm" x="532" y="226" text-anchor="start">CFG_APP_COLOR=blue</text>
<text class="tm" x="532" y="244" text-anchor="start">CFG_APP_MODE=dev</text>
<text class="tm" x="532" y="262" text-anchor="start">CFG_app.properties=...</text>
<rect class="box" x="520" y="288" width="240" height="124" rx="8"/>
<text class="tm" x="532" y="310" text-anchor="start">volume mounts</text>
<text class="tm" x="532" y="330" text-anchor="start">/etc/app/APP_COLOR</text>
<text class="tm" x="532" y="348" text-anchor="start">/etc/app/app.properties</text>
<text class="tm" x="532" y="370" text-anchor="start">/etc/db/password</text>
<text class="ts" x="532" y="388" text-anchor="start">tmpfs, mode 0400</text>
<line class="ln" x1="254" y1="110" x2="518" y2="130" marker-end="url(#ah)"/>
<line class="lnc" x1="254" y1="140" x2="518" y2="226" marker-end="url(#ahc)"/>
<line class="ln" x1="254" y1="170" x2="518" y2="330" marker-end="url(#ah)"/>
<line class="ln" x1="254" y1="280" x2="518" y2="150" marker-end="url(#ah)"/>
<line class="ln" x1="254" y1="310" x2="518" y2="370" marker-end="url(#ah)"/>
<text class="ts" x="330" y="104" text-anchor="start">one key</text>
<text class="tc" x="310" y="200" text-anchor="start">every key</text>
<text class="ts" x="320" y="262" text-anchor="start">files</text>
<rect class="panel" x="24" y="444" width="752" height="46" rx="10"/>
<text class="ts" x="40" y="472" text-anchor="start">Variables are copied once when the container starts. Files can change later (next diagram).</text>
</svg>
