<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">What changes after you update a ConfigMap</title>
<desc id="d">A timeline from our lab. At 20:53:05 UTC we applied a new ConfigMap with APP_COLOR green and greeting hi. The file mounted from a volume changed after about 58 seconds, because the kubelet refreshes ConfigMap volumes on its sync loop. The environment variable APP_COLOR still said blue, because variables are set only when a container starts; that row is highlighted. In a second test, a Pod that mounted the file with subPath kept the old content after the ConfigMap changed back. After kubectl rollout restart, the new Pod started with APP_COLOR green.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">After kubectl apply of a new ConfigMap</text>
<line class="lnf" x1="330" y1="70" x2="770" y2="70"/>
<line class="ln" x1="330" y1="62" x2="330" y2="78"/>
<text class="ts" x="334" y="58" text-anchor="start">0 s</text>
<line class="ln" x1="500" y1="62" x2="500" y2="78"/>
<text class="ts" x="504" y="58" text-anchor="start">~58 s</text>
<line class="ln" x1="640" y1="62" x2="640" y2="78"/>
<text class="ts" x="644" y="58" text-anchor="start">rollout restart</text>
<rect class="box" x="24" y="96" width="752" height="76" rx="10"/>
<text class="t" x="40" y="124" text-anchor="start">volume file</text>
<text class="ts" x="40" y="148" text-anchor="start">updated by the kubelet, no restart</text>
<text class="tm" x="334" y="136" text-anchor="start">greeting=hello</text>
<text class="tm" x="504" y="136" text-anchor="start">greeting=hi</text>
<text class="tm" x="644" y="136" text-anchor="start">greeting=hi</text>
<rect class="boxc" x="24" y="188" width="752" height="76" rx="10"/>
<text class="t" x="40" y="216" text-anchor="start">env variable</text>
<text class="ts" x="40" y="240" text-anchor="start">only a new container reads it</text>
<text class="tm" x="334" y="228" text-anchor="start">APP_COLOR=blue</text>
<text class="tm" x="504" y="228" text-anchor="start">APP_COLOR=blue</text>
<text class="tm" x="644" y="228" text-anchor="start">APP_COLOR=green</text>
<rect class="box" x="24" y="280" width="752" height="76" rx="10"/>
<text class="t" x="40" y="308" text-anchor="start">subPath file</text>
<text class="ts" x="40" y="332" text-anchor="start">CM set back to hello: still hi 75 s later</text>
<text class="tm" x="334" y="320" text-anchor="start">greeting=hi</text>
<text class="tm" x="504" y="320" text-anchor="start">greeting=hi</text>
<text class="tm" x="644" y="320" text-anchor="start">until recreated</text>
<rect class="panel" x="24" y="380" width="752" height="56" rx="10"/>
<text class="ts" x="40" y="404" text-anchor="start">subPath mounts never receive updates; recreate the Pod (rollout restart for a Deployment).</text>
<text class="ts" x="40" y="424" text-anchor="start">Delay for volumes: kubelet sync period plus cache delay, about a minute here.</text>
</svg>
