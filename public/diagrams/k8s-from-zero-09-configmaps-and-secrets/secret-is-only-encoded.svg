<rect class="bg" x="0" y="0" width="800" height="460" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Secret values are base64: encoding anyone can reverse</text>
<rect class="box" x="24" y="56" width="200" height="64" rx="10"/>
<text class="tm" x="40" y="84" text-anchor="start">s3cr3t-Pa55</text>
<text class="ts" x="40" y="106" text-anchor="start">what you typed</text>
<rect class="boxn" x="300" y="56" width="200" height="64" rx="10"/>
<text class="tm" x="316" y="84" text-anchor="start">czNjcjN0LVBhNTU=</text>
<text class="ts" x="316" y="106" text-anchor="start">what the API stores</text>
<rect class="box" x="576" y="56" width="200" height="64" rx="10"/>
<text class="tm" x="592" y="84" text-anchor="start">s3cr3t-Pa55</text>
<text class="ts" x="592" y="106" text-anchor="start">base64 -d, no key</text>
<line class="ln" x1="224" y1="88" x2="298" y2="88" marker-end="url(#ah)"/>
<line class="lnc" x1="500" y1="88" x2="574" y2="88" marker-end="url(#ahc)"/>
<text class="ts" x="232" y="80" text-anchor="start">base64</text>
<rect class="boxc" x="24" y="136" width="752" height="40" rx="10"/>
<text class="tc" x="40" y="162" text-anchor="start">No key, no password: any reader of the value can decode it</text>
<rect class="box" x="24" y="192" width="368" height="168" rx="10"/>
<text class="t" x="40" y="216" text-anchor="start">Who can read it on a default cluster</text>
<text class="ts" x="40" y="242" text-anchor="start">get secrets in the namespace</text>
<text class="ts" x="40" y="268" text-anchor="start">create a Pod there (it can mount the Secret)</text>
<text class="ts" x="40" y="294" text-anchor="start">read etcd: unencrypted by default</text>
<text class="ts" x="40" y="320" text-anchor="start">read last-applied-configuration</text>
<text class="ts" x="40" y="350" text-anchor="start">(the last one: kubectl apply with stringData)</text>
<rect class="boxb" x="408" y="192" width="368" height="168" rx="10"/>
<text class="t" x="424" y="216" text-anchor="start">What protects it (later episodes)</text>
<text class="ts" x="424" y="242" text-anchor="start">RBAC: who may get secrets (part 20)</text>
<text class="ts" x="424" y="268" text-anchor="start">encryption at rest in etcd (part 72)</text>
<text class="ts" x="424" y="294" text-anchor="start">external secret stores (part 80)</text>
<text class="ts" x="424" y="320" text-anchor="start">no annotation: create secret, --server-side</text>
<rect class="panel" x="24" y="376" width="752" height="70" rx="10"/>
<text class="t" x="40" y="400" text-anchor="start">What a Secret does give you over a ConfigMap</text>
<text class="ts" x="40" y="424" text-anchor="start">its own RBAC resource, tmpfs volumes on the node, and describe shows sizes instead of values.</text>
</svg>
