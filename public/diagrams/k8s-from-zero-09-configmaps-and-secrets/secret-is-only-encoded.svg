<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
<title id="t">A Secret is encoded, not encrypted</title>
<desc id="d">The password s3cr3t-Pa55 goes through base64 and becomes czNjcjN0LVBhNTU=, and base64 -d turns it straight back; no key is involved, which is highlighted. Below, four ways a Secret can be read: anyone allowed to get Secrets in the namespace, anyone allowed to create Pods there, because a Pod can mount it, anyone with access to etcd, where Secrets are stored unencrypted by default, and the last-applied-configuration annotation that kubectl apply wrote with the plain stringData in our lab. A panel lists the protections covered later: RBAC, encryption at rest and external secret stores, plus creating the Secret with kubectl create secret or server-side apply so no annotation is written.</desc>
