<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">A Job with completions 6 and parallelism 2, and a Job that runs out of retries</title>
<desc id="d">Top: the Indexed Job batch with completions 6 and parallelism 2 ran in three waves on our cluster: indexes 0 and 1, then 2 and 3, then 4 and 5, each Pod running about three seconds, and finished Complete 6/6 in 18 seconds. Bottom: the Job flaky with backoffLimit 2 ran its failing Pod three times, about 11 and 20 seconds apart because the retry delay doubles, and then the Job was marked Failed with reason BackoffLimitExceeded, highlighted.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">completions = how many must succeed; parallelism = how many at once</text>
<text class="tm" x="24" y="66" text-anchor="start">Job batch: completions 6, parallelism 2, completionMode Indexed</text>
<rect class="boxs" x="40" y="80" width="170" height="36" rx="8"/>
<text class="tm" x="52" y="103" text-anchor="start">batch-0  Completed</text>
<rect class="boxs" x="40" y="124" width="170" height="36" rx="8"/>
<text class="tm" x="52" y="147" text-anchor="start">batch-1  Completed</text>
<line class="ln" x1="212" y1="122" x2="228" y2="122" marker-end="url(#ah)"/>
<rect class="boxs" x="230" y="80" width="170" height="36" rx="8"/>
<text class="tm" x="242" y="103" text-anchor="start">batch-2  Completed</text>
<rect class="boxs" x="230" y="124" width="170" height="36" rx="8"/>
<text class="tm" x="242" y="147" text-anchor="start">batch-3  Completed</text>
<line class="ln" x1="402" y1="122" x2="418" y2="122" marker-end="url(#ah)"/>
<rect class="boxs" x="420" y="80" width="170" height="36" rx="8"/>
<text class="tm" x="432" y="103" text-anchor="start">batch-4  Completed</text>
<rect class="boxs" x="420" y="124" width="170" height="36" rx="8"/>
<text class="tm" x="432" y="147" text-anchor="start">batch-5  Completed</text>
<rect class="boxb" x="616" y="80" width="160" height="80" rx="10"/>
<text class="tm" x="630" y="108" text-anchor="start">Complete</text>
<text class="tm" x="630" y="130" text-anchor="start">6/6 in 18s</text>
<text class="ts" x="40" y="190" text-anchor="start">wave 1</text>
<text class="ts" x="230" y="190" text-anchor="start">wave 2</text>
<text class="ts" x="420" y="190" text-anchor="start">wave 3</text>
<line class="lnf" x1="24" y1="212" x2="776" y2="212"/>
<text class="tm" x="24" y="240" text-anchor="start">Job flaky: backoffLimit 2, the container always exits 1</text>
<rect class="box" x="40" y="256" width="170" height="40" rx="8"/>
<text class="tm" x="52" y="281" text-anchor="start">try 1  Error</text>
<text class="ts" x="52" y="316" text-anchor="start">0s</text>
<line class="ln" x1="212" y1="276" x2="228" y2="276" marker-end="url(#ah)"/>
<rect class="box" x="230" y="256" width="170" height="40" rx="8"/>
<text class="tm" x="242" y="281" text-anchor="start">try 2  Error</text>
<text class="ts" x="242" y="316" text-anchor="start">+11s</text>
<line class="ln" x1="402" y1="276" x2="418" y2="276" marker-end="url(#ah)"/>
<rect class="box" x="420" y="256" width="170" height="40" rx="8"/>
<text class="tm" x="432" y="281" text-anchor="start">try 3  Error</text>
<text class="ts" x="432" y="316" text-anchor="start">+31s</text>
<rect class="boxc" x="616" y="256" width="160" height="40" rx="8"/>
<text class="tc" x="628" y="281" text-anchor="start">Failed</text>
<line class="lnc" x1="592" y1="276" x2="614" y2="276" marker-end="url(#ahc)"/>
<rect class="panel" x="24" y="340" width="752" height="92" rx="10"/>
<text class="ts" x="40" y="364" text-anchor="start">Retry delay doubles: 10s, 20s, 40s ... capped at ten minutes (Job docs)</text>
<text class="ts" x="40" y="386" text-anchor="start">backoffLimit defaults to 6; restartPolicy must be Never or OnFailure</text>
<text class="tm" x="40" y="408" text-anchor="start">condition: Failed=True, reason BackoffLimitExceeded</text>
</svg>
