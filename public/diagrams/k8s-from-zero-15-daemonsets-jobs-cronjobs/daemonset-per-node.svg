<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">A DaemonSet runs one Pod on every node that allows it</title>
<desc id="d">Three nodes from our kind cluster: k8s-ep13-control-plane, k8s-ep13-worker and k8s-ep13-worker2. The DaemonSet node-agent first placed one Pod on each worker, DESIRED 2. The control plane carries the taint node-role.kubernetes.io/control-plane:NoSchedule, highlighted, so it got no Pod. After we added a matching toleration, DESIRED became 3 and a Pod ran on the control plane too. Adding a node adds a Pod; removing a node garbage-collects its Pod.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3424; stroke: #d9cbb0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">One copy per node, and the taint decides which nodes count</text>
<rect class="boxb" x="24" y="52" width="752" height="50" rx="10"/>
<text class="tm" x="40" y="82" text-anchor="start">DaemonSet node-agent</text>
<text class="ts" x="260" y="82" text-anchor="start">before: DESIRED 2  /  with toleration: DESIRED 3</text>
<line class="ln" x1="400" y1="102" x2="140" y2="134" marker-end="url(#ah)"/>
<rect class="boxc" x="24" y="136" width="232" height="190" rx="10"/>
<text class="tm" x="38" y="160" text-anchor="start">k8s-ep13-control-plane</text>
<text class="tm" x="38" y="184" text-anchor="start">taint: control-plane</text>
<text class="tm" x="38" y="202" text-anchor="start">:NoSchedule</text>
<rect class="boxd" x="38" y="220" width="204" height="40" rx="8"/>
<text class="ts" x="50" y="245" text-anchor="start">before: no Pod</text>
<rect class="boxs" x="38" y="270" width="204" height="40" rx="8"/>
<text class="tm" x="50" y="295" text-anchor="start">after: node-agent-hh62h</text>
<line class="ln" x1="400" y1="102" x2="396" y2="134" marker-end="url(#ah)"/>
<rect class="box" x="280" y="136" width="232" height="190" rx="10"/>
<text class="tm" x="294" y="160" text-anchor="start">k8s-ep13-worker</text>
<rect class="boxs" x="294" y="220" width="204" height="40" rx="8"/>
<text class="tm" x="306" y="245" text-anchor="start">node-agent Pod</text>
<text class="ts" x="294" y="300" text-anchor="start">one Pod, always</text>
<line class="ln" x1="400" y1="102" x2="652" y2="134" marker-end="url(#ah)"/>
<rect class="box" x="536" y="136" width="232" height="190" rx="10"/>
<text class="tm" x="550" y="160" text-anchor="start">k8s-ep13-worker2</text>
<rect class="boxs" x="550" y="220" width="204" height="40" rx="8"/>
<text class="tm" x="562" y="245" text-anchor="start">node-agent Pod</text>
<text class="ts" x="550" y="300" text-anchor="start">one Pod, always</text>
<rect class="panel" x="24" y="344" width="752" height="58" rx="10"/>
<text class="ts" x="40" y="368" text-anchor="start">The controller also adds tolerations such as node.kubernetes.io/not-ready and</text>
<text class="ts" x="40" y="388" text-anchor="start">unschedulable, so the agent keeps running on sick or cordoned nodes.</text>
</svg>
