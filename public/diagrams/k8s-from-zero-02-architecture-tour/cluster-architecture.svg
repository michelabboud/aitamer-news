<text class="tm" x="99.0" y="84.5" text-anchor="middle">kubectl</text>
<text class="tm" x="99.0" y="101.5" text-anchor="middle">(your laptop)</text>
<rect class="panel" x="210" y="48" width="566" height="170" rx="10"/>
