<line class="ln" x1="120" y1="298" x2="280" y2="140" marker-end="url(#ah)"/>
<rect class="panel" x="408" y="262" width="368" height="180" rx="10"/>
<text class="th" x="760" y="286" text-anchor="end">Worker node 2</text>
<rect class="boxs" x="424" y="300" width="160" height="40" rx="10"/>
<text class="tm" x="504.0" y="325.0" text-anchor="middle">kubelet</text>
<rect class="boxd" x="600" y="300" width="160" height="40" rx="10"/>
<text class="tm" x="680.0" y="325.0" text-anchor="middle">kube-proxy</text>
<rect class="box" x="424" y="352" width="336" height="36" rx="10"/>
<text class="tm" x="592.0" y="375.0" text-anchor="middle">container runtime (containerd)</text>
<rect class="boxs" x="424" y="398" width="104" height="32" rx="10"/>
<text class="tm" x="476.0" y="419.0" text-anchor="middle">pod</text>
<rect class="boxs" x="540" y="398" width="104" height="32" rx="10"/>
<text class="tm" x="592.0" y="419.0" text-anchor="middle">pod</text>
<rect class="boxs" x="656" y="398" width="104" height="32" rx="10"/>
<text class="tm" x="708.0" y="419.0" text-anchor="middle">pod</text>
<line class="ln" x1="504" y1="298" x2="340" y2="140" marker-end="url(#ah)"/>
<text class="ts" x="400" y="250" text-anchor="middle">kubelets and kube-proxy talk to kube-apiserver</text>
<text class="ts" x="24" y="460" text-anchor="start">Dashed: optional. Some network plugins replace kube-proxy; local clusters have no cloud-controller-manager.</text>
</svg>
