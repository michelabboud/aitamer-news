<rect class="boxb" x="410" y="150" width="200" height="52" rx="10"/>
<text class="tm" x="510.0" y="181.0" text-anchor="middle">kube-controller-manager</text>
<rect class="boxd" x="624" y="86" width="140" height="116" rx="10"/>
<text class="tm" x="694.0" y="123.5" text-anchor="middle">cloud-</text>
<text class="tm" x="694.0" y="140.5" text-anchor="middle">controller-</text>
<text class="tm" x="694.0" y="157.5" text-anchor="middle">manager</text>
<text class="tm" x="694.0" y="174.5" text-anchor="middle">(optional)</text>
<line class="lnc" x1="174" y1="98" x2="224" y2="108" marker-end="url(#ahc)"/>
<line class="ln" x1="311" y1="138" x2="311" y2="150"/>
<line class="ln" x1="311" y1="138" x2="311" y2="148" marker-end="url(#ah)"/>
<rect class="panel" x="24" y="262" width="368" height="180" rx="10"/>
<text class="th" x="376" y="286" text-anchor="end">Worker node 1</text>
<rect class="boxs" x="40" y="300" width="160" height="40" rx="10"/>
<text class="tm" x="120.0" y="325.0" text-anchor="middle">kubelet</text>
<rect class="boxd" x="216" y="300" width="160" height="40" rx="10"/>
