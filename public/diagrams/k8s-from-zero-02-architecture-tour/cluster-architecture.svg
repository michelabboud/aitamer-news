<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Kubernetes cluster architecture</title>
<desc id="d">A cluster has a control plane and worker nodes. The control plane runs kube-apiserver, etcd, kube-scheduler, kube-controller-manager and, only in clouds, the optional cloud-controller-manager. Every worker node runs a kubelet, a container runtime such as containerd, and usually kube-proxy, and holds pods. kubectl on your laptop talks only to kube-apiserver, which is highlighted as the front door of the cluster. etcd is drawn in sand because it is the storage.</desc>
