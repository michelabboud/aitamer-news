<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Life of a kubectl apply</title>
<desc id="d">A sequence diagram with six lanes: kubectl, kube-apiserver with etcd, the Deployment controller, the ReplicaSet controller, kube-scheduler, and the kubelet on a node. Step 1, kubectl sends the Deployment to the API server, which saves it in etcd. Step 2, the Deployment controller sees it and creates a ReplicaSet. Step 3, the ReplicaSet controller creates two Pods with no node. Step 4, the scheduler picks a node and writes it into each Pod, which is highlighted. Step 5, the kubelet on that node sees its new Pods, asks the container runtime to pull the image and start the container. Step 6, the kubelet reports the Pod status back to the API server. Every arrow goes through the API server.</desc>
<style>
