</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="520" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Life of a kubectl apply: every step goes through the API server</text>
<rect class="box" x="23" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="80.0" y="78.0" text-anchor="middle">kubectl</text>
<line class="lnf" x1="80" y1="96" x2="80" y2="490" stroke-dasharray="5 4"/>
<rect class="boxb" x="153" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="210.0" y="69.5" text-anchor="middle">kube-apiserver</text>
<text class="tm" x="210.0" y="86.5" text-anchor="middle">+ etcd</text>
<line class="lnf" x1="210" y1="96" x2="210" y2="490" stroke-dasharray="5 4"/>
<rect class="boxb" x="283" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="340.0" y="69.5" text-anchor="middle">deployment</text>
<text class="tm" x="340.0" y="86.5" text-anchor="middle">controller</text>
<line class="lnf" x1="340" y1="96" x2="340" y2="490" stroke-dasharray="5 4"/>
<rect class="boxb" x="413" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="470.0" y="69.5" text-anchor="middle">replicaset</text>
<text class="tm" x="470.0" y="86.5" text-anchor="middle">controller</text>
<line class="lnf" x1="470" y1="96" x2="470" y2="490" stroke-dasharray="5 4"/>
<rect class="boxb" x="543" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="600.0" y="78.0" text-anchor="middle">kube-scheduler</text>
<line class="lnf" x1="600" y1="96" x2="600" y2="490" stroke-dasharray="5 4"/>
<rect class="boxs" x="663" y="50" width="114" height="46" rx="10"/>
<text class="tm" x="720.0" y="69.5" text-anchor="middle">kubelet</text>
<text class="tm" x="720.0" y="86.5" text-anchor="middle">(node)</text>
<line class="lnf" x1="720" y1="96" x2="720" y2="490" stroke-dasharray="5 4"/>
<line class="ln" x1="80" y1="130" x2="206" y2="130" marker-end="url(#ah)"/>
<text class="ts" x="145.0" y="123" text-anchor="middle">1. POST Deployment web</text>
<text class="ts" x="218" y="150" text-anchor="start">saved in etcd</text>
<line class="ln" x1="210" y1="180" x2="336" y2="180" marker-end="url(#ah)"/>
<text class="ts" x="275.0" y="173" text-anchor="middle">watch: new Deployment</text>
<line class="ln" x1="340" y1="206" x2="214" y2="206" marker-end="url(#ah)"/>
<text class="ts" x="275.0" y="199" text-anchor="middle">2. create ReplicaSet</text>
<line class="ln" x1="210" y1="244" x2="466" y2="244" marker-end="url(#ah)"/>
<text class="ts" x="340.0" y="237" text-anchor="middle">watch: new ReplicaSet</text>
<line class="ln" x1="470" y1="270" x2="214" y2="270" marker-end="url(#ah)"/>
<text class="ts" x="340.0" y="263" text-anchor="middle">3. create 2 Pods (no node yet)</text>
<line class="ln" x1="210" y1="308" x2="596" y2="308" marker-end="url(#ah)"/>
<text class="ts" x="405.0" y="301" text-anchor="middle">watch: unscheduled Pods</text>
<line class="lnc" x1="600" y1="334" x2="214" y2="334" marker-end="url(#ahc)"/>
<text class="tc" x="405.0" y="327" text-anchor="middle">4. bind: spec.nodeName = node</text>
<line class="ln" x1="210" y1="372" x2="716" y2="372" marker-end="url(#ah)"/>
<text class="ts" x="465.0" y="365" text-anchor="middle">watch: Pods for my node</text>
<rect class="box" x="660" y="388" width="120" height="40" rx="10"/>
<text class="ts" x="720.0" y="404.5" text-anchor="middle">5. pull, create,</text>
<text class="ts" x="720.0" y="421.5" text-anchor="middle">start container</text>
<line class="ln" x1="720" y1="452" x2="214" y2="452" marker-end="url(#ah)"/>
<text class="ts" x="465.0" y="445" text-anchor="middle">6. status: Running</text>
<text class="ts" x="24" y="508" text-anchor="start">Event sources you will see in the lab: deployment-controller, replicaset-controller, default-scheduler, kubelet.</text>
</svg>
