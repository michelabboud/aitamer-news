<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">Components coordinate through the API server</title>
<desc id="d">A hub-and-spoke picture. kube-apiserver sits in the middle and is highlighted. Around it, kubectl, kube-scheduler, kube-controller-manager, kube-proxy and CoreDNS point at the API server. Control-plane components and the kubelets on each node coordinate through the API server: they watch and update objects there and do not call one another directly. etcd sits below the API server; only the API server reads and writes it. Each kubelet also talks to containerd over CRI, a local node-side link. The API server connects to each kubelet for logs, exec and attach, and port-forward.</desc>
