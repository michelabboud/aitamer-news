<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">Everyone talks to the API server</title>
<desc id="d">A hub-and-spoke picture. kube-apiserver sits in the middle and is highlighted. Around it are kubectl, kube-scheduler, kube-controller-manager, the optional cloud-controller-manager, the kubelet on each node, kube-proxy, and CoreDNS. Each of them talks only to the API server, mostly by watching for changes. etcd sits below the API server and is the only spoke that no other component touches: only the API server reads and writes it.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Everyone talks to the API server, nobody talks to etcd directly</text>
<rect class="boxc" x="305" y="208" width="190" height="64" rx="10"/>
<text class="tb" x="400.0" y="245.0" text-anchor="middle">kube-apiserver</text>
<rect class="box" x="65.0" y="90" width="130" height="40" rx="10"/>
<text class="tm" x="130.0" y="115.0" text-anchor="middle">kubectl</text>
<line class="ln" x1="180" y1="134" x2="325" y2="204" marker-end="url(#ah)"/>
<rect class="boxb" x="332.0" y="70" width="136" height="40" rx="10"/>
<text class="tm" x="400.0" y="95.0" text-anchor="middle">kube-scheduler</text>
<line class="ln" x1="400" y1="114" x2="400" y2="204" marker-end="url(#ah)"/>
<rect class="boxb" x="566.0" y="90" width="208" height="40" rx="10"/>
<text class="tm" x="670.0" y="115.0" text-anchor="middle">kube-controller-manager</text>
<line class="ln" x1="620" y1="134" x2="475" y2="204" marker-end="url(#ah)"/>
<rect class="boxs" x="34.0" y="230" width="152" height="40" rx="10"/>
<text class="tm" x="110.0" y="255.0" text-anchor="middle">kubelet (node 1)</text>
<line class="ln" x1="190" y1="247" x2="301" y2="243" marker-end="url(#ah)"/>
<rect class="boxs" x="625.0" y="230" width="130" height="40" rx="10"/>
<text class="tm" x="690.0" y="255.0" text-anchor="middle">kube-proxy</text>
<line class="ln" x1="621" y1="248" x2="499" y2="243" marker-end="url(#ah)"/>
<rect class="boxs" x="74.0" y="360" width="152" height="40" rx="10"/>
<text class="tm" x="150.0" y="385.0" text-anchor="middle">kubelet (node 2)</text>
<line class="ln" x1="193" y1="356" x2="336" y2="276" marker-end="url(#ah)"/>
<rect class="boxs" x="585.0" y="360" width="130" height="40" rx="10"/>
<text class="tm" x="650.0" y="385.0" text-anchor="middle">CoreDNS</text>
<line class="ln" x1="607" y1="356" x2="464" y2="276" marker-end="url(#ah)"/>
<rect class="boxn" x="340" y="390" width="120" height="44" rx="10"/>
<text class="tm" x="400.0" y="417.0" text-anchor="middle">etcd</text>
<line class="ln" x1="400" y1="272" x2="400" y2="386" marker-end="url(#ah)"/>
<text class="ts" x="408" y="340" text-anchor="start">only the API server</text>
<text class="ts" x="408" y="356" text-anchor="start">reads and writes etcd</text>
<text class="ts" x="24" y="454" text-anchor="start">Components watch the API server for changes and write back what they did; they never call each other.</text>
</svg>
