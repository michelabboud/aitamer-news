<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">What kubectx and kubens change in your kubeconfig</title>
<desc id="d">A kubeconfig file holds clusters, users and contexts; each context names one cluster, one user and an optional namespace. In our lab the file has two contexts on the same kind cluster: kind-k8s-ep22 with namespace k8s-from-zero, and lab with namespace kube-system. The field current-context, highlighted, points at one of them, and every kubectl command uses it. kubectx lab rewrites current-context, kubectx dash switches back to the previous one, kubectx old=new renames a context. kubens k8s-from-zero writes the namespace field of the current context. kubectx -r starts a shell in which write requests to that context are refused, a client-side safety net that does not replace RBAC.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Two small tools, two fields in one file</text>
<rect class="boxd" x="24" y="50" width="470" height="400" rx="10"/>
<text class="tm" x="40" y="74" text-anchor="start">kubeconfig (KUBECONFIG or ~/.kube/config)</text>
<rect class="boxb" x="40" y="90" width="200" height="48" rx="10"/>
<text class="tm" x="140.0" y="110.5" text-anchor="middle">cluster</text>
<text class="tm" x="140.0" y="127.5" text-anchor="middle">kind-k8s-ep22</text>
<rect class="box" x="278" y="90" width="200" height="48" rx="10"/>
<text class="tm" x="378.0" y="110.5" text-anchor="middle">user</text>
<text class="tm" x="378.0" y="127.5" text-anchor="middle">kind-k8s-ep22</text>
<rect class="boxs" x="40" y="160" width="438" height="74" rx="10"/>
<text class="tm" x="56" y="184" text-anchor="start">context kind-k8s-ep22</text>
<text class="tm" x="56" y="204" text-anchor="start">cluster + user + namespace: k8s-from-zero</text>
<text class="ts" x="56" y="224" text-anchor="start"></text>
<rect class="boxs" x="40" y="248" width="438" height="62" rx="10"/>
<text class="tm" x="56" y="272" text-anchor="start">context lab</text>
<text class="tm" x="56" y="292" text-anchor="start">cluster + user + namespace: kube-system</text>
<rect class="boxc" x="40" y="336" width="438" height="52" rx="10"/>
<text class="tm" x="259.0" y="367.0" text-anchor="middle">current-context: kind-k8s-ep22</text>
<path class="lnc" d="M140,336 L140,236" marker-end="url(#ahc)"/>
<text class="ts" x="40" y="416" text-anchor="start">every kubectl command reads current-context first</text>
<text class="ts" x="40" y="436" text-anchor="start">then the namespace of that context</text>
<rect class="box" x="512" y="60" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="82" text-anchor="start">kubectx lab</text>
<text class="ts" x="524" y="102" text-anchor="start">sets current-context to lab</text>
<rect class="box" x="512" y="124" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="146" text-anchor="start">kubectx -</text>
<text class="ts" x="524" y="166" text-anchor="start">back to the previous context</text>
<rect class="box" x="512" y="188" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="210" text-anchor="start">kubectx lab=lab-system</text>
<text class="ts" x="524" y="230" text-anchor="start">renames a context</text>
<rect class="box" x="512" y="252" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="274" text-anchor="start">kubens k8s-from-zero</text>
<text class="ts" x="524" y="294" text-anchor="start">sets the namespace of the current context</text>
<rect class="box" x="512" y="316" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="338" text-anchor="start">kubens -c</text>
<text class="ts" x="524" y="358" text-anchor="start">prints the current namespace</text>
<rect class="boxd" x="512" y="380" width="264" height="54" rx="10"/>
<text class="tm" x="524" y="402" text-anchor="start">kubectx -r kind-k8s-ep22</text>
<text class="ts" x="524" y="422" text-anchor="start">read-only shell: writes refused</text>
</svg>
