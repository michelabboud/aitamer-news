<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">stern follows every Pod that matches, including new ones</title>
<desc id="d">stern web takes a regular expression, or a label selector with -l, and opens one log stream per matching container. Before a rollout, Pods web-86f79b74d9-cjsf2 and web-86f79b74d9-plcl5 match, and stern prints a plus line for each. During kubectl rollout restart, the new Pods web-854c556f4-2mnfl and web-854c556f4-5qx6w, highlighted, start and stern adds them without a restart; the old Pods stop and stern prints a minus line. All streams are merged into one terminal, each line prefixed with the Pod and container name. kubectl logs -f follows one Pod only.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">One command, every matching Pod, one merged stream</text>
<rect class="boxb" x="24" y="56" width="170" height="60" rx="10"/>
<text class="tm" x="109.0" y="82.5" text-anchor="middle">stern web</text>
<text class="tm" x="109.0" y="99.5" text-anchor="middle">(regex on Pod names)</text>
<rect class="boxb" x="24" y="128" width="170" height="72" rx="10"/>
<text class="tm" x="109.0" y="152.0" text-anchor="middle">stern -l</text>
<text class="tm" x="109.0" y="169.0" text-anchor="middle">app.kubernetes.io/</text>
<text class="tm" x="109.0" y="186.0" text-anchor="middle">name=web</text>
<rect class="boxs" x="250" y="56" width="230" height="54" rx="10"/>
<text class="tm" x="365.0" y="79.0" text-anchor="middle">web-86f79b74d9-cjsf2</text>
<text class="tm" x="365.0" y="97.0" text-anchor="middle">old: - when it stops</text>
<line class="ln" x1="196" y1="100" x2="248" y2="83" marker-end="url(#ah)"/>
<line class="ln" x1="480" y1="83" x2="540" y2="200" marker-end="url(#ah)"/>
<rect class="boxs" x="250" y="122" width="230" height="54" rx="10"/>
<text class="tm" x="365.0" y="145.0" text-anchor="middle">web-86f79b74d9-plcl5</text>
<text class="tm" x="365.0" y="163.0" text-anchor="middle">old: - when it stops</text>
<line class="ln" x1="196" y1="100" x2="248" y2="149" marker-end="url(#ah)"/>
<line class="ln" x1="480" y1="149" x2="540" y2="200" marker-end="url(#ah)"/>
<rect class="boxc" x="250" y="188" width="230" height="54" rx="10"/>
<text class="tm" x="365.0" y="211.0" text-anchor="middle">web-854c556f4-2mnfl</text>
<text class="tm" x="365.0" y="229.0" text-anchor="middle">new: + joins on its own</text>
<line class="lnc" x1="196" y1="150" x2="248" y2="215" marker-end="url(#ahc)"/>
<line class="ln" x1="480" y1="215" x2="540" y2="200" marker-end="url(#ah)"/>
<rect class="boxc" x="250" y="254" width="230" height="54" rx="10"/>
<text class="tm" x="365.0" y="277.0" text-anchor="middle">web-854c556f4-5qx6w</text>
<text class="tm" x="365.0" y="295.0" text-anchor="middle">new: + joins on its own</text>
<line class="lnc" x1="196" y1="150" x2="248" y2="281" marker-end="url(#ahc)"/>
<line class="ln" x1="480" y1="281" x2="540" y2="200" marker-end="url(#ah)"/>
<rect class="panel" x="542" y="56" width="234" height="300" rx="10"/>
<text class="t" x="556" y="80" text-anchor="start">your terminal</text>
<text class="tm" x="556" y="108" text-anchor="start">+ web-86f79b74d9-plcl5 › web</text>
<text class="tm" x="556" y="130" text-anchor="start">+ web-854c556f4-5qx6w › web</text>
<text class="tm" x="556" y="152" text-anchor="start">web-...-cjsf2 web GET / 200</text>
<text class="tm" x="556" y="174" text-anchor="start">web-...-plcl5 web GET / 200</text>
<text class="tm" x="556" y="196" text-anchor="start">web-...-5qx6w web GET / 200</text>
<text class="tm" x="556" y="218" text-anchor="start">- web-86f79b74d9-cjsf2 › web</text>
<text class="ts" x="556" y="252" text-anchor="start">one line per log line,</text>
<text class="ts" x="556" y="270" text-anchor="start">prefixed with Pod and container</text>
<text class="ts" x="556" y="300" text-anchor="start">--tail 0: only new lines</text>
<text class="ts" x="556" y="320" text-anchor="start">--since 10s: recent lines</text>
<text class="ts" x="556" y="340" text-anchor="start">-o raw: no prefix</text>
<rect class="box" x="24" y="380" width="752" height="44" rx="10"/>
<text class="t" x="40" y="407" text-anchor="start">kubectl logs -f deploy/web follows one Pod; stern keeps the set of Pods in sync with the query.</text>
</svg>
