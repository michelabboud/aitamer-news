<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">How kubectl finds plugins, and how krew installs them</title>
<desc id="d">When you type kubectl tree, kubectl looks for an executable named kubectl-tree on your PATH and runs it; dashes in the file name become spaces in the command, so kubectl-whoami-ns answers to kubectl whoami ns. kubectl plugin list shows what it found. krew is itself a plugin: kubectl krew install tree reads the krew-index plugin manifest from a Git repository, downloads the archive the manifest names, checks its sha256, and links the binary into the krew bin directory, which you add to PATH. Highlighted: the index warns that plugins are not audited for security, so read what you install. A plain shell script such as kubectl-here works the same way.</desc>
