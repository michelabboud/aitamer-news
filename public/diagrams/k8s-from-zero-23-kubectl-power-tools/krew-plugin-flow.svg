<rect class="bg" x="0" y="0" width="800" height="470" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">A plugin is any kubectl-&lt;name&gt; file on your PATH</text>
<rect class="box" x="24" y="60" width="200" height="56" rx="10"/>
<text class="tm" x="124.0" y="84.5" text-anchor="middle">kubectl tree</text>
<text class="tm" x="124.0" y="101.5" text-anchor="middle">deployment web</text>
<line class="ln" x1="224" y1="88" x2="270" y2="88" marker-end="url(#ah)"/>
<rect class="boxb" x="272" y="60" width="250" height="56" rx="10"/>
<text class="tm" x="397.0" y="84.5" text-anchor="middle">look up kubectl-tree</text>
<text class="tm" x="397.0" y="101.5" text-anchor="middle">in each PATH directory</text>
<line class="ln" x1="522" y1="88" x2="568" y2="88" marker-end="url(#ah)"/>
<rect class="boxs" x="570" y="60" width="206" height="56" rx="10"/>
<text class="tm" x="673.0" y="84.5" text-anchor="middle">run it with</text>
<text class="tm" x="673.0" y="101.5" text-anchor="middle">deployment web</text>
<text class="ts" x="24" y="146" text-anchor="start">dashes become spaces: kubectl-whoami-ns runs as kubectl whoami ns</text>
<rect class="panel" x="24" y="166" width="752" height="190" rx="10"/>
<text class="tm" x="40" y="190" text-anchor="start">kubectl krew install tree</text>
<rect class="boxb" x="40" y="206" width="160" height="76" rx="10"/>
<text class="tm" x="120.0" y="231.0" text-anchor="middle">krew-index</text>
<text class="tm" x="120.0" y="249.0" text-anchor="middle">Git repo of plugin</text>
<text class="tm" x="120.0" y="267.0" text-anchor="middle">manifests</text>
<line class="ln" x1="200" y1="244" x2="224" y2="244" marker-end="url(#ah)"/>
<rect class="boxb" x="226" y="206" width="160" height="76" rx="10"/>
<text class="ts" x="306.0" y="231.0" text-anchor="middle">manifest tree</text>
<text class="ts" x="306.0" y="249.0" text-anchor="middle">URI + sha256</text>
<text class="ts" x="306.0" y="267.0" text-anchor="middle">for each OS</text>
<line class="ln" x1="386" y1="244" x2="410" y2="244" marker-end="url(#ah)"/>
<rect class="boxs" x="412" y="206" width="160" height="76" rx="10"/>
<text class="ts" x="492.0" y="231.0" text-anchor="middle">download</text>
<text class="ts" x="492.0" y="249.0" text-anchor="middle">archive, verify</text>
<text class="ts" x="492.0" y="267.0" text-anchor="middle">sha256</text>
<line class="ln" x1="572" y1="244" x2="596" y2="244" marker-end="url(#ah)"/>
<rect class="boxs" x="598" y="206" width="160" height="76" rx="10"/>
<text class="tm" x="678.0" y="231.0" text-anchor="middle">~/.krew/bin</text>
<text class="tm" x="678.0" y="249.0" text-anchor="middle">kubectl-tree</text>
<text class="tm" x="678.0" y="267.0" text-anchor="middle">(add to PATH)</text>
<rect class="boxc" x="40" y="296" width="720" height="46" rx="10"/>
<text class="tc" x="400.0" y="324.0" text-anchor="middle">krew: these plugins are not audited for security by the Krew maintainers</text>
<rect class="box" x="24" y="374" width="752" height="76" rx="10"/>
<text class="t" x="40" y="398" text-anchor="start">Your own plugin needs no krew:</text>
<text class="tm" x="40" y="420" text-anchor="start">save kubectl-here, chmod +x, put it on PATH, run kubectl here</text>
<text class="ts" x="40" y="440" text-anchor="start">kubectl plugin list shows every plugin kubectl can see</text>
</svg>
