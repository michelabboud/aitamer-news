<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
<title id="t">docker compose up -d --wait</title>
<desc id="d">A timeline from left to right, from the lab&#x27;s output. db: Started, then Waiting, then Healthy once pg_isready succeeds. Only then web: Starting, Started. With --wait, Compose waits again until web is Healthy as well, highlighted, and returns. The first curl after that gets the notes. Without health checks, part 7&#x27;s web started as soon as db was running, and the first requests failed.</desc>
