<text class="tm" x="715" y="202.5" text-anchor="middle">curl OK</text>
<text class="ts" x="400" y="260" text-anchor="middle">depends_on: condition: service_healthy holds web back; --wait waits for web too.</text>
<text class="ts" x="400" y="280" text-anchor="middle">The test commands decide what healthy means.</text>
