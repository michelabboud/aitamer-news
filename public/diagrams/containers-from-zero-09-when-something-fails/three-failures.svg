  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="440" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Match the state to what the logs say</text>
<rect class="panel" x="24" y="50" width="752" height="370" rx="10"/>
<text class="tb" x="44" y="86" text-anchor="start">What happened</text>
<text class="tb" x="224" y="86" text-anchor="start">ps and inspect</text>
<text class="tb" x="424" y="86" text-anchor="start">The logs</text>
<text class="tb" x="624" y="86" text-anchor="start">Fix</text>
<rect class="box" x="40" y="104" width="172" height="88" rx="10"/>
<text class="ts" x="126" y="144.0" text-anchor="middle">compose stop db</text>
<text class="ts" x="126" y="161.0" text-anchor="middle">(manual stop)</text>
<rect class="box" x="220" y="104" width="192" height="88" rx="10"/>
<text class="tm" x="316" y="135.5" text-anchor="middle">db Exited (0)</text>
<text class="tm" x="316" y="152.5" text-anchor="middle">web Up (unhealthy)</text>
<text class="tm" x="316" y="169.5" text-anchor="middle">restarts=0</text>
<rect class="box" x="420" y="104" width="192" height="88" rx="10"/>
<text class="ts" x="516" y="135.5" text-anchor="middle">web: failed to resolve</text>
<text class="ts" x="516" y="152.5" text-anchor="middle">host &#x27;db&#x27;</text>
<text class="ts" x="516" y="169.5" text-anchor="middle">db: ...is shut down</text>
<rect class="box" x="620" y="104" width="136" height="88" rx="10"/>
<text class="ts" x="688" y="152.5" text-anchor="middle">up -d --wait</text>
<rect class="boxc" x="40" y="204" width="172" height="88" rx="10"/>
<text class="ts" x="126" y="244.0" text-anchor="middle">web: empty</text>
<text class="ts" x="126" y="261.0" text-anchor="middle">DATABASE_URL</text>
<rect class="boxc" x="220" y="204" width="192" height="88" rx="10"/>
<text class="tm" x="316" y="235.5" text-anchor="middle">web Exited (1)</text>
<text class="tm" x="316" y="252.5" text-anchor="middle">restarts=5</text>
<text class="tm" x="316" y="269.5" text-anchor="middle">then it stays down</text>
<rect class="boxc" x="420" y="204" width="192" height="88" rx="10"/>
<text class="ts" x="516" y="244.0" text-anchor="middle">web: DATABASE_URL</text>
<text class="ts" x="516" y="261.0" text-anchor="middle">is not set, six times</text>
<rect class="boxc" x="620" y="204" width="136" height="88" rx="10"/>
<text class="ts" x="688" y="244.0" text-anchor="middle">fix config,</text>
<text class="ts" x="688" y="261.0" text-anchor="middle">up -d</text>
<rect class="box" x="40" y="304" width="172" height="88" rx="10"/>
<text class="ts" x="126" y="344.0" text-anchor="middle">kill 1 in db</text>
<text class="ts" x="126" y="361.0" text-anchor="middle">(advanced)</text>
<rect class="box" x="220" y="304" width="192" height="88" rx="10"/>
<text class="tm" x="316" y="335.5" text-anchor="middle">db exit=0</text>
<text class="tm" x="316" y="352.5" text-anchor="middle">restarts=1</text>
<text class="tm" x="316" y="369.5" text-anchor="middle">healthy again</text>
<rect class="box" x="420" y="304" width="192" height="88" rx="10"/>
<text class="ts" x="516" y="335.5" text-anchor="middle">db: received smart</text>
<text class="ts" x="516" y="352.5" text-anchor="middle">shutdown request,</text>
<text class="ts" x="516" y="369.5" text-anchor="middle">ready to accept</text>
<rect class="box" x="620" y="304" width="136" height="88" rx="10"/>
<text class="ts" x="688" y="344.0" text-anchor="middle">nothing:</text>
<text class="ts" x="688" y="361.0" text-anchor="middle">unless-stopped</text>
</svg>
