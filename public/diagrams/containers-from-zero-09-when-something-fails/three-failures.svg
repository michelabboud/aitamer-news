<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Three failures, three signatures</title>
<desc id="d">A table with three rows, caused on purpose in the lab. Row 1, docker compose stop db: docker compose ps and docker inspect show db Exited (0) and web Up (unhealthy) with restarts=0; web&#x27;s log says failed to resolve host &#x27;db&#x27;, db&#x27;s log ends with database system is shut down; fix with docker compose up -d --wait. Row 2, web starts with an empty DATABASE_URL: ps shows web Exited (1), restarts=5; the log shows DATABASE_URL is not set six times; fix the configuration and run up -d. This row is highlighted. Row 3, in the advanced step, kill 1 inside db: PostgreSQL logs received smart shutdown request, exits with 0, and unless-stopped starts it again, restarts=1, healthy a few seconds later.</desc>
<style>
