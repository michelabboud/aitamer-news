<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">A health check and a restart policy are separate</title>
<desc id="d">Two columns. Left, the health check: Docker runs a test command inside the running container every interval, here pg_isready for db and a request to /healthz for web. The result is a health status, starting, healthy or unhealthy, after retries consecutive failures. depends_on with condition service_healthy and docker compose up --wait read that status. Highlighted: an unhealthy container keeps running; nothing restarts it. Right, the restart policy: Docker acts when the container&#x27;s main process exits. on-failure:5 restarts after a non-zero exit, at most five times. unless-stopped restarts after any exit, unless you stopped the container yourself.</desc>
<style>
.bg { fill: #f7f3ea; }
.t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2b3445; }
.ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6377; }
.th { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2b3445; }
.tm { font-family: ui-monospace, monospace; font-size: 12px; fill: #2b3445; }
.tc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b9503a; }
.box { fill: #ffffff; stroke: #8a93a3; stroke-width: 1.5; }
.boxc { fill: #fbe3dc; stroke: #d9674f; stroke-width: 1.5; }
.boxb { fill: #e3ecf7; stroke: #5b85b8; stroke-width: 1.5; }
.boxs { fill: #e5ede2; stroke: #6f8f68; stroke-width: 1.5; }
.boxd { fill: none; stroke: #8a93a3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { stroke: #6b7385; stroke-width: 1.6; fill: none; }
.lnc { stroke: #d9674f; stroke-width: 2.2; fill: none; }
.lnb { stroke: #5b85b8; stroke-width: 1.6; fill: none; }
.lnf { stroke: #b6bcc8; stroke-width: 1; fill: none; }
.ah { fill: #6b7385; }
.ahc { fill: #d9674f; }
.dc { fill: #d9674f; }
.db { fill: #5b85b8; }
.ds { fill: #6f8f68; }
.dn { fill: #c9a86a; }
.dg { fill: #a3aab8; }
.panel { fill: #efe8da; }
.boxn { fill: #f3ead6; stroke: #c9a86a; stroke-width: 1.5; }
.tb { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #2b3445; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1c2230; }
  .t { fill: #e8eaf0; }
  .ts { fill: #b3bacb; }
  .th { fill: #f1f2f6; }
  .tm { fill: #e8eaf0; }
  .tc { fill: #f09a86; }
  .box { fill: #262e3f; stroke: #7d879a; }
  .boxc { fill: #4a2d2a; stroke: #e8806b; }
  .boxb { fill: #243650; stroke: #8fb3d9; }
  .boxs { fill: #2a3a2c; stroke: #9bb693; }
  .boxd { stroke: #7d879a; }
  .ln { stroke: #aab2c2; }
  .lnc { stroke: #e8806b; }
  .lnb { stroke: #8fb3d9; }
  .lnf { stroke: #4a5366; }
  .ah { fill: #aab2c2; }
  .ahc { fill: #e8806b; }
  .dc { fill: #e8806b; }
  .db { fill: #8fb3d9; }
  .ds { fill: #9bb693; }
  .dn { fill: #d9cbb0; }
  .dg { fill: #6b7385; }
  .panel { fill: #232a38; }
  .boxn { fill: #3a3326; stroke: #d9cbb0; }
  .tb { fill: #e8eaf0; }
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="420" rx="12"/>
<text class="th" x="24" y="32" text-anchor="start">Health is a status; restart reacts to an exit</text>
<rect class="panel" x="24" y="50" width="364" height="350" rx="10"/>
<text class="th" x="40" y="76" text-anchor="start">Health check</text>
<rect class="box" x="44" y="92" width="324" height="56" rx="10"/>
<text class="tb" x="206" y="116.0" text-anchor="middle">test runs inside the container</text>
<text class="ts" x="206" y="133.0" text-anchor="middle">every interval: pg_isready, GET /healthz</text>
<line class="ln" x1="206" y1="148" x2="206" y2="170" marker-end="url(#ah)"/>
<rect class="box" x="44" y="172" width="324" height="56" rx="10"/>
<text class="tm" x="206" y="196.0" text-anchor="middle">starting, healthy, unhealthy</text>
<text class="ts" x="206" y="213.0" text-anchor="middle">unhealthy after retries failures in a row</text>
<line class="ln" x1="206" y1="228" x2="206" y2="250" marker-end="url(#ah)"/>
<rect class="box" x="44" y="252" width="324" height="56" rx="10"/>
<text class="ts" x="206" y="276.0" text-anchor="middle">read by depends_on: service_healthy</text>
<text class="ts" x="206" y="293.0" text-anchor="middle">and docker compose up --wait</text>
<rect class="boxc" x="44" y="324" width="324" height="56" rx="10"/>
<text class="tb" x="206" y="348.0" text-anchor="middle">unhealthy keeps running</text>
<text class="ts" x="206" y="365.0" text-anchor="middle">nothing restarts it</text>
<rect class="panel" x="412" y="50" width="364" height="350" rx="10"/>
<text class="th" x="428" y="76" text-anchor="start">Restart policy</text>
<rect class="box" x="432" y="92" width="324" height="56" rx="10"/>
<text class="tb" x="594" y="116.0" text-anchor="middle">main process exits</text>
<text class="ts" x="594" y="133.0" text-anchor="middle">Exited (code)</text>
<line class="ln" x1="594" y1="148" x2="594" y2="170" marker-end="url(#ah)"/>
<rect class="box" x="432" y="172" width="324" height="56" rx="10"/>
<text class="tm" x="594" y="196.0" text-anchor="middle">on-failure:5</text>
<text class="ts" x="594" y="213.0" text-anchor="middle">non-zero exit only, at most 5 restarts</text>
<rect class="box" x="432" y="244" width="324" height="56" rx="10"/>
<text class="tm" x="594" y="268.0" text-anchor="middle">unless-stopped</text>
<text class="ts" x="594" y="285.0" text-anchor="middle">any exit, also code 0</text>
<rect class="boxs" x="432" y="324" width="324" height="56" rx="10"/>
<text class="tb" x="594" y="348.0" text-anchor="middle">docker compose stop</text>
<text class="ts" x="594" y="365.0" text-anchor="middle">a manual stop is not restarted</text>
</svg>
